          - sensor
          - unknown
        detailed_only:
          - alarm_control_panel
          - climate
          - input_select
          - lawn_mower
          - media_player
          - select
          - vacuum
          - water_heater

      # yamllint disable rule:truthy rule:line-length rule:comments-indentation
      enum:
        ColorMode:  # Possible light color modes. - https://github.com/home-assistant/core/blob/dev/homeassistant/components/light/__init__.py
          UNKNOWN: "[<ColorMode.UNKNOWN: 'unknown'>]"
          ONOFF: "[<ColorMode.ONOFF: 'onoff'>]"
          BRIGHTNESS: "[<ColorMode.BRIGHTNESS: 'brightness'>]"
          COLOR_TEMP: "[<ColorMode.COLOR_TEMP: 'color_temp'>]"
          HS: "[<ColorMode.HS: 'hs'>]"
          XY: "[<ColorMode.XY: 'xy'>]"
          RGB: "[<ColorMode.RGB: 'rgb'>]"
          RGBW: "[<ColorMode.RGBW: 'rgbw'>]"
          RGBWW: "[<ColorMode.RGBWW: 'rgbww'>]"
          WHITE: "[<ColorMode.WHITE: ''>]"
        states:
          "on": ["on", "open", "opening", "true", "True", true, True, "active", "playing", "heat", "cold", "dry", "armed_home", "armed_away", "armed_vacation", "armed_custom_bypass", "triggered", "pending", "arming", "unlocked", 1]
          "off": ["off", "closed", "closing", "false", "False", false, False, "standby", "paused", "idle", "disarmed", "disarming", "locked"]
          unknown: ["unknown", "unavailable", None, none, ""]
          climate:
            "on": ["heat_cool", "heat", "heating", "cold", "cooling", "dry", "drying", "fan", "fan_only", "auto"]
            "off": ["off", "idle"]
          alarm_control_panel:
            "on": ["armed_home", "armed_away", "armed_vacation", "armed_custom_bypass", "triggered", "pending", "arming"]
            "off": ["disarmed", "disarming"]
          lawn_mower:
            "on": ["mowing", "returning"]
            "off": ["docked", "paused", "error"]
          lock:
            "on": ["unlocked"]
            "off": ["locked"]
          vacuum:
            "on": ["cleaning", "returning"]
            "off": ["docked", "paused", "idle", "error"]
      # yamllint disable rule:comments-indentation
      # yamllint enable rule:truthy rule:line-length
      # yamllint enable rule:comments-indentation

  - condition: '{{ nspanel_name is defined }}'
  - condition: '{{ nspanel_name is string }}'
  - condition: '{{ nspanel_name | length > 0 }}'

  - alias: ESPHome version gate
    # Prevents calling API actions that an older firmware has not registered yet.
    # An unknown action raises ServiceNotFound, which HA surfaces as a repair issue
    # even when the call carries continue_on_error.
    # The user can opt out via 'esphome_version_check_bypass', in which case the
    # notification is still created but the run is allowed to continue.
    if: '{{ not esphome_compatible }}'
    then:
      - action: persistent_notification.create
        data:
          notification_id: 'NSPanel_Easy_version_mismatch_{{ nspanel_name }}'
          title: "NSPanel Easy - Version mismatch: ESPHome"
          message: >
            {% if esphome_version_parts | count != 3 %}
            The ESPHome firmware version for the NSPanel **{{ nspanel_full_name }}** could not be determined,
            {% if esphome_version_check_bypass %}
            so API actions the firmware may not support can fail until this is resolved.
            {% else %}
            so the Blueprint has stopped to avoid calling API actions the firmware may not support.
            {% endif %}

            - Blueprint version: {{ blueprint_version }}

            - Required firmware version: {{ min_esphome_version_string }} or newer

            - Reported firmware version: {{ esphome_sw_version if esphome_sw_version | length > 0 else "Unknown" }}

            ---

            **How to Resolve This Issue**

            1. Confirm the correct device is selected in the **NSPanel device** field of this automation.

            2. Confirm the panel is online and connected to Home Assistant.

            3. If the panel is online and the correct device is selected, please
            [report this issue](https://github.com/edwardtfn/NSPanel-Easy/issues/new/choose),
            including the reported firmware version shown above.
            {% else %}
            {% if esphome_api_outdated %}
            Your NSPanel Easy ESPHome firmware provides an older API version than the Blueprint requires,
            {% else %}
            Your NSPanel Easy ESPHome firmware is older than the minimum version required by the Blueprint,
            {% endif %}
            {% if esphome_version_check_bypass %}
            and the version check has been bypassed, so features added after your firmware version
            will not work until you finish the update.
            {% else %}
            so the Blueprint has stopped to avoid calling API actions this firmware does not implement yet.
            {% endif %}

            - Panel: **{{ nspanel_full_name }}**

            - Current ESPHome version: {{ esphome_version_string }}

            - Required version: {{ blueprint_version if esphome_api_outdated else min_esphome_version_string }} or newer

            - Recommended version: {{ blueprint_version }} (same as the Blueprint)
            {% if esphome_api_version | count == 2 %}

            - API version: {{ esphome_api_version | join('.') }} (Blueprint requires {{ api_version | join('.') }})
            {% endif %}

            ---

            **How to Resolve This Issue**

            To fix this, update the firmware on your panel:

            1. Open the ESPHome dashboard, find your panel and click **Install**.

            2. After the panel restarts, wait about one minute: the display is updated automatically.

            This notification clears itself once everything is up to date.

            *For more detailed instructions, please refer to the online documentation:
            [How to Update the Firmware](https://github.com/edwardtfn/NSPanel-Easy/blob/main/docs/howto.md#update-esphome).*
            {% endif %}
        continue_on_error: true
      - alias: Custom action - ESPHome firmware outdated
        # Runs only on automation reload or HA start, and only when the firmware version is known.
        # It is placed before the stop so it also runs when the gate blocks the Blueprint.
        if:
          - '{{ trigger.id in ["automation_reloaded", "ha_started"] }}'
          - '{{ esphome_version_parts | count == 3 }}'
        then:
          - sequence: !input versioning_esphome_outdated_action
      - if: '{{ not esphome_version_check_bypass }}'
        then:
          - stop: ESPHome firmware is older than required by the Blueprint (version or API)

  - alias: API version gate - Blueprint outdated
    # The firmware removed or changed API actions this Blueprint calls. Calling them
    # would raise errors and repair issues in Home Assistant, so the run stops.
    # Only runs started by a panel event carry the firmware's API version.
    # There is no bypass: an outdated Blueprint cannot call the new actions.
    if: '{{ blueprint_api_outdated }}'
    then:
      - action: persistent_notification.create
        data:
          notification_id: 'NSPanel_Easy_version_mismatch_{{ nspanel_name }}'
          title: "NSPanel Easy - Version mismatch: Blueprint"
          message: >
            Your NSPanel Easy Blueprint is not compatible with the ESPHome firmware of the panel
            **{{ nspanel_full_name }}**, so the Blueprint has stopped to avoid calling API actions this
            firmware no longer supports.

            - Current Blueprint version: {{ blueprint_version }} (API {{ api_version | join('.') }})

            - ESPHome firmware version: {{ esphome_version_string if esphome_version_string | length > 0 else "Unknown" }} (API {{ esphome_api_version | join('.') }})

            ---

            **How to Resolve This Issue**

            1. Navigate to your [Blueprint Dashboard](/config/blueprint/dashboard).

            2. Locate the blueprint named "**NSPanel Easy Configuration**".

            3. Click on the corresponding 3-dot menu.

            4. Choose "**Re-import blueprint**".

            5. Select the "**Re-import**" button.


            *For more detailed instructions, please refer to the online documentation:
            [How to Update Blueprint](https://github.com/edwardtfn/NSPanel-Easy/blob/main/docs/howto.md#update-blueprint).*
        continue_on_error: true
      - alias: Custom action - Blueprint outdated
        # Runs once per panel boot, on the version event, as in the version mismatch handler.
        # It is placed before the stop, which also blocks that handler.
        if: '{{ trigger.event.data.type | default("") == "version" }}'
        then:
          - variables:
              versions:
                blueprint: '{{ trigger.event.data.blueprint | default("") }}'
                blueprint_min: '{{ trigger.event.data.min_blueprint_version | default("") }}'
                esphome: '{{ trigger.event.data.esphome | default("") }}'
          - sequence: !input versioning_blueprint_outdated_action
      - stop: Blueprint API version is older than the ESPHome firmware API version

  - alias: Global anchor repository
    enabled: false  # Anchor holder only; never executed, and skipped by static checks (e.g. Spook)
    if: '{{ false }}'  # It should never execute directly
    then:
      - &delay_default
        delay:
          milliseconds: !input delay
      - variables:
          entity_id: '{{ None }}'
          forced_icon_state: '{{ None }}'
          overlap:
            icon: '{{ None }}'
            icon_color: '{{ None }}'
            name: '{{ None }}'
      - &variable_entity
        alias: Variable Entity
        variables:
          entity_id_valid: &variable_entity_id_valid >
            {{
              entity_id is defined and
              entity_id is string and
              entity_id | length > 2 and
              entity_id.split(".") | count == 2 and
              states[entity_id] is not none
            }}
          overlap_icon_valid: >
            {{
              overlap is defined and
              overlap.icon is defined and
              overlap.icon is string and
              overlap.icon | length > 0 and
              overlap.icon is match "mdi:" and
              ((overlap.icon.split(":")[1]) in special_icons or ("," ~ (overlap.icon.split(":")[1]) ~ ",") in all_icon_names)
            }}
          overlap_icon_color_valid: '{{ overlap is defined and overlap.icon_color is defined and overlap.icon_color is list and overlap.icon_color | count == 3 }}'
          overlap_name_valid: '{{ overlap is defined and overlap.name is defined and overlap.name is string and overlap.name | length > 0 }}'
          entity_state: '{{ states(entity_id) | default("unknown") if entity_id_valid }}'
          entity_has_value: '{{ has_value(entity_id) if entity_id_valid }}'
          entity_domain: '{{ states[entity_id].domain if entity_id_valid }}'
          entity_icon: '{{ state_attr(entity_id, "icon") | default("") if entity_id_valid }}'
          icon_state: '{{ forced_icon_state | default(entity_state, true) }}'
          entity_icon_valid: >
            {{
              entity_icon is defined and
              entity_icon is string and
              entity_icon | length > 0 and
              entity_icon is match "mdi:" and
              ((entity_icon.split(":")[1]) in special_icons or ("," ~ (entity_icon.split(":")[1]) ~ ",") in all_icon_names)
            }}
          entity_state_is_on: >
            {{
              (
                entity_state in enum.states.on or
                (entity_domain in ["input_number", "number", "sensor"] and entity_has_value and entity_state not in ["off", "false", "False"]) or
                (entity_domain in enum.states and entity_state in enum.states[entity_domain].on)
              ) if entity_id_valid
            }}
          entity_state_is_off: >
            {{
              (not entity_state_is_on) and
              (
                entity_state in enum.states.off or
                (
                  entity_domain in enum.states and
                  entity_state in enum.states[entity_domain].off
                )
              )
              if entity_id_valid
            }}
          entity_state_is_unknown: '{{ ((not entity_state_is_on) and (not entity_state_is_off)) if entity_id_valid }}'
          entity_icon_color_tmp: >
            {%- if entity_id_valid -%}
              {%- set entity_color_attr = state_attr(entity_id, "color") | default("") -%}
              {%- if entity_color_attr is string and entity_color_attr is match "#[0-9a-fA-F]{6}$" -%}
                {%- set own_color = [entity_color_attr[1:3] | int(base=16), entity_color_attr[3:5] | int(base=16), entity_color_attr[5:7] | int(base=16)] -%}
              {%- elif entity_color_attr is list and entity_color_attr | count == 3 -%}
                {%- set own_color = entity_color_attr -%}
              {%- else -%}
                {%- set own_color = none -%}
              {%- endif -%}
              {%- set default_color = own_color if own_color is not none else (overlap.icon_color if overlap_icon_color_valid else nextion.color.on) -%}
              {%- set has_explicit_color = own_color is not none or overlap_icon_color_valid -%}
              {{ default_color if (entity_state_is_on or (has_explicit_color and not entity_state_is_off and entity_state not in enum.states.unknown)) else nextion.color.off }}
            {%- else -%}
              {{ overlap.icon_color if overlap_icon_color_valid else [0, 0, 0] }}
            {%- endif -%}
          entity_friendly_name: '{{ states[entity_id].name if entity_id_valid }}'
          entity_device_class: '{{ state_attr(entity_id, "device_class") | default("") if entity_id_valid else "" }}'
          # Icon and color for the state, from entity_state_styles: { color, icon } or {} (see Global variables)
          entity_state_style: >
            {%- set domain_styles = entity_state_styles[entity_domain] if entity_id_valid and entity_domain in entity_state_styles else {} -%}
            {%- if domain_styles.actions is defined -%}
              {%- set hvac_action = state_attr(entity_id, "hvac_action") | default("") -%}
              {%- set climate_action = hvac_action if hvac_action and hvac_action not in enum.states.unknown else entity_state -%}
              {{ domain_styles.actions | selectattr("match", "in", climate_action) | first | default({}) }}
            {%- elif domain_styles.states is defined -%}
              {%- set style_key = (state_attr(entity_id, domain_styles.attribute) | default(entity_state)) if domain_styles.attribute is defined else entity_state -%}
              {{ domain_styles.states[style_key] if style_key in domain_styles.states else {} }}
            {%- else -%}
              {{ {} }}
            {%- endif -%}
          entity_icon_color: >
              {%- if entity_id_valid -%}
                {%- if entity_domain == "light" -%}
                  {%- if entity_state != "on" -%}
                    {{ nextion.color.off }}
                  {%- else -%}
                    {%- set entity_rgb_color_attr = state_attr(entity_id, "rgb_color") | default("") -%}
                    {%- if entity_rgb_color_attr is list and entity_rgb_color_attr | count == 3 -%}
                      {{ entity_rgb_color_attr }}
                    {%- else -%}
                      {{ entity_icon_color_tmp }}
                    {%- endif -%}
                  {%- endif -%}
                {%- elif entity_domain == "humidifier" -%}
                  {#- `action` tells whether it is actually running, not only switched on -#}
                  {%- set humidifier_action = state_attr(entity_id, "action") -%}
                  {%- if entity_state == "off" or humidifier_action == "off" -%}
                    {{ nextion.color.off }}
                  {%- elif humidifier_action == "humidifying" -%}
                    {{ nextion.color.blue }}
                  {%- elif humidifier_action == "drying" -%}
                    {{ nextion.color.orange }}
                  {%- else -%}
                    {{ entity_icon_color_tmp }}
                  {%- endif -%}
                {%- elif entity_state_style.color is defined -%}
                  {{ nextion.color[entity_state_style.color] }}
                {%- else -%}
                  {{ entity_icon_color_tmp }}
                {%- endif -%}
              {%- endif -%}

          entity:
            name: >
              {%- if entity_id_valid -%}
                {{ overlap.name if overlap_name_valid else entity_friendly_name }}
              {%- endif -%}

            icon: >
              {%- if entity_id_valid -%}
                {%- set icon_domain = nextion.icon.domain[entity_domain] | default("\uE027") if entity_domain else "\uE027" -%}{#- mdi:alert-circle -#}
                {#- Priority 1: Overlap icon -#}
                {%- if overlap_icon_valid -%}
                  {{ (special_icons[(overlap.icon.split(":")[1])] if (overlap.icon.split(":")[1]) in special_icons
                    else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (overlap.icon.split(":")[1]) ~ ",")].count(",")))
                    if ("," ~ (overlap.icon.split(":")[1]) ~ ",") in all_icon_names
                    else "") }}
                {#- Priority 2: Domain-specific icon, from entity_state_styles -#}
                {%- elif entity_domain in entity_state_styles and "default_icon" in entity_state_styles[entity_domain] -%}
                  {{ entity_state_style.icon | default(entity_state_styles[entity_domain].default_icon or icon_domain) }}
                {#- Priority 3: Entity's custom icon from state attribute -#}
                {%- elif entity_icon_valid -%}
                  {{ (special_icons[(entity_icon.split(":")[1])] if (entity_icon.split(":")[1]) in special_icons
                    else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (entity_icon.split(":")[1]) ~ ",")].count(",")))
                    if ("," ~ (entity_icon.split(":")[1]) ~ ",") in all_icon_names
                    else "") }}
                {#- Priority 4: Device class icon -#}
                {%- elif entity_device_class is string and
                    entity_device_class | length > 0 and
                    entity_domain in device_class_icons -%}
                  {%- set state_suffix = "" if entity_domain in ["button", "event", "sensor"] else ("-" + icon_state) -%}
                  {%- set device_class_key = entity_device_class + state_suffix -%}
                  {%- if device_class_key in device_class_icons[entity_domain] -%}
                    {{ (special_icons[(device_class_icons[entity_domain][device_class_key])] if (device_class_icons[entity_domain][device_class_key]) in special_icons
                      else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (device_class_icons[entity_domain][device_class_key]) ~ ",")].count(",")))
                      if ("," ~ (device_class_icons[entity_domain][device_class_key]) ~ ",") in all_icon_names
                      else "") }}
                  {%- else -%}
                    {{ icon_domain }}
                  {%- endif -%}
                {#- Priority 5: Domain default -#}
                {%- else -%}
                  {{ icon_domain }}
                {%- endif -%}
              {%- endif -%}

            icon_color: '{{ entity_icon_color }}'
            icon_color_rgb565: >-
              {{
                int(
                      ((entity_icon_color[0] //(2**3)) *(2**11)) +
                      ((entity_icon_color[1] //(2**2)) *(2**5)) +
                      ((entity_icon_color[2] //(2**3)))
                    )
                if entity_icon_color is list and entity_icon_color | count == 3
                else 0
              }}

  - alias: Main choices
    choose:
      - alias: NSPanel event
        conditions:
          - condition: trigger
            id: nspanel_event
          - '{{ trigger is defined }}'
          - '{{ trigger.event is defined }}'
          - '{{ trigger.event.data is defined }}'
        sequence:  # nspanel_event
          - &variable_nspanel_event
            variables:
              nspanel_event: >-
                {{
                  trigger.event.data
                  if
                    trigger is defined and
                    trigger.event is defined and
                    trigger.event.data is defined
                  else none
                }}
          - condition: '{{ nspanel_event is not none }}'
          - choose:
              - alias: Boot init
                conditions:
                  - '{{ nspanel_event.type == "boot"}}'
                  - '{{ nspanel_event.step is defined and nspanel_event.step in ["display_ack", "setup", "start", "timeout", "reload"] }}'
                sequence:
                  - &global_settings
                    sequence:
                      - variables:
                          global_settings_setup: >-
                            {{
                              not (
                                nspanel_event is defined and
                                nspanel_event.step is defined and
                                nspanel_event.step == "start"
                              )
                            }}

                      - alias: Blueprint version
                        sequence:
                          - action: 'esphome.{{ action_prefix }}_component_text_list'
                            data:
                              page: mem
                              id: ver_blueprint
                              txt_list:
                                - '{{ blueprint_version }}'
                            continue_on_error: true
                          - &delay_boot
                            delay:
                              milliseconds: !input delay_boot

                      # Stop here if this is initial boot as Nextion may not be ready
                      - condition: '{{ global_settings_setup }}'

                      - alias: Sun position
                        sequence:
                          - variables:
                              sun_zone_tmp: !input sun_zone

                              sun_zone_entity: >
                                {%- if sun_zone_tmp is string and sun_zone_tmp | length > 0 -%}
                                  {{ sun_zone_tmp }}
                                {%- elif sun_zone_tmp is list and sun_zone_tmp | count > 0 and sun_zone_tmp[0] is string -%}
                                  {{ sun_zone_tmp[0] }}
                                {%- elif states.zone.home is not none -%}
                                  zone.home
                                {%- elif states.zone | list | count > 0 -%}
                                  {{ states.zone | map(attribute="entity_id") | list | first }}
                                {%- endif -%}

                              sun_latitude: '{{ state_attr(sun_zone_entity, "latitude") if sun_zone_entity | length > 0 }}'
                              sun_longitude: '{{ state_attr(sun_zone_entity, "longitude") if sun_zone_entity | length > 0 }}'
                          - alias: Send Sun position
                            if: '{{ sun_latitude | is_number and sun_longitude | is_number }}'
                            then:
                              - action: 'esphome.{{ action_prefix }}_component_text_list'
                                data:
                                  page: mem
                                  id: sun_coordinates
                                  txt_list:
                                    - '{{ sun_latitude }}'
                                    - '{{ sun_longitude }}'
                                continue_on_error: true
                              - *delay_default

                      - alias: API Subscriptions
                        sequence:
                          - variables: &variables_weather_entity_from_input
                              weather_entity_tmp: !input weather_entity
                              weather_entity: >
                                {%- if weather_entity_tmp is string and weather_entity_tmp | length > 0 -%} {{ weather_entity_tmp }}
                                {%- elif states.weather | list | count > 0 -%} {{ states.weather | map(attribute="entity_id") | list | first }}
                                {%- endif -%}

                          - alias: variables_temperature_entities_from_input
                            variables:
                              outdoortemp_tmp: !input outdoortemp
                              home_outdoor_temp_visible_tmp: !input home_outdoor_temp_visible

                              outdoor_temp_entity: >
                                {%- if not home_outdoor_temp_visible_tmp -%}
                                {%- elif outdoortemp_tmp is string and outdoortemp_tmp | length > 0 -%} {{ outdoortemp_tmp }}
                                {%- elif outdoortemp_tmp is list and outdoortemp_tmp | count > 0 and outdoortemp_tmp[0] is string -%} {{ outdoortemp_tmp[0] }}
                                {%- else -%} {{ weather_entity }}
                                {%- endif -%}

                              indoortemp_tmp: !input indoortemp
                              home_indoor_temp_visible_tmp: !input home_indoor_temp_visible

                              indoor_temp_entity: >
                                {%- if not home_indoor_temp_visible_tmp -%}
                                {%- elif indoortemp_tmp is string and indoortemp_tmp | length > 0 -%} {{ indoortemp_tmp }}
                                {%- elif indoortemp_tmp is list and indoortemp_tmp | count > 0 and indoortemp_tmp[0] is string -%} {{ indoortemp_tmp[0] }}
                                {%- endif -%}

                              temp_calibration_reference_tmp: !input temp_calibration_reference
                              thermostat_use_temp_reference_tmp: !input thermostat_use_temp_reference

                              # Never the panel's own sensor or thermostat: both already include the correction being calibrated.
                              temp_calibration_entity: >
                                {%- set e = temp_calibration_reference_tmp[0]
                                            if temp_calibration_reference_tmp is list and temp_calibration_reference_tmp | count > 0
                                            else temp_calibration_reference_tmp -%}
                                {%- if e is string and "." in e and e not in [nspaneltemp, thermostat_embedded] -%}
                                {{ e }}
                                {%- endif -%}
                          - variables:
                              wake_up_sensors_tmp: !input wake_up_sensors
                          - variables:
                              # Home page chips: inputs only, so no templates to render
                              subs_chips:
                                - entity: !input chip01
                                  inverted: !input chip01_inverted
                                  icon: !input chip01_icon
                                  icon_color_rgb: !input chip01_icon_color
                                  component: chip01
                                - entity: !input chip02
                                  inverted: !input chip02_inverted
                                  icon: !input chip02_icon
                                  icon_color_rgb: !input chip02_icon_color
                                  component: chip02
                                - entity: !input chip03
                                  inverted: !input chip03_inverted
                                  icon: !input chip03_icon
                                  icon_color_rgb: !input chip03_icon_color
                                  component: chip03
                                - entity: !input chip04
                                  inverted: !input chip04_inverted
                                  icon: !input chip04_icon
                                  icon_color_rgb: !input chip04_icon_color
                                  component: chip04
                                - entity: !input chip05
                                  inverted: !input chip05_inverted
                                  icon: !input chip05_icon
                                  icon_color_rgb: !input chip05_icon_color
                                  component: chip05
                                - entity: !input chip06
                                  inverted: !input chip06_inverted
                                  icon: !input chip06_icon
                                  icon_color_rgb: !input chip06_icon_color
                                  component: chip06
                                - entity: !input chip07
                                  inverted: !input chip07_inverted
                                  icon: !input chip07_icon
                                  icon_color_rgb: !input chip07_icon_color
                                  component: chip07

                              ##### API subscriptions #####
                              # Components driven directly by ESPHome through Home Assistant state
                              # subscriptions. The panel renders these locally, so this automation does
                              # not trigger on their entities at all.
                              # Built in a single template, so each panel's automation holds one template here
                              # instead of one per field (issue #657).
                              api_subscriptions: >-
                                {%- set calibration_is_climate = temp_calibration_entity.split(".")[0] == "climate" -%}
                                {%- set ns = namespace(wakeup=[]) -%}
                                {%- set sensors = [wake_up_sensors_tmp] if wake_up_sensors_tmp is string else wake_up_sensors_tmp -%}
                                {%- for sensor in sensors | default([], true) -%}
                                  {%- set ns.wakeup = ns.wakeup + [{"entity": sensor, "component": "sensor%02d" | format(loop.index)}] -%}
                                {%- endfor -%}
                                {#- Weather picture, outdoor and indoor temperature -#}
                                {%- set weather = [
                                      {"entity": weather_entity, "page": "home", "component": "weather"},
                                      {"entity": outdoor_temp_entity,
                                       "attribute": "temperature" if outdoor_temp_entity == weather_entity else "",
                                       "page": "home", "component": "outdoor_temp"},
                                      {"entity": indoor_temp_entity,
                                       "attribute": "current_temperature" if indoor_temp_entity.split(".")[0] == "climate" else "",
                                       "page": "home", "component": "indr_temp"}
                                    ] -%}
                                {#- Reference for the panel's temperature sensor. The component selects the mode: calibration only,
                                    or also the thermostat's direct source.
                                    A climate entity's attribute is not re-sent when it disappears, so its state tells when it is unavailable -#}
                                {%- set calibration = [
                                      {"entity": temp_calibration_entity,
                                       "attribute": "current_temperature" if calibration_is_climate else "",
                                       "page": "calibration",
                                       "component": "thermostat"
                                                    if thermostat_use_temp_reference_tmp and states[thermostat_embedded] is not none
                                                    else "temperature"},
                                      {"entity": temp_calibration_entity if calibration_is_climate else "",
                                       "page": "calibration", "component": "availability"}
                                    ] -%}
                                {{
                                  (
                                    (subs_chips | map("combine", {"page": "chips"}) | list)
                                    + weather
                                    + (home_page.custom_buttons | map("combine", {"page": "home"}) | list)
                                    + (ns.wakeup | map("combine", {"page": "wakeup"}) | list)
                                    + calibration
                                  )
                                  | selectattr("entity", "defined")
                                  | selectattr("entity", "string")
                                  | rejectattr("entity", "eq", "")
                                  | selectattr("entity", "search", "^[^.]+\\.[^.]+$")
                                  | list
                                }}

                          ###### API subscriptions ######
                          - &push_subscriptions
                            alias: Push API subscriptions
                            sequence:
                              # Orders overlapping pushes by start time, so the panel keeps only the newest one.
                              # The "T" keeps it a string: Home Assistant would turn an all-digit value into a number,
                              # too large for the recorder to store with the action call.
                              - variables:
                                  push_id: '{{ utcnow().strftime("%Y%m%dT%H%M%S%f") }}'
                              - repeat:
                                  for_each: '{{ api_subscriptions }}'
                                  sequence:
                                    - condition: '{{ repeat.item.entity.split(".") | count == 2 }}'
                                    - variables:
                                        entity_id: '{{ repeat.item.entity }}'
                                        icon_color_rgb_valid: >
                                          {{
                                            repeat.item.icon_color_rgb is defined and
                                            repeat.item.icon_color_rgb is list and
                                            repeat.item.icon_color_rgb | count == 3
                                          }}
                                        overlap:
                                          icon: >
                                            {{
                                              repeat.item.icon
                                              if
                                                repeat.item.icon is defined and
                                                repeat.item.icon is string and
                                                repeat.item.icon | length > 0 and
                                                repeat.item.icon is match "mdi:" and
                                                ((repeat.item.icon.split("mdi:") | last) in special_icons or ("," ~ (repeat.item.icon.split("mdi:") | last) ~ ",") in all_icon_names)
                                              else
                                                None
                                            }}
                                          icon_color: '{{ repeat.item.icon_color_rgb if icon_color_rgb_valid else None }}'

                                    # Domains whose appearance varies across the visible
                                    # state set are resolved on-device, so send no icon
                                    # unless the user set an explicit override.
                                    - variables:
                                        resolved_on_device: >
                                          {{
                                            entity_id.split(".")[0] in
                                            ["alarm_control_panel", "climate", "cover", "lock", "water_heater"]
                                          }}

                                    # A chip is only ever visible in one state, so its
                                    # icon must be resolved for that state rather than
                                    # for whatever the entity happens to be doing now.
                                    # Resolve both, and let the panel pick.
                                    - variables:
                                        forced_icon_state: 'on'
                                    - *variable_entity
                                    - variables:
                                        sub_device_class: '{{ entity_device_class | default("", true) }}'
                                        sub_icon_on: '{{ "" if resolved_on_device and not overlap_icon_valid else entity.icon }}'

                                    - variables:
                                        forced_icon_state: 'off'
                                    - *variable_entity
                                    - variables:
                                        sub_icon_off: '{{ "" if resolved_on_device and not overlap_icon_valid else entity.icon }}'

                                    - action: 'esphome.{{ action_prefix }}_api_subscribe'
                                      data:
                                        push_id: '{{ push_id }}'
                                        page: '{{ repeat.item.page }}'
                                        component: '{{ repeat.item.component }}'
                                        entity: '{{ entity_id }}'
                                        device_class: '{{ sub_device_class }}'
                                        attribute: '{{ repeat.item.attribute | default("", true) }}'
                                        icon_on: '{{ sub_icon_on }}'
                                        icon_off: '{{ sub_icon_off }}'
                                        color_on: '{{ repeat.item.icon_color_rgb if icon_color_rgb_valid else nextion.color.on }}'
                                        color_off: '{{ repeat.item.icon_color_rgb if icon_color_rgb_valid else nextion.color.off }}'
                                        inverted: '{{ repeat.item.inverted | default(false) }}'
                                      continue_on_error: true
                                    - *delay_default

                              - action: 'esphome.{{ action_prefix }}_api_subscribe_end'
                                data:
                                  push_id: '{{ push_id }}'
                                  count: '{{ api_subscriptions | count }}'
                                continue_on_error: true

                      - &variables_hardware
                        variables:
                          hw_button_left_entity: !input left_button_entity
                          hw_button_left_state_entity: !input left_button_state_entity
                          hw_button_right_entity: !input right_button_entity
                          hw_button_right_state_entity: !input right_button_state_entity
                          hardware:
                            buttons:
                              left:
                                entity: '{{ hw_button_left_entity }}'
                                entity_is_valid: '{{ hw_button_left_entity is defined and hw_button_left_entity is string and hw_button_left_entity.split(".") | count == 2 }}'
                                state_entity: '{{ hw_button_left_state_entity }}'
                                state_entity_is_valid: >
                                  {{ hw_button_left_state_entity is defined and hw_button_left_state_entity is string and hw_button_left_state_entity.split(".") | count == 2 }}
                                label_type: !input 'left_button_label_type'
                                name: !input 'left_button_name'
                                icon: !input 'left_button_icon'
                                hold_select: !input 'left_button_hold_select'
                                bar_always_visible: !input hw_button_bar_left_always_show
                              right:
                                entity: '{{ hw_button_right_entity }}'
                                entity_is_valid: '{{ hw_button_right_entity is defined and hw_button_right_entity is string and hw_button_right_entity.split(".") | count == 2 }}'
                                state_entity: '{{ hw_button_right_state_entity }}'
                                state_entity_is_valid: >
                                  {{ hw_button_right_state_entity is defined and hw_button_right_state_entity is string and hw_button_right_state_entity.split(".") | count == 2 }}
                                label_type: !input 'right_button_label_type'
                                name: !input 'right_button_name'
                                icon: !input 'right_button_icon'
                                hold_select: !input 'right_button_hold_select'
                                bar_always_visible: !input hw_button_bar_right_always_show

                      - alias: DateTime
                        sequence:
                          - alias: DateTime on page home
                            sequence:
                              - alias: date_color
                                action: 'esphome.{{ action_prefix }}_component_color'
                                data:
                                  page: mem
                                  id: date_color
                                  color: !input date_label_color
                                continue_on_error: true
                              - *delay_boot
                              - alias: time_color
                                action: 'esphome.{{ action_prefix }}_component_color'
                                data:
                                  page: mem
                                  id: time_color
                                  color: !input time_label_color
                                continue_on_error: true
                              - *delay_boot
                              - alias: date_format
                                action: 'esphome.{{ action_prefix }}_component_text_list'
                                data:
                                  page: mem
                                  id: date_format
                                  txt_list:
                                    - !input date_format
                                continue_on_error: true
                              - *delay_boot
                              - alias: time_format
                                action: 'esphome.{{ action_prefix }}_component_text_list'
                                data:
                                  page: mem
                                  id: time_format
                                  txt_list:
                                    - !input time_format
                                continue_on_error: true
                              - *delay_boot

                      - alias: Localization - Units separator
                        sequence:
                          - alias: units_separator
                            action: 'esphome.{{ action_prefix }}_component_text_list'
                            data:
                              page: mem
                              id: units_separator
                              txt_list:
                                - '{{ "none" if compact_unit_display else "space" }}'
                            continue_on_error: true
                          - *delay_boot

                      - alias: Home page
                        sequence:
                          - alias: Chips
                            sequence:
                              - variables:
                                  climate_chip_visibility: !input climate_chip_visibility
                              - alias: climate_chip_visibility
                                action: 'esphome.{{ action_prefix }}_component_val'
                                data:
                                  page: mem
                                  id: climate_chip_visibility
                                  val: >-
                                    {%- if climate_chip_visibility == 'always' %}1
                                    {%- elif climate_chip_visibility == 'never' %}2
                                    {%- else %}0{%- endif %}
                                continue_on_error: true
                              - *delay_boot
                              - alias: chip_font
                                action: 'esphome.{{ action_prefix }}_component_val'
                                data:
                                  page: mem
                                  id: chip_font
                                  val: !input chip_font_size
                                continue_on_error: true
                              - *delay_boot
                          - alias: custom_buttons_font
                            action: 'esphome.{{ action_prefix }}_component_val'
                            data:
                              page: mem
                              id: custom_buttons_font
                              val: !input custom_buttons_font_size
                            continue_on_error: true
                          - *delay_boot
                          - alias: unavailable_behavior
                            # Held on the panel rather than passed per call: the home page custom
                            # buttons are rendered on-device from API subscriptions, with no
                            # blueprint round trip to carry a parameter.
                            action: 'esphome.{{ action_prefix }}_component_val'
                            data:
                              page: mem
                              id: unavailable_behavior
                              val: !input unavailable_behavior
                            continue_on_error: true
                          - *delay_boot
                          - alias: custom_buttons_confirm
                            sequence:
                              - variables:
                                  home_custom_buttons_confirm:
                                    - !input home_custom_button01_confirm
                                    - !input home_custom_button02_confirm
                                    - !input home_custom_button03_confirm
                                    - !input home_custom_button04_confirm
                                    - !input home_custom_button05_confirm
                                    - !input home_custom_button06_confirm
                                    - !input home_custom_button07_confirm
                              - action: 'esphome.{{ action_prefix }}_component_val'
                                data:
                                  page: mem
                                  id: custom_buttons_confirm
                                  val: >
                                    {% set ns = namespace(decimal_value = 0) %}
                                    {% for confirm_item in home_custom_buttons_confirm %}
                                        {% if (confirm_item) %}
                                            {% set ns.decimal_value = ns.decimal_value + (2 ** loop.index0) %}
                                        {% endif %}
                                    {% endfor %}
                                    {{ ns.decimal_value }}
                                continue_on_error: true
                              - *delay_boot
                          - alias: Temperatures appearance
                            sequence:
                              - variables:
                                  home_indoor_temp_icon: !input home_indoor_temp_icon
                              - action: 'esphome.{{ action_prefix }}_component_text_list'
                                data:
                                  page: home
                                  id: indr_temp_icon
                                  txt_list:
                                    - >
                                      {{
                                        (special_icons[(home_indoor_temp_icon.split("mdi:") | last)] if (home_indoor_temp_icon.split("mdi:") | last) in special_icons
                                          else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (home_indoor_temp_icon.split("mdi:") | last) ~ ",")].count(",")))
                                          if ("," ~ (home_indoor_temp_icon.split("mdi:") | last) ~ ",") in all_icon_names
                                          else "")
                                        if home_indoor_temp_icon.split("mdi:") | count == 2 and ((home_indoor_temp_icon.split("mdi:") | last) in special_icons
                                          or ("," ~ (home_indoor_temp_icon.split("mdi:") | last) ~ ",") in all_icon_names)
                                        else "\uE50E"
                                      }}{# mdi:thermometer #}
                                continue_on_error: true
                              - *delay_boot
                              - action: 'esphome.{{ action_prefix }}_component_color'
                                data:
                                  page: home
                                  id: indr_temp_icon
                                  color: !input home_indoor_temp_icon_color
                                continue_on_error: true
                              - *delay_boot
                              - alias: indoor_temperature_visibility
                                action: 'esphome.{{ action_prefix }}_components_visibility'
                                data:
                                  page: home
                                  ids:
                                    - indr_temp
                                  visible: !input home_indoor_temp_visible
                                continue_on_error: true
                              - *delay_boot
                              - alias: Outdoor temperature
                                sequence:
                                  - alias: outdoor_temperature_visibility
                                    action: 'esphome.{{ action_prefix }}_components_visibility'
                                    data:
                                      page: home
                                      ids:
                                        - outdoor_temp
                                      visible: !input home_outdoor_temp_visible
                                    continue_on_error: true
                                  - *delay_boot
                                  - variables:
                                      home_outdoor_temp_visible_tmp: !input home_outdoor_temp_visible
                                  - if: '{{ home_outdoor_temp_visible_tmp }}'
                                    then:
                                      - alias: outdoor_temp_font
                                        action: 'esphome.{{ action_prefix }}_component_val'
                                        data:
                                          page: mem
                                          id: outdoor_temp_font
                                          val: !input home_outdoor_temp_font
                                        continue_on_error: true
                                      - *delay_boot
                          - alias: Home page - Entities button
                            sequence:
                              - variables:
                                  bt_entities_icon: !input home_button06_icon
                                  bt_entities_visible: >-
                                    {{
                                      entities_pages.entities
                                      | selectattr("page", "defined")
                                      | selectattr("page", "in", pages.entitypages)
                                      | selectattr("entity", "defined")
                                      | rejectattr("entity", "eq", [])
                                      | list
                                      | count > 0
                                    }}
                              - alias: entities_pages_icon
                                action: 'esphome.{{ action_prefix }}_icon'
                                data:
                                  page: home
                                  id: bt_entities
                                  icon: >
                                    {{
                                      (special_icons[(bt_entities_icon.split("mdi:") | last)] if (bt_entities_icon.split("mdi:") | last) in special_icons
                                        else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (bt_entities_icon.split("mdi:") | last) ~ ",")].count(",")))
                                        if ("," ~ (bt_entities_icon.split("mdi:") | last) ~ ",") in all_icon_names
                                        else "")
                                      if bt_entities_icon is string and ((bt_entities_icon.split("mdi:") | last) in special_icons
                                          or ("," ~ (bt_entities_icon.split("mdi:") | last) ~ ",") in all_icon_names)
                                      else "\uEDCF"
                                    }}{# mdi:format-list-bulleted-square #}
                                  icon_color: !input home_button06_icon_color
                                  visible: '{{ bt_entities_visible }}'
                                continue_on_error: true
                              - *delay_boot
                          - alias: Home page - Utilities button
                            sequence:
                              - variables:
                                  utilities_enabled: !input utilities_enabled
                                  bt_utilities_icon: !input home_button08_icon
                              - alias: home_bt_utilities
                                action: 'esphome.{{ action_prefix }}_icon'
                                data:
                                  page: home
                                  id: bt_utilities
                                  icon: >
                                    {{
                                      (special_icons[(bt_utilities_icon.split("mdi:") | last)] if (bt_utilities_icon.split("mdi:") | last) in special_icons
                                        else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (bt_utilities_icon.split("mdi:") | last) ~ ",")].count(",")))
                                        if ("," ~ (bt_utilities_icon.split("mdi:") | last) ~ ",") in all_icon_names
                                        else "")
                                      if bt_utilities_icon is string and ((bt_utilities_icon.split("mdi:") | last) in special_icons
                                          or ("," ~ (bt_utilities_icon.split("mdi:") | last) ~ ",") in all_icon_names)
                                      else "\uE299"
                                    }}{# mdi:gauge #}
                                  icon_color: !input home_button08_icon_color
                                  visible: '{{ utilities_enabled }}'
                              - *delay_boot

                      ###### Notification button ######
                      - &refresh_page_home_notification_button
                        sequence:
                          - variables:
                              home_button04_icon_color01: !input home_button04_icon_color01
                              bt_notific_icon_color: >
                                {{
                                  home_button04_icon_color01
                                  if home_button04_icon_color01 is list and home_button04_icon_color01 | count == 3
                                  else [200, 204, 200]
                                }}
                          ##### Home page - Notification icon (bt_notific) - Colors
                          - action: 'esphome.{{ action_prefix }}_component_color'
                            data:
                              page: mem
                              id: notification_icon_color_normal
                              color: '{{ bt_notific_icon_color }}'
                            continue_on_error: true
                          - *delay_boot
                          - action: 'esphome.{{ action_prefix }}_component_color'
                            data:
                              page: mem
                              id: notification_icon_color_unread
                              color: !input home_button04_icon_color02
                            continue_on_error: true
                          - *delay_boot

                          ##### Home page - Notification icon (bt_notific) - Icon
                          - variables:
                              bt_notific_icon: !input home_button04_icon
                          - action: 'esphome.{{ action_prefix }}_icon'
                            data:
                              page: home
                              id: bt_notific
                              icon: >
                                {{
                                  (special_icons[(bt_notific_icon.split(":")[1])] if (bt_notific_icon.split(":")[1]) in special_icons
                                    else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (bt_notific_icon.split(":")[1]) ~ ",")].count(",")))
                                    if ("," ~ (bt_notific_icon.split(":")[1]) ~ ",") in all_icon_names
                                    else "")
                                  if bt_notific_icon is string and ((bt_notific_icon.split(":")[1]) in special_icons or ("," ~ (bt_notific_icon.split(":")[1]) ~ ",") in all_icon_names)
                                  else "\uE1ED"
                                }}{# mdi:email #}
                              icon_color: '{{ bt_notific_icon_color }}'
                              visible: false
                            continue_on_error: true
                          - *delay_boot

                      - alias: Home page - outdoor_temp - color
                        sequence:
                          - action: 'esphome.{{ action_prefix }}_component_color'
                            data:
                              page: home
                              id: outdoor_temp
                              color: !input home_outdoor_temp_label_color
                            continue_on_error: true
                          - *delay_boot

                      - alias: Home page - indr_temp - color
                        sequence:
                          - action: 'esphome.{{ action_prefix }}_component_color'
                            data:
                              page: home
                              id: indr_temp
                              color: !input home_indoor_temp_label_color
                            continue_on_error: true
                          - *delay_boot

                      - alias: Home page - Values 01 - 04
                        repeat:
                          for_each: '{{ home_page.entity_value | list }}'
                          sequence:
                            - condition:
                                - '{{ repeat.item.entity is defined }}'
                                - '{{ repeat.item.entity is string }}'
                                - '{{ repeat.item.entity.split(".") | count == 2 }}'
                            - variables:
                                default_color: *default_home_value_color
                            - alias: Text color
                              if:
                                - '{{ repeat.item.label_color_rgb is defined }}'
                                - '{{ repeat.item.label_color_rgb is list }}'
                                - '{{ repeat.item.label_color_rgb | count == 3 }}'
                                - '{{ repeat.item.label_color_rgb != default_color }}'
                              then:
                                - action: 'esphome.{{ action_prefix }}_component_color'
                                  data:
                                    page: home
                                    id: '{{ repeat.item.component }}'
                                    color: '{{ repeat.item.label_color_rgb }}'
                                  continue_on_error: true
                                - *delay_boot

                            - alias: Icon color
                              if:
                                - '{{ repeat.item.icon_color_rgb is defined }}'
                                - '{{ repeat.item.icon_color_rgb is list }}'
                                - '{{ repeat.item.icon_color_rgb | count == 3 }}'
                                - '{{ repeat.item.icon_color_rgb != default_color }}'
                              then:
                                - action: 'esphome.{{ action_prefix }}_component_color'
                                  data:
                                    page: home
                                    id: '{{ repeat.item.component }}_icon'
                                    color: '{{ repeat.item.icon_color_rgb }}'
                                  continue_on_error: true
                                - *delay_boot

                            - alias: Icon
                              if:
                                - '{{ repeat.item.icon is defined }}'
                                - '{{ repeat.item.icon is string }}'
                                - '{{ repeat.item.icon is match "mdi:" }}'
                                - '{{ ((repeat.item.icon.split("mdi:") | last) in special_icons or ("," ~ (repeat.item.icon.split("mdi:") | last) ~ ",") in all_icon_names) }}'
                              then:
                                - action: 'esphome.{{ action_prefix }}_component_text_list'
                                  data:
                                    page: '{{ repeat.item.page }}'
                                    id: '{{ repeat.item.component }}_icon'
                                    txt_list:
                                      - '{{ (special_icons[(repeat.item.icon.split("mdi:") | last)] if (repeat.item.icon.split("mdi:") | last) in special_icons
                                        else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (repeat.item.icon.split("mdi:") | last) ~ ",")].count(",")))
                                        if ("," ~ (repeat.item.icon.split("mdi:") | last) ~ ",") in all_icon_names
                                        else "") }}'
                                  continue_on_error: true
                                - *delay_boot

                      - alias: Home page - Values with a graph
                        sequence:
                          - variables:
                              graph_entities: >-
                                {%- set ns = namespace(entities=[]) -%}
                                {%- for value in home_page.entity_value -%}
                                  {%- set entity = value.entity if value.entity is string else "" -%}
                                  {%- set has_graph = value.graph | default(false, true) and "." in entity
                                        and states[entity] is not none
                                        and state_attr(entity, "state_class") in ["measurement", "measurement_angle"] -%}
                                  {%- set ns.entities = ns.entities + [entity if has_graph else ""] -%}
                                {%- endfor -%}
                                {{ ns.entities }}
                          - action: 'esphome.{{ action_prefix }}_component_text_list'
                            data:
                              page: mem
                              id: graph_entities
                              txt_list: '{{ graph_entities }}'
                            continue_on_error: true
                          - *delay_boot

                      - alias: Hardware buttons labels
                        sequence:
                          - variables:
                              hw_buttons_labels_pages: !input hw_buttons_labels_pages
                          # Left button label: when the label type is `Icon`, the icon is resolved like elsewhere,
                          # the selected icon first, then the state indicator (or controlled) entity's icon, device class or domain
                          - variables:
                              entity_id: >-
                                {{
                                  hardware.buttons.left.state_entity if hardware.buttons.left.state_entity_is_valid
                                  else hardware.buttons.left.entity if hardware.buttons.left.entity_is_valid
                                  else None
                                }}
                              forced_icon_state: '{{ None }}'
                              overlap:
                                icon: '{{ hardware.buttons.left.icon | default(None, true) }}'
                                icon_color: '{{ None }}'
                                name: '{{ None }}'
                          - *variable_entity
                          - variables:
                              hw_button_left_label: >-
                                {%- if hardware.buttons.left.label_type == "Icon" -%}
                                  {%- if overlap_icon_valid -%}
                                    {{ (special_icons[(overlap.icon.split(":")[1])] if (overlap.icon.split(":")[1]) in special_icons
                                      else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (overlap.icon.split(":")[1]) ~ ",")].count(",")))
                                      if ("," ~ (overlap.icon.split(":")[1]) ~ ",") in all_icon_names
                                      else "") }}
                                  {%- elif entity_id_valid -%}
                                    {{ entity.icon }}
                                  {%- else -%}
                                    {{ "\uE027" }}{# mdi:alert-circle #}
                                  {%- endif -%}
                                {%- elif hardware.buttons.left.label_type == "Text" -%}
                                  {{ hardware.buttons.left.name | default("", true) | string }}
                                {%- else -%}
                                  {{ "" }}
                                {%- endif -%}
                          # Right button label: when the label type is `Icon`, the icon is resolved like elsewhere,
                          # the selected icon first, then the state indicator (or controlled) entity's icon, device class or domain
                          - variables:
                              entity_id: >-
                                {{
                                  hardware.buttons.right.state_entity if hardware.buttons.right.state_entity_is_valid
                                  else hardware.buttons.right.entity if hardware.buttons.right.entity_is_valid
                                  else None
                                }}
                              forced_icon_state: '{{ None }}'
                              overlap:
                                icon: '{{ hardware.buttons.right.icon | default(None, true) }}'
                                icon_color: '{{ None }}'
                                name: '{{ None }}'
                          - *variable_entity
                          - variables:
                              hw_button_right_label: >-
                                {%- if hardware.buttons.right.label_type == "Icon" -%}
                                  {%- if overlap_icon_valid -%}
                                    {{ (special_icons[(overlap.icon.split(":")[1])] if (overlap.icon.split(":")[1]) in special_icons
                                      else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (overlap.icon.split(":")[1]) ~ ",")].count(",")))
                                      if ("," ~ (overlap.icon.split(":")[1]) ~ ",") in all_icon_names
                                      else "") }}
                                  {%- elif entity_id_valid -%}
                                    {{ entity.icon }}
                                  {%- else -%}
                                    {{ "\uE027" }}{# mdi:alert-circle #}
                                  {%- endif -%}
                                {%- elif hardware.buttons.right.label_type == "Text" -%}
                                  {{ hardware.buttons.right.name | default("", true) | string }}
                                {%- else -%}
                                  {{ "" }}
                                {%- endif -%}
                          ### LABELS Pages ###
                          - action: 'esphome.{{ action_prefix }}_component_text_list'
                            data:
                              page: mem
                              id: buttons_labels_pages
                              # Each option may hold more than one page (comma-separated); an empty list is sent as ['']
                              txt_list: >-
                                {{
                                  (hw_buttons_labels_pages | join(',')).split(',') | reject('eq', '') | list
                                  if hw_buttons_labels_pages | count > 0
                                  else ['']
                                }}
                            continue_on_error: true
                          - *delay_boot
                          ### LABELS Font Color ###
                          - action: 'esphome.{{ action_prefix }}_component_color'
                            data:
                              page: mem
                              id: button_left_label_color
                              color: !input left_button_color
                            continue_on_error: true
                          - *delay_boot
                          - action: 'esphome.{{ action_prefix }}_component_color'
                            data:
                              page: mem
                              id: button_right_label_color
                              color: !input right_button_color
                            continue_on_error: true
                          - *delay_boot
                          ### LABELS Text ###
                          # Always sent, so an empty label clears the one previously stored
                          - action: 'esphome.{{ action_prefix }}_component_text_list'
                            data:
                              page: mem
                              id: button_left_label
                              txt_list:
                                - '{{ hw_button_left_label }}'
                            continue_on_error: true
                          - *delay_boot
                          - action: 'esphome.{{ action_prefix }}_component_text_list'
                            data:
                              page: mem
                              id: button_right_label
                              txt_list:
                                - '{{ hw_button_right_label }}'
                            continue_on_error: true
                          - *delay_boot

                      - alias: QRcode
