                                          - '{{ nspanel_event.component == "button04" }}'
                                        sequence: !input entity04_custom_action
                                      - alias: Custom action - Button 05
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage01" }}'
                                          - '{{ nspanel_event.component == "button05" }}'
                                        sequence: !input entity05_custom_action
                                      - alias: Custom action - Button 06
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage01" }}'
                                          - '{{ nspanel_event.component == "button06" }}'
                                        sequence: !input entity06_custom_action
                                      - alias: Custom action - Button 07
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage01" }}'
                                          - '{{ nspanel_event.component == "button07" }}'
                                        sequence: !input entity07_custom_action
                                      - alias: Custom action - Button 08
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage01" }}'
