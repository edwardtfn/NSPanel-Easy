          blue: [0, 128, 248]
          grey_dark: [40, 44, 40]            # 10596
          grey_super_light: [200, 204, 200]  # 52857
          grey_white: [225, 225, 225]        # 59164
          red: [248, 0, 0]
          white: [255, 255, 255]
          yellow: [248, 248, 0]
          #### Colors from HA Style:
          green: [76, 175, 80]
          orange: [255, 152, 0]
          cyan: [0, 188, 212]
          deep_orange: [255, 87, 34]
          amber: [255, 193, 7]
          "on": !input icon_color_fallback_on
