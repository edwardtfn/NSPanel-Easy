                                  txt_list:
                                    - >
                                      {{
                                        (special_icons[(bt_qrcode_icon.split("mdi:") | last)] if (bt_qrcode_icon.split("mdi:") | last) in special_icons
                                          else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (bt_qrcode_icon.split("mdi:") | last) ~ ",")].count(",")))
                                          if ("," ~ (bt_qrcode_icon.split("mdi:") | last) ~ ",") in all_icon_names
                                          else "")
                                        if bt_qrcode_icon is string and ((bt_qrcode_icon.split("mdi:") | last) in special_icons
                                            or ("," ~ (bt_qrcode_icon.split("mdi:") | last) ~ ",") in all_icon_names)
                                        else "\uE432"
