actions:
  - alias: Global variables
    variables:
      ##### GENERAL #####
      action_prefix: >
        {%- if device_name_override is string and device_name_override | length > 0 -%}
          {{ device_name_override | regex_replace("[^a-zA-Z0-9]", "_") | regex_replace("_+", "_") | lower }}
        {%- else -%}
          {{
            trigger.event.data.device_name
            if
              trigger is defined and
              trigger.event is defined and
              trigger.event.data is defined and
              trigger.event.data.device_name is defined and
              trigger.event.data.device_name is string and trigger.event.data.device_name | length > 0
            else
              (
                states(device_name_sensor)
                if has_value(device_name_sensor)
                else entity_prefix
              )
          }}
        {%- endif %}

      nspanel_name: '{{ action_prefix }}'
      # Device name with the action prefix appended when they differ,
      # e.g. "Office Panel (office_workstation_panel)".
      nspanel_full_name: >-
        {{
          device_name(nspanel_deviceid) ~ ((" (" ~ nspanel_name ~ ")")
          if nspanel_name != device_name(nspanel_deviceid)
          else "")
        }}

      page_constructor: false
      # True when an entity details page refresh was not triggered by an entity change:
      # the entity stayed quiet until the wait timed out (settle pass or fallback refresh).
      # Set per iteration by "Entity details pages refresh".
      refresh_settled: false
      # Milliseconds a button for an automation, button, input button, remote, scene or script shows on
      # before it is drawn off again.
      momentary_duration_ms: 800
      # False when a button page state trigger is not an activation of its automation, button, input button,
      # scene or script, e.g. a script ending more than momentary_duration_ms after its start or an attribute-only update.
      # Set by "Update button's entities".
      momentary_activated: true

      # Not in trigger_variables: they are limited templates there and cannot read states.
      sun_state_list: >
        {{
          (
            states.sun
            | map(attribute="state")
            | list
          )
          if states.sun | length > 0
          else []
        }}
      # Only below_horizon means night, so an unavailable or unknown sun keeps the day pictures.
      sun_is_up: >
        {{
          sun_state_list | first != "below_horizon"
          if sun_state_list | length > 0
          else true
        }}

