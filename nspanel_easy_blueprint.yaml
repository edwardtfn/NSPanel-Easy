    climate_settings:
      name: Climate entity
      icon: mdi:thermostat-cog
      description: Select the main climate entity.
      collapsed: true
      input:
        climate:
          name: Main climate Entity
          description: >
            Main climate entity, shown as the climate chip on the Home page and controlled on the climate page.
            If no climate entity is provided, the climate chip is not shown.

            Select your panel's own thermostat here if you use the Climate add-on to control the climate system with your panel's relays.

            *Only one entity may be selected.*
          default: *selector_entity_single_default_empty
          selector:
            entity:
              multiple: *selector_entity_single_multiple
              filter:
                domain: climate
        climate_chip_visibility:
          name: Main Climate - Chip Visibility
          description: >-
            Controls when the climate chip is shown on the home screen.
            "Active only" shows the chip only when the climate is actively
            heating, cooling, drying, or running the fan.
            "Always" keeps the chip visible whenever a climate entity is
            configured, even when idle or off.
            "Never" hides the chip entirely, regardless of the climate state.
          default: active_only
          selector:
            select:
              options:
                - label: "Active only"
                  value: active_only
                - label: "Always"
                  value: always
                - label: "Never"
                  value: never
        thermostat_use_temp_reference:
          name: Embedded Thermostat - Regulate on the Calibration Reference
          description: >-
            Toggle to have the panel's embedded thermostat (Climate add-on) control its relays using
            **NSPanel Temperature Sensor - Calibration Reference - Entity** directly,
            for example when that sensor is placed elsewhere in the room.
            Leave it disabled when the reference is next to the panel, as the calibration alone already covers that case.

            When disabled, the thermostat uses the NSPanel's own sensor, calibrated against that reference,
            and keeps working fully on its own while Home Assistant is unavailable.

            When enabled, the thermostat falls back to the calibrated NSPanel sensor whenever the reference
            has no usable value, has not changed for `temp_reference_max_age` (2 hours by default),
            differs from the panel's sensor by more than 10 °C (18 °F),
            or Home Assistant has been unavailable for longer than `api_stale_grace_period`.

            Has no effect when no calibration reference is selected.
          default: false
          selector:
            boolean:
