                      - alias: Disable empty buttons pages
                        sequence:
                          - variables:
                              txt_list_payload: >
                                {% set ns = namespace(items=[]) %}
                                {% for page in pages.buttonpages %}
                                  {% set pns = namespace(mask=0) %}
                                  {% for btn in buttons_pages.buttons
                                        | selectattr("page", "eq", page)
                                        | selectattr("entity", "defined")
                                        | rejectattr("entity", "eq", []) %}
                                    {% set slot = btn.component | replace("button", "") | int - 1 %}
                                    {% set pns.mask = pns.mask + (2 ** slot) %}
                                  {% endfor %}
                                  {% set ns.items = ns.items + ["is_" ~ page ~ "=" ~ pns.mask] %}
                                {% endfor %}
                                {{ ns.items }}
                          - action: 'esphome.{{ action_prefix }}_component_text_list'
                            data:
                              page: mem
                              id: command
                              txt_list: '{{ txt_list_payload }}'
                            continue_on_error: true
                          - *delay_boot

                      - alias: Disable empty entity pages
                        sequence:
                          - variables:
                              txt_list_payload: >
                                {% set ns = namespace(items=[], any_entities=false) %}
                                {% for page in pages.entitypages %}
                                  {% set has_entities = entities_pages.entities
                                        | selectattr("page", "defined")
                                        | selectattr("page", "eq", page)
                                        | selectattr("entity", "defined")
                                        | rejectattr("entity", "eq", [])
                                        | list
                                        | count > 0 %}
                                  {% set ns.items = ns.items + ["is_" ~ page ~ "=" ~ (1 if has_entities else 0)] %}
                                  {% set ns.any_entities = ns.any_entities or has_entities %}
                                {% endfor %}
                                {{ ns.items }}
                          - action: 'esphome.{{ action_prefix }}_component_text_list'
                            data:
                              page: mem
                              id: command
                              txt_list: '{{ txt_list_payload }}'
                            continue_on_error: true
                          - *delay_boot

              - alias: Lawn mower start/pause toggle
                conditions:
                  - '{{ nspanel_event.type == "action_call" }}'
                  - '{{ nspanel_event.action == "_lawn_mower_start_pause_toggle_" }}'
                  - '{{ nspanel_event.entity is defined }}'
                sequence:
                  - action: >-
                      {{ "lawn_mower.pause"
                        if states(nspanel_event.entity) in ["mowing", "returning"]
                        else "lawn_mower.start_mowing" }}
                    target:
                      entity_id: '{{ nspanel_event.entity }}'
                    continue_on_error: true

              - alias: Vacuum start/pause toggle
                conditions:
                  - '{{ nspanel_event.type == "action_call" }}'
                  - '{{ nspanel_event.action == "_vacuum_start_pause_toggle_" }}'
                  - '{{ nspanel_event.entity is defined }}'
                sequence:
                  - action: >-
                      {{ "vacuum.pause"
                        if states(nspanel_event.entity) in ["cleaning", "returning"]
                        else "vacuum.start" }}
                    target:
                      entity_id: '{{ nspanel_event.entity }}'
                    continue_on_error: true

              - alias: NSPanel action call
                conditions:
                  - '{{ nspanel_event.type == "action_call" }}'
                  - '{{ nspanel_event.action is defined and nspanel_event.action is string and nspanel_event.action | length > 0 }}'
                  - '{{ nspanel_event.action.split(".") | count == 2 }}'  # prevents call to null action
                  - '{{ nspanel_event.action.split(".")[0] | length > 0 and nspanel_event.action.split(".")[0] not in ["null", None] }}'  # prevents call to null service
                  - '{{ nspanel_event.action.split(".")[1] | length > 0 and nspanel_event.action.split(".")[1] not in ["null", None] }}'  # prevents call to null service
                  - '{{ nspanel_event.action | length > (2+nspanel_event.action.index(".")) }}'  # prevents call to null action
                  - '{{ nspanel_event.action is not match "alarm_control_panel." }}'  # Prevent the use of this call for alarm control due to safety reasons
                  - '{{ nspanel_event.entity is defined and nspanel_event.entity is string and nspanel_event.entity | length > 0 }}'
                sequence:
                  - if: '{{ nspanel_event.key is defined and nspanel_event.key is string and nspanel_event.key | length > 0 }}'
                    then:
                      - choose:
                          # The water heater page also shows humidifiers, but its buttons and slider always report the
                          # water heater actions. Translate them here when the entity on the page is a humidifier.
                          - alias: "water_heater.set_temperature (humidifier)"
                            conditions:
                              - '{{ nspanel_event.action == "water_heater.set_temperature" }}'
                              - '{{ nspanel_event.entity.split(".")[0] == "humidifier" }}'
                              - '{{ is_number(nspanel_event.value) }}'
                            sequence:
                              - variables:
                                  set_humidity_srv: "humidifier.set_humidity"  # Templated to avoid unknown action warnings when humidifier isn't loaded
                              - action: '{{ set_humidity_srv }}'
                                data:
                                  humidity: '{{ nspanel_event.value | float | round(0) | int }}'
                                target:
                                  entity_id: '{{ nspanel_event.entity }}'
                                continue_on_error: true
                          - alias: "water_heater.set_operation_mode (humidifier)"
                            conditions:
                              - '{{ nspanel_event.action == "water_heater.set_operation_mode" }}'
                              - '{{ nspanel_event.entity.split(".")[0] == "humidifier" }}'
                            sequence:
                              - variables:
                                  # The page reports the water heater mode bound to the pressed button, so map it back
                                  # to the button, then to the humidifier mode assigned to that button when rendered.
                                  humidifier_pressed_button: >-
                                    {{
                                      (page_water_heater.buttons.operation_mode
                                        | selectattr("mode", "eq", nspanel_event.value)
                                        | map(attribute="component")
                                        | list
                                      + [""]) | first
                                    }}
                                  humidifier_mode: >-
                                    {%- set available_modes = state_attr(nspanel_event.entity, "available_modes") -%}
                                    {%- set available_modes = available_modes if available_modes is list else [] -%}
                                    {%- set ns = namespace(mode="") -%}
                                    {%- for component in page_humidifier.buttons.modes -%}
                                      {%- if component == humidifier_pressed_button and loop.index0 < available_modes | count -%}
                                        {%- set ns.mode = available_modes[loop.index0] -%}
                                      {%- endif -%}
                                    {%- endfor -%}
                                    {{ ns.mode }}
                              - choose:
                                  - alias: Power button
                                    conditions: '{{ humidifier_pressed_button == page_humidifier.buttons.power }}'
                                    sequence:
                                      - action: '{{ "humidifier.turn_off" if is_state(nspanel_event.entity, "on") else "humidifier.turn_on" }}'
                                        target:
                                          entity_id: '{{ nspanel_event.entity }}'
                                        continue_on_error: true
                                  - alias: Mode button
                                    conditions: '{{ humidifier_mode | length > 0 }}'
                                    sequence:
                                      - variables:
                                          set_mode_srv: "humidifier.set_mode"  # Templated to avoid unknown action warnings when humidifier isn't loaded
                                      - action: '{{ set_mode_srv }}'
                                        data:
                                          mode: '{{ humidifier_mode }}'
                                        target:
                                          entity_id: '{{ nspanel_event.entity }}'
                                        continue_on_error: true
                          - alias: "climate.set_temperature"
                            conditions:
                              - '{{ nspanel_event.action == "climate.set_temperature" }}'
                              - '{{ nspanel_event.key in ["target_temp_high", "target_temp_low"] }}'
                            sequence:
                              - variables:
                                  target_temp_low: >
                                    {{
                                      nspanel_event.value
                                      if nspanel_event.value is defined and nspanel_event.key == "target_temp_low"
                                      else state_attr(nspanel_event.entity, "target_temp_low") | int(-999)
                                    }}
                                  target_temp_high: >
                                    {{
                                      nspanel_event.value
                                      if nspanel_event.value is defined and nspanel_event.key == "target_temp_high"
                                      else state_attr(nspanel_event.entity, "target_temp_high") | int(-999)
                                    }}
                              - condition:
                                  - '{{ is_number(target_temp_low) and target_temp_low > -999 }}'
                                  - '{{ is_number(target_temp_high) and target_temp_high > -999 }}'
                              - action: '{{ nspanel_event.action }}'
                                data:
                                  target_temp_low: '{{ target_temp_low }}'
                                  target_temp_high: '{{ target_temp_high }}'
                                target:
                                  entity_id: '{{ nspanel_event.entity }}'
                                continue_on_error: true
                          - alias: "fan.oscillate"
                            conditions:
                              - '{{ nspanel_event.action == "fan.oscillate" }}'
                              - '{{ nspanel_event.key == "oscillating" }}'
                            sequence:
                              - variables:
                                  oscillating: '{{ state_attr(nspanel_event.entity, "oscillating") | default(true) }}'
                              - action: '{{ nspanel_event.action }}'
                                data:
                                  oscillating: '{{ true if oscillating is boolean and not oscillating else false }}'
                                target:
                                  entity_id: '{{ nspanel_event.entity }}'
                                continue_on_error: true
                          - alias: "fan.turn_on"
                            conditions:
                              - '{{ nspanel_event.action == "fan.turn_on" }}'
                              - '{{ nspanel_event.key == "percentage" }}'
                              - '{{ nspanel_event.value is defined }}'
                            sequence:
                              - action: '{{ nspanel_event.action }}'
                                data: {}
                                target:
                                  entity_id: '{{ nspanel_event.entity }}'
                                continue_on_error: true
                              - delay:
                                  milliseconds: 100
                              - variables:
                                  percentage_srv: "fan.set_percentage"  # This is used to fool engines checking for calls to unknown actions
                              - action: '{{ percentage_srv }}'
                                data:
                                  percentage: '{{ nspanel_event.value }}'
                                target:
                                  entity_id: '{{ nspanel_event.entity }}'
                                continue_on_error: true
                          - alias: "light.turn_on (rgb_color)"
                            conditions:
                              - '{{ nspanel_event.action == "light.turn_on" }}'
                              - '{{ nspanel_event.key == "rgb_color" }}'
                              - '{{ nspanel_event.red is defined and nspanel_event.green is defined and nspanel_event.blue is defined }}'
                            sequence:
                              - action: '{{ nspanel_event.action }}'
                                data:
                                  rgb_color: '{{ [nspanel_event.red, nspanel_event.green, nspanel_event.blue] }}'
                                target:
                                  entity_id: '{{ nspanel_event.entity }}'
                                continue_on_error: true
                        default:
                          - condition:
                              - '{{ nspanel_event.action is defined }}'
                              - '{{ nspanel_event.key is defined }}'
                              - '{{ nspanel_event.value is defined }}'
                              - '{{ nspanel_event.entity is defined }}'
                          # Build dict in Jinja to preserve typed values (e.g., string "None" vs null)
                          - variables:
                              call_data: '{{ {nspanel_event.key: nspanel_event.value} }}'
                          - action: '{{ nspanel_event.action }}'
                            data: '{{ call_data }}'
                            target:
                              entity_id: '{{ nspanel_event.entity }}'
                            continue_on_error: true
                    else:
                      - condition:
                          - '{{ nspanel_event.action is defined }}'
                          - '{{ nspanel_event.entity is defined }}'
                          - '{{ "." in nspanel_event.action }}'
                      - action: '{{ nspanel_event.action }}'
                        target:
                          entity_id: '{{ nspanel_event.entity }}'
                        continue_on_error: true
                  - delay:
                      milliseconds: '{{ media_player_update_delay }}'
                  - condition:
                      - '{{ nspanel_event.entity is defined }}'
                  - action: homeassistant.update_entity
                    data:
                      entity_id: '{{ nspanel_event.entity }}'
                    continue_on_error: true

              - alias: Page changed
                conditions:
                  - '{{ nspanel_event.type == "page_changed"}}'
                  - '{{ nspanel_event.page is defined }}'
                sequence:
                  - variables:
                      page_constructor: true
                      entity_id: &variable_entity_id_from_trigger >
                        {{
                          nspanel_event.entity
                          if nspanel_event is defined and nspanel_event.entity is defined and nspanel_event.entity is string and nspanel_event.entity | length > 1
                          else (
                            trigger.entity_id
                            if trigger.entity_id is defined
                            else (
                              trigger.event.data.entity_id
                              if trigger is defined and trigger.event is defined and trigger.event.data is defined and trigger.event.data.entity_id is defined
                              else ""
                            )
                          )
                        }}
                      entity_id_valid: *variable_entity_id_valid
                      original_state:
                        page: '{{ nspanel_event.page }}'
                        entity_id: '{{ entity_id }}'
                        entity_id_valid: '{{ entity_id_valid }}'
                        entity_domain: '{{ entity_id.split(".")[0] if entity_id_valid else "" }}'
                      # Title and icon of the button that opened an entity details page. The click that
                      # opened the page runs in a separate automation run, so the click run stores them
                      # on the panel (`details_overlap` memory var) and the panel reports them back here,
                      # only when they belong to the entity shown.
                      details_overlap:
                        icon: >-
                          {{
                            nspanel_event.icon
                            if
                              nspanel_event.icon is defined and
                              nspanel_event.icon is string and
                              nspanel_event.icon is match "mdi:" and
                              ((nspanel_event.icon.split("mdi:") | last) in special_icons or ("," ~ (nspanel_event.icon.split("mdi:") | last) ~ ",") in all_icon_names)
                            else None
                          }}
                        icon_color: '{{ None }}'
                        name: >-
                          {{
                            nspanel_event.title
                            if
                              nspanel_event.title is defined and
                              nspanel_event.title is string and
                              nspanel_event.title | length > 0
                            else None
                          }}

                  - choose:
                      - alias: Home page
                        conditions: '{{ nspanel_event.page == pages.home }}'
                        sequence: &refresh_page_home
                          ###### Climate chip ######
                          - &update_home_page_climate_chip
                            if: '{{ (not embedded_climate) and climate is string and climate is match "climate." }}'
                            then:
                              - variables:
                                  entity_id: '{{ climate }}'
                                  overlap:
                                    icon: '{{ None }}'
                                    icon_color: '{{ None }}'
                                    name: '{{ None }}'
                              - *variable_entity
                              - condition: '{{ entity_id_valid }}'
                              - variables:
                                  hvac_action: '{{ state_attr(entity_id, "hvac_action") }}'
                                  # "Active only" means the system is doing something, which is what
                                  # hvac_action reports. That attribute is optional, so an entity that
                                  # does not publish it falls back to its mode: anything but "off"
                                  # counts as active, since idle cannot be distinguished. Note the
                                  # vocabularies differ — the state holds modes ("fan_only"), while
                                  # hvac_action holds actions ("fan"). See #300.
                                  climate_active: >-
                                    {{
                                      hvac_action in ["heating", "cooling", "drying", "fan", "preheating", "defrosting"]
                                      if hvac_action is string and hvac_action | length > 0 and hvac_action not in enum.states.unknown
                                      else entity_state not in ["off"] + enum.states.unknown
                                    }}
                                  climate_chip_visibility: !input climate_chip_visibility
                                  climate_chip_visible: >-
                                    {{
                                      entity_has_value and
                                      climate_chip_visibility != 'never' and
                                      (climate_chip_visibility == 'always' or climate_active)
                                    }}
                              - action: 'esphome.{{ action_prefix }}_icon'
                                data:
                                  page: chips
                                  id: chip_climate
                                  icon: '{{ entity.icon if entity.icon is defined else "" }}'
                                  icon_color: >
                                    {{
                                      entity.icon_color
                                      if climate_chip_visible and entity.icon_color is defined
                                      else [0, 0, 0]
                                    }}
                                  visible: true
                                continue_on_error: true
                              - *delay_default

                          ###### Home page values ######
                          - repeat:
                              for_each: >
                                {{
                                  home_page.entity_value
                                  | selectattr("entity", "defined")
                                  | rejectattr("entity", "eq", "")
                                  | rejectattr("entity", "eq", [])
                                  | list
                                }}
                              sequence:
                                - &display_value
                                  if:
                                    - '{{ repeat.item.entity is defined }}'
                                    - '{{ repeat.item.entity is string }}'
                                    - '{{ repeat.item.entity.split(".") | count == 2 }}'
                                  then:
                                    - variables:
                                        entity_id: '{{ repeat.item.entity }}'
                                        default_color: *default_home_value_color
                                        overlap:
                                          icon: >
                                            {{
                                              repeat.item.icon
                                              if
                                                repeat.item.icon is defined and
                                                repeat.item.icon is string and
                                                repeat.item.icon is match "mdi:" and
                                                ((repeat.item.icon.split("mdi:") | last) in special_icons or ("," ~ (repeat.item.icon.split("mdi:") | last) ~ ",") in all_icon_names)
                                              else
                                                None
                                            }}
                                    - *variable_entity
                                    - if: '{{ entity_has_value }}'
                                      then:
                                        - variables:
                                            unit_of_measurement_raw: '{{ state_attr(entity_id, "unit_of_measurement") | default("") }}'
                                            unit_of_measurement: >
                                              {{
                                                unit_of_measurement_raw
                                                if unit_of_measurement_raw and unit_of_measurement_raw is string and unit_of_measurement_raw | length > 0
                                                else ""
                                              }}
                                            value_is_zero: >
                                              {{
                                                is_number(states(entity_id)) and
                                                (states(entity_id, rounded=true) | float == 0)
                                              }}
                                        - if: '{{ hide_if_zero is defined and hide_if_zero and value_is_zero }}'
                                          then:
                                            # Numeric state rounds to zero: hide both value and icon
                                            - action: 'esphome.{{ action_prefix }}_components_visibility'
                                              data:
                                                page: '{{ repeat.item.page }}'
                                                ids:
                                                  - '{{ repeat.item.component }}'
                                                  - '{{ repeat.item.component }}_icon'
                                                visible: false
                                              continue_on_error: true
                                          else:
                                            - if: '{{ entity.icon | length > 0 }}'
                                              then:
                                                - action: 'esphome.{{ action_prefix }}_component_text_list'
                                                  data:
                                                    page: '{{ repeat.item.page }}'
                                                    id: '{{ repeat.item.component }}_icon'
                                                    txt_list:
                                                      - '{{ entity.icon }}'
                                                  continue_on_error: true
                                                - *delay_default
                                            - alias: value_with_unit_and_translations
                                              action: 'esphome.{{ action_prefix }}_component_text_list'
                                              data:
                                                page: '{{ repeat.item.page }}'
                                                id: '{{ repeat.item.component }}'
                                                txt_list: &value_with_unit_and_translations
                                                  - >
                                                    {{
                                                      (
                                                        (
                                                          states(entity_id, rounded=true) ~ (
                                                            ("" if compact_unit_display else " ") ~ unit_of_measurement
                                                            if unit_of_measurement is string and unit_of_measurement | length > 0
                                                            else ""
                                                          )
                                                        )
                                                        if is_number(entity_state)
                                                        else state_translated(entity_id)
                                                      ) | regex_replace('\s+', ' ') | trim
                                                      if entity_id_valid and entity_has_value
                                                      else "_{_unavailable_}_"
                                                    }}
                                              continue_on_error: true
                                            - *delay_default
                                            # Restore visibility after any displayable state (e.g. zero → non-zero transition)
                                            - action: 'esphome.{{ action_prefix }}_components_visibility'
                                              data:
                                                page: '{{ repeat.item.page }}'
                                                ids:
                                                  - '{{ repeat.item.component }}'
                                                  - '{{ repeat.item.component }}_icon'
                                                visible: true
                                              continue_on_error: true
                                      else:
                                        # No value (unavailable/unknown): show localized marker and keep icon visible
                                        - action: 'esphome.{{ action_prefix }}_component_text_list'
                                          data:
                                            page: '{{ repeat.item.page }}'
                                            id: '{{ repeat.item.component }}'
                                            txt_list:
                                              - "_{_unavailable_}_"
                                          continue_on_error: true
                                        - *delay_default
                                        # Ensure both value and icon are visible (recovery from hide-if-zero)
                                        - action: 'esphome.{{ action_prefix }}_components_visibility'
                                          data:
                                            page: '{{ repeat.item.page }}'
                                            ids:
                                              - '{{ repeat.item.component }}'
                                              - '{{ repeat.item.component }}_icon'
                                            visible: true
                                          continue_on_error: true
                                    - *delay_default

                      - alias: Buttons pages
                        conditions: '{{ nspanel_event.page in pages.buttonpages }}'
                        sequence: &refresh_page_buttonpage
                          - &variables_page_buttons
                            variables:
                              event_page: '{{ nspanel_event.page if nspanel_event is defined and nspanel_event.page is defined else pages.current }}'
                              button_pages_icon_size: !input button_pages_icon_size
                          - if: '{{ event_page in pages.buttonpages }}'
                            then:
                              - alias: Button pages label
                                if: >
                                  {{
                                    buttons_pages.labels[event_page] != None and
                                    buttons_pages.labels[event_page] != [] and
                                    (buttons_pages.labels[event_page] | string) | length > 0
                                  }}
                                then:
                                  - action: 'esphome.{{ action_prefix }}_component_text_list'
                                    data:
                                      page: ""
                                      id: page_label
                                      txt_list:
                                        - '{{ buttons_pages.labels[event_page] | string }}'
                                    continue_on_error: true
                                  - *delay_default

                              - alias: Buttons page - Populate buttons
                                repeat:
                                  for_each: >
                                    {{
                                      buttons_pages.buttons
                                      | selectattr("page", "defined")
                                      | selectattr("page", "eq", event_page)
                                      | selectattr("entity", "defined")
                                      | rejectattr("entity", "eq", [])
                                      | list
                                    }}
                                  sequence: &display_button_page_button
                                    - condition: '{{ repeat.item.entity is defined and repeat.item.entity is string and repeat.item.entity | length > 0 }}'
                                    - variables:
                                        entity_id: '{{ repeat.item.entity }}'
                                        state_entity_id: >
                                          {{
                                            repeat.item.state_entity
                                            if repeat.item.state_entity is defined
                                                and repeat.item.state_entity is string
                                                and repeat.item.state_entity | length > 3
                                                and "." in repeat.item.state_entity
                                            else repeat.item.entity
                                          }}
                                        overlap:
                                          icon: >
                                            {{
                                              repeat.item.icon
                                              if
                                                repeat.item.icon is defined and
                                                repeat.item.icon is string and
                                                repeat.item.icon | length > 0 and
                                                repeat.item.icon is match "mdi:" and
                                                ((repeat.item.icon.split("mdi:") | last) in special_icons or ("," ~ (repeat.item.icon.split("mdi:") | last) ~ ",") in all_icon_names)
                                              else
                                                None
                                            }}
                                          icon_color: '{{ repeat.item.icon_color_rgb if repeat.item.icon_color_rgb is defined else None }}'
                                          name: '{{ repeat.item.name if repeat.item.name is defined else None }}'
                                    - *variable_entity
                                    - variables:
                                        current_entity_state_available: '{{ entity_state not in ["unavailable"] }}'
                                        state_entity_state: '{{ states(state_entity_id) if state_entity_id != entity_id else entity_state }}'
                                        state_value: >
                                          {{
                                            repeat.item.state_value
                                            if repeat.item.state_value is defined
                                                and repeat.item.state_value is string
                                                and repeat.item.state_value | length > 0
                                            else ""
                                          }}
                                        btn_state: >  # Button state (on = true or off = false)
                                          {% if state_value | length > 0 %}
                                            {{ state_entity_state == state_value }}
                                          {% else %}
                                            {{
                                              (state_entity_state in enum.states.on and (entity_domain not in ["automation"] or state_entity_id != entity_id))
                                              or (entity_domain == "climate" and state_entity_state != "off")
                                              or (entity_domain in ["automation", "button", "input_button", "remote", "scene", "script"]
                                                  and "unavailable" not in [entity_state, state_entity_state]
                                                  and (trigger.from_state is not defined or trigger.from_state is none or trigger.from_state.state not in ["unavailable"])
                                                  and not page_constructor
                                                  and momentary_activated
                                                  and trigger.entity_id in [repeat.item.entity, state_entity_id]
                                                  and state_entity_id == entity_id)
                                            }}
                                          {% endif %}
                                        temperature_units: !input temperature_unit
                                        btn_bri_txt: >  # Buttons value (brightness, temperature, etc.)
                                          {% if not has_value(entity_id) %} 0
                                          {% elif entity_domain == "light" and entity_state == "on" %}
                                            {% set entity_brightness = state_attr(entity_id, "brightness") %}
                                            {% set entity_brightness_index = entity_brightness/255 if entity_brightness and is_number(entity_brightness) else 0 %}
                                            {{ (entity_brightness_index*100) | round(0) }}%
                                          {% elif entity_domain == "fan" and entity_state == "on" and state_attr(entity_id, "percentage") | int(0) > 0 %}
                                            {{ state_attr(entity_id, "percentage") | round(0, default=0) }}%
                                          {% elif entity_domain == "cover" and entity_state in ["open", "opening", "closing"] and is_number(state_attr(entity_id, "current_position")) %}
                                            {{ (state_attr(entity_id, "current_position") | int(100)) | round(0) }}%
                                          {% elif entity_domain == "climate" and is_number(state_attr(entity_id, 'current_temperature')) %}
                                            {% set current_temperature = state_attr(entity_id, 'current_temperature') | float %}
                                            {{
                                              current_temperature
                                              | round(
                                                0 if current_temperature >= 100
                                                      or temperature_units in ["F", "f", "°F", "°f", "K", "k"]
                                                else 1)
                                            }}{{ temperature_units }}
                                          {% elif entity_domain == "humidifier" and is_number(state_attr(entity_id, 'current_humidity')) %}
                                            {{ state_attr(entity_id, 'current_humidity') | float | round(0) | int }}%
                                          {% else %} 0
                                          {% endif %}
                                        btn_icon: >
                                          {{
                                            entity.icon
                                            if entity.icon is defined
                                                and entity.icon is string
                                                and entity.icon | length > 0
                                            else "\uE027"
                                          }}{# mdi:alert-circle #}
                                        btn_label: >
                                          {{
                                            entity.name
                                            if entity.name is defined
                                                and entity.name is string
                                                and entity.name | length > 0
                                            else entity_id
                                          }}
                                        btn_icon_font: '{{ button_pages_icon_size if is_number(button_pages_icon_size) else 8 }}'
                                        btn_bri: '{{ btn_bri_txt if btn_bri_txt and btn_bri_txt != "0%" else "" }}'
                                    - action: 'esphome.{{ action_prefix }}_button'
                                      data:
                                        page: '{{ repeat.item.page }}'
                                        id: '{{ repeat.item.component }}'
                                        state: '{{ btn_state }}'
                                        icon: '{{ btn_icon }}'
                                        icon_color: >
                                          {{
                                            entity.icon_color
                                            if entity.icon_color is defined
                                                and entity.icon_color is list
                                                and entity.icon_color | count == 3
                                            else [200, 200, 200]
                                          }}
                                        icon_font: '{{ btn_icon_font }}'
                                        bri: '{{ btn_bri }}'
                                        label: '{{ btn_label if page_constructor else "" }}'
                                        is_page_render: '{{ page_constructor }}'
                                        icon_only: false
                                        available: '{{ current_entity_state_available }}'
                                      continue_on_error: true
                                    - if:
                                        - '{{ btn_state }}'
                                        - '{{ entity_domain in ["automation", "button", "input_button", "remote", "scene", "script"] }}'
                                        - '{{ not page_constructor }}'
                                        - '{{ momentary_activated }}'
                                        - '{{ trigger.entity_id in [repeat.item.entity, state_entity_id] }}'
                                        - '{{ state_entity_id == entity_id }}'
                                      then:
                                        - delay:
                                            milliseconds: '{{ momentary_duration_ms }}'
                                        - action: 'esphome.{{ action_prefix }}_button'
                                          data:
                                            page: '{{ repeat.item.page }}'
                                            id: '{{ repeat.item.component }}'
                                            state: false
                                            icon: '{{ btn_icon }}'
                                            icon_color: [128, 128, 128]  # grey_light
                                            icon_font: '{{ btn_icon_font }}'
                                            bri: '{{ btn_bri }}'
                                            label: ""
                                            is_page_render: false
                                            icon_only: false
                                            available: '{{ current_entity_state_available }}'
                                          continue_on_error: true
                                    - *delay_default

                              - alias: Page buttons - Confirm value
                                sequence:
                                  - variables:
                                      confirm_list: >
                                        {{
                                          buttons_pages.buttons
                                          | selectattr("page", "defined")
                                          | selectattr("page", "eq", event_page)
                                          | sort(attribute="component")
                                          | map(attribute="confirm")
                                          | list
                                        }}
                                      confirm_value: >
                                        {% set ns = namespace(decimal_value = 0, index = 0) %}
                                        {% for confirm_item in confirm_list %}
                                            {% if (confirm_item) %}
                                                {% set ns.decimal_value = ns.decimal_value + (2 ** ns.index) %}
                                            {% endif %}
                                            {% set ns.index = ns.index + 1 %}
                                        {% endfor %}
                                        {{ ns.decimal_value }}
                                  - action: 'esphome.{{ action_prefix }}_component_val'
                                    data:
                                      page: ""
                                      id: confirm
                                      val: '{{ confirm_value }}'
                                    continue_on_error: true
                                  - *delay_default

                      - alias: Entity pages  ## ENTITY PAGES 01 - 04
                        conditions: '{{ nspanel_event.page in pages.entitypages }}'
                        sequence: &refresh_entity_pages
                          - &variables-entity_pages
                            variables:
                              event_page: '{{ nspanel_event.page if nspanel_event is defined and nspanel_event.page is defined else pages.current }}'
                              entitypages_show_entities_icons: !input entitypages_show_entities_icons
                          ##### Entity page - Label #####
                          - if: '{{ entities_pages.labels[event_page] | length > 0 }}'
                            then:
                              - action: 'esphome.{{ action_prefix }}_component_text_list'
                                data:
                                  page: '{{ event_page }}'
                                  id: page_label
                                  txt_list:
                                    - '{{ entities_pages.labels[event_page] }}'
                                continue_on_error: true
                              - *delay_default
                          ##### Entities #####
                          - repeat:
                              for_each: >
                                {{
                                  entities_pages.entities
                                  | selectattr("page", "defined")
                                  | selectattr("page", "eq", event_page)
                                  | selectattr("entity", "defined")
                                  | rejectattr("entity", "eq", [])
                                  | list
                                }}
                              sequence: &update_entity_page_entity
                                - condition: '{{ repeat.item.entity is string and repeat.item.entity | length > 0 }}'
                                - variables:
                                    entity_id: '{{ repeat.item.entity }}'
                                    overlap:
                                      icon: >
                                        {{
                                          repeat.item.icon
                                          if
                                            repeat.item.icon is defined and
                                            repeat.item.icon is string and
                                            repeat.item.icon | length > 0 and
                                            repeat.item.icon is match "mdi:" and
                                            ((repeat.item.icon.split("mdi:") | last) in special_icons or ("," ~ (repeat.item.icon.split("mdi:") | last) ~ ",") in all_icon_names)
                                          else
                                            None
                                        }}
                                      name: '{{ repeat.item.name if repeat.item.name is defined else None }}'
                                    unit_of_measurement: '{{ state_attr(entity_id, "unit_of_measurement") | default("") }}'
                                - *variable_entity
                                - alias: Entities pages - Constructor
                                  if: '{{ page_constructor }}'
                                  then:
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: mem
                                        id: command
                                        txt_list:
                                          - >-
                                            {% if entitypages_show_entities_icons %}
                                              {{ repeat.item.component }}_icon.txt="{{ entity.icon }}"
                                            {% else %}
                                              {{ repeat.item.component }}_icon.txt=""
                                            {% endif %}
                                          - '{{ repeat.item.component }}_label.txt="{{ entity.name }}"'
                                      continue_on_error: true
                                    - *delay_default
                                - alias: Entities pages - Values (with icons)
                                  sequence:
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: '{{ repeat.item.page }}'
                                        id: '{{ repeat.item.component }}'
                                        txt_list: *value_with_unit_and_translations
                                      continue_on_error: true
                                    - *delay_default

                      - alias: Weather pages  ## PAGE WEATHER (WEATHER01 to WEATHER05)
                        conditions: '{{ nspanel_event.page in pages.weatherpages }}'
                        sequence:
                          - variables: *variables_weather_entity_from_input
                          - variables:
                              weather_attribution: '{{ state_attr(weather_entity, "attribution") if weather_entity is string }}'
                              # Unit of each weather value, from the weather entity, with a fallback for missing units
                              weather_units: >-
                                {%- set default_units = {
                                      "humidity": "%",
                                      "hours_of_sun": "h",
                                      "precipitation": "",
                                      "precipitation_probability": "%",
                                      "pressure": "",
                                      "thunderstorm_probability": "%",
                                      "uv_index": "",
                                      "wind_speed": ""
                                    } -%}
                                {%- set ns = namespace(units={}) -%}
                                {%- for key, default_unit in default_units.items() -%}
                                  {%- set unit = state_attr(weather_entity, key ~ "_unit") if weather_entity is string -%}
                                  {%- set ns.units = dict(ns.units, **{key: unit if unit else default_unit}) -%}
                                {%- endfor -%}
                                {{ ns.units }}
                              page_name: '{{ nspanel_event.page }}'
                              page_index: '{{ (page_name[-2:] | int(0)) - 1 }}'

                          ##### Display weather data only when available #####
                          - variables:
                              weather_entity_supported_features: '{{ state_attr(weather_entity, "supported_features") | int(0) }}'
                              forecast_type: >
                                {% if weather_entity_supported_features == 0 or weather_entity_supported_features | bitwise_and(1) > 0 %}
                                  daily
                                {% elif weather_entity_supported_features | bitwise_and(4) > 0 %}
                                  twice_daily
                                {% elif weather_entity_supported_features | bitwise_and(2) > 0 %}
                                  hourly
                                {% endif %}
                          - condition: '{{ forecast_type in ["daily", "twice_daily", "hourly"] }}'
                          - action: 'weather.get_forecasts'
                            target:
                              entity_id: '{{ weather_entity }}'
                            data:
                              type: '{{ forecast_type }}'
                            response_variable: service_response_var
                            continue_on_error: true
                          - variables:
                              forecast: >
                                {% if service_response_var is defined
                                      and service_response_var[weather_entity] is defined
                                      and service_response_var[weather_entity].forecast is defined %}
                                  {{ service_response_var[weather_entity].forecast }}
                                {% elif service_response_var is defined and service_response_var.forecast is defined %}
                                  {{ service_response_var.forecast }}
                                {% else %}
                                  {{ state_attr(weather_entity, "forecast") | default(false) }}
                                {% endif %}
                          - condition: '{{ forecast != false }}'
                          - variables:
                              datetime_is_string: '{{ forecast[0] is defined and forecast[0]["datetime"] is string }}'
                              forecast_day: >
                                {% if datetime_is_string %}
                                  {{
                                    forecast | default([])
                                    | selectattr("datetime", "defined")
                                    | selectattr("datetime", ">=", (today_at("00:00") + timedelta(days= page_index)) | as_timestamp | timestamp_utc )
                                    | selectattr("datetime", "<", (today_at("00:00") + timedelta(days= (page_index+1))) | as_timestamp | timestamp_utc )
                                    | list
                                  }}
                                {% else %}
                                  [
                                    {
                                      'datetime': '{{ forecast | default([])
                                        | selectattr("datetime", "defined")
                                        | rejectattr("datetime", "none")
                                        | rejectattr("datetime", "eq", "")
                                        | selectattr("datetime", ">=", (today_at("00:00") + timedelta(days= page_index)) | as_timestamp | as_datetime )
                                        | selectattr("datetime", "<", (today_at("00:00") + timedelta(days= (page_index+1))) | as_timestamp | as_datetime )
                                        | map(attribute="datetime") | list | first | as_timestamp | timestamp_utc
                                        if forecast | default([])
                                        | selectattr("datetime", "defined")
                                        | rejectattr("datetime", "none")
                                        | rejectattr("datetime", "eq", "")
                                        | selectattr("datetime", ">=", (today_at("00:00") + timedelta(days= page_index)) | as_timestamp | as_datetime )
                                        | selectattr("datetime", "<", (today_at("00:00") + timedelta(days= (page_index+1))) | as_timestamp | as_datetime )
                                        | map(attribute="datetime") | list | count > 0
                                        else "" }}',
                                      'condition': '{{ forecast | default([])
                                        | selectattr("condition", "defined")
                                        | rejectattr("condition", "none")
                                        | rejectattr("condition", "eq", "")
                                        | selectattr("datetime", "defined")
                                        | rejectattr("datetime", "none")
                                        | rejectattr("datetime", "eq", "")
                                        | selectattr("datetime", ">=", (today_at("00:00") + timedelta(days= page_index)) | as_timestamp | as_datetime )
                                        | selectattr("datetime", "<", (today_at("00:00") + timedelta(days= (page_index+1))) | as_timestamp | as_datetime )
                                        | map(attribute="condition") | list | first
                                        if forecast | default([])
                                        | selectattr("condition", "defined")
                                        | rejectattr("condition", "none")
                                        | rejectattr("condition", "eq", "")
                                        | selectattr("datetime", "defined")
                                        | rejectattr("datetime", "none")
                                        | rejectattr("datetime", "eq", "")
                                        | selectattr("datetime", ">=", (today_at("00:00") + timedelta(days= page_index)) | as_timestamp | as_datetime )
                                        | selectattr("datetime", "<", (today_at("00:00") + timedelta(days= (page_index+1))) | as_timestamp | as_datetime )
                                        | map(attribute="condition") | list | count > 0
                                        else "" }}',
                                      'temperature': '{{ forecast | default([])
                                        | selectattr("temperature", "defined")
                                        | selectattr("temperature", "is_number")
                                        | selectattr("datetime", "defined")
                                        | rejectattr("datetime", "none")
                                        | rejectattr("datetime", "eq", "")
                                        | selectattr("datetime", ">=", (today_at("00:00") + timedelta(days= page_index)) | as_timestamp | as_datetime )
                                        | selectattr("datetime", "<", (today_at("00:00") + timedelta(days= (page_index+1))) | as_timestamp | as_datetime )
                                        | map(attribute="temperature") | list | first
                                        if forecast | default([])
                                        | selectattr("temperature", "defined")
                                        | selectattr("temperature", "is_number")
                                        | selectattr("datetime", "defined")
                                        | rejectattr("datetime", "none")
                                        | rejectattr("datetime", "eq", "")
                                        | selectattr("datetime", ">=", (today_at("00:00") + timedelta(days= page_index)) | as_timestamp | as_datetime )
                                        | selectattr("datetime", "<", (today_at("00:00") + timedelta(days= (page_index+1))) | as_timestamp | as_datetime )
                                        | map(attribute="temperature") | list | count > 0
                                        else "" }}',
                                      'templow': '{{ forecast | default([])
                                        | selectattr("templow", "defined")
                                        | selectattr("templow", "is_number")
                                        | selectattr("datetime", "defined")
                                        | rejectattr("datetime", "none")
                                        | rejectattr("datetime", "eq", "")
                                        | selectattr("datetime", ">=", (today_at("00:00") + timedelta(days= page_index)) | as_timestamp | as_datetime )
                                        | selectattr("datetime", "<", (today_at("00:00") + timedelta(days= (page_index+1))) | as_timestamp | as_datetime )
                                        | map(attribute="templow") | list | first
                                        if forecast | default([])
                                        | selectattr("templow", "defined")
                                        | selectattr("templow", "is_number")
                                        | selectattr("datetime", "defined")
                                        | rejectattr("datetime", "none")
                                        | rejectattr("datetime", "eq", "")
                                        | selectattr("datetime", ">=", (today_at("00:00") + timedelta(days= page_index)) | as_timestamp | as_datetime )
                                        | selectattr("datetime", "<", (today_at("00:00") + timedelta(days= (page_index+1))) | as_timestamp | as_datetime )
                                        | map(attribute="templow") | list | count > 0
                                        else "" }}',
                                      'precipitation': '{{ forecast | default([])
                                        | selectattr("precipitation", "defined")
                                        | selectattr("precipitation", "is_number")
                                        | selectattr("datetime", "defined")
                                        | rejectattr("datetime", "none")
                                        | rejectattr("datetime", "eq", "")
                                        | selectattr("datetime", ">=", (today_at("00:00") + timedelta(days= page_index)) | as_timestamp | as_datetime )
                                        | selectattr("datetime", "<", (today_at("00:00") + timedelta(days= (page_index+1))) | as_timestamp | as_datetime )
                                        | map(attribute="precipitation") | list | first
                                        if forecast | default([])
                                        | selectattr("precipitation", "defined")
                                        | selectattr("precipitation", "is_number")
                                        | selectattr("datetime", "defined")
                                        | rejectattr("datetime", "none")
                                        | rejectattr("datetime", "eq", "")
                                        | selectattr("datetime", ">=", (today_at("00:00") + timedelta(days= page_index)) | as_timestamp | as_datetime )
                                        | selectattr("datetime", "<", (today_at("00:00") + timedelta(days= (page_index+1))) | as_timestamp | as_datetime )
                                        | map(attribute="precipitation") | list | count > 0
                                        else "" }}',
                                      'wind_speed': '{{ forecast | default([])
                                        | selectattr("wind_speed", "defined")
                                        | selectattr("wind_speed", "is_number")
                                        | selectattr("datetime", "defined")
                                        | rejectattr("datetime", "none")
                                        | rejectattr("datetime", "eq", "")
                                        | selectattr("datetime", ">=", (today_at("00:00") + timedelta(days= page_index)) | as_timestamp | as_datetime )
                                        | selectattr("datetime", "<", (today_at("00:00") + timedelta(days= (page_index+1))) | as_timestamp | as_datetime )
                                        | map(attribute="wind_speed") | list | first
                                        if forecast | default([])
                                        | selectattr("wind_speed", "defined")
                                        | selectattr("wind_speed", "is_number")
                                        | selectattr("datetime", "defined")
                                        | rejectattr("datetime", "none")
                                        | rejectattr("datetime", "eq", "")
                                        | selectattr("datetime", ">=", (today_at("00:00") + timedelta(days= page_index)) | as_timestamp | as_datetime )
                                        | selectattr("datetime", "<", (today_at("00:00") + timedelta(days= (page_index+1))) | as_timestamp | as_datetime )
                                        | map(attribute="wind_speed") | list | count > 0
                                        else "" }}'
                                    }
                                  ]
                                {% endif %}
                          - if: '{{ forecast_day | count > 0 or page_index == 0 }}'
                            then:  # Display forecast
                              - variables:
                                  forecast_day: >
                                    {% if forecast_day | count > 0 %}{{ forecast_day }}
                                    {% elif page_index == 0 %}
                                      [
                                        {
                                          'condition': '{{ states(weather_entity) }}',
                                          'temperature': '{{ state_attr(weather_entity, "temperature") }}',
                                          'wind_speed': '{{ state_attr(weather_entity, "wind_speed") }}'
                                        }
                                      ]
                                    {% endif %}
                              - if: '{{ forecast_day | count > 0 }}'
                                then:
                                  - variables:
                                      # Lowest temperature of the day: each forecast slot gives its low temperature,
                                      # or its temperature when it has no numeric low (e.g. hourly slots or twice_daily night slots)
                                      temp_min: >
                                        {%- set ns = namespace(lows=[]) -%}
                                        {%- for slot in forecast_day -%}
                                          {%- if slot.templow is defined and is_number(slot.templow) -%}
                                            {%- set ns.lows = ns.lows + [slot.templow | float] -%}
                                          {%- elif slot.temperature is defined and is_number(slot.temperature) -%}
                                            {%- set ns.lows = ns.lows + [slot.temperature | float] -%}
                                          {%- endif -%}  {#- if slot has a numeric low or temperature -#}
                                        {%- endfor -%}
                                        {{ ns.lows | min if ns.lows | count > 0 else "unknown" }}
                                      temp_max: >
                                        {{
                                          forecast_day
                                          | selectattr("temperature", "defined")
                                          | selectattr("temperature", "is_number")
                                          | map(attribute="temperature")
                                          | map("float") | list | max
                                          if
                                            forecast_day
                                            | selectattr("temperature", "defined")
                                            | selectattr("temperature", "is_number")
                                            | map(attribute="temperature")
                                            | map("float") | list | count > 0
                                          else None
                                        }}
                                      condition: >
                                        {{
                                          forecast_day
                                          | selectattr("condition", "defined")
                                          | rejectattr("condition", "none")
                                          | rejectattr("condition", "eq", "")
                                          | map(attribute="condition") | list | first
                                          if
                                            forecast_day
                                            | selectattr("condition", "defined")
                                            | rejectattr("condition", "none")
                                            | rejectattr("condition", "eq", "")
                                            | map(attribute="condition") | list | count > 0
                                          else None
                                        }}
                                      # True only when every forecast slot of a forecast page is known to be at night:
                                      # - daily: a slot covers a whole day, so it is never night;
                                      # - twice_daily: every slot has is_daytime set to false;
                                      # - hourly: every slot lies between sunset and sunrise, using the time of day of the next sun events.
                                      #   Skipped when a sun event is more than 26 hours away (polar day or night) or the sun is not available.
                                      # Anything else (missing data, legacy forecast attribute) keeps the day pictures.
                                      forecast_is_night: >
                                        {%- set items = forecast_day | selectattr("datetime", "defined") | list if datetime_is_string else [] -%}
                                        {%- if items | count == 0 -%}
                                          false
                                        {%- elif forecast_type == "daily" -%}
                                          false
                                        {%- elif forecast_type == "twice_daily" -%}
                                          {{ items | selectattr("is_daytime", "defined") | selectattr("is_daytime", "false") | list | count == items | count }}
                                        {%- elif forecast_type == "hourly" -%}
                                          {%- set sun_entity = states.sun | map(attribute="entity_id") | list | first | default(none) -%}
                                          {%- set next_rising = as_datetime(state_attr(sun_entity, "next_rising") | string, none) if sun_entity else none -%}
                                          {%- set next_setting = as_datetime(state_attr(sun_entity, "next_setting") | string, none) if sun_entity else none -%}
                                          {%- set now_ts = as_timestamp(now()) -%}
                                          {%- if next_rising is none or next_setting is none
                                                or as_timestamp(next_rising) - now_ts > 93600
                                                or as_timestamp(next_setting) - now_ts > 93600 -%}
                                            false
                                          {%- else -%}
                                            {%- set rising = as_local(next_rising) -%}
                                            {%- set setting = as_local(next_setting) -%}
                                            {%- set setting_seconds = setting.hour * 3600 + setting.minute * 60 + setting.second -%}
                                            {%- set night_seconds = (rising.hour * 3600 + rising.minute * 60 + rising.second - setting_seconds) % 86400 -%}
                                            {%- set ns = namespace(night=true) -%}
                                            {%- for item in items -%}
                                              {%- set slot = as_datetime(item.datetime | string, none) -%}
                                              {%- if slot is none -%}
                                                {%- set ns.night = false -%}
                                              {%- else -%}
                                                {%- set slot = as_local(slot) -%}
                                                {%- set after_setting = (slot.hour * 3600 + slot.minute * 60 + slot.second - setting_seconds) % 86400 -%}
                                                {#- The whole hour of the slot must end before sunrise -#}
                                                {%- if after_setting + 3600 > night_seconds -%}
                                                  {%- set ns.night = false -%}
                                                {%- endif -%}
                                              {%- endif -%}
                                            {%- endfor -%}
                                            {{ ns.night }}
                                          {%- endif -%}
                                        {%- else -%}
                                          false
                                        {%- endif -%}
                                      # Values of the day from the forecast slots, as [field, how the slots combine]. One template computes
                                      # them all, so the Blueprint has fewer distinct templates (#636). A value is none when no slot has a number.
                                      forecast_values: >-
                                        {%- set ns = namespace(values={}) -%}
                                        {%- for field, operation in [
                                             ["precipitation", "sum"],
                                             ["precipitation_probability", "max"],
                                             ["pressure", "max"],
                                             ["wind_speed", "max"],
                                             ["hours_of_sun", "sum"],
                                             ["uv_index", "max"],
                                             ["thunderstorm_probability", "max"],
                                             ["humidity", "max"]
                                           ] -%}
                                          {%- set numbers = forecast_day
                                               | selectattr(field, "defined")
                                               | selectattr(field, "is_number")
                                               | map(attribute=field)
                                               | map("float")
                                               | list -%}
                                          {%- set value = ((numbers | sum if operation == "sum" else numbers | max) | round(0)) if numbers | count > 0 else none -%}
                                          {%- set ns.values = dict(ns.values, **{field: value}) -%}
                                        {%- endfor -%}
                                        {{ ns.values }}
                                      # Values shown in fields 1 to 5, in display order (only the visible ones are used)
                                      parameters: >-
                                        {%- macro with_unit(value, unit) -%}
                                          {{- (value ~ ("" if compact_unit_display else " ") ~ unit) if is_number(value) -}}
                                        {%- endmacro -%}
                                        {%- set precipitation_value = [
                                              with_unit(forecast_values.precipitation, weather_units.precipitation),
                                              with_unit(forecast_values.precipitation_probability, weather_units.precipitation_probability)
                                            ] | reject("eq", "") | join(" - ") -%}
                                        {#- Humidity icon "\uE58D" is mdi:water-percent -#}
                                        {{
                                          [
                                            {
                                              "name": "hours_of_sun",
                                              "visibility": is_number(forecast_values.hours_of_sun),
                                              "value": with_unit(forecast_values.hours_of_sun, weather_units.hours_of_sun) | trim,
                                              "icon": nextion.icon.weather.sun
                                            },
                                            {
                                              "name": "thunderstorm_probability",
                                              "visibility": is_number(forecast_values.thunderstorm_probability),
                                              "value": with_unit(forecast_values.thunderstorm_probability, weather_units.thunderstorm_probability) | trim,
                                              "icon": nextion.icon.weather.lightning
                                            },
                                            {
                                              "name": "precipitation",
                                              "visibility": is_number(forecast_values.precipitation) or is_number(forecast_values.precipitation_probability),
                                              "value": precipitation_value | trim,
                                              "icon": nextion.icon.weather.rain
                                            },
                                            {
                                              "name": "uv_index",
                                              "visibility": is_number(forecast_values.uv_index),
                                              "value": with_unit(forecast_values.uv_index, weather_units.uv_index) | trim,
                                              "icon": nextion.icon.weather.protect
                                            },
                                            {
                                              "name": "wind_speed",
                                              "visibility": is_number(forecast_values.wind_speed),
                                              "value": with_unit(forecast_values.wind_speed, weather_units.wind_speed) | trim,
                                              "icon": nextion.icon.weather.wind
                                            },
                                            {
                                              "name": "humidity",
                                              "visibility": is_number(forecast_values.humidity),
                                              "value": with_unit(forecast_values.humidity, weather_units.humidity) | trim,
                                              "icon": "\uE58D"
                                            },
                                            {
                                              "name": "pressure",
                                              "visibility": is_number(forecast_values.pressure),
                                              "value": with_unit(forecast_values.pressure, weather_units.pressure) | trim,
                                              "icon": nextion.icon.weather.gauge
                                            }
                                          ]
                                        }}

                                  ##### Display weather PIC when available
                                  - if: '{{ condition not in ["unknown", None] }}'
                                    then:
                                      - action: 'esphome.{{ action_prefix }}_component_val'
                                        data:
                                          page: mem
                                          id: weather_icon
                                          val: >-
                                            {{
                                              nextion.pic.weather[
                                                states(weather_entity) | default("unavailable")
                                                if weather_entity is string
                                                else "unavailable"
                                              ] | int(1)
                                              if condition == "unknown" and page_name == pages.weatherpages[0]
                                              else (
                                                nextion.pic.weather_night[condition]
                                                if page_name != pages.weatherpages[0] and forecast_is_night and condition in nextion.pic.weather_night
                                                else nextion.pic.weather_day[condition]
                                                if page_name != pages.weatherpages[0] and not forecast_is_night and condition in nextion.pic.weather_day
                                                else nextion.pic.weather[condition]
                                              ) | int(1)
                                            }}
                                        continue_on_error: true
                                      - *delay_default

                                  ##### Display temperature min/max when available
                                  - variables:
                                      temperature_units: !input temperature_unit
                                      weather_entity_uom: '{{ state_attr(weather_entity, "temperature_unit") }}'

                                      weather_temp_units: >
                                        {{
                                          weather_entity_uom if weather_entity_uom is string and weather_entity_uom | length > 0
                                          else temperature_units
                                        }}
                                      weather_forecast_max_first: !input weather_forecast_max_first
                                      temperature_string: >
                                        {%- set unit_separator = "" if compact_unit_display else " " -%}
                                        {%- set temp_low = (temp_min | round(0) ~ unit_separator ~ weather_temp_units) if is_number(temp_min) else "" -%}
                                        {%- set temp_high = (temp_max | round(0) ~ unit_separator ~ weather_temp_units) if is_number(temp_max) and temp_min != temp_max else "" -%}
                                        {%- set temps = [temp_high, temp_low] if weather_forecast_max_first else [temp_low, temp_high] -%}
                                        {{ temps | reject("eq", "") | join(" / ") }}
                                  - if: '{{ (is_number(temp_min) or is_number(temp_max)) and temperature_string is string and temperature_string | length > 0 }}'
                                    then:
                                      - action: 'esphome.{{ action_prefix }}_component_text_list'
                                        data:
                                          page: '{{ page_name }}'
                                          id: 'temperature'  ### Temperature MIN/MAX ###
                                          txt_list:
                                            - '{{ temperature_string }}'
                                        continue_on_error: true
                                      - *delay_default

                                  ##### fields 1 to 5 (Parameters) #####
                                  - repeat:
                                      for_each: '{{ (parameters | selectattr("visibility", "eq", true) | list)[:5] }}'
                                      sequence:
                                        - action: 'esphome.{{ action_prefix }}_component_text_list'
                                          data:
                                            page: '{{ page_name }}'
                                            id: 'value0{{ repeat.index }}'
                                            txt_list:
                                              - '{{ repeat.item.value }}'
                                          continue_on_error: true
                                        - *delay_default
                                        - action: 'esphome.{{ action_prefix }}_component_text_list'
                                          data:
                                            page: '{{ page_name }}'
                                            id: 'value0{{ repeat.index }}_icon'
                                            txt_list:
                                              - '{{ repeat.item.icon }}'
                                          continue_on_error: true
                                        - *delay_default
                                else: &forecast_unavailable
                                  - action: 'esphome.{{ action_prefix }}_component_text_list'
                                    data:
                                      page: '{{ page_name }}'
                                      id: 'value01'
                                      txt_list:
                                        - '_{_unavailable_}_'
                                    continue_on_error: true
                            else: *forecast_unavailable

                      - alias: Utilities page  ## PAGE UTILITIES
                        conditions: '{{ nspanel_event.page == pages.utilities }}'
                        sequence: &refresh_page_utilities
                          - alias: Utilities page - Title
                            sequence:
                              - variables:
                                  page_icon: '{{ (pages_utilities.title.icon.split("mdi:") | last) if pages_utilities.title.icon is string and pages_utilities.title.icon.split("mdi:") | count == 2 }}'
                              - action: 'esphome.{{ action_prefix }}_component_text_list'
                                data:
                                  page: mem
                                  id: command
                                  txt_list:
                                    - 'title_icon.txt="{{ (special_icons[(page_icon)] if (page_icon) in special_icons
                                      else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (page_icon) ~ ",")].count(",")))
                                      if ("," ~ (page_icon) ~ ",") in all_icon_names
                                      else "") if ((page_icon) in special_icons or ("," ~ (page_icon) ~ ",") in all_icon_names) else "\uE299" }}{# mdi:gauge #}"'
                                    - 'title.txt="{{ pages_utilities.title.label }}"'
                                continue_on_error: true
                              - *delay_default

                          - variables:
                              utilities_constructor_init: true

                          - alias: Utilities page - Groups
                            repeat:
                              for_each: '{{ pages_utilities.groups | list }}'
                              sequence: &refresh_page_utilities_group
                                - &variable_rgb565_from_repeat_item_color
                                  alias: Var rgb565
                                  variables:
                                    rgb565: '{{ int(((repeat.item.color[0] //(2**3)) *(2**11))+((repeat.item.color[1] //(2**2)) *(2**5))+(repeat.item.color[2] //(2**3))) }}'
                                - alias: Variables
                                  variables:
                                    utilities_constructor: '{{ utilities_constructor_init is defined and utilities_constructor_init }}'
                                    icon_enabled: >
                                      {{
                                        utilities_constructor and
                                        repeat.item.icon is defined and
                                        repeat.item.icon is string and
                                        ((repeat.item.icon.split("mdi:") | last) in special_icons or ("," ~ (repeat.item.icon.split("mdi:") | last) ~ ",") in all_icon_names)
                                      }}
                                    value1_enabled: >
                                      {{
                                        repeat.item.value1 is defined and
                                        repeat.item.value1 is string and
                                        repeat.item.value1.split(".") | count == 2 and
                                        (utilities_constructor or (trigger.entity_id == repeat.item.value1))
                                      }}
                                    value2_enabled: >
                                      {{
                                        repeat.item.value2 is defined and
                                        repeat.item.value2 is string and
                                        repeat.item.value2.split(".") | count == 2 and
                                        (utilities_constructor or (trigger.entity_id == repeat.item.value2))
                                      }}
                                    label_enabled: '{{ utilities_constructor and repeat.item.label is defined and repeat.item.label is string and repeat.item.label | length > 0 }}'
                                - alias: Utilities - Display icon
                                  if: '{{ icon_enabled }}'
                                  then:
                                    - variables:
                                        icon_code: '{{ (repeat.item.icon.split("mdi:") | last) }}'
                                    - action: 'esphome.{{ action_prefix }}_icon'
                                      data:
                                        page: utilities
                                        id: '{{ repeat.item.name }}_icon'
                                        icon: '{{ (special_icons[(icon_code)] if (icon_code) in special_icons
                                          else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (icon_code) ~ ",")].count(",")))
                                          if ("," ~ (icon_code) ~ ",") in all_icon_names
                                          else "") if ((icon_code) in special_icons or ("," ~ (icon_code) ~ ",") in all_icon_names) else "" }}'
                                        icon_color: >
                                          {{
                                            repeat.item.color
                                            if repeat.item.color is defined and repeat.item.color is list and repeat.item.color | count == 3
                                            else [0, 0, 0]
                                          }}
                                        visible: '{{ ((icon_code) in special_icons or ("," ~ (icon_code) ~ ",") in all_icon_names) }}'
                                      continue_on_error: true
                                    - *delay_default
                                - alias: Utilities - Label
                                  if: '{{ label_enabled }}'
                                  then:
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: mem
                                        id: command
                                        txt_list:
                                          - '{{ repeat.item.name }}_label.txt="{{ repeat.item.label }}"'
                                          - '{{ repeat.item.name }}_label.pco={{ rgb565 }}'
                                          - 'vis {{ repeat.item.name }}_label,1'
                                      continue_on_error: true
                                    - *delay_default
                                - alias: Calc lines
                                  variables:
                                    line_ref_state: >
                                      {{
                                        states(repeat.item.line_ref) | float(0)
                                        if repeat.item.line_ref is defined and repeat.item.line_ref is string and repeat.item.line_ref.split(".") | count == 2
                                        else 0
                                      }}
                                    direction: '{{ (((line_ref_state > 0) - (line_ref_state < 0)) * (-3 if repeat.item.line_inverted is defined and repeat.item.line_inverted else 3)) | int(0) }}'
                                - alias: Utilities - Display values
                                  if: '{{ value1_enabled or value2_enabled }}'
                                  then:
                                    - variables:
                                        value_enabled: '{{ value1_enabled }}'
                                        entity_id: '{{ repeat.item.value1 if value1_enabled else "" }}'
                                    - variables:
                                        unit_of_measurement: &utilities_value_unit_of_measurement >
                                          {{ state_attr(entity_id, "unit_of_measurement") | default("")
                                            if value_enabled and entity_id | length > 0 else "" }}
                                    - *variable_entity
                                    - variables:
                                        value1_val: &utilities_value_with_unit_and_translations >
                                          {{
                                            (
                                              (states(entity_id, rounded=true) ~ (
                                                ("" if compact_unit_display else " ") ~ unit_of_measurement
                                                if unit_of_measurement is string and unit_of_measurement | length > 0 else ""
                                              ))
                                              if is_number(entity_state)
                                              else state_translated(entity_id)
                                            ) | regex_replace('\s+', ' ') | trim
                                            if value_enabled and entity_id_valid and entity_has_value
                                            else ""
                                          }}
                                        value_enabled: '{{ value2_enabled }}'
                                        entity_id: '{{ repeat.item.value2 if value2_enabled else "" }}'
                                    - variables:
                                        unit_of_measurement: *utilities_value_unit_of_measurement
                                    - *variable_entity
                                    - variables:
                                        value2_val: *utilities_value_with_unit_and_translations
                                    - action: 'esphome.{{ action_prefix }}_utilities_group_refresh'
                                      data:
                                        group_id: '{{ repeat.item.name }}'
                                        value1: '{{ value1_val }}'
                                        value2: '{{ value2_val }}'
                                        direction: '{{ direction }}'
                                        constructor: '{{ utilities_constructor }}'
                                      continue_on_error: true
                                    - *delay_default
                                    - if: '{{ utilities_constructor }}'
                                      then:
                                        - if: '{{ value1_enabled }}'
                                          then:
                                            - action: 'esphome.{{ action_prefix }}_component_text_list'
                                              data:
                                                page: mem
                                                id: command
                                                txt_list:
                                                  - '{{ repeat.item.name }}.pco={{ rgb565 }}'
                                                  - 'vis {{ repeat.item.name }},1'
                                              continue_on_error: true
                                            - *delay_default
                                        - if: '{{ value2_enabled }}'
                                          then:
                                            - action: 'esphome.{{ action_prefix }}_component_text_list'
                                              data:
                                                page: mem
                                                id: command
                                                txt_list:
                                                  - '{{ repeat.item.name }}b.pco={{ rgb565 }}'
                                                  - 'vis {{ repeat.item.name }}b,1'
                                              continue_on_error: true
                                            - *delay_default
                                - alias: Utilities - Line
                                  if:
                                    - '{{ icon_enabled or value1_enabled or value2_enabled or label_enabled }}'
                                    - '{{ repeat.item.name not in ["grid"] }}'
                                    - '{{ utilities_constructor }}'
                                  then:
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: mem
                                        id: command
                                        txt_list:
                                          - '{{ repeat.item.name }}_line.bco={{ rgb565 }}'
                                          - '{{ repeat.item.name }}_line.bco1={{ rgb565 }}'
                                          - >-
                                            {% if pages_utilities.cursor.width != 255 %}
                                              {{ repeat.item.name }}_line.wid={{ pages_utilities.cursor.width }}
                                            {% endif %}
                                          - 'vis {{ repeat.item.name }}_line,1'
                                      continue_on_error: true
                                    - *delay_default

                      - alias: Graph page
                        conditions: '{{ nspanel_event.page == pages.graph }}'
                        sequence: &refresh_page_graph
                          - variables:
                              # Settings of the Home page value that opened the graph
                              graph_value: >-
                                {{
                                  home_page.entity_value
                                  | selectattr("entity", "defined")
                                  | selectattr("entity", "eq", entity_id)
                                  | list
                                  | first
                                  | default({}, true)
                                }}
                              overlap:
                                icon: >
                                  {{
                                    graph_value.icon
                                    if
                                      graph_value.icon is defined and
                                      graph_value.icon is string and
                                      graph_value.icon is match "mdi:" and
                                      ((graph_value.icon.split("mdi:") | last) in special_icons or ("," ~ (graph_value.icon.split("mdi:") | last) ~ ",") in all_icon_names)
                                    else
                                      None
                                  }}
                          - *variable_entity
                          - condition: '{{ entity_id_valid }}'
                          - &condition_graph_enabled
                            alias: Only an entity with the graph enabled on a Home page value
                            condition: template
                            value_template: >-
                              {{
                                home_page.entity_value
                                | selectattr("entity", "defined")
                                | selectattr("entity", "eq", entity_id)
                                | selectattr("graph", "defined")
                                | selectattr("graph", "eq", true)
                                | list | count > 0
                              }}
                          - variables:
                              unit_of_measurement_raw: '{{ state_attr(entity_id, "unit_of_measurement") | default("") }}'
                              unit_of_measurement: >
                                {{
                                  unit_of_measurement_raw
                                  if unit_of_measurement_raw and unit_of_measurement_raw is string and unit_of_measurement_raw | length > 0
                                  else ""
                                }}
                              # Fixed bounds; a comma is accepted as decimal separator, and an empty or non-numeric field means automatic
                              graph_min: >-
                                {%- set bound = (graph_value.graph_min | default("") | string | trim).replace(",", ".") -%}
                                {{ bound if is_number(bound) else "" }}
                              graph_max: >-
                                {%- set bound = (graph_value.graph_max | default("") | string | trim).replace(",", ".") -%}
                                {{ bound if is_number(bound) else "" }}
                              # Same decimals as the value shown on the Home page
                              graph_decimals: >-
                                {%- set rounded = states(entity_id, rounded=true) | string -%}
                                {{ rounded.split(".")[1] | length if is_number(rounded) and "." in rounded else 0 }}
                          - action: 'esphome.{{ action_prefix }}_component_text_list'
                            data:
                              page: mem
                              id: graph_config
                              txt_list:
                                - '{{ entity.name }}'
                                - '{{ entity.icon }}'
                                - '{{ unit_of_measurement }}'
                                - '{{ graph_min }}'
                                - '{{ graph_max }}'
                                - '{{ graph_decimals }}'
                            continue_on_error: true
                          - *delay_default
                          - &graph_value_now
                            action: 'esphome.{{ action_prefix }}_component_text_list'
                            data:
                              page: mem
                              id: graph_value_now
                              txt_list: *value_with_unit_and_translations
                            continue_on_error: true
                          - *delay_default
                          - variables: &variables_graph_period
                              # The newest complete 5-minute period; the recorder compiles it a few seconds after it ends
                              graph_end_ts: '{{ ((as_timestamp(now()) - 60) // 300 * 300) | int }}'
                              graph_start_ts: >-
                                {{
                                  [graph_end_ts - 288 * 300, (graph_since | int(0)) + 300] | max
                                  if graph_since is defined
                                  else graph_end_ts - 288 * 300
                                }}
                          # A missing recorder integration is not caught by continue_on_error, so this run stops here
                          - &graph_get_statistics
                            action: recorder.get_statistics
                            data:
                              statistic_ids:
                                - '{{ entity_id }}'
                              start_time: '{{ graph_start_ts | int | as_datetime | string }}'
                              end_time: '{{ graph_end_ts | int | as_datetime | string }}'
                              period: 5minute
                              types:
                                - mean
                            response_variable: graph_response
                            continue_on_error: true
                          - variables: &variables_graph_values
                              # `[start, v0, v1, ...]`: one value per period, oldest first, "" for a period without data
                              graph_values: >-
                                {%- set rows = graph_response.statistics[entity_id]
                                      if graph_response is defined and graph_response.statistics is defined
                                        and entity_id in graph_response.statistics
                                      else [] -%}
                                {%- set rows = rows | selectattr("mean", "number") | list -%}
                                {%- set slots = ((graph_end_ts - graph_start_ts) // 300) | int -%}
                                {%- set ns = namespace(out=[graph_start_ts | string], row=0) -%}
                                {%- for slot in range(slots) -%}
                                  {%- set slot_ts = graph_start_ts + slot * 300 -%}
                                  {#- Periods start on 5-minute boundaries, so a row is either in this slot or a later one -#}
                                  {%- if ns.row < rows | count and as_timestamp(rows[ns.row].start) | int < slot_ts -%}
                                    {%- set ns.row = ns.row + 1 -%}
                                  {%- endif -%}
                                  {%- if ns.row < rows | count and as_timestamp(rows[ns.row].start) | int == slot_ts -%}
                                    {%- set ns.out = ns.out + ["%.6g" | format(rows[ns.row].mean)] -%}
                                    {%- set ns.row = ns.row + 1 -%}
                                  {%- else -%}
                                    {%- set ns.out = ns.out + [""] -%}
                                  {%- endif -%}
                                {%- endfor -%}
                                {{ ns.out }}
                          - action: 'esphome.{{ action_prefix }}_component_text_list'
                            data:
                              page: mem
                              id: graph_history
                              txt_list: '{{ graph_values }}'
                            continue_on_error: true
                          - *delay_default

                  - variables:
                      entity_details_pages_max_refreshes: !input entity_details_pages_max_refreshes
                      entity_details_pages_debounce_ms: !input entity_details_pages_debounce
                      entity_details_pages_update_interval_s: !input entity_details_pages_update_interval
                      current_page_from_sensor: '{{ nspanel_event.page }}'
                      # Domains whose entity changes refresh each entity details page after it opens. One shared
                      # condition reads it, instead of a separate template per page (#636: fewer distinct templates).
                      page_entity_domains:
                        light: ["light"]
                        cover: ["cover"]
                        fan: ["fan"]
                        media_player: ["media_player"]
                        alarm: ["alarm_control_panel"]
                        climate: ["climate"]
                        button: ["button", "input_button"]
                        switch: ["switch", "input_boolean"]
                        water_heater: ["humidifier", "water_heater"]
                        select: ["select", "input_select"]
                        timer: ["timer"]
                        vacuum: ["lawn_mower", "vacuum"]
                      # Cross-iteration state: the last redraw was driven by an entity change on a
                      # page that keeps pending presses (fan), so the next wait is a short settle
                      # pass that redraws once the entity has been quiet for the debounce time.
                      refresh_pending_settle: false
                      # Set at the end of each pass that waited for the next refresh, so the loop
                      # ends on any condition below that fails
                      refresh_next: false
                  # Entity details pages are rendered by this loop only, so each page's sequence exists once
                  # in the automation (#657). The first pass renders the page as it opens; the next passes
                  # render it again on each change of its entity, while the page stays open on it.
                  - alias: Entity details pages
                    repeat:
                      sequence:
                        - variables:
                            refresh_next: false
                        - choose:
                            - alias: Light settings page
                              conditions:
                                - '{{ current_page_from_sensor == pages.light }}'
                                - '{{ repeat.index == 1 or original_state.entity_domain in page_entity_domains.get(current_page_from_sensor, []) }}'
                              sequence: &refresh_page_light
                                - &get_entity_id_from_event_or_trigger
                                  variables:
                                    entity_id: '{{ original_state.entity_id }}'
                                    entity_id_valid: '{{ original_state.entity_id_valid }}'
                                    # Set on every refresh, so the configured title and icon are not lost when
                                    # another step of this run reassigns `overlap`.
                                    overlap: >-
                                      {{
                                        details_overlap
                                        if details_overlap is defined
                                        else {"icon": None, "icon_color": None, "name": None}
                                      }}
                                - *variable_entity
                                - &entity_details_title_with_icon
                                  alias: Fill title of entity details page
                                  if: '{{ entity is defined }}'
                                  then:
                                    - variables:
                                        txt_list: >
                                          {%- set ns = namespace(items=[]) -%}
                                          {%- if entity.name is defined and entity.name is string and entity.name | length > 0 -%}
                                            {%- set ns.items = ns.items + ['page_label.txt="' + entity.name + '"'] -%}
                                          {%- endif -%}
                                          {%- if entity.icon is defined and entity.icon is string and entity.icon | length > 0 -%}
                                            {%- set ns.items = ns.items + ['icon_state.txt="' + entity.icon + '"'] -%}
                                          {%- endif -%}
                                          {{ ns.items }}
                                    - if: '{{ txt_list | length > 0 }}'
                                      then:
                                        - action: 'esphome.{{ action_prefix }}_component_text_list'
                                          data:
                                            page: mem
                                            id: command
                                            txt_list: '{{ txt_list }}'
                                          continue_on_error: true
                                        - *delay_default
                                - &variables_light_modes
                                  alias: variables_light_modes
                                  variables:
                                    entity_id_valid: '{{ entity_id is defined and entity_id is string and entity_id.split(".") | count == 2 }}'
                                    # "embedded_climate" is not a real entity_id and cannot be split, but it
                                    # must still resolve to the climate domain so its detail page can open.
                                    entity_domain: >-
                                      {{
                                        "climate"
                                        if entity_id == "embedded_climate"
                                        else (entity_id.split(".")[0] if entity_id_valid else "")
                                      }}
                                    entity_domain_is_light: '{{ entity_id_valid and entity_domain == "light" }}'
                                    supported_features: '{{ state_attr(entity_id, "supported_features") | int(0) if entity_id_valid else 0 }}'
                                    supported_color_modes: >-
                                      {{
                                        state_attr(entity_id, "supported_color_modes") | default([], true)
                                        if entity_domain_is_light
                                        else []
                                      }}
                                    color_mode_brightness: >-
                                      {{
                                        entity_domain_is_light and
                                        (
                                          supported_features | bitwise_and(1) > 0 or
                                          states[entity_id] is defined and "brightness" in states[entity_id].attributes or
                                          enum.ColorMode.BRIGHTNESS in supported_color_modes or
                                          "brightness" in supported_color_modes or
                                          supported_color_modes
                                            | map(attribute="value") | list
                                            | select("in", ["brightness"])
                                            | list | length > 0 or
                                          state_attr(entity_id, "brightness") | int(-1) >= 0
                                        )
                                      }}
                                    color_mode_color: >-
                                      {{
                                        entity_domain_is_light and
                                        (
                                          supported_features | bitwise_and(16) > 0 or
                                          enum.ColorMode.HS in supported_color_modes or
                                          enum.ColorMode.XY in supported_color_modes or
                                          enum.ColorMode.RGB in supported_color_modes or
                                          enum.ColorMode.RGBW in supported_color_modes or
                                          enum.ColorMode.RGBWW in supported_color_modes or
                                          "hs" in supported_color_modes or
                                          "xy" in supported_color_modes or
                                          "rgb" in supported_color_modes or
                                          "rgbw" in supported_color_modes or
                                          "rgbww" in supported_color_modes or
                                          state_attr(entity_id, "rgb_color") | default("unknown") is list or
                                          supported_color_modes
                                            | map(attribute="value") | list
                                            | select("in", ["hs", "xy", "rgb", "rgbw", "rgbww"])
                                            | list | length > 0
                                        )
                                      }}
                                    color_mode_temp: >-
                                      {{
                                        entity_domain_is_light and
                                        (
                                          supported_features | bitwise_and(2) > 0 or
                                          enum.ColorMode.COLOR_TEMP in supported_color_modes or
                                          "color_temp" in supported_color_modes or
                                          supported_color_modes
                                            | map(attribute="value") | list
                                            | select("in", ["color_temp"])
                                            | list | length > 0 or
                                          state_attr(entity_id, "color_temp_kelvin") | int(-1) >= 0
                                        )
                                      }}
                                    effects_available: '{{ entity_domain_is_light and supported_features | bitwise_and(4) > 0 }}'
                                    # Single source of truth for "is there anything to show on this light's
                                    # detail page?" — a light with none of these renders an empty page where
                                    # only the always-visible power button remains, duplicating the short
                                    # press. Unlike click_opens_details, effects count here: the effect tab
                                    # is reachable on the detail page but is not a tap action. See #285.
                                    light_has_details: >-
                                      {{
                                        entity_domain_is_light and
                                        (
                                          color_mode_brightness or
                                          color_mode_color or
                                          color_mode_temp or
                                          effects_available
                                        )
                                      }}
                                    # Single source of truth for "does a tap on this entity open its detail
                                    # card instead of performing the short-press action?" — shared by every
                                    # place that renders per-entity buttons (Home page, Buttons pages), so a
                                    # capability added for one can't silently miss the other.
                                    # Entities without a toggle always open the card. Adjustable entities do so
                                    # only when the user opted in via `button_tap_behavior`; by default a tap
                                    # toggles and the card is reached with a long press (#446).
                                    click_opens_details: >-
                                      {{
                                        entity_domain in domains_functionality.detailed_only or
                                        (
                                          button_tap_behavior == "details_when_adjustable" and
                                          (
                                            (entity_domain == "cover" and supported_features | bitwise_and(132) > 0) or
                                            (entity_domain == "fan" and supported_features | bitwise_and(11) > 0) or
                                            (entity_domain == "light" and (color_mode_brightness or color_mode_color or color_mode_temp))
                                          )
                                        )
                                      }}

                                ##### LIGHT State #####
                                - alias: Light brightness
                                  if: '{{ color_mode_brightness }}'
                                  then:
                                    - variables:
                                        curr_brightness: '{{ (state_attr(entity_id, "brightness") | int(0) * 100 / 255) | round(0) }}'
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: mem
                                        id: command
                                        txt_list:
                                          - 'lightslider.val={{ curr_brightness }}'
                                          - 'light_value.txt="{{ curr_brightness ~ ("" if compact_unit_display else " ") }}%"'
                                          - 'light_value_2.txt="{{ curr_brightness ~ ("" if compact_unit_display else " ") }}%"'
                                          - 'power_button.pco=50712'  # [192, 192, 192]
                                      continue_on_error: true
                                    - *delay_default

                                ##### LIGHT Check Color_Temp Value is available when yes send some current Values #####
                                - alias: Light temperature
                                  if: '{{ color_mode_temp }}'
                                  then:
                                    - variables:
                                        curr_color_temp: '{{ state_attr(entity_id, "color_temp_kelvin") | int(-1) }}'
                                        min_color_temp_kelvin: '{{ state_attr(entity_id, "min_color_temp_kelvin") | int(2000) }}'
                                        max_color_temp_kelvin: '{{ state_attr(entity_id, "max_color_temp_kelvin") | int(6535) }}'
                                    - variables:
                                        curr_color_temp: >
                                          {{
                                            curr_color_temp
                                            if curr_color_temp >= min_color_temp_kelvin and curr_color_temp <= max_color_temp_kelvin
                                            else ((min_color_temp_kelvin+max_color_temp_kelvin)/2) | int(4268)
                                          }}
                                    - condition: '{{ is_number(curr_color_temp) }}'
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: mem
                                        id: command
                                        txt_list:
                                          - 'temp_value.txt="{{ curr_color_temp }}K"'
                                          - 'temp_value_2.txt="{{ curr_color_temp }}K"'
                                          - 'tempslider.val={{ (min_color_temp_kelvin + max_color_temp_kelvin - curr_color_temp) | int }}'
                                          - 'tempslider.minval={{ min_color_temp_kelvin }}'
                                          - 'tempslider.maxval={{ max_color_temp_kelvin }}'
                                      continue_on_error: true
                                    - *delay_default

                                ##### LIGHT Effects #####
                                - alias: Light effects
                                  if:
                                    - '{{ effects_available }}'
                                  then:
                                    - variables:
                                        current_effect_raw: '{{ state_attr(entity_id, "effect") }}'
                                        current_effect: >-
                                          {{
                                            current_effect_raw | trim
                                            if current_effect_raw is defined and current_effect_raw is string and current_effect_raw | length > 0
                                            else ""
                                          }}
                                    ##### Always (construction and updates): push current effect #####
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: mem
                                        id: popup_select_current
                                        txt_list:
                                          - '{{ current_effect }}'
                                      continue_on_error: true
                                    - *delay_default

                                    - if: '{{ page_constructor }}'
                                      then:
                                        - variables:
                                            effect_list_raw_attr: '{{ state_attr(entity_id, "effect_list") }}'
                                            effect_list_raw: >
                                              {{
                                                effect_list_raw_attr | list
                                                if
                                                  effect_list_raw_attr is defined and
                                                  effect_list_raw_attr is iterable and
                                                  effect_list_raw_attr is not string
                                                else []
                                              }}

                                            # Truncation rule (the picker pages through up to 32 options): current always included.
                                            # If <=32: send all in HA order.
                                            # If >32 and current in first 32: send first 32.
                                            # If >32 and current in positions 32+: send [current] + first 31 excluding current.
                                            effect_list_truncated: >
                                              {%- if effect_list_raw | length <= 32 -%}
                                                {%- if current_effect | length == 0 or current_effect in effect_list_raw -%}
                                                  {{ effect_list_raw }}
                                                {%- else -%}
                                                  {{ ([current_effect] + (effect_list_raw | list))[:32] }}
                                                {%- endif -%}
                                              {%- elif current_effect | length == 0 or current_effect in effect_list_raw[:32] -%}
                                                {{ effect_list_raw[:32] }}
                                              {%- else -%}
                                                {{ [current_effect] + (effect_list_raw[:31] | reject("equalto", current_effect) | list) }}
                                              {%- endif -%}
                                        - action: 'esphome.{{ action_prefix }}_component_text_list'
                                          data:
                                            page: mem
                                            id: popup_select_context
                                            txt_list:
                                              - 'light_effect'
                                          continue_on_error: true
                                        - *delay_default
                                        - action: 'esphome.{{ action_prefix }}_component_val'
                                          data:
                                            page: mem
                                            id: popup_select_mode
                                            val: 0
                                          continue_on_error: true
                                        - *delay_default
                                        - action: 'esphome.{{ action_prefix }}_component_text_list'
                                          data:
                                            page: mem
                                            id: popup_select_options
                                            txt_list: '{{ effect_list_truncated }}'
                                          continue_on_error: true
                                        - *delay_default

                                ##### LIGHT Features mask (construction-only) #####
                                # Bitmask: bit 0=brightness, bit 1=temp, bit 2=color, bit 3=effects
                                - alias: Light features mask
                                  if: '{{ page_constructor }}'
                                  then:
                                    - variables:
                                        light_features_mask: >-
                                          {{
                                            (1 if color_mode_brightness else 0) +
                                            (2 if color_mode_temp       else 0) +
                                            (4 if color_mode_color      else 0) +
                                            (8 if effects_available     else 0)
                                          }}
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: mem
                                        id: command
                                        txt_list:
                                          - 'light_features_mask={{ light_features_mask }}'
                                          - 'features.en=1'
                                      continue_on_error: true
                                    - *delay_default
                            - alias: Cover settings page
                              conditions:
                                - '{{ current_page_from_sensor == pages.cover }}'
                                - '{{ repeat.index == 1 or original_state.entity_domain in page_entity_domains.get(current_page_from_sensor, []) }}'
                              sequence: &refresh_page_cover
                                - *get_entity_id_from_event_or_trigger
                                - *variable_entity
                                - variables:
                                    current_position_attr: '{{ state_attr(entity_id, "current_position") }}'
                                - alias: Cover state
                                  if: '{{ is_number(current_position_attr) }}'
                                  then:
                                    - variables:
                                        current_position: '{{ current_position_attr | round(0) | int }}'
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: mem
                                        id: command
                                        txt_list:
                                          # The page holds two position sliders: one next to the tilt
                                          # slider and one centered for covers without tilt. Only one of
                                          # them is visible, both are written.
                                          - 'coverslider.val={{ current_position }}'
                                          - 'cover_value.txt="{{ current_position ~ ("" if compact_unit_display else " ") }}%"'
                                          - 'coverslider2.val={{ current_position }}'
                                          - 'cover_value_2.txt="{{ current_position ~ ("" if compact_unit_display else " ") }}%"'
                                      continue_on_error: true
                                    - *delay_default

                                - variables:
                                    current_tilt_attr: '{{ state_attr(entity_id, "current_tilt_position") }}'
                                - alias: Cover tilt state
                                  if: '{{ is_number(current_tilt_attr) }}'
                                  then:
                                    - variables:
                                        current_tilt: '{{ current_tilt_attr | round(0) | int }}'
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: mem
                                        id: command
                                        txt_list:
                                          - 'tiltslider.val={{ current_tilt }}'
                                          - 'tilt_value.txt="{{ current_tilt ~ ("" if compact_unit_display else " ") }}%"'
                                      continue_on_error: true
                                    - *delay_default

                                - condition: '{{ page_constructor }}'  # Page constructor
                                - variables:
                                    entity_device_class_raw: >-
                                      {{
                                        state_attr(entity_id, "device_class") | default("window")
                                        if entity_id_valid
                                        else "window"
                                      }}
                                    entity_device_class: >-
                                      {{
                                        entity_device_class_raw
                                        if
                                          entity_device_class_raw is defined and
                                          entity_device_class_raw is string and
                                          entity_device_class_raw | length > 0
                                        else "window"
                                      }}
                                    cover_icons:
                                      open: >
                                        {{
                                          (special_icons[(device_class_icons.cover[entity_device_class ~ "-open"])] if (device_class_icons.cover[entity_device_class ~ "-open"]) in special_icons
                                            else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (device_class_icons.cover[entity_device_class ~ "-open"]) ~ ",")].count(",")))
                                            if ("," ~ (device_class_icons.cover[entity_device_class ~ "-open"]) ~ ",") in all_icon_names
                                            else "")
                                          if (entity_device_class ~ "-open") in device_class_icons.cover
                                          else "\uE5B0"
                                        }}{# mdi:window-open #}
                                      close: >
                                        {{
                                          (special_icons[(device_class_icons.cover[entity_device_class ~ "-closed"])] if (device_class_icons.cover[entity_device_class ~ "-closed"]) in special_icons
                                            else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (device_class_icons.cover[entity_device_class ~ "-closed"]) ~ ",")].count(",")))
                                            if ("," ~ (device_class_icons.cover[entity_device_class ~ "-closed"]) ~ ",") in all_icon_names
                                            else "")
                                          if (entity_device_class ~ "-closed") in device_class_icons.cover
                                          else "\uE5AD"
                                        }}{# mdi:window-closed #}
                                - *entity_details_title_with_icon
                                - alias: Cover open-close icons
                                  action: 'esphome.{{ action_prefix }}_component_text_list'
                                  data:
                                    page: mem
                                    id: command
                                    txt_list:
                                      - 'cover_open.txt="{{ cover_icons.open }}"'
                                      - 'cover_close.txt="{{ cover_icons.close }}"'
                                  continue_on_error: true
                                - *delay_default
                                - alias: Cover sliders
                                  # Component coordinates are fixed at design time, so the page holds both
                                  # layouts: a centered position slider, or the position and tilt pair.
                                  # `vis` is not sticky across page loads, so set it both ways every time.
                                  sequence:
                                    - variables:
                                        cover_tilt_available: '{{ state_attr(entity_id, "supported_features") | int(0) | bitwise_and(128) > 0 }}'
                                    - action: 'esphome.{{ action_prefix }}_components_visibility'
                                      data:
                                        page: cover
                                        ids:
                                          - coverslider
                                          - cover_value
                                          - tiltslider
                                          - tilt_value
                                        visible: '{{ cover_tilt_available }}'
                                      continue_on_error: true
                                    - action: 'esphome.{{ action_prefix }}_components_visibility'
                                      data:
                                        page: cover
                                        ids:
                                          - coverslider2
                                          - cover_value_2
                                        visible: '{{ not cover_tilt_available }}'
                                      continue_on_error: true
                                    - *delay_default
                                - alias: Cover battery icon
                                  sequence:
                                    - variables:
                                        battery_attribute: '{{ state_attr(entity_id, "battery") | default("unavailable") }}'
                                        battery_level: >
                                          {% if is_number(battery_attribute) %}
                                            {{ battery_attribute }}
                                          {% elif expand(device_entities(device_id(entity_id)))
                                                  | selectattr("attributes.device_class", "defined")
                                                  | selectattr("attributes.device_class", "eq", "battery")
                                                  | map(attribute="state")
                                                  | map("float", default=none)
                                                  | select("ne", none)
                                                  | list
                                                  | count > 0 %}
                                            {{
                                              expand(device_entities(device_id(entity_id)))
                                              | selectattr("attributes.device_class", "defined")
                                              | selectattr("attributes.device_class", "eq", "battery")
                                              | map(attribute="state")
                                              | map("float", default=none)
                                              | select("ne", none)
                                              | list
                                              | first
                                              | round(0)
                                            }}
                                          {% elif has_value(entity_id | replace("cover.","sensor.") ~ "_battery") %}
                                            {{ states(entity_id | replace("cover.","sensor.") ~ "_battery", rounded=true) | default("unavailable") }}
                                          {% elif has_value(entity_id | replace("cover.","sensor.") | replace("cover", "battery")) %}
                                            {{ states(entity_id | replace("cover.","sensor.") | replace("cover", "battery"), rounded=true) | default("unavailable") }}
                                          {% else %} unavailable
                                          {% endif %}
                                    - condition: '{{ is_number(battery_level) }}'
                                    - variables:
                                        battery_icon: >
                                          {% if battery_level >= 80 %}
                                            battery-high
                                          {% elif battery_level >= 40 %}
                                            battery-medium
                                          {% elif battery_level >= 15 %}
                                            battery-low
                                          {% else %}
                                            battery-outline
                                          {% endif %}
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: mem
                                        id: command
                                        txt_list:
                                          - 'battery_value.txt="{{ battery_level ~ ("" if compact_unit_display else " ") }}%"'
                                          - 'battery_icon.txt="{{ (special_icons[(battery_icon)] if (battery_icon) in special_icons
                                            else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (battery_icon) ~ ",")].count(",")))
                                            if ("," ~ (battery_icon) ~ ",") in all_icon_names
                                            else "") }}"'
                                          - 'battery_icon.pco=52857'  # nextion.color.grey_super_light
                                      continue_on_error: true
                                    - *delay_default
                            - alias: Fan settings page
                              conditions:
                                - '{{ current_page_from_sensor == pages.fan }}'
                                - '{{ repeat.index == 1 or original_state.entity_domain in page_entity_domains.get(current_page_from_sensor, []) }}'
                              sequence: &refresh_page_fan
                                - *get_entity_id_from_event_or_trigger
                                - variables:
                                    fan:
                                      supported_features: '{{ state_attr(entity_id, "supported_features") | int(0) }}'
                                      percentage: >
                                        {{
                                          state_attr(entity_id, "percentage") | int(0)
                                          if is_state(entity_id, 'on')
                                          else 0
                                        }}
                                      steps: >
                                        {% set percentage_step = state_attr(entity_id, "percentage_step") | float(0) %}
                                        {{
                                          (100/percentage_step) | round(0) | int(0)
                                          if percentage_step > 0
                                          else 0
                                        }}
                                - *variable_entity
                                - *entity_details_title_with_icon
                                - alias: FAN capabilities
                                  # SET_SPEED, OSCILLATE and PRESET_MODE are independent features,
                                  # so each block below must be gated on its own bit only.
                                  variables:
                                    fan_speed_available: '{{ fan.steps > 0 and fan.supported_features | bitwise_and(1) > 0 }}'
                                    # Mirrors HA's more-info dialog: up to 3 speeds are shown as buttons
                                    # (off + speeds), more than that as a percentage slider.
                                    fan_speed_buttons: '{{ fan_speed_available and fan.steps <= 3 }}'
                                    fan_speed_slider: '{{ fan_speed_available and not fan_speed_buttons }}'
                                    fan_oscillate_available: '{{ fan.supported_features | bitwise_and(2) > 0 }}'
                                    fan_preset_mode_available: >
                                      {{
                                        fan.supported_features | bitwise_and(8) > 0 and
                                        state_attr(entity_id, "preset_modes") is iterable and
                                        state_attr(entity_id, "preset_modes") is not string and
                                        state_attr(entity_id, "preset_modes") | default([], true) | length > 0
                                      }}
                                - if: '{{ fan_oscillate_available }}'
                                  then:
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: mem
                                        id: command
                                        txt_list:
                                          - 'bt_oscillate.txt="{{
                                                                  "\uE069"
                                                                  if state_attr(entity_id, "oscillating") | default(false)
                                                                  else "\uF9E6"
                                                                }}{# mdi:autorenew, mdi:autorenew-off #}"'
                                          - 'bt_oscillate.pco=59164'  # nextion.color.grey_white
                                          - 'vis bt_oscillate,1'
                                      continue_on_error: true
                                    - *delay_default

                                - alias: FAN power button
                                  # Not speed-related, so it must be painted for every fan.
                                  action: 'esphome.{{ action_prefix }}_component_text_list'
                                  data:
                                    page: mem
                                    id: command
                                    txt_list:
                                      - 'power_button.pco=50712'  # [192, 192, 192]
                                  continue_on_error: true
                                - *delay_default

                                - alias: FAN speed
                                  sequence:
                                    # Speed widgets are visible by default on the TFT and Nextion keeps
                                    # `vis` across page entries, so set it both ways on every render.
                                    - action: 'esphome.{{ action_prefix }}_components_visibility'
                                      data:
                                        page: fan
                                        ids:
                                          - fan_value
                                          - fanslider
                                          - button_up
                                          - button_down
                                        visible: '{{ fan_speed_slider }}'
                                      continue_on_error: true
                                    - *delay_default
                                    - if: '{{ fan_speed_slider }}'
                                      then:
                                        - variables:
                                            color_rgb565:
                                              grey_white: 59164  # nextion.color.grey_white
                                              grey_dark: 10596   # nextion.color.grey_dark
                                        - action: 'esphome.{{ action_prefix }}_component_text_list'
                                          data:
                                            page: mem
                                            id: command
                                            txt_list:
                                              - 'fan_value.txt="{{ fan.percentage ~ ("" if compact_unit_display else " ") }}%"'
                                              - 'fanslider.val={{ ((fan.percentage / 100) * fan.steps) | round(0) | int(0) }}'
                                              - 'fanslider.maxval={{ fan.steps }}'
                                              - 'button_up.pco={{ color_rgb565.grey_white if fan.percentage < 100 else color_rgb565.grey_dark }}'
                                              - 'button_down.pco={{ color_rgb565.grey_white if fan.percentage > 0 else color_rgb565.grey_dark }}'
                                          continue_on_error: true
                                        - *delay_default

                                - alias: FAN speed buttons
                                  # Reuses the mode_bt1..mode_bt5 slots. Preset modes only take those
                                  # slots when there is no speed control, so both never compete.
                                  # Buttons run top to bottom from the highest speed down to off. A press
                                  # only reports the slot; see "Fan page mode buttons" (button_click).
                                  if: '{{ fan_speed_buttons }}'
                                  then:
                                    - variables:
                                        speed_buttons_count: '{{ fan.steps + 1 }}'
                                        # Same rounding as HA's fanPercentageToSpeed
                                        speed_index_active: >-
                                          {{
                                            ((fan.percentage * fan.steps) / 100) | round(0) | int(0)
                                            if is_state(entity_id, "on")
                                            else 0
                                          }}

                                    ##### Construction-only: icons, pictures, payloads and visibility #####
                                    - if: '{{ page_constructor }}'
                                      then:
                                        - action: 'esphome.{{ nspanel_name }}_component_text_list'
                                          data:
                                            page: mem
                                            id: command
                                            txt_list: >-
                                              {% set ns = namespace(items=[]) %}
                                              {% set shift = 1 if states(background_type) | lower is match("light") else 0 %}
                                              {% for slot in range(1, speed_buttons_count + 1) %}
                                                {% set speed_index = speed_buttons_count - slot %}
                                                {% if speed_index == 0 %}
                                                  {% set icon = "\uE81C" %}{# mdi:fan-off #}
                                                {% elif fan.steps == 1 %}
                                                  {% set icon = "\uE20F" %}{# mdi:fan #}
                                                {% else %}
                                                  {% set icon = (special_icons[("fan-speed-" ~ speed_index)] if ("fan-speed-" ~ speed_index) in special_icons
                                                    else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ ("fan-speed-" ~ speed_index) ~ ",")].count(",")))
                                                    if ("," ~ ("fan-speed-" ~ speed_index) ~ ",") in all_icon_names
                                                    else "") %}
                                                {% endif %}
                                                {% set button = 'mode_bt' ~ slot %}
                                                {% set base = 114 + ((slot - 1) * 4) %}
                                                {% set ns.items = ns.items + [button ~ '.font=8'] %}
                                                {% set ns.items = ns.items + [button ~ '.txt="' ~ icon ~ '"'] %}
                                                {% set ns.items = ns.items + [button ~ '.pic=' ~ (base + 2 + shift)] %}
                                                {% set ns.items = ns.items + [button ~ '.pic2=' ~ (base + shift)] %}
                                              {% endfor %}
                                              {{ ns.items }}
                                          continue_on_error: true
                                        - *delay_default
                                        - action: 'esphome.{{ nspanel_name }}_components_visibility'
                                          data:
                                            page: fan
                                            ids: >-
                                              {{ range(1, speed_buttons_count + 1) | map("string") | map("regex_replace", "^", "mode_bt") | list }}
                                            visible: true
                                          continue_on_error: true
                                        - *delay_default
                                        - action: 'esphome.{{ nspanel_name }}_components_visibility'
                                          data:
                                            page: fan
                                            ids: >-
                                              {{ range(speed_buttons_count + 1, 6) | map("string") | map("regex_replace", "^", "mode_bt") | list }}
                                            visible: false
                                          continue_on_error: true
                                        - *delay_default

                                    ##### Always: confirmed state, which also clears a pending press #####
                                    # A pending press is only cleared once its slot is the confirmed one, so
                                    # intermediate states reported during a transition keep it pending. The
                                    # page constructor and any redraw after the entity went quiet (settle
                                    # pass or fallback refresh) clear every slot, covering requests that
                                    # never make the pressed slot the active one.
                                    - action: 'esphome.{{ nspanel_name }}_component_text_list'
                                      data:
                                        page: mem
                                        id: command
                                        txt_list: >-
                                          {% set ns = namespace(items=[]) %}
                                          {% set clear_all_pending = page_constructor or refresh_settled %}
                                          {% for slot in range(1, speed_buttons_count + 1) %}
                                            {% set active = (speed_buttons_count - slot) == speed_index_active %}
                                            {% set ns.items = ns.items + ["mode_bt" ~ slot ~ ".val=" ~ (1 if active else 0)] %}
                                            {% if active or clear_all_pending %}
                                              {% set ns.items = ns.items + ["mode_bt" ~ slot ~ ".pco=65535"] %}  {# nextion.color.white #}
                                              {% set ns.items = ns.items + ["mode_bt" ~ slot ~ ".pco2=65535"] %}  {# nextion.color.white #}
                                            {% endif %}  {# active or clear_all_pending #}
                                          {% endfor %}
                                          {{ ns.items }}
                                      continue_on_error: true
                                    - *delay_default

                                - alias: FAN Preset mode
                                  if: '{{ fan_preset_mode_available }}'
                                  then:
                                    - variables:
                                        current_preset_mode_raw: '{{ state_attr(entity_id, "preset_mode") }}'
                                        current_preset_mode: >-
                                          {{
                                            current_preset_mode_raw | trim
                                            if current_preset_mode_raw is defined and current_preset_mode_raw is string and current_preset_mode_raw | length > 0
                                            else ""
                                          }}
                                        preset_modes_raw_attr: '{{ state_attr(entity_id, "preset_modes") }}'
                                    - variables:
                                        preset_modes_raw: >
                                          {{
                                            preset_modes_raw_attr
                                            if
                                              preset_modes_raw_attr is defined and
                                              preset_modes_raw_attr is iterable and
                                              preset_modes_raw_attr is not string
                                            else []
                                          }}
                                    - variables:
                                        # A fan without speed control leaves the slider area free, so the
                                        # modes are shown as buttons there. The page has five of them,
                                        # a longer list stays on the popup.
                                        preset_buttons: '{{ not fan_speed_available and preset_modes_raw | length <= 5 }}'

                                    ##### Construction-only: push options + show mode button #####
                                    - if: '{{ page_constructor }}'
                                      then:
                                        - variables:
                                            # The picker pages through up to 32 options; current is always included
                                            preset_modes_truncated: >
                                              {%- if preset_modes_raw | length <= 32 -%}
                                                {{ preset_modes_raw }}
                                              {%- elif current_preset_mode | length == 0 or current_preset_mode in preset_modes_raw[:32] -%}
                                                {{ preset_modes_raw[:32] }}
                                              {%- else -%}
                                                {{ [current_preset_mode] + (preset_modes_raw[:31] | reject("equalto", current_preset_mode) | list) }}
                                              {%- endif -%}
                                        - action: 'esphome.{{ nspanel_name }}_component_text_list'
                                          data:
                                            page: mem
                                            id: popup_select_context
                                            txt_list:
                                              - 'fan_preset_mode'
                                          continue_on_error: true
                                        - *delay_default
                                        - action: 'esphome.{{ nspanel_name }}_component_val'
                                          data:
                                            page: mem
                                            id: popup_select_mode
                                            val: 0
                                          continue_on_error: true
                                        - *delay_default
                                        - action: 'esphome.{{ nspanel_name }}_component_text_list'
                                          data:
                                            page: mem
                                            id: popup_select_options
                                            txt_list: '{{ preset_modes_truncated }}'
                                          continue_on_error: true
                                        - *delay_default
                                        - action: 'esphome.{{ nspanel_name }}_components_visibility'
                                          data:
                                            page: fan
                                            ids:
                                              - mode_button
                                            visible: '{{ not preset_buttons }}'
                                          continue_on_error: true
                                        - *delay_default

                                        ##### Modes as buttons, for fans without speed control #####
                                        - if: '{{ preset_buttons }}'
                                          then:
                                            - action: 'esphome.{{ nspanel_name }}_component_text_list'
                                              data:
                                                page: mem
                                                id: command
                                                txt_list: >-
                                                  {% set ns = namespace(items=[]) %}
                                                  {% set shift = 1 if states(background_type) | lower is match("light") else 0 %}
                                                  {% for mode in preset_modes_raw %}
                                                    {% set button = 'mode_bt' ~ loop.index %}
                                                    {% set base = 114 + (loop.index0 * 4) %}
                                                    {% set ns.items = ns.items + [button ~ '.font=2'] %}
                                                    {% set ns.items = ns.items + [button ~ '.txt="' ~ (mode | replace('"', "")) ~ '"'] %}
                                                    {% set ns.items = ns.items + [button ~ '.pic=' ~ (base + 2 + shift)] %}
                                                    {% set ns.items = ns.items + [button ~ '.pic2=' ~ (base + shift)] %}
                                                  {% endfor %}
                                                  {{ ns.items }}
                                              continue_on_error: true
                                            - *delay_default
                                            - action: 'esphome.{{ nspanel_name }}_components_visibility'
                                              data:
                                                page: fan
                                                ids: >-
                                                  {{ range(1, preset_modes_raw | length + 1) | map("string") | map("regex_replace", "^", "mode_bt") | list }}
                                                visible: true
                                              continue_on_error: true
                                            - *delay_default
                                            - if: '{{ preset_modes_raw | length < 5 }}'
                                              then:
                                                - action: 'esphome.{{ nspanel_name }}_components_visibility'
                                                  data:
                                                    page: fan
                                                    ids: >-
                                                      {{ range(preset_modes_raw | length + 1, 6) | map("string") | map("regex_replace", "^", "mode_bt") | list }}
                                                    visible: false
                                                  continue_on_error: true
                                                - *delay_default

                                    ##### Always (construction and updates): push current preset_mode #####
                                    - action: 'esphome.{{ nspanel_name }}_component_text_list'
                                      data:
                                        page: mem
                                        id: popup_select_current
                                        txt_list:
                                          - '{{ current_preset_mode }}'
                                      continue_on_error: true

                                    ##### Always: paint the mode buttons, active one highlighted #####
                                    - if: '{{ preset_buttons }}'
                                      then:
                                        # The pictures are pushed by the page constructor, so an update
                                        # only has to move the state of each button and clear the
                                        # pending colour a press leaves behind. That colour is only
                                        # cleared once its button is the confirmed one, or on the page
                                        # constructor and any redraw after the entity went quiet (settle
                                        # pass or fallback refresh), so intermediate states reported
                                        # during a transition keep the press pending.
                                        - action: 'esphome.{{ nspanel_name }}_component_text_list'
                                          data:
                                            page: mem
                                            id: command
                                            txt_list: >-
                                              {% set ns = namespace(items=[]) %}
                                              {% set running = states(entity_id) == "on" %}
                                              {% set clear_all_pending = page_constructor or refresh_settled %}
                                              {% for mode in preset_modes_raw %}
                                                {% set active = running and mode == current_preset_mode %}
                                                {% set ns.items = ns.items + ["mode_bt" ~ loop.index ~ ".val=" ~ (1 if active else 0)] %}
                                                {% if active or clear_all_pending %}
                                                  {% set ns.items = ns.items + ["mode_bt" ~ loop.index ~ ".pco=65535"] %}  {# nextion.color.white #}
                                                  {% set ns.items = ns.items + ["mode_bt" ~ loop.index ~ ".pco2=65535"] %}  {# nextion.color.white #}
                                                {% endif %}  {# active or clear_all_pending #}
                                              {% endfor %}
                                              {{ ns.items }}
                                          continue_on_error: true
                                        - *delay_default
                            - alias: Media player settings page
                              conditions:
                                - '{{ current_page_from_sensor == pages.media_player }}'
                                - '{{ repeat.index == 1 or original_state.entity_domain in page_entity_domains.get(current_page_from_sensor, []) }}'
                              sequence: &refresh_page_media_player
                                - *get_entity_id_from_event_or_trigger
                                - variables:
                                    wait_completed: false
                                    # Cross-iteration state for cheap-refresh logic. last_signature
                                    # is a content fingerprint of every field except media_position
                                    # (which is resynced separately and very cheaply). last_full_refresh
                                    # is the timestamp of the most recent full payload send, used by
                                    # the 60s safety net.
                                    last_signature: ''
                                    last_full_refresh: 0
                                - *variable_entity
                                - *entity_details_title_with_icon
                                - alias: Refresh page in a loop
                                  repeat:
                                    sequence:
                                      - condition:
                                          - '{{ nspanel_event is defined }}'
                                          - '{{ nspanel_event.entity is defined }}'
                                          - '{{ nspanel_event.entity is string }}'
                                          - '{{ nspanel_event.entity | length > 0 }}'
                                          - '{{ nspanel_event.entity is match "media_player." }}'
                                      - action: homeassistant.update_entity
                                        data:
                                          entity_id: '{{ nspanel_event.entity }}'
                                        continue_on_error: true
                                      - delay:
                                          milliseconds: '{{ media_player_update_delay }}'
                                      # All values of an iteration in a single template, so the loop holds one template here
                                      # instead of one per value (issue #657).
                                      # - Media player groups don't expose correct supported_features, so we override with a known-good mask:
                                      #   PAUSE(1) + VOLUME_SET(4) + VOLUME_MUTE(8) + PREVIOUS_TRACK(16) + NEXT_TRACK(32) + TURN_ON(128) +
                                      #   TURN_OFF(256) + PLAY_MEDIA(512) + STOP(4096) + PLAY(16384) = 21437
                                      # - Title and artist are sanitized once for both the signature and the payload.
                                      # - `signature` is a content fingerprint covering everything the ESPHome lambda
                                      #   conditions UI writes on, EXCEPT media_position (resynced
                                      #   cheaply between full refreshes). Order is fixed; '|' is a
                                      #   safe separator since none of the fields can contain it
                                      #   except free-text title/artist — and even if they do, a
                                      #   collision only causes a missed cheap-path optimization,
                                      #   not incorrect UI state (the 60s safety net catches it).
                                      - variables:
                                          media_player: >-
                                            {%- set title = state_attr(entity_id, "media_title") -%}
                                            {%- set artist = state_attr(entity_id, "media_artist") -%}
                                            {%- set updated_at = state_attr(entity_id, "media_position_updated_at") -%}
                                            {%- set now_ts = now() | as_timestamp -%}
                                            {%- set mp = {
                                                  "state": states(entity_id),
                                                  "is_volume_muted": state_attr(entity_id, "is_volume_muted"),
                                                  "volume_level": (state_attr(entity_id, "volume_level") | round(2, default=0) * 100) | int(0),
                                                  "media_title": title
                                                                 if title is string and title | length > 0 and title not in enum.states.unknown
                                                                 else "",
                                                  "media_artist": artist
                                                                  if artist is string and artist | length > 0 and artist not in enum.states.unknown
                                                                  else "",
                                                  "media_duration": state_attr(entity_id, "media_duration") | int(0),
                                                  "media_position": state_attr(entity_id, "media_position") | int(0),
                                                  "media_position_delta":
                                                    ((now_ts - (updated_at | as_timestamp | default(now_ts, true))) | round(0) | int)
                                                    if updated_at not in [None, "", "unknown", "unavailable", false, 0]
                                                    else 0,
                                                  "supported_features":
                                                    (1+4+8+16+32+128+256+512+4096+16384)
                                                    if (state_attr(entity_id, "mass_player_type") | default("")) == "group"
                                                    else state_attr(entity_id, "supported_features") | int(0),
                                                  "now_ts": now_ts | int
                                                } -%}
                                            {%- set signature = [mp.state, mp.is_volume_muted, mp.volume_level, mp.media_title, mp.media_artist,
                                                                 mp.media_duration, mp.supported_features] | join("|") -%}
                                            {{ dict(mp, signature=signature,
                                                    needs_full_refresh=signature != last_signature or (mp.now_ts - last_full_refresh) >= 60) }}
                                      # Branch: full refresh when content changed or safety-net
                                      # cadence elapsed; otherwise cheap component_val resync of
                                      # prg_current only (skipped entirely when nothing to track).
                                      # NOTE: prg_current clamp here MUST mirror the C++ clamp in
                                      # nspanel_esphome_page_media_player.yaml (capped_pos logic).
                                      # If you change one, change the other.
                                      - choose:
                                          - conditions: '{{ media_player.needs_full_refresh }}'
                                            sequence:
                                              - action: 'esphome.{{ action_prefix }}_page_media_player'
                                                # A single template for all fields keeps the title and artist as text: rendered as separate fields,
                                                # Home Assistant would parse a title such as `1.00` into the number 1.0.
                                                data: >-
                                                  {{
                                                    {
                                                      "entity": entity_id,
                                                      "state": media_player.state if media_player.state is string else "",
                                                      "is_volume_muted": media_player.is_volume_muted if media_player.is_volume_muted is boolean else false,
                                                      "volume_level": media_player.volume_level,
                                                      "media_title": media_player.media_title,
                                                      "media_artist": media_player.media_artist,
                                                      "media_duration": media_player.media_duration,
                                                      "media_position": media_player.media_position,
                                                      "media_position_delta": media_player.media_position_delta,
                                                      "supported_features": media_player.supported_features
                                                    }
                                                  }}
                                                continue_on_error: true
                                              - variables:
                                                  last_signature: '{{ media_player.signature }}'
                                                  last_full_refresh: '{{ media_player.now_ts }}'
                                          - conditions: '{{ media_player.media_duration > 0 and media_player.state == "playing" }}'
                                            sequence:
                                              - action: 'esphome.{{ action_prefix }}_component_val'
                                                data:
                                                  page: media_player
                                                  id: prg_current
                                                  val: >-
                                                    {%- set pos = [[media_player.media_position, 0] | max, media_player.media_duration] | min -%}
                                                    {%- set delta = [media_player.media_position_delta, 0] | max -%}
                                                    {{ pos + [delta, media_player.media_duration - pos] | min }}
                                                continue_on_error: true
                                      - wait_template: '{{ states(currentpage) != pages.media_player }}'
                                        timeout:
                                          milliseconds: '{{ media_player_update_interval }}'
                                        continue_on_timeout: true
                                      - variables:
                                          wait_completed: '{{ wait.completed and media_player.media_duration > 0 }}'
                                    until:
                                      - or:
                                          - '{{ nspanel_event is not defined }}'
                                          - '{{ nspanel_event.entity is not defined }}'
                                          - '{{ wait_completed }}'
                                          - '{{ states(currentpage) != pages.media_player }}'  # Don't replace this by pages.current as this have to be evaluated all the time
                                          - '{{ nspanel_event.type != "page_changed" }}'
                            - alias: Alarm settings page
                              conditions:
                                - '{{ current_page_from_sensor == pages.alarm }}'
                                - '{{ repeat.index == 1 or original_state.entity_domain in page_entity_domains.get(current_page_from_sensor, []) }}'
                              sequence: &refresh_page_alarm
                                - *get_entity_id_from_event_or_trigger
                                - variables:
                                    alarm_entity: >
                                      {{
                                        entity_id
                                        if (
                                          entity_id is string
                                          and entity_id.split(".") | count == 2
                                          and entity_id.split(".")[0] == "alarm_control_panel"
                                        )
                                        else None
                                      }}
                                - alias: Alarm settings page - update
                                  if: '{{ alarm_entity is string and alarm_entity is match "alarm_control_panel." }}'
                                  then:
                                    - variables:
                                        entity_id: '{{ alarm_entity }}'
                                        supported_features: '{{ state_attr(entity_id, "supported_features") | default(0) }}'
                                    - condition: '{{ supported_features > 0 }}'
                                    - *variable_entity
                                    - *entity_details_title_with_icon
                                    - variables:  # https://github.com/home-assistant/core/blob/dev/homeassistant/components/alarm_control_panel/const.py
                                        alarm:
                                          code_format: '{{ state_attr(entity_id, "code_format") }}'
                                          code_arm_required: '{{ state_attr(entity_id, "code_arm_required") | default(true) }}'
                                    - action: 'esphome.{{ action_prefix }}_page_alarm'
                                      data:
                                        state: '{{ entity_state }}'
                                        supported_features: '{{ supported_features }}'
                                        code_format: '{{ alarm.code_format if alarm.code_format else "none" }}'
                                        code_arm_required: '{{ alarm.code_arm_required if alarm.code_arm_required else false }}'
                                        entity: '{{ entity_id }}'
                                      continue_on_error: true
                            - alias: Climate page
                              conditions:
                                - '{{ current_page_from_sensor == pages.climate }}'
                                - '{{ repeat.index == 1 or original_state.entity_domain in page_entity_domains.get(current_page_from_sensor, []) }}'
                              sequence: &refresh_page_climate
                                - *get_entity_id_from_event_or_trigger
                                - variables:
                                    climate_entity: >
                                      {{
                                        entity_id
                                        if (
                                          entity_id is string
                                          and entity_id.split(".") | count == 2
                                          and entity_id.split(".")[0] == "climate"
                                        )
                                        else climate
                                      }}
                                    settings_entity_domain: >
                                      {{
                                        climate_entity.split(".")[0]
                                        if
                                          climate_entity is defined and
                                          climate_entity is string and
                                          (climate_entity == "embedded_climate" or climate_entity.split(".") | count == 2)
                                        else "unknown"
                                      }}
                                    hvac_modes: '{{ state_attr(climate_entity, "hvac_modes") if settings_entity_domain == "climate" }}'
                                    friendly_name_raw: '{{ state_attr(climate_entity, "friendly_name") }}'
                                    friendly_name: >-
                                      {%- if
                                            details_overlap is defined and
                                            details_overlap.name is string and
                                            details_overlap.name | length > 0 and
                                            (
                                              "embedded_climate"
                                              if climate_entity == thermostat_embedded
                                              else climate_entity
                                            ) == original_state.entity_id
                                      -%}
                                        {{ details_overlap.name }}
                                      {%- else -%}
                                        {{ friendly_name_raw if friendly_name_raw and friendly_name_raw is string else "" }}
                                      {%- endif -%}
                                - if:
                                    - '{{ page_constructor }}'
                                    - '{{ not embedded_climate }}'
                                    - '{{ nspanel_event is defined }}'
                                    - '{{ nspanel_event.page is defined }}'
                                    - '{{ nspanel_event.page == pages.climate }}'
                                    - '{{ climate_entity is defined }}'
                                  then:
                                    # The page is always reached through `entity_details_show`, which has already
                                    # set `back_page_id` to the calling page. An empty `back_page` keeps it, so
                                    # closing the page returns to the caller instead of jumping to the home page.
                                    - action: 'esphome.{{ action_prefix }}_entity_details_show'
                                      data:
                                        entity: '{{ climate_entity }}'
                                        back_page: ""
                                      continue_on_error: true
                                    - *delay_default

                                - condition: '{{ settings_entity_domain == "climate" }}'
                                - action: 'esphome.{{ action_prefix }}_component_text_list'
                                  data:
                                    page: mem
                                    id: command
                                    txt_list:
                                      - 'page_label.txt="{{ friendly_name | replace("\\", "\\\\") | replace("\"", "\\\"") }}"'
                                  continue_on_error: true
                                - *delay_default

                                ##### Values #####
                                - &variables-climate_page
                                  variables:
                                    climate_page_entities:
                                      - entity: !input 'climate_value01'
                                        icon: !input 'climate_value01_icon'
                                        icon_color_rgb: !input 'climate_value01_icon_color'
                                        label_color_rgb: !input 'climate_value01_label_color'
                                        page: climate
                                        component: value01
                                      - entity: !input 'climate_value02'
                                        icon: !input 'climate_value02_icon'
                                        icon_color_rgb: !input 'climate_value02_icon_color'
                                        label_color_rgb: !input 'climate_value02_label_color'
                                        page: climate
                                        component: value02
                                      - entity: !input 'climate_value03'
                                        icon: !input 'climate_value03_icon'
                                        icon_color_rgb: !input 'climate_value03_icon_color'
                                        label_color_rgb: !input 'climate_value03_label_color'
                                        page: climate
                                        component: value03
                                      - entity: !input 'climate_value04'
                                        icon: !input 'climate_value04_icon'
                                        icon_color_rgb: !input 'climate_value04_icon_color'
                                        label_color_rgb: !input 'climate_value04_label_color'
                                        page: climate
                                        component: value04
                                - repeat:
                                    for_each: >
                                      {{
                                        climate_page_entities
                                        | selectattr("entity", "defined")
                                        | rejectattr("entity", "eq", "")
                                        | rejectattr("entity", "eq", [])
                                        | list
                                      }}
                                    sequence:
                                      - *display_value
                                      - if: '{{ repeat.item.label_color_rgb != [200, 204, 200] }}'
                                        then:
                                          - variables:
                                              label_color_rgb565: >-
                                                {{
                                                  int(
                                                        ((repeat.item.label_color_rgb[0] //(2**3)) *(2**11)) +
                                                        ((repeat.item.label_color_rgb[1] //(2**2)) *(2**5)) +
                                                        ((repeat.item.label_color_rgb[2] //(2**3)))
                                                      )
                                                  if repeat.item.label_color_rgb is list and repeat.item.label_color_rgb | count == 3
                                                  else 52857
                                                }}
                                          - action: 'esphome.{{ action_prefix }}_component_text_list'
                                            data:
                                              page: mem
                                              id: command
                                              txt_list:
                                                - '{{ repeat.item.component }}.pco={{ label_color_rgb565 }}'
                                                - '{{ repeat.item.component }}_icon.pco={{ label_color_rgb565 }}'
                                            continue_on_error: true
                                          - *delay_default

                                ##### Slider & climate values #####
                                - &climate-update_slider
                                  if: '{{ not (climate_entity == climate and embedded_climate) }}'
                                  then:
                                    # `hvac_modes` updates the variable of the enclosing sequence, read by the climate buttons
                                    - variables:
                                        hvac_modes: '{{ state_attr(climate_entity, "hvac_modes") }}'
                                    - action: 'esphome.{{ action_prefix }}_page_climate'
                                      # All values in a single template, so each copy of this block holds one template here
                                      # instead of one per value (issue #657)
                                      data: >-
                                        {%- set supported_features = state_attr(climate_entity, "supported_features") | int(0) -%}
                                        {%- set target_temp_step = state_attr(climate_entity, "target_temp_step") -%}
                                        {%- if not is_number(target_temp_step) -%}
                                          {%- set target_temp_step = state_attr(climate_entity, "target_temperature_step") -%}
                                        {%- endif -%}
                                        {%- set target_temp_step = target_temp_step | float(0.5) | abs -%}
                                        {%- set temp_step = ((10 * target_temp_step) | round(0) | int)
                                                            if is_number(target_temp_step) and target_temp_step > 0 else 10 -%}
                                        {%- set temp_offset_raw = (state_attr(climate_entity, "min_temp") | float(7) * 10) | round(0) | int -%}
                                        {%- set temp_offset = temp_offset_raw if (temp_offset_raw % temp_step) == 0
                                                              else temp_offset_raw + temp_step - (temp_offset_raw % temp_step) -%}
                                        {%- set max_temp = (state_attr(climate_entity, "max_temp") | float(35) * 10) | round(0) | int -%}
                                        {%- set climate_state = states(climate_entity) | default("unavailable")
                                                                if climate_entity is string else "unavailable" -%}
                                        {%- set hvac_action = state_attr(climate_entity, "hvac_action") | default("") -%}
                                        {%- set climate_action = hvac_action
                                                                 if hvac_action and hvac_action not in enum.states.unknown
                                                                 else climate_state -%}
                                        {%- if "off" in climate_action -%}
                                          {%- set climate_icon = "\uFFFF" -%}{#- blank -#}
                                        {%- elif "heat_cool" in climate_action -%}
                                          {%- set climate_icon = "\uE069" -%}{#- mdi:autorenew -#}
                                        {%- elif "heating" in climate_action or "heat" in climate_action -%}
                                          {%- set climate_icon = "\uE50F" -%}{#- mdi:thermometer-lines -#}
                                        {%- elif "cooling" in climate_action or "cool" in climate_action -%}
                                          {%- set climate_icon = "\uE716" -%}{#- mdi:snowflake -#}
                                        {%- elif "drying" in climate_action or "dry" in climate_action -%}
                                          {%- set climate_icon = "\uE58D" -%}{#- mdi:water-percent -#}
                                        {%- elif "fan" in climate_action or "fan_only" in climate_action -%}
                                          {%- set climate_icon = "\uE20F" -%}{#- mdi:fan -#}
                                        {%- elif "auto" in climate_action -%}
                                          {%- set climate_icon = "\uF8F1" -%}{#- mdi:refresh-auto -#}
                                        {%- elif "idle" in climate_action -%}
                                          {%- set climate_icon = "\uE50E" -%}{#- mdi:thermometer -#}
                                        {%- else -%}
                                          {%- set climate_icon = "\uFFFF" -%}{#- blank -#}
                                        {%- endif -%}
                                        {{
                                          {
                                            "current_temp": state_attr(climate_entity, "current_temperature") | float(-999) | round(1),
                                            "supported_features": supported_features,
                                            "target_temp": state_attr(climate_entity, "temperature") | float(-999) | round(1)
                                                           if supported_features | bitwise_and(1) > 0 else -999,
                                            "target_temp_high": state_attr(climate_entity, "target_temp_high") | float(-999) | round(1)
                                                                if supported_features | bitwise_and(2) > 0 else -999,
                                            "target_temp_low": state_attr(climate_entity, "target_temp_low") | float(-999) | round(1)
                                                               if supported_features | bitwise_and(2) > 0 else -999,
                                            "temp_step": temp_step,
                                            "total_steps": (((max_temp - temp_offset) / temp_step) | int)
                                                           if max_temp >= temp_offset and temp_step > 0 else 0,
                                            "temp_offset": temp_offset,
                                            "climate_icon": climate_icon,
                                            "entity": "embedded_climate" if climate_entity == thermostat_embedded else climate_entity
                                          }
                                        }}
                                      continue_on_error: true
                                    - *delay_default

                                ##### Climate buttons #####
                                - &climate-update_buttons
                                  if: '{{ not (climate_entity == climate and embedded_climate) }}'
                                  then:
                                    - repeat:
                                        for_each: '{{ page_climate.buttons.hvac_mode }}'
                                        sequence:
                                          - condition: '{{ repeat.item.mode in hvac_modes }}'
                                          ### ICON Font Color ###
                                          - action: 'esphome.{{ action_prefix }}_component_color'
                                            data:
                                              page: climate
                                              id: '{{ repeat.item.component }}'
                                              color: >
                                                {{
                                                  nextion.color[repeat.item.color]
                                                  if states(climate_entity) == repeat.item.mode
                                                  else nextion.color.disabled
                                                }}
                                            continue_on_error: true
                                          - *delay_default
                                          ### ICON Font ###
                                          - action: 'esphome.{{ action_prefix }}_component_text_list'
                                            data:
                                              page: mem
                                              id: command
                                              txt_list:
                                                - '{{ repeat.item.component }}.txt="{{ (special_icons[(repeat.item.icon)] if (repeat.item.icon) in special_icons
                                                  else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (repeat.item.icon) ~ ",")].count(",")))
                                                  if ("," ~ (repeat.item.icon) ~ ",") in all_icon_names
                                                  else "") }}"'
                                                - 'vis {{ repeat.item.component }},1'
                                            continue_on_error: true
                                          - *delay_default

                                ##### Preset mode #####
                                - &climate-update_preset
                                  # The embedded thermostat is drawn by ESPHome, which also builds its preset
                                  # picker, so the picker keeps working with the API disconnected.
                                  if: '{{ climate_entity != thermostat_embedded }}'
                                  then:
                                    - variables:
                                        preset_modes_attr: '{{ state_attr(climate_entity, "preset_modes") }}'
                                        current_preset_mode_raw: '{{ state_attr(climate_entity, "preset_mode") }}'
                                    - variables:
                                        preset_modes_raw: >
                                          {{
                                            preset_modes_attr
                                            if
                                              state_attr(climate_entity, "supported_features") | int(0) | bitwise_and(16) > 0 and
                                              preset_modes_attr is defined and
                                              preset_modes_attr is iterable and
                                              preset_modes_attr is not string
                                            else []
                                          }}
                                        current_preset_mode: >-
                                          {{
                                            current_preset_mode_raw | trim
                                            if current_preset_mode_raw is defined and current_preset_mode_raw is string and current_preset_mode_raw | length > 0
                                            else ""
                                          }}
                                        # Options and button visibility are pushed on construction, and on updates only when the
                                        # preset support or list changes, or when the active preset changes while the list is
                                        # truncated (the active preset must stay among the retained options).
                                        preset_refresh: >-
                                          {%- if page_constructor -%}
                                            true
                                          {%- else -%}
                                            {#- Only state_changed events carry old_state; the details refresh loop runs from the panel event #}
                                            {%- set old_state = (
                                              trigger.event.data.old_state
                                              if trigger is defined and trigger.event is defined and trigger.event.data is defined and trigger.event.data.old_state is defined
                                              else none
                                            ) -%}
                                            {#- No previous state to compare against: push the options again #}
                                            {%- if old_state is none -%}
                                              true
                                            {%- else -%}
                                              {%- set old_supported = old_state.attributes.get("supported_features", 0) | int(0) | bitwise_and(16) > 0 -%}
                                              {%- set new_supported = state_attr(climate_entity, "supported_features") | int(0) | bitwise_and(16) > 0 -%}
                                              {{
                                                old_supported != new_supported
                                                or old_state.attributes.get("preset_modes") != preset_modes_attr
                                                or (preset_modes_raw | length > 32 and old_state.attributes.get("preset_mode") != current_preset_mode_raw)
                                              }}
                                            {%- endif -%}
                                          {%- endif -%}

                                    ##### Construction and preset list changes: push options + show preset button #####
                                    - if: '{{ preset_refresh }}'
                                      then:
                                        - if: '{{ preset_modes_raw | length > 0 }}'
                                          then:
                                            - variables:
                                                # The picker pages through up to 32 options; a supported current preset is always included
                                                preset_modes_truncated: >
                                                  {%- if preset_modes_raw | length <= 32 -%}
                                                    {{ preset_modes_raw }}
                                                  {%- elif
                                                    current_preset_mode | length == 0 or
                                                    current_preset_mode not in preset_modes_raw or
                                                    current_preset_mode in preset_modes_raw[:32]
                                                  -%}
                                                    {{ preset_modes_raw[:32] }}
                                                  {%- else -%}
                                                    {{ [current_preset_mode] + (preset_modes_raw[:31] | reject("equalto", current_preset_mode) | list) }}
                                                  {%- endif -%}
                                            - action: 'esphome.{{ action_prefix }}_component_text_list'
                                              data:
                                                page: mem
                                                id: popup_select_context
                                                txt_list:
                                                  - 'climate_preset_mode'
                                              continue_on_error: true
                                            - *delay_default
                                            - action: 'esphome.{{ action_prefix }}_component_val'
                                              data:
                                                page: mem
                                                id: popup_select_mode
                                                val: 0
                                              continue_on_error: true
                                            - *delay_default
                                            - action: 'esphome.{{ action_prefix }}_component_text_list'
                                              data:
                                                page: mem
                                                id: popup_select_options
                                                txt_list: '{{ preset_modes_truncated }}'
                                              continue_on_error: true
                                            - *delay_default
                                        - action: 'esphome.{{ action_prefix }}_components_visibility'
                                          data:
                                            page: climate
                                            ids:
                                              - preset_button
                                            visible: '{{ preset_modes_raw | length > 0 }}'
                                          continue_on_error: true
                                        - *delay_default

                                    ##### Always (construction and updates): push current preset_mode #####
                                    # Read the active preset again right before writing it. The automation runs in parallel mode, so
                                    # a newer state change may already have been pushed while this run sent the options above.
                                    - variables:
                                        preset_mode_now: >-
                                          {%- set preset_mode_attr = state_attr(climate_entity, "preset_mode") -%}
                                          {{ preset_mode_attr | trim if preset_mode_attr is string and preset_mode_attr | length > 0 else "" }}
                                    - if: '{{ preset_modes_raw | length > 0 }}'
                                      then:
                                        - action: 'esphome.{{ action_prefix }}_component_text_list'
                                          data:
                                            page: mem
                                            id: popup_select_current
                                            txt_list:
                                              - '{{ preset_mode_now }}'
                                          continue_on_error: true
                                        - *delay_default

                                        ##### Always: show the active preset on the preset button #####
                                        # Standard presets get the icon Home Assistant uses for them; no preset or a
                                        # custom one keeps the generic icon. The font color marks whether a preset is
                                        # active, using the display theme colors. This also clears the press color.
                                        - action: 'esphome.{{ action_prefix }}_component_text_list'
                                          data:
                                            page: mem
                                            id: command
                                            txt_list: >-
                                              {%- set preset_icons = {
                                                "home": "home",
                                                "away": "account-arrow-right",
                                                "boost": "rocket-launch",
                                                "comfort": "sofa",
                                                "eco": "leaf",
                                                "sleep": "bed",
                                                "activity": "motion-sensor"
                                              } -%}
                                              {%- set preset = preset_mode_now | lower -%}
                                              {%- set preset_active = preset | length > 0 and preset != "none" -%}
                                              {{
                                                [
                                                  'preset_button.txt="' ~ (special_icons[(preset_icons.get(preset, "tune-variant"))] if (preset_icons.get(preset, "tune-variant")) in special_icons
                                                    else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (preset_icons.get(preset, "tune-variant")) ~ ",")].count(",")))
                                                    if ("," ~ (preset_icons.get(preset, "tune-variant")) ~ ",") in all_icon_names
                                                    else "") ~ '"',
                                                  "preset_button.pco=" ~ ("color_pco_main" if preset_active else "color_pco_secondary")
                                                ]
                                              }}
                                          continue_on_error: true
                                        - *delay_default

                                - &climate_custom_buttons
                                  alias: Climate custom buttons
                                  sequence:
                                    - &climate_custom_buttons_variables
                                      variables:
                                        climate_custom_buttons:
                                          - entity: !input climate_button08
                                            icon: !input climate_button08_icon
                                            icon_color_rgb: !input climate_button08_icon_color
                                            component: button08
                                          - entity: !input climate_button09
                                            icon: !input climate_button09_icon
                                            icon_color_rgb: !input climate_button09_icon_color
                                            component: button09
                                    - &climate_custom_buttons_update
                                      repeat:
                                        for_each: '{{ climate_custom_buttons | selectattr("entity", "defined") | rejectattr("entity", "eq", []) | list }}'
                                        sequence:
                                          - condition: '{{ repeat.item.entity is defined and repeat.item.entity is string and repeat.item.entity | length > 0 }}'
                                          - variables:
                                              entity_id: '{{ repeat.item.entity }}'
                                              overlap:
                                                icon: >
                                                  {{
                                                    repeat.item.icon
                                                    if
                                                      repeat.item.icon is defined and
                                                      repeat.item.icon is string and
                                                      repeat.item.icon | length > 0 and
                                                      repeat.item.icon is match "mdi:" and
                                                      ((repeat.item.icon.split("mdi:") | last) in special_icons or ("," ~ (repeat.item.icon.split("mdi:") | last) ~ ",") in all_icon_names)
                                                    else
                                                      None
                                                  }}
                                                icon_color: '{{ repeat.item.icon_color_rgb }}'
                                          - *variable_entity
                                          # Climate custom buttons are icon-only: a single text component
                                          # with no `pic`/`bri`/`text` siblings, always toggle, no long
                                          # click and no detail page. They still go through the shared
                                          # `button` action (with `icon_only`) so that every per-entity
                                          # button is rendered by one code path.
                                          - action: 'esphome.{{ action_prefix }}_button'
                                            data:
                                              page: '{{ pages.climate }}'
                                              id: '{{ repeat.item.component }}'
                                              state: false
                                              icon: '{{ entity.icon }}'
                                              icon_color: >
                                                {{
                                                  entity.icon_color
                                                  if entity.icon_color is defined
                                                      and entity.icon_color is list
                                                      and entity.icon_color | count == 3
                                                  else [200, 200, 200]
                                                }}
                                              icon_font: 0     # Unused while `icon_only` is set: the font is fixed on the TFT
                                              bri: ""
                                              label: ""
                                              is_page_render: false
                                              icon_only: true
                                              available: '{{ entity_state not in ["unavailable"] }}'
                                            continue_on_error: true
                                          - *delay_default
                            - alias: Button page
                              conditions:
                                - '{{ current_page_from_sensor == pages.button }}'
                                - '{{ repeat.index == 1 or original_state.entity_domain in page_entity_domains.get(current_page_from_sensor, []) }}'
                              sequence: &refresh_page_button
                                - *get_entity_id_from_event_or_trigger
                                - condition:
                                    - '{{ entity_id is defined }}'
                                    - '{{ entity_id is string }}'
                                    - '{{ entity_id.split(".") | count == 2 }}'
                                    - '{{ entity_id.split(".")[0] in ["button", "input_button"] }}'
                                - *variable_entity
                                - condition: '{{ entity is defined }}'
                                - *entity_details_title_with_icon
                                - if: '{{ entity.icon is defined and entity.icon is string and entity.icon | length > 0 }}'
                                  then:
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: ""
                                        id: icon
                                        txt_list:
                                          - '{{ entity.icon }}'
                                      continue_on_error: true
                                    - *delay_default
                                - action: 'esphome.{{ action_prefix }}_component_val'
                                  data:
                                    page: ""
                                    id: state
                                    val: '{{ -1 if is_state(entity_id, "unavailable") else 0 }}'
                                  continue_on_error: true
                                - *delay_default
                                - action: 'esphome.{{ action_prefix }}_component_text_list'
                                  data:
                                    page: mem
                                    id: command
                                    txt_list:
                                      - 'render.en=1'
                                  continue_on_error: true
                            - alias: Switch page
                              conditions:
                                - '{{ current_page_from_sensor == pages.switch }}'
                                - '{{ repeat.index == 1 or original_state.entity_domain in page_entity_domains.get(current_page_from_sensor, []) }}'
                              sequence: &refresh_page_switch
                                - *get_entity_id_from_event_or_trigger
                                - condition:
                                    - '{{ entity_id is defined }}'
                                    - '{{ entity_id is string }}'
                                    - '{{ entity_id.split(".") | count == 2 }}'
                                    - '{{ entity_id.split(".")[0] in ["switch", "input_boolean"] }}'
                                - *variable_entity
                                - condition: '{{ entity is defined }}'
                                - *entity_details_title_with_icon
                                - *delay_default
                                - action: 'esphome.{{ action_prefix }}_component_val'
                                  data:
                                    page: ""
                                    id: state
                                    val: >
                                      {{
                                        1
                                        if is_state(entity_id, "on")
                                        else (
                                          0
                                          if is_state(entity_id, "off")
                                          else -1
                                        )
                                      }}
                                  continue_on_error: true
                                - *delay_default
                                - action: 'esphome.{{ action_prefix }}_component_text_list'
                                  data:
                                    page: mem
                                    id: command
                                    txt_list:
                                      - 'render.en=1'
                                  continue_on_error: true
                            - alias: Water Heater page
                              conditions:
                                - '{{ current_page_from_sensor == pages.water_heater }}'
                                - '{{ repeat.index == 1 or original_state.entity_domain in page_entity_domains.get(current_page_from_sensor, []) }}'
                              sequence: &refresh_page_water_heater
                                - &variables_water_heater_entity
                                  variables:
                                    water_heater_entity_temp: >
                                      {{
                                        nspanel_event.entity
                                        if
                                          nspanel_event is defined and
                                          nspanel_event.entity is defined and
                                          nspanel_event.entity is string and
                                          nspanel_event.entity | length > 1
                                        else (trigger.entity_id if trigger.entity_id is defined else ((trigger.event | default({})).get('data') or {}).get('entity_id'))
                                      }}
                                    water_heater_entity: >
                                      {{
                                        water_heater_entity_temp
                                        if
                                          water_heater_entity_temp is string and
                                          water_heater_entity_temp | length > 0 and
                                          water_heater_entity_temp != "embedded_climate"
                                        else ""
                                      }}
                                    settings_entity_domain: >
                                      {{
                                        water_heater_entity.split(".")[0]
                                        if
                                          water_heater_entity is defined and
                                          water_heater_entity is string and
                                          water_heater_entity.split(".") | count == 2
                                        else "unknown"
                                      }}
                                    operation_list: >
                                      {{
                                        state_attr(water_heater_entity, "operation_list") | default([], true)
                                        if settings_entity_domain == "water_heater"
                                        else []
                                      }}
                                    # Humidifiers (and dehumidifiers) are shown on this page too, with humidity instead of temperature
                                    is_humidifier: '{{ settings_entity_domain == "humidifier" }}'
                                    friendly_name_raw: '{{ state_attr(water_heater_entity, "friendly_name") }}'
                                    friendly_name: >-
                                      {%- if
                                            details_overlap is defined and
                                            details_overlap.name is string and
                                            details_overlap.name | length > 0 and
                                            water_heater_entity == original_state.entity_id
                                      -%}
                                        {{ details_overlap.name }}
                                      {%- else -%}
                                        {{ friendly_name_raw if friendly_name_raw and friendly_name_raw is string else "" }}
                                      {%- endif -%}

                                - condition: '{{ settings_entity_domain in ["water_heater", "humidifier"] }}'
                                - action: 'esphome.{{ action_prefix }}_component_text_list'
                                  data:
                                    page: ""
                                    id: page_label
                                    txt_list:
                                      - '{{ friendly_name }}'
                                  continue_on_error: true
                                - *delay_default

                                ##### Values #####
                                - &variables_water_heater_page
                                  variables:
                                    water_heater_page_entities:
                                      - entity: !input water_heater_value01
                                        icon: !input water_heater_value01_icon
                                        icon_color_rgb: !input water_heater_value01_icon_color
                                        label_color_rgb: !input water_heater_value01_label_color
                                        page: water_heater
                                        component: value01
                                      - entity: !input water_heater_value02
                                        icon: !input water_heater_value02_icon
                                        icon_color_rgb: !input water_heater_value02_icon_color
                                        label_color_rgb: !input water_heater_value02_label_color
                                        page: water_heater
                                        component: value02
                                      - entity: !input water_heater_value03
                                        icon: !input water_heater_value03_icon
                                        icon_color_rgb: !input water_heater_value03_icon_color
                                        label_color_rgb: !input water_heater_value03_label_color
                                        page: water_heater
                                        component: value03
                                      - entity: !input water_heater_value04
                                        icon: !input water_heater_value04_icon
                                        icon_color_rgb: !input water_heater_value04_icon_color
                                        label_color_rgb: !input water_heater_value04_label_color
                                        page: water_heater
                                        component: value04
                                - &variables_humidifier_page
                                  variables:
                                    humidifier_page_entities:
                                      - entity: !input humidifier_value01
                                        icon: !input humidifier_value01_icon
                                        icon_color_rgb: !input humidifier_value01_icon_color
                                        label_color_rgb: !input humidifier_value01_label_color
                                        page: water_heater
                                        component: value01
                                      - entity: !input humidifier_value02
                                        icon: !input humidifier_value02_icon
                                        icon_color_rgb: !input humidifier_value02_icon_color
                                        label_color_rgb: !input humidifier_value02_label_color
                                        page: water_heater
                                        component: value02
                                      - entity: !input humidifier_value03
                                        icon: !input humidifier_value03_icon
                                        icon_color_rgb: !input humidifier_value03_icon_color
                                        label_color_rgb: !input humidifier_value03_label_color
                                        page: water_heater
                                        component: value03
                                      - entity: !input humidifier_value04
                                        icon: !input humidifier_value04_icon
                                        icon_color_rgb: !input humidifier_value04_icon_color
                                        label_color_rgb: !input humidifier_value04_label_color
                                        page: water_heater
                                        component: value04
                                - repeat:
                                    for_each: >
                                      {{
                                        (humidifier_page_entities if is_humidifier else water_heater_page_entities)
                                        | selectattr("entity", "defined")
                                        | rejectattr("entity", "eq", "")
                                        | rejectattr("entity", "eq", [])
                                        | list
                                      }}
                                    sequence:
                                      - *display_value
                                      - variables:
                                          var_icon: >
                                            {{
                                              (special_icons[(repeat.item.icon.split("mdi:") | last)] if (repeat.item.icon.split("mdi:") | last) in special_icons
                                                else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (repeat.item.icon.split("mdi:") | last) ~ ",")].count(",")))
                                                if ("," ~ (repeat.item.icon.split("mdi:") | last) ~ ",") in all_icon_names
                                                else "")
                                              if
                                                repeat.item.icon is defined and
                                                repeat.item.icon is string and
                                                ((repeat.item.icon.split("mdi:") | last) in special_icons or ("," ~ (repeat.item.icon.split("mdi:") | last) ~ ",") in all_icon_names)
                                              else False
                                            }}
                                      - if: '{{ var_icon != False }}'
                                        then:
                                          - action: 'esphome.{{ action_prefix }}_component_text_list'
                                            data:
                                              page: '{{ repeat.item.page }}'
                                              id: '{{ repeat.item.component }}_icon'
                                              txt_list:
                                                - '{{ var_icon }}'
                                            continue_on_error: true
                                          - *delay_default
                                      - if: '{{ repeat.item.label_color_rgb != [200, 204, 200] }}'
                                        then:
                                          - action: 'esphome.{{ action_prefix }}_component_color'
                                            data:
                                              page: '{{ repeat.item.page }}'
                                              id: '{{ repeat.item.component }}'
                                              color: '{{ repeat.item.label_color_rgb }}'
                                            continue_on_error: true
                                          - *delay_default

                                ##### Slider & water heater values #####
                                - &water_heater_update_slider
                                  alias: water_heater_update_slider
                                  sequence:
                                    - variables:
                                        current_temp: >-
                                          {{
                                            state_attr(water_heater_entity, "current_humidity" if is_humidifier else "current_temperature")
                                            | float(-999) | round(1)
                                          }}
                                        supported_features: '{{ state_attr(water_heater_entity, "supported_features") | int(0) }}'
                                        # Humidifiers always have a target humidity, water heaters only with TARGET_TEMPERATURE (bit 1)
                                        is_target_temperature: '{{ is_humidifier or supported_features | bitwise_and(1) > 0 }}'
                                        target_temp: >-
                                          {{
                                            state_attr(water_heater_entity, "humidity" if is_humidifier else "temperature")
                                            | float(-999) | round(1)
                                            if is_target_temperature else -999
                                          }}
                                    - variables:
                                        is_target_temperature: '{{ is_target_temperature and target_temp > -999 }}'
                                        temp_step: >
                                          {% if is_humidifier %}
                                            {# humidifier.set_humidity only accepts whole percentages, so the dial steps by whole numbers #}
                                            {% set target_temp_step = state_attr(water_heater_entity, "target_humidity_step") | float(1) | abs | round(0) %}
                                          {% else %}
                                            {% set target_temp_step = state_attr(water_heater_entity, "target_temp_step") %}
                                            {% if not is_number(target_temp_step) %}
                                              {% set target_temp_step = state_attr(water_heater_entity, "target_temperature_step") %}
                                            {% endif %}
                                            {% set target_temp_step = target_temp_step | float(0.5) %}
                                          {% endif %}
                                          {# A step that rounds to zero would break the modulo below, so fall back to 1 unit #}
                                          {% set step10 = (10 * (target_temp_step | abs)) | round(0) | int(0) %}
                                          {{ step10 if step10 > 0 else 10 }}
                                        temp_offset_raw: >-
                                          {#- Limits are rounded inward, so the slider never offers a value outside the entity's range -#}
                                          {{
                                            (state_attr(water_heater_entity, "min_humidity" if is_humidifier else "min_temp")
                                              | float(0 if is_humidifier else 7) * 10)
                                            | round(3) | round(0, "ceil") | int
                                          }}
                                        temp_offset: '{{ temp_offset_raw if (temp_offset_raw % temp_step) == 0 else temp_offset_raw + temp_step - (temp_offset_raw % temp_step) }}'
                                        max_temp: >-
                                          {{
                                            (state_attr(water_heater_entity, "max_humidity" if is_humidifier else "max_temp")
                                              | float(100 if is_humidifier else 35) * 10)
                                            | round(3) | round(0, "floor") | int
                                          }}
                                        total_steps: >
                                          {{
                                            (((max_temp - temp_offset) / temp_step) | int)
                                            if max_temp >= temp_offset and temp_step > 0 else 0
                                          }}
                                        water_heater_state: '{{ states(water_heater_entity) | default("unavailable") if water_heater_entity is string else "unavailable" }}'
                                        operation_mode: '{{ state_attr(water_heater_entity, "operation_mode") | default(water_heater_state) }}'
                                        use_decimal: '{{ temp_step % 10 != 0 }}'
                                        temperature_units: !input temperature_unit
                                        slider_unit: '{{ "%" if is_humidifier else temperature_units }}'
                                        water_heater_icon: >
                                          {%- if is_humidifier -%}
                                            {%- set humidifier_mode = state_attr(water_heater_entity, "mode") -%}
                                            {%- if water_heater_state == "off" -%}
                                              {{ "\uF465" }}{# mdi:air-humidifier-off #}
                                            {%- elif humidifier_mode is string and humidifier_mode in page_humidifier.buttons.mode_icons -%}
                                              {{ (special_icons[(page_humidifier.buttons.mode_icons[humidifier_mode])] if (page_humidifier.buttons.mode_icons[humidifier_mode]) in special_icons
                                                else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (page_humidifier.buttons.mode_icons[humidifier_mode]) ~ ",")].count(",")))
                                                if ("," ~ (page_humidifier.buttons.mode_icons[humidifier_mode]) ~ ",") in all_icon_names
                                                else "") }}
                                            {%- else -%}
                                              {{ "\uF098" }}{# mdi:air-humidifier #}
                                            {%- endif -%}
                                          {%- else -%}
                                            {%- set icon_map = {
                                              'off': "\uF1B3",
                                              'on': "\uEF91",
                                              'eco': "\uE329",
                                              'electric': "\uF40A",
                                              'gas': "\uE237",
                                              'heat_pump': "\uFA42",
                                              'performance': "\uFA44",
                                              'high_demand': "\uE4C4"
                                            } -%}{#- mdi:water-boiler-off, mdi:water-boiler, mdi:leaf, mdi:lightning-bolt, mdi:fire, mdi:heat-pump, mdi:heat-wave, mdi:speedometer -#}
                                            {{ icon_map.get(operation_mode, "\uEF91") }}{# mdi:water-boiler #}
                                          {%- endif -%}
                                        current_temp_text: >
                                          {%- if current_temp > -999 -%}
                                            {{ (("%.1f" | format(current_temp)) if use_decimal else ("%.0f" | format(current_temp))) ~ ("" if compact_unit_display else " ") ~ slider_unit }}
                                          {%- else -%}
                                            {{ "_{_unavailable_}_" }}
                                          {%- endif -%}
                                        target_temp_text: >
                                          {%- if is_target_temperature -%}
                                            {{ (("%.1f" | format(target_temp)) if use_decimal else ("%.0f" | format(target_temp))) ~ ("" if compact_unit_display else " ") ~ slider_unit }}
                                          {%- else -%}

                                          {%- endif -%}
                                        slider_value: >
                                          {{ (((10 * target_temp) - temp_offset) / temp_step) | round(0) | int if is_target_temperature else 0 }}

                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: mem
                                        id: command
                                        txt_list:
                                          ##### Slider configuration #####
                                          - 'temp_unit.txt="{{ "" if compact_unit_display else " " }}{{ slider_unit }}"'
                                          - 'slider.maxval={{ total_steps }}'
                                          - 'temp_offset.val={{ temp_offset }}'
                                          - 'temp_step.val={{ temp_step }}'
                                          ##### Current temperature #####
                                          - 'current_temp.txt="{{ current_temp_text }}"'
                                      continue_on_error: true
                                    - *delay_default

                                    - alias: Target temp and slider
                                      if: '{{ is_target_temperature }}'
                                      then:
                                        - action: 'esphome.{{ action_prefix }}_component_text_list'
                                          data:
                                            page: mem
                                            id: command
                                            txt_list:
                                              - 'target.txt="{{ target_temp_text }}"'
                                              - 'slider.val={{ slider_value }}'
                                              - 'target_icon.txt="{{ water_heater_icon }}"'
                                              - 'vis slider,1'
                                              - 'vis target_icon,1'
                                              - 'vis decrease_temp,1'
                                              - 'vis increase_temp,1'
                                          continue_on_error: true
                                      else:
                                        - action: 'esphome.{{ action_prefix }}_component_text_list'
                                          data:
                                            page: mem
                                            id: command
                                            txt_list:
                                              - 'vis slider,0'
                                              - 'vis target_icon,0'
                                              - 'vis decrease_temp,0'
                                              - 'vis increase_temp,0'
                                          continue_on_error: true
                                    - *delay_default

                                ##### Water heater buttons #####
                                - &water_heater_update_buttons
                                  alias: water_heater_update_buttons
                                  sequence:
                                    - action: 'esphome.{{ action_prefix }}_components_visibility'
                                      data:
                                        page: water_heater
                                        ids: '{{ page_water_heater.buttons.operation_mode | map(attribute="component") | list }}'
                                        visible: false
                                      continue_on_error: true
                                    - *delay_default
                                    - variables:
                                        # Buttons to show, as {component, icon, color}
                                        page_buttons: >-
                                          {%- set ns = namespace(items=[]) -%}
                                          {%- if is_humidifier -%}
                                            {#- Modes are assigned to the buttons in the order the entity reports them -#}
                                            {%- set humidifier_mode = state_attr(water_heater_entity, "mode") -%}
                                            {%- set humidifier_is_on = is_state(water_heater_entity, "on") -%}
                                            {%- set humidifier_color = nextion.color.orange if is_state_attr(water_heater_entity, "device_class", "dehumidifier") else nextion.color.blue -%}
                                            {%- set available_modes = state_attr(water_heater_entity, "available_modes") -%}
                                            {%- set available_modes = available_modes[:page_humidifier.buttons.modes | count] if available_modes is list else [] -%}
                                            {%- for mode in available_modes -%}
                                              {%- set ns.items = ns.items + [{
                                                "component": page_humidifier.buttons.modes[loop.index0],
                                                "icon": page_humidifier.buttons.mode_icons.get(mode, page_humidifier.buttons.mode_icon_fallback),
                                                "color": humidifier_color if humidifier_is_on and mode == humidifier_mode else nextion.color.disabled
                                              }] -%}
                                            {%- endfor -%}
                                            {%- set ns.items = ns.items + [{
                                              "component": page_humidifier.buttons.power,
                                              "icon": "power",
                                              "color": humidifier_color if humidifier_is_on else nextion.color.disabled
                                            }] -%}
                                          {%- else -%}
                                            {%- for button in page_water_heater.buttons.operation_mode if button.mode in operation_list -%}
                                              {%- set ns.items = ns.items + [{
                                                "component": button.component,
                                                "icon": button.icon,
                                                "color": nextion.color[button.color] if operation_mode == button.mode else nextion.color.disabled
                                              }] -%}
                                            {%- endfor -%}
                                          {%- endif -%}
                                          {{ ns.items }}
                                    - repeat:
                                        for_each: '{{ page_buttons }}'
                                        sequence:
                                          - variables:
                                              color_rgb888: '{{ repeat.item.color }}'
                                              color_rgb565: >-
                                                {{
                                                  int(
                                                        ((color_rgb888[0] //(2**3)) *(2**11)) +
                                                        ((color_rgb888[1] //(2**2)) *(2**5)) +
                                                        ((color_rgb888[2] //(2**3)))
                                                      )
                                                }}

                                          - action: 'esphome.{{ action_prefix }}_component_text_list'
                                            data:
                                              page: mem
                                              id: command
                                              txt_list:
                                                - '{{ repeat.item.component }}.txt="{{ (special_icons[(repeat.item.icon)] if (repeat.item.icon) in special_icons
                                                  else ("%c" | format(57344 + all_icon_names[:all_icon_names.find("," ~ (repeat.item.icon) ~ ",")].count(",")))
                                                  if ("," ~ (repeat.item.icon) ~ ",") in all_icon_names
                                                  else "") }}"'  # Icon
                                                - '{{ repeat.item.component }}.pco={{ color_rgb565 }}'                   # Color
                                                - 'vis {{ repeat.item.component }},1'                                    # Visibility
                                            continue_on_error: true
                                          - *delay_default
                            - alias: Select page
                              conditions:
                                - '{{ current_page_from_sensor == pages.select }}'
                                - '{{ repeat.index == 1 or original_state.entity_domain in page_entity_domains.get(current_page_from_sensor, []) }}'
                              sequence: &refresh_page_select
                                - *get_entity_id_from_event_or_trigger
                                - *variable_entity
                                - *entity_details_title_with_icon
                                - variables:
                                    entity_id_valid: '{{ entity_id is defined and entity_id is string and entity_id.split(".") | count == 2 }}'
                                    entity_domain: '{{ entity_id.split(".")[0] if entity_id_valid }}'
                                    current_option_raw: '{{ states(entity_id) }}'
                                    current_option: >-
                                      {{
                                        current_option_raw | trim
                                        if
                                          current_option_raw is defined and
                                          current_option_raw is string and
                                          current_option_raw | length > 0 and
                                          current_option_raw not in ["unknown", "unavailable"]
                                        else ""
                                      }}
                                    picker_title_raw: '{{ entity.name if entity is defined and entity.name is defined else None }}'
                                    picker_title: >-
                                      {{
                                        picker_title_raw
                                        if
                                          picker_title_raw is defined and
                                          picker_title_raw is string and
                                          picker_title_raw | length > 0
                                        else entity_id
                                      }}

                                ##### Construction-only: push options + context + mode + title #####
                                - if: '{{ page_constructor }}'
                                  then:
                                    - variables:
                                        options_raw_attr: '{{ state_attr(entity_id, "options") }}'
                                        options_raw: >
                                          {{
                                            options_raw_attr
                                            if
                                              options_raw_attr is defined and
                                              options_raw_attr is iterable and
                                              options_raw_attr is not string
                                            else []
                                          }}
                                    - variables:
                                        # The picker pages through up to 32 options; current is always included
                                        options_truncated: >
                                          {%- if options_raw | length <= 32 -%}
                                            {{ options_raw }}
                                          {%- elif current_option | length == 0 or current_option in options_raw[:32] -%}
                                            {{ options_raw[:32] }}
                                          {%- else -%}
                                            {{ [current_option] + (options_raw[:31] | reject("equalto", current_option) | list) }}
                                          {%- endif -%}
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: mem
                                        id: popup_select_context
                                        txt_list:
                                          - 'select_option'
                                      continue_on_error: true
                                    - *delay_default
                                    - action: 'esphome.{{ action_prefix }}_component_val'
                                      data:
                                        page: mem
                                        id: popup_select_mode
                                        val: 0
                                      continue_on_error: true
                                    - *delay_default
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: mem
                                        id: popup_select_options
                                        txt_list: '{{ options_truncated }}'
                                      continue_on_error: true
                                    - *delay_default

                                    ##### Replace placeholder title with entity friendly name #####
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: popup_select
                                        id: lbl_title
                                        txt_list:
                                          - '{{ picker_title }}'
                                      continue_on_error: true
                                    - *delay_default

                                ##### Always (construction and updates): push current option #####
                                - action: 'esphome.{{ action_prefix }}_component_text_list'
                                  data:
                                    page: mem
                                    id: popup_select_current
                                    txt_list:
                                      - '{{ current_option }}'
                                  continue_on_error: true
                                - *delay_default
                            - alias: Timer page
                              conditions:
                                - '{{ current_page_from_sensor == pages.timer }}'
                                - '{{ repeat.index == 1 or original_state.entity_domain in page_entity_domains.get(current_page_from_sensor, []) }}'
                              sequence: &refresh_page_timer
                                - *get_entity_id_from_event_or_trigger
                                - condition:
                                    - '{{ entity_id is defined }}'
                                    - '{{ entity_id is string }}'
                                    - '{{ entity_id.split(".") | count == 2 }}'
                                    - '{{ entity_id.split(".")[0] == "timer" }}'
                                - *variable_entity
                                - condition: '{{ entity is defined }}'
                                - *entity_details_title_with_icon
                                - variables:
                                    timer_state_raw: '{{ states(entity_id) }}'
                                    timer_state: >
                                      {{
                                        0 if timer_state_raw == "idle"
                                        else (1 if timer_state_raw == "active"
                                        else (2 if timer_state_raw == "paused"
                                        else -1))
                                      }}
                                    duration_raw: '{{ state_attr(entity_id, "duration") }}'
                                    duration_secs: >
                                      {%- if duration_raw is string and duration_raw | length > 0 -%}
                                        {%- set parts = duration_raw.split(":") -%}
                                        {%- if parts | count == 3 -%}
                                          {{ (parts[0] | int) * 3600 + (parts[1] | int) * 60 + (parts[2] | int) }}
                                        {%- elif parts | count == 2 -%}
                                          {{ (parts[0] | int) * 60 + (parts[1] | int) }}
                                        {%- else -%}
                                          0
                                        {%- endif -%}
                                      {%- else -%}
                                        0
                                      {%- endif -%}
                                    duration_label: >
                                      {%- set h = duration_secs // 3600 -%}
                                      {%- set m = (duration_secs % 3600) // 60 -%}
                                      {%- set s = duration_secs % 60 -%}
                                      {%- if h > 0 -%}
                                        {{ h }}:{{ "%02d" | format(m) }}:{{ "%02d" | format(s) }}
                                      {%- elif m > 0 -%}
                                        {{ m }}:{{ "%02d" | format(s) }}
                                      {%- else -%}
                                        {{ s }}
                                      {%- endif -%}
                                    # `remaining` is only updated by HA when the timer is started, paused or finished,
                                    # so it holds the correct value only while paused. While active, the countdown
                                    # must be derived from `finishes_at`, otherwise every refresh resets the display.
                                    remaining_raw: '{{ state_attr(entity_id, "remaining") }}'
                                    remaining_attr_secs: >
                                      {%- if remaining_raw is string and remaining_raw | length > 0 -%}
                                        {%- set parts = remaining_raw.split(":") -%}
                                        {%- if parts | count == 3 -%}
                                          {{ (parts[0] | int) * 3600 + (parts[1] | int) * 60 + (parts[2] | int) }}
                                        {%- elif parts | count == 2 -%}
                                          {{ (parts[0] | int) * 60 + (parts[1] | int) }}
                                        {%- else -%}
                                          0
                                        {%- endif -%}
                                      {%- else -%}
                                        0
                                      {%- endif -%}
                                    finishes_at_raw: '{{ state_attr(entity_id, "finishes_at") }}'
                                    remaining_secs: >
                                      {%- if timer_state == 1 -%}
                                        {%- set finishes_at = as_datetime(finishes_at_raw | string, none) -%}
                                        {%- if finishes_at is not none -%}
                                          {{ [((finishes_at - now()).total_seconds()) | round(0, "ceil") | int, 0] | max }}
                                        {%- else -%}
                                          {{ remaining_attr_secs }}
                                        {%- endif -%}
                                      {%- elif timer_state == 2 -%}
                                        {{ remaining_attr_secs }}
                                      {%- else -%}
                                        0
                                      {%- endif -%}
                                - action: 'esphome.{{ action_prefix }}_component_text_list'
                                  data:
                                    page: mem
                                    id: command
                                    txt_list:
                                      - 'timer_state.val={{ timer_state }}'
                                      - 'refresh_bts.en=1'
                                      - 'remaining.val={{ remaining_secs }}'
                                      - 'duration_label.txt="{{ duration_label }}"'
                                      - 'tick.en=1'
                                  continue_on_error: true
                            - alias: Vacuum / lawn mower page
                              conditions:
                                - '{{ current_page_from_sensor == pages.vacuum }}'
                                - '{{ repeat.index == 1 or original_state.entity_domain in page_entity_domains.get(current_page_from_sensor, []) }}'
                              sequence: &refresh_page_vacuum
                                - *get_entity_id_from_event_or_trigger
                                - variables:
                                    # ── Domain detection ──────────────────────────
                                    entity_domain: '{{ entity_id.split(".")[0] }}'
                                    is_mower: '{{ entity_domain == "lawn_mower" }}'

                                    # ── Raw attributes ────────────────────────────
                                    entity_state: '{{ states(entity_id) }}'
                                    supported_features: '{{ state_attr(entity_id, "supported_features") | int(0) }}'
                                    # Home Assistant 2026.9 moved the vacuum battery from the battery_level attribute to a battery sensor of the device
                                    battery_level: >-
                                      {% set battery_attribute = state_attr(entity_id, "battery_level") %}
                                      {% set device = device_id(entity_id) %}
                                      {% set battery_values = (device_entities(device) if device else [])
                                          | select("match", "sensor\\.")
                                          | select("is_state_attr", "device_class", "battery")
                                          | map("states")
                                          | select("is_number")
                                          | map("float")
                                          | list %}
                                      {# Round half up (+0.5 then truncate); battery levels are never negative #}
                                      {% if is_number(battery_attribute) %}
                                        {{ (battery_attribute | float + 0.5) | int }}
                                      {% elif battery_values | count > 0 %}
                                        {{ (battery_values | first + 0.5) | int }}
                                      {% else %}
                                        -1
                                      {% endif %}

                                    # ── State groups ─────────────────────────────
                                    is_active: >-
                                      {{
                                        entity_state in ["cleaning", "mowing", "returning", "paused", "idle"]
                                      }}
                                    is_docked: '{{ entity_state == "docked" }}'
                                    is_running: '{{ entity_state in ["cleaning", "mowing", "returning"] }}'

                                    # ── Vacuum feature flags ──────────────────────
                                    has_start: '{{ not is_mower and supported_features | bitwise_and(8192) > 0 }}'
                                    has_pause: '{{ not is_mower and supported_features | bitwise_and(4) > 0 }}'
                                    has_stop: '{{ not is_mower and supported_features | bitwise_and(8) > 0 }}'
                                    has_return_home: '{{ not is_mower and supported_features | bitwise_and(16) > 0 }}'
                                    has_battery: '{{ battery_level >= 0 }}'

                                    # ── Mower feature flags ───────────────────────
                                    mower_has_start: '{{ is_mower and supported_features | bitwise_and(1) > 0 }}'
                                    mower_has_pause: '{{ is_mower and supported_features | bitwise_and(2) > 0 }}'
                                    mower_has_dock: '{{ is_mower and supported_features | bitwise_and(4) > 0 }}'

                                    # ── Unified button availability ───────────────
                                    btn_start_pause_available: >-
                                      {{
                                        (has_start or has_pause)
                                        if not is_mower
                                        else (mower_has_start or mower_has_pause)
                                      }}
                                    btn_stop_available: '{{ has_stop }}'  # always false for mower
                                    btn_return_available: >-
                                      {{
                                        has_return_home if not is_mower else mower_has_dock
                                      }}

                                    # ── Picture slots ─────────────────────────────
                                    pic_active_dark: '{{ 96 if not is_mower else 100 }}'
                                    pic_active_light: '{{ 97 if not is_mower else 101 }}'
                                    pic_docked_dark: '{{ 98 if not is_mower else 102 }}'
                                    pic_docked_light: '{{ 99 if not is_mower else 103 }}'

                                - *variable_entity
                                - *entity_details_title_with_icon

                                ##### State label #####
                                - action: 'esphome.{{ action_prefix }}_component_text_list'
                                  data:
                                    page: vacuum
                                    id: state_label
                                    txt_list:
                                      - '{{ entity_state | capitalize }}'
                                  continue_on_error: true
                                - *delay_default

                                ##### vacuum_pic — active vs. docked #####
                                - action: 'esphome.{{ action_prefix }}_component_text_list'
                                  data:
                                    page: mem
                                    id: command
                                    txt_list:
                                      - >-
                                        vacuum_pic.pic={{
                                          pic_active_light if (is_active and theme == "light")
                                          else (
                                            pic_active_dark if is_active
                                            else (
                                              pic_docked_light if theme == "light"
                                              else pic_docked_dark
                                            )
                                          )
                                        }}
                                  continue_on_error: true
                                - *delay_default

                                ##### bt_start_pause #####
                                - action: 'esphome.{{ action_prefix }}_icon'
                                  data:
                                    page: vacuum
                                    id: bt_start_pause
                                    icon: '{{ "\uE3E3" if is_running else "\uE409" }}{# mdi:pause, mdi:play #}'
                                    icon_color: '{{ nextion.color.grey_white }}'
                                    visible: '{{ btn_start_pause_available }}'
                                  continue_on_error: true
                                - *delay_default

                                ##### bt_stop #####
                                - action: 'esphome.{{ action_prefix }}_icon'
                                  data:
                                    page: vacuum
                                    id: bt_stop
                                    icon: '{{ "\uE4DA" }}{# mdi:stop #}'
                                    icon_color: '{{ nextion.color.grey_white }}'
                                    visible: '{{ btn_stop_available }}'
                                  continue_on_error: true
                                - *delay_default

                                ##### bt_return #####
                                - action: 'esphome.{{ action_prefix }}_icon'
                                  data:
                                    page: vacuum
                                    id: bt_return
                                    icon: '{{ "\uEF9B" }}{# mdi:home-import-outline #}'
                                    icon_color: '{{ nextion.color.grey_white }}'
                                    visible: '{{ btn_return_available and not is_docked }}'
                                  continue_on_error: true
                                - *delay_default

                                ##### Battery (vacuum only, feature-gated) #####
                                - action: 'esphome.{{ action_prefix }}_icon'
                                  data:
                                    page: vacuum
                                    id: battery_icon
                                    icon: >-
                                      {% set lvl = battery_level %}
                                      {% if lvl >= 95 %}{{ "\uE078" }}{# mdi:battery #}
                                      {% elif lvl >= 85 %}{{ "\uE081" }}{# mdi:battery-90 #}
                                      {% elif lvl >= 75 %}{{ "\uE080" }}{# mdi:battery-80 #}
                                      {% elif lvl >= 65 %}{{ "\uE07F" }}{# mdi:battery-70 #}
                                      {% elif lvl >= 55 %}{{ "\uE07E" }}{# mdi:battery-60 #}
                                      {% elif lvl >= 45 %}{{ "\uE07D" }}{# mdi:battery-50 #}
                                      {% elif lvl >= 35 %}{{ "\uE07C" }}{# mdi:battery-40 #}
                                      {% elif lvl >= 25 %}{{ "\uE07B" }}{# mdi:battery-30 #}
                                      {% elif lvl >= 15 %}{{ "\uE07A" }}{# mdi:battery-20 #}
                                      {% else %}{{ "\uE079" }}{# mdi:battery-10 #}
                                      {% endif %}
                                    icon_color: '{{ nextion.color.grey_white }}'
                                    visible: '{{ has_battery and battery_level >= 0 }}'
                                  continue_on_error: true
                                - *delay_default
                                - if: '{{ has_battery and battery_level >= 0 }}'
                                  then:
                                    - action: 'esphome.{{ action_prefix }}_component_text_list'
                                      data:
                                        page: vacuum
                                        id: battery_value
                                        txt_list:
                                          - '{{ battery_level }}%'
                                      continue_on_error: true
                                    - *delay_default
                                - action: 'esphome.{{ action_prefix }}_components_visibility'
                                  data:
                                    page: vacuum
                                    ids: ["battery_value"]
                                    visible: '{{ has_battery and battery_level >= 0 }}'
                                  continue_on_error: true
                                - *delay_default

                        # Refresh passes: only while the details page stays open on the same entity
                        - condition:
                            - '{{ detailed_entity | length > 0 }}'
                            - '{{ original_state.entity_id_valid }}'
                            - '{{ nspanel_event.page in pages.detailed_entity }}'
                        - alias: Wait for the panel state sensors to catch up  # Once, after the first render
                          wait_template: &condition_details_page_sensors_ready >
                            {{
                              repeat.index > 1 or (
                                states(currentpage) == original_state.page and
                                states(detailed_entity) == original_state.entity_id
                              )
                            }}
                          timeout:
                            milliseconds: !input entity_details_pages_sync_timeout
                          continue_on_timeout: true
                        - condition: *condition_details_page_sensors_ready
                        - condition: &conditions_entity_details_pages_loop >
                            {{
                              repeat.index <= entity_details_pages_max_refreshes and
                              original_state.entity_id_valid and
                              original_state.entity_id == (states(detailed_entity) if detailed_entity | length > 0 else '') and
                              original_state.page in pages.detailed_entity and
                              original_state.page == states(currentpage)
                            }}
                        - variables:
                            page_constructor: false
                        - variables:
                            entity_initial_stamp: >
                              {{
                                states[original_state.entity_id].last_updated | string
                                if states[original_state.entity_id] is not none
                                else ''
                              }}
                            entity_id: '{{ original_state.entity_id }}'
                            entity_id_valid: '{{ original_state.entity_id_valid }}'
                            entity_domain: '{{ original_state.entity_domain }}'
                        - delay:
                            milliseconds: !input entity_details_pages_debounce
                        - wait_template: >
                            {{
                              original_state.page != states(currentpage) or
                              states(detailed_entity) != original_state.entity_id or
                              (
                                states[original_state.entity_id].last_updated | string
                                if states[original_state.entity_id] is not none
                                else ''
                              ) != entity_initial_stamp
                            }}
                          # Settle pass: debounce time; otherwise the fallback refresh interval (seconds)
                          timeout: >-
                            {{
                              (entity_details_pages_debounce_ms | int(1000)) / 1000
                              if refresh_pending_settle
                              else entity_details_pages_update_interval_s | int(60)
                            }}
                          continue_on_timeout: true
                        - condition: *conditions_entity_details_pages_loop
                        - variables:
                            current_page_from_sensor: '{{ states(currentpage) }}'
                            # No entity change before the timeout: settle pass or fallback refresh
                            refresh_settled: '{{ not wait.completed }}'
                        - variables:
                            # Only the fan page keeps a press pending across intermediate states,
                            # so the other pages skip the extra settle redraw.
                            refresh_pending_settle: >-
                              {{
                                not refresh_settled and
                                current_page_from_sensor == pages.fan and
                                original_state.entity_domain in ["fan"]
                              }}
                        - variables:
                            refresh_next: true
                      until: '{{ not refresh_next }}'

              - alias: Button click
                conditions:
                  - '{{ nspanel_event.type == "button_click" }}'
                sequence:
                  - choose:
                      - alias: Hardware buttons
                        conditions:
                          - '{{ nspanel_event is defined }}'
                          - '{{ nspanel_event.component is defined }}'
                          - '{{ nspanel_event.component in ["hw_bt_left", "hw_bt_right"] }}'
                        sequence:
                          - *variables_hardware
                          - variables:
                              last_click_button: >
                                {{
                                  hardware.buttons.left
                                  if nspanel_event.component == "hw_bt_left"
                                  else hardware.buttons.right
                                }}
                              entity_id: >
                                {{
                                  last_click_button.entity
                                  if last_click_button is defined and last_click_button.entity is defined
                                  else None
                                }}
                          - *variables_light_modes
                          - choose:
                              - alias: Long click
                                conditions: >-
                                  {{
                                    nspanel_event.command == "long_click" or
                                    entity_domain in domains_functionality.detailed_only
                                  }}
                                sequence:
                                  - choose:
                                      - alias: Default
                                        conditions:
                                          - '{{ last_click_button.hold_select == "Default" }}'
                                          - '{{ entity_domain in domains_functionality.detailed }}'
                                          - '{{ entity_domain != "light" or light_has_details }}'
                                          - '{{ entity_domain != "fan" or supported_features | bitwise_and(11) > 0 }}'
                                        sequence:
                                          - *variable_entity
                                          - variables:
                                              back_page: '{{ pages.home }}'
                                          - &entity_details_show
                                            sequence:
                                              # Store the title and icon of the button being opened on the panel. The
                                              # panel reports them back with the page change, where the details page is
                                              # rendered. Blank values clear an override left by a previous button.
                                              - action: 'esphome.{{ action_prefix }}_component_text_list'
                                                data:
                                                  page: mem
                                                  id: details_overlap
                                                  txt_list:
                                                    - '{{ "embedded_climate" if entity_id == thermostat_embedded else entity_id }}'
                                                    - >-
                                                      {{
                                                        overlap.name
                                                        if
                                                          overlap is defined and
                                                          overlap.name is defined and
                                                          overlap.name is string
                                                        else ""
                                                      }}
                                                    - >-
                                                      {{
                                                        overlap.icon
                                                        if
                                                          overlap is defined and
                                                          overlap.icon is defined and
                                                          overlap.icon is string and
                                                          overlap.icon is match "mdi:" and
                                                          ((overlap.icon.split("mdi:") | last) in special_icons or ("," ~ (overlap.icon.split("mdi:") | last) ~ ",") in all_icon_names)
                                                        else ""
                                                      }}
                                                continue_on_error: true
                                              - action: 'esphome.{{ action_prefix }}_entity_details_show'
                                                data:
                                                  entity: '{{ "embedded_climate" if entity_id == thermostat_embedded else entity_id }}'
                                                  back_page: '{{ back_page }}'
                                                continue_on_error: true
                                              - condition: '{{ entity is defined }}'
                                              - condition: '{{ entity.name is defined }}'
                                              - condition: '{{ entity.name is string }}'
                                              - condition: '{{ entity.name | length > 0 }}'
                                              - action: 'esphome.{{ action_prefix }}_component_text_list'
                                                data:
                                                  page: ""
                                                  id: page_label
                                                  txt_list:
                                                    - '{{ entity.name }}'
                                                continue_on_error: true
                                      - alias: Custom hold action - Left
                                        conditions: '{{ last_click_button.hold_select == "Custom Action" and nspanel_event.component == "hw_bt_left" }}'
                                        sequence: !input left_button_hold_custom_action
                                      - alias: Custom hold action - Right
                                        conditions: '{{ last_click_button.hold_select == "Custom Action" and nspanel_event.component == "hw_bt_right" }}'
                                        sequence: !input right_button_hold_custom_action
                              - alias: Short click
                                conditions:
                                  - '{{ nspanel_event.command == "short_click" }}'
                                  - '{{ entity_domain not in domains_functionality.detailed_only }}'
                                sequence:
                                  - alias: Custom click action - Left
                                    if: '{{ nspanel_event.component == "hw_bt_left" }}'
                                    then:
                                      - sequence: !input left_button_click_custom_action
                                  - alias: Custom click action - Right
                                    if: '{{ nspanel_event.component == "hw_bt_right" }}'
                                    then:
                                      - sequence: !input right_button_click_custom_action
                                  - condition: '{{ last_click_button is defined }}'
                                  - condition: '{{ last_click_button.entity is defined }}'
                                  - condition: '{{ last_click_button.entity is string }}'
                                  - condition: '{{ last_click_button.entity | length > 2 }}'
                                  - condition: '{{ nspanel_event.component != "hw_bt_left" or hardware.buttons.left.entity != relay01_entity }}'
                                  - condition: '{{ nspanel_event.component != "hw_bt_right" or hardware.buttons.right.entity != relay02_entity }}'
                                  - &short_press_action_call
                                    alias: "short_press_action_call"
                                    sequence:
                                      - variables:
                                          last_click_button_entity_state: '{{ states(last_click_button.entity) }}'
                                      # A button the user can see is not actionable while its entity is
                                      # unavailable. Guarding here covers every surface that calls this
                                      # anchor: button pages, climate and home custom buttons, hardware
                                      # buttons. Skipped under "Show as off", where the panel gives the
                                      # user no indication that the tap would be pointless.
                                      - condition: >-
                                          {{
                                            unavailable_behavior | int(1) == 0 or
                                            last_click_button_entity_state not in ["unavailable"]
                                          }}
                                      - variables:
                                          action_to_call: >-
                                            {% if entity_domain == "cover"
                                                  and last_click_button_entity_state in ["opening", "closing"]
                                                  and state_attr(last_click_button.entity, "supported_features") | int(0) | bitwise_and(4) == 0 %}
                                              cover.stop_cover
                                            {% elif entity_domain in ["cover", "fan", "humidifier", "input_boolean", "light", "remote", "switch"] %}
                                              {{ entity_domain }}.toggle
                                            {% elif entity_domain == "automation" %}
                                              automation.{{ domain_automation_button_action if domain_automation_button_action is string else "toggle"}}
                                            {% elif entity_domain == "group" %}
                                              {#- Old-style groups: set all members to the same state, based on the group state.  -#}
                                              {#- homeassistant.toggle would toggle each member individually, keeping mixed states. -#}
                                              {% if last_click_button_entity_state in enum.states.on %}
                                                homeassistant.turn_off
                                              {% elif last_click_button_entity_state in enum.states.off %}
                                                homeassistant.turn_on
                                              {% else %}
                                                homeassistant.update_entity
                                              {% endif %}  {#- group state #}
                                            {% elif entity_domain in ["button", "input_button"] %}
                                              {{ entity_domain }}.press
                                            {% elif entity_domain == "lawn_mower" %}
                                              {% if last_click_button_entity_state in ["mowing", "returning"] %}
                                                lawn_mower.pause
                                              {% else %}
                                                lawn_mower.start_mowing
                                              {% endif %}
                                            {% elif entity_domain == "lock" %}
                                              {% if last_click_button_entity_state == "locked" %}
                                                lock.unlock
                                              {% else %}
                                                lock.lock
                                              {% endif %}
                                            {% elif entity_domain in ["scene", "script"] %}
                                              {{ entity_domain }}.turn_on
                                            {% elif entity_domain == "media_player" %}
                                              media_player.media_play_pause
                                            {% elif entity_domain == "timer" %}
                                              {% if last_click_button_entity_state == "active" %}
                                                timer.pause
                                              {% else %}
                                                timer.start
                                              {% endif %}
                                            {% elif entity_domain == "vacuum" %}
                                              {% if last_click_button_entity_state in ["cleaning", "returning"] %}
                                                vacuum.pause
                                              {% else %}
                                                vacuum.start
                                              {% endif %}
                                            {% else %}
                                              homeassistant.update_entity
                                            {% endif %}
                                      - alias: call_an_action
                                        action: '{{ action_to_call }}'
                                        data:
                                          entity_id: '{{ last_click_button.entity }}'
                                        continue_on_error: true
                          - if:
                              - '{{ entity_domain in ["media_player"] }}'
                              - '{{ last_click_button is defined }}'
                              - '{{ last_click_button.entity is defined }}'
                              - '{{ last_click_button.entity is string }}'
                              - '{{ last_click_button.entity | length > 2 }}'
                            then:
                              - delay:
                                  milliseconds: '{{ media_player_update_delay }}'
                              - action: homeassistant.update_entity
                                data:
                                  entity_id: '{{ last_click_button.entity }}'
                                continue_on_error: true

                      - alias: Buttons pages
