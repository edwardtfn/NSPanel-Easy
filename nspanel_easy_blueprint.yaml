conditions:
  - >  # Prevent trigger when panel's version is older, unless bypassed or in special cases (handled later)
    {{
      esphome_gate_ok or trigger.id in ["automation_reloaded", "ha_started", "nspanel_event"]
    }}
  - >  # Trigger is coming from panel's event or Device Name is available
    {{
      trigger.id in ["automation_reloaded", "ha_started", "nspanel_event"] or has_value(device_name_sensor)
    }}
  - >  # Update page Home only when visible or home_page_background_update is enabled
    {{ trigger.id not in ["home_values_state"] or home_page_background_update or pages.current in [pages.home, pages.graph] }}
  - >  # Do not update values when page utilities is not visible
    {{ trigger.id != "utilities_page" or pages.current == pages.utilities }}
  - >  # Do not update values when page entities is not visible
    {{ trigger.id != "trigger_entitypage_state" or pages.current in pages.entitypages }}
  - >  # Do not update values when page climate is not visible
    {{
      pages.current == pages.climate or
      trigger.id not in ["trigger_climatepage_value_state", "climate_button08_state", "climate_button09_state"]
    }}
  - >  # Climate entity: run only when something shown on the panel changed (#641)
    {#- The trigger fires on every change of the entity, including attribute-only updates
        (e.g. internal values of Better Thermostat, or a new current_temperature). While the
        climate page is not visible, only the climate chip is updated, and it shows only the
        state, hvac_action, icon and color. The embedded thermostat has no chip from the Blueprint
        (the firmware handles it), so it needs the climate page. A removed entity (no new state)
        has nothing to show. #}
    {%- if trigger.id != "climate_state" -%}
      true
    {%- else -%}
      {%- set old_state = trigger.event.data.get("old_state") -%}
      {%- set new_state = trigger.event.data.get("new_state") -%}
      {%- if new_state is none -%}
        false
      {%- elif pages.current == pages.climate -%}
        true
      {%- elif trigger.event.data.get("entity_id") == thermostat_embedded -%}
        false
      {%- elif old_state is none -%}
        true
      {%- else -%}
        {{
          old_state.state != new_state.state or
          old_state.attributes.get("hvac_action") != new_state.attributes.get("hvac_action") or
          old_state.attributes.get("icon") != new_state.attributes.get("icon") or
          old_state.attributes.get("color") != new_state.attributes.get("color")
        }}
      {%- endif -%}
    {%- endif -%}
  - >  # Do not update values when page water heater is not visible
    {{
      pages.current == pages.water_heater or
      trigger.id not in ["trigger_water_heater_page_value_state", "trigger_humidifier_page_value_state"]
    }}
  - >  # Do not update values when page button is not visible
    {{
      trigger.id != "trigger_buttonpage_state" or
      pages.current in pages.buttonpages or
      (
        pages.current in pages.detailed_entity and
        trigger.entity_id is defined and
        detailed_entity | length > 0 and
        trigger.entity_id == states(detailed_entity)
      )
    }}
