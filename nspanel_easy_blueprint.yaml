    hardware_buttons:
      name: Hardware buttons
      icon: mdi:gesture-tap-button
      description: Select how the physical buttons will behave.
      collapsed: true
      input:
        hw_buttons_bars_visible_pages:
          name: Hardware Buttons - Visibility Pages
          description: >
            Choose the pages where the bars, indicating the status of entities linked to hardware buttons, will be displayed.

            ***Attention!** Overlapping of button bars with other components may occur on some pages. Please proceed with caution.*
          default:
            - 'home'
          selector:
            select:
              multiple: true
              options:
                # Values are page names (comma-separated when an option covers more than one page)
                - label: "Home (default)"
                  value: 'home'
                - label: "Buttons pages"
                  value: 'buttonpage01,buttonpage02,buttonpage03,buttonpage04'
                - label: "Entities pages"
                  value: 'entitypage01,entitypage02,entitypage03,entitypage04'
                - label: "Notification page"
                  value: 'notification'
                - label: "QR code page"
                  value: 'qrcode'
                - label: "Screen saver (sleep) page"
                  value: 'screensaver'
                - label: "Settings page"
                  value: 'settings'
                - label: "Utilities page"
                  value: 'utilities'
                - label: "Weather pages"
                  value: 'weather01,weather02,weather03,weather04,weather05'
                - label: "Alarm control panel page"
                  value: 'alarm'
                - label: "Climate page"
                  value: 'climate'
                - label: "Cover page"
                  value: 'cover'
                - label: "Fan page"
                  value: 'fan'
                - label: "Light page"
                  value: 'light'
                - label: "Media player page"
                  value: 'media_player'
                - label: "Confirm pop-up page"
                  value: 'confirm'
                - label: "Keyboard pop-up page"
                  value: 'keyb_num'
        hw_buttons_labels_pages:
          name: Hardware Buttons - Labels Pages
          description: >
            Choose the pages where the labels of the hardware buttons will be displayed.

            ***Note:** The labels are not visible on the US landscape model.*
          default:
            - 'home'
          selector:
            select:
              multiple: true
              options:
                # Values are page names (comma-separated when an option covers more than one page)
                - label: "Home (default)"
                  value: 'home'
                - label: "Screen saver (sleep) page"
                  value: 'screensaver'
        hw_buttons_bar_color_on:
          name: Hardware Buttons - Bar color when `On`
          description: "Choose a color for the button's bars when the controlled entity is `On`."
          default: [31, 169, 255]
          selector: *color_selector
        hw_buttons_bar_color_off:
          name: Hardware Buttons - Bar color when `Off`
          description: "Choose a color for the button's bars when the controlled entity is `Off`."
          default: [44, 44, 44]
          selector: *color_selector
        hw_button_bar_left_always_show:
          name: Hardware Buttons - Left - Always Show Bar
          description: >
            Controls the visibility of the **left** button bar.
            By default, the bar is hidden when no entity is assigned.
            Enabling this option keeps the bar visible at all times, showing the `Off` state by default.

            Note: The bar remains visible if an entity is assigned, regardless of this setting.
          default: false
          selector:
            boolean:
        hw_button_bar_right_always_show:
          name: Hardware Buttons - Right - Always Show Bar
          description: >
            Controls the visibility of the **right** button bar.
            By default, the bar is hidden when no entity is assigned.
            Enabling this option keeps the bar visible at all times, showing the `Off` state by default.

            Note: The bar remains visible if an entity is assigned, regardless of this setting.
          default: false
          selector:
            boolean:
        relay_1_local_fallback:
          name: Activate relay 1 local fallback - Enable/Disable
          default: false
          description: >
            Activate this to use left button to toggle relay 1 if the panel is offline.

            *When left button is using the entity related to relay 1 the processing will always be local, even if fallback is disabled.*
          selector:
            boolean:
