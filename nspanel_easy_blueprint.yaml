                                          - '{{ nspanel_event.component == "button02" }}'
                                        sequence: !input entity10_custom_action
                                      - alias: Custom action - Button 11
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage02" }}'
                                          - '{{ nspanel_event.component == "button03" }}'
                                        sequence: !input entity11_custom_action
                                      - alias: Custom action - Button 12
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage02" }}'
                                          - '{{ nspanel_event.component == "button04" }}'
                                        sequence: !input entity12_custom_action
                                      - alias: Custom action - Button 13
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage02" }}'
                                          - '{{ nspanel_event.component == "button05" }}'
                                        sequence: !input entity13_custom_action
                                      - alias: Custom action - Button 14
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage02" }}'
