                                          - '{{ nspanel_event.component == "button07" }}'
                                        sequence: !input entity15_custom_action
                                      - alias: Custom action - Button 16
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage02" }}'
                                          - '{{ nspanel_event.component == "button08" }}'
                                        sequence: !input entity16_custom_action
                                      - alias: Custom action - Button 17
