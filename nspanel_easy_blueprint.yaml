      ##### Humidifier page (rendered on the water heater page) #####
      # Humidifier modes are free text (`available_modes`), so they are assigned to the mode
      # buttons in the order the entity reports them. HA's standard modes get a matching icon,
      # any other mode gets the fallback icon. The power button toggles the entity on/off.
      page_humidifier:
        buttons:
          modes:
            - button01
            - button02
            - button03
            - button04
            - button05
            - button06
            - button07
          power: button08
          mode_icons:
            normal: water-percent
            eco: leaf
            away: account-arrow-right
            boost: rocket-launch
            comfort: sofa
            home: home
            sleep: sleep
            auto: auto-mode
            baby: baby-carriage
