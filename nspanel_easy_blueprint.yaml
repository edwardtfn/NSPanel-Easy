#################################################################################################
##### NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy
##### Blueprint
##### PLEASE only make changes if it is necessary and also the required knowledge is available.
##### For normal use with the Blueprint, no changes are necessary.
##################################################################################################
---
blueprint:
  name: NSPanel Easy Configuration (v2026.11.15)
  author: Edward Firmo (https://github.com/edwardtfn)
  description: >
    # NSPanel Easy Configuration via Blueprint


    This project enables comprehensive configuration of your NSPanel through a Blueprint featuring a user interface.

  source_url: https://raw.githubusercontent.com/edwardtfn/NSPanel-Easy/refs/tags/latest/nspanel_easy_blueprint.yaml
  domain: automation
  homeassistant:
    min_version: 2026.10.0

  input:
    nspanel_name:  # This key was kept with this name to support inputs from legacy versions where the panel name was used
      name: NSPanel device (REQUIRED)
      description: "Please select the ESPHome device related to the NSPanel to be controlled by this automation."
      default: []
      selector:
        device:
          multiple: false
          filter:
            - integration: esphome
              model: NSPanel-Easy
            - integration: esphome
              model: esp32dev
            - integration: esphome
              model: NSPanel_HA_Blueprint
            - integration: esphome
              model: Wall_Display
    localization:
      name: Localization
      icon: mdi:earth
      description: Select the language and date/time formats to be displayed in your panel.
      collapsed: true
      input:
        date_format:
          name: Date Format
          description: "Select the format for date to display."
          default: '%A, %d.%m'
          selector:
            select:
              multiple: false
              custom_value: true
              options:
                # ── Full weekday · Full month name ──────────────────────────────────────
                - label: 'Weekday, DD MMMM YYYY  (ex. "Friday, 22 March 2024")'
                  value: '%A, %d %B %Y'
                - label: 'Weekday, DD MMMM  (ex. "Friday, 22 March")'
                  value: '%A, %d %B'
                # ── Full weekday · Short month name ─────────────────────────────────────
                - label: 'Weekday, DD MMM YYYY  (ex. "Friday, 22 Mar 2024")'
                  value: '%A, %d %b %Y'
                - label: 'Weekday, DD MMM  (ex. "Friday, 22 Mar")'
                  value: '%A, %d %b'
                - label: 'Weekday DD MMM  (ex. "Friday 22 Mar")'
                  value: '%A %d %b'
                # ── Full weekday · Numeric dot ───────────────────────────────────────────
                - label: 'Weekday, DD.MM.YYYY  (ex. "Friday, 22.03.2024")'
                  value: '%A, %d.%m.%Y'
                - label: 'Weekday, DD.MM.  (ex. "Friday, 22.03.")'
                  value: '%A, %d.%m.'
                - label: 'Weekday, DD.MM  (ex. "Friday, 22.03")'
                  value: '%A, %d.%m'
                - label: 'Weekday D.M.  (ex. "Friday 22.3.")'
                  value: '%A %-d.%-m.'
                - label: 'Weekday D.M  (ex. "Friday 22.3")'
                  value: '%A %-d.%-m'
                # ── Full weekday · Numeric slash ─────────────────────────────────────────
                - label: 'Weekday, DD/MM  (ex. "Friday, 22/03")'
                  value: '%A, %d/%m'
                - label: 'Weekday, D/M  (ex. "Friday, 22/3")'
                  value: '%A, %-d/%-m'
                - label: 'Weekday, M/D  (ex. "Friday, 3/22")'
                  value: '%A, %-m/%-d'
                # ── Full weekday · Numeric dash ──────────────────────────────────────────
                - label: 'Weekday D-M  (ex. "Friday 22-3")'
                  value: '%A %-d-%-m'
                - label: 'Weekday M-D  (ex. "Friday 3-22")'
                  value: '%A %-m-%-d'
                # ── Short weekday · Full month name ─────────────────────────────────────
                - label: 'Wkd, DD MMMM YYYY  (ex. "Fri, 22 March 2024")'
                  value: '%a, %d %B %Y'
                - label: 'Wkd, DD MMMM  (ex. "Fri, 22 March")'
                  value: '%a, %d %B'
                # ── Short weekday · Short month name ────────────────────────────────────
                - label: 'Wkd, DD MMM YYYY  (ex. "Fri, 22 Mar 2024")'
                  value: '%a, %d %b %Y'
                - label: 'Wkd, DD MMM  (ex. "Fri, 22 Mar")'
                  value: '%a, %d %b'
                - label: 'Wkd DD MMM  (ex. "Fri 22 Mar")'
                  value: '%a %d %b'
                # ── Short weekday · Numeric dot ──────────────────────────────────────────
                - label: 'Wkd, DD.MM.YYYY  (ex. "Fri, 22.03.2024")'
                  value: '%a, %d.%m.%Y'
                - label: 'Wkd, DD.MM.  (ex. "Fri, 22.03.")'
                  value: '%a, %d.%m.'
                - label: 'Wkd, DD.MM  (ex. "Fri, 22.03")'
                  value: '%a, %d.%m'
                - label: 'Wkd D.M.  (ex. "Fri 22.3.")'
                  value: '%a %-d.%-m.'
                - label: 'Wkd D.M  (ex. "Fri 22.3")'
                  value: '%a %-d.%-m'
                # ── Short weekday · Numeric slash ────────────────────────────────────────
                - label: 'Wkd, DD/MM  (ex. "Fri, 22/03")'
                  value: '%a, %d/%m'
                - label: 'Wkd, D/M  (ex. "Fri, 22/3")'
                  value: '%a, %-d/%-m'
                - label: 'Wkd, M/D  (ex. "Fri, 3/22")'
                  value: '%a, %-m/%-d'
                # ── Short weekday · Numeric dash ─────────────────────────────────────────
                - label: 'Wkd D-M  (ex. "Fri 22-3")'
                  value: '%a %-d-%-m'
                - label: 'Wkd M-D  (ex. "Fri 3-22")'
                  value: '%a %-m-%-d'
                # ── No weekday · Full month name ─────────────────────────────────────────
                - label: 'DD MMMM YYYY  (ex. "22 March 2024")'
                  value: '%d %B %Y'
                - label: 'DD MMMM  (ex. "22 March")'
                  value: '%d %B'
                - label: 'MMMM DD, YYYY  (ex. "March 22, 2024")'
                  value: '%B %d, %Y'
                # ── No weekday · Numeric dot ──────────────────────────────────────────────
                - label: 'DD.MM.YYYY  (ex. "22.03.2024")'
                  value: '%d.%m.%Y'
                - label: 'DD.MM.  (ex. "22.03.")'
                  value: '%d.%m.'
                - label: 'DD.MM  (ex. "22.03")'
                  value: '%d.%m'
                - label: 'D.M  (ex. "22.3")'
                  value: '%-d.%-m'
                # ── No weekday · Numeric slash ────────────────────────────────────────────
                - label: 'DD/MM/YYYY  (ex. "22/03/2024")'
                  value: '%d/%m/%Y'
                - label: 'DD/MM  (ex. "22/03")'
                  value: '%d/%m'
                - label: 'D/M  (ex. "22/3")'
                  value: '%-d/%-m'
                - label: 'MM/DD/YYYY  (ex. "03/22/2024")'
                  value: '%m/%d/%Y'
                - label: 'M/D  (ex. "3/22")'
                  value: '%-m/%-d'
                # ── No weekday · Numeric dash ─────────────────────────────────────────────
                - label: 'DD-MM-YYYY  (ex. "22-03-2024")'
                  value: '%d-%m-%Y'
                - label: 'DD-MM  (ex. "22-03")'
                  value: '%d-%m'
                - label: 'YYYY-MM-DD  (ex. "2024-03-22")  [ISO 8601]'
                  value: '%Y-%m-%d'
        time_format:
          name: Time Format
          description: "Choose how time should be displayed."
          default: '%H:%M'
          selector:
            select:
              multiple: false
              custom_value: true
              options:
                # ── 24h · Colon · Padded ─────────────────────────────────────────────────
                # Common in most of the world as the standard digital clock format
                - label: 'HH:MM  (ex. "08:30" and "20:30")'
                  value: '%H:%M'
                # ── 24h · Colon · No leading zero ────────────────────────────────────────
                # Common in German-speaking countries (de, at, ch) and Netherlands (nl)
                - label: 'H:MM  (ex. "8:30" and "20:30")'
                  value: '%-H:%M'
                # ── 24h · Dot · Padded ───────────────────────────────────────────────────
                # Conventional in Finland (fi), historically Germany (de), Poland (pl), Netherlands (nl)
                - label: 'HH.MM  (ex. "08.30" and "20.30")'
                  value: '%H.%M'
                # ── 24h · Dot · No leading zero ──────────────────────────────────────────
                # German informal (de): "8.30 Uhr", Dutch informal (nl): "8.30 uur"
                - label: 'H.MM  (ex. "8.30" and "20.30")'
                  value: '%-H.%M'
                # ── 12h · Colon · Padded · AM/PM suffix ──────────────────────────────────
                # Standard in English-speaking countries (en, af, cy, ms, sw)
                - label: 'HH:MM AM/PM  (ex. "08:30 AM" and "08:30 PM")'
                  value: '%I:%M %p'
                # ── 12h · Colon · No leading zero · AM/PM suffix ─────────────────────────
                # Most common 12h informal usage (en, hi, bn, ar, ur, pa)
                - label: 'H:MM AM/PM  (ex. "8:30 AM" and "8:30 PM")'
                  value: '%-I:%M %p'
                # ── 12h · AM/PM prefix · Colon ───────────────────────────────────────────
                # Conventional in Korean (ko) and sometimes Chinese (zh-cn, zh-tw)
                - label: 'AM/PM H:MM  (ex. "AM 8:30" and "PM 8:30")'
                  value: '%p %-I:%M'
        temperature_unit:
          name: Temperature Unit
          description: >-
            Select the temperature unit for sensors provided by Home Assistant without a pre-defined unit.


            IMPORTANT!

            The panel's embedded sensor is managed locally
            and requires its own setting as a substitution in your panel's YAML:

            ```yaml

            substitutions:
              temp_units: "°F"

            ```
          default: '°C'
          selector:
            select:
              multiple: false
              options:
                - '°C'
                - '°F'
        decimal_separator:
          name: System settings - Decimal Separator
          description: "Choose the decimal separator for displaying numbers."
          default: '.'
          selector:
            select:
              multiple: false
              options:
                - label: '. (Dot)'
                  value: '.'
                - label: ', (Comma)'
                  value: ','
        compact_unit_display:
          name: Compact unit display
          description: >-
            When enabled, numeric values and their units are displayed without a
            space between them (e.g., `21°C` instead of `21 °C`).
          default: false
          selector:
            boolean:
        sun_zone:
          name: Sun position - Zone
          description: >-
            The zone whose coordinates the panel uses to work out sunrise and sunset,
            which decides whether day or night weather icons are shown on the Home page.

            Leave this empty to use your home zone. Set it only when the panel is
            somewhere else, such as a holiday home.

            The coordinates are read once and stored on the panel, so it keeps showing
            the correct icons even while Home Assistant is unreachable. Until they are
            available the panel treats 06:00-18:00 as daytime.

            *Only one entity may be selected.*
          default: &selector_entity_single_default_empty []
          selector:
            entity:
              multiple: &selector_entity_single_multiple false
              filter:
                domain:
                  - zone
    weather_temperature:
      name: Weather and temperature
      icon: mdi:weather-partly-snowy-rainy
      description: Select the weather provider and how the ambient temperatures will be displayed.
      collapsed: true
      input:
        weather_entity:
          name: Weather entity from HA
          description: >
            Select your weather entity.

            This will be used for weather information on Home page and all the weather pages.

            *Only one entity may be selected.*
          default: *selector_entity_single_default_empty
          selector:
            entity:
              multiple: *selector_entity_single_multiple
              filter:
                domain:
                  - weather
        weather_forecast_max_first:
          name: Weather pages - Show maximum temperature first
          description: >
            Toggle to show the forecast temperatures on the weather pages as `<max> / <min>` instead of `<min> / <max>`.
          default: false
          selector:
            boolean:
        home_outdoor_temp_visible:
          name: Home Page - Outdoor Temperature Sensor Visibility
          description: "Toggle to display the outdoor temperature on the Home page."
          default: true
          selector:
            boolean:
        outdoortemp:
          name: Home page - Outdoor Temperature Sensor
          description: >-
            If no outdoor sensor is available,
            leave this field empty and the value from the selected weather integration will be used automatically.

            *Only one entity may be selected.*
          default: *selector_entity_single_default_empty
          selector: &entity_temp_sensor_selector
            entity:
              multiple: *selector_entity_single_multiple
              filter:
                domain:
                  - sensor
                device_class:
                  - temperature
        home_outdoor_temp_label_color:
          name: Home page - Outdoor Temperature Sensor - Text color
          description: &description_text_color "Choose a color for the sensor's display text."
          default: [255, 255, 255]
          selector: &color_selector
            color_rgb:
        home_outdoor_temp_font:
          name: Home page - Outdoor Temperature Sensor font size
          description: >
            The size of the outdoor temperature font

            ***ATTENTION!** Depending on the value shown and the font size, the text may exceed the available space.*
          default: '4'
          selector:
            select:
              multiple: false
              options:
                - label: 16px
                  value: '0'
                - label: 18px
                  value: '1'
                - label: 22px
                  value: '2'
                - label: 26px
                  value: '3'
                - label: 36px
                  value: '4'
                - label: 48px
                  value: '5'
                - label: 72px
                  value: '6'
        home_indoor_temp_visible:
          name: Home Page - Indoor Temperature Sensor Visibility
          description: "Toggle to display the indoor temperature on the Home page."
          default: true
          selector:
            boolean:
        indoortemp:
          name: Home page - Indoor Temperature Sensor - Entity
          description: >-
            An indoor temperature sensor is not necessary.

            Leave the field empty if you want to use the temperature sensor of the NSPanel.

            Additionally a temperature correction for the NSPanel sensor is possible under HA Devices.

            You may select either a temperature `sensor` entity or a `climate` entity,
            in which case the **current temperature** reported by the climate entity will
            be used, not its target temperature.

            *Only one entity may be selected.*
          default: *selector_entity_single_default_empty
          selector: &entity_temp_or_climate_sensor_selector
            entity:
              multiple: *selector_entity_single_multiple
              filter:
                - domain: sensor
                  device_class: temperature
                - domain: climate
        home_indoor_temp_icon:
          name: Home page - Indoor Temperature Sensor - Icon
          description: "Icon which should be displayed (Default mdi:thermometer)"
          default: mdi:thermometer
          selector: &selector_icon
            icon:
        home_indoor_temp_icon_color:
          name: Home page - Indoor Temperature Sensor - Icon color
          description: &description_icon_color "Icon color which should be displayed."
          default: [255, 255, 255]
          selector: *color_selector
        home_indoor_temp_label_color:
          name: Home page - Indoor Temperature Sensor - Text color
          description: *description_text_color
          default: [255, 255, 255]
          selector: *color_selector
        temp_calibration_reference:
          name: NSPanel Temperature Sensor - Calibration Reference - Entity
          description: >-
            Optional reference used to calibrate the NSPanel's own temperature sensor automatically,
            compensating for the panel's self-heating.

            The panel keeps using its own sensor, so it keeps working while Home Assistant is unavailable.
            Once a minute, the **Temperature Correction** under HA Devices is adjusted slowly towards the difference
            between this reference and the panel's sensor. Leave the field empty to set the correction manually.

            Place the reference in the same room, near the panel but not directly above it, as the panel's heat rises.
            If the embedded thermostat regulates on it (see **Embedded Thermostat - Regulate on the Calibration Reference**),
            place it where the room temperature should be measured instead.
            You may select either a temperature `sensor` entity or a `climate` entity,
            in which case its **current temperature** is used. The panel's own sensor and thermostat cannot be selected.

            The entity must report in the same unit as `temp_units` in your ESPHome settings.

            *Only one entity may be selected.*
          default: *selector_entity_single_default_empty
          selector: *entity_temp_or_climate_sensor_selector
    home_page_entites_states:
      name: Home page - Entities states
      icon: mdi:home
      description: Select the entities to be displayed on the Home page.
      collapsed: true
      input:
        home_value01:
          name: Home page - Entity State 01 - Entity
          description: &description_entity_displayed >-
            Entity which should be displayed.

            *Only one entity may be selected.*
          default: *selector_entity_single_default_empty
          selector: &selector_value_entity
            entity:
              multiple: *selector_entity_single_multiple
        home_value01_label_color:
          name: Home page - Entity State 01 - Text color
          description: *description_text_color
          default: &default_home_value_color [200, 204, 200]
          selector: *color_selector
        home_value01_icon:
          name: Home page - Entity State 01 - Icon
          description: &description_icon_automatic_default >
            ***Icon Display:** If not specified, an attribute-defined icon will be used, if available. Otherwise, no icon will be shown.*
          default: []
          selector: *selector_icon
        home_value01_icon_color:
          name: Home page - Entity State 01 - Icon color
          description: *description_icon_color
          default: *default_home_value_color
          selector: *color_selector
        home_value01_graph:
          name: Home page - Entity State 01 - Graph
          description: &description_home_value_graph >-
            When enabled, tapping this value (or its icon) opens a graph of the entity over the last 24 hours,
            drawn from the 5-minute means of the Home Assistant recorder statistics.


            *Only sensors with a `state_class` of `measurement` or `measurement_angle` have the mean statistics used by the graph. For other entities the value is not tappable.*
          default: false
          selector: &selector_home_value_graph
            boolean: {}
        home_value01_graph_min:
          name: Home page - Entity State 01 - Graph minimum
          description: &description_home_value_graph_min >-
            Fixed lower bound of the graph. Leave empty for an automatic bound, from the lowest value of the last 24 hours.
          default: ""
          selector: &selector_home_value_graph_bound
            text: {}
        home_value01_graph_max:
          name: Home page - Entity State 01 - Graph maximum
          description: &description_home_value_graph_max >-
            Fixed upper bound of the graph. Leave empty for an automatic bound, from the highest value of the last 24 hours.
          default: ""
          selector: *selector_home_value_graph_bound
        home_value02:
          name: Home page - Entity State 02 - Entity
          description: *description_entity_displayed
          default: *selector_entity_single_default_empty
          selector: *selector_value_entity
        home_value02_label_color:
          name: Home page - Entity State 02 - Text color
          description: *description_text_color
          default: *default_home_value_color
          selector: *color_selector
        home_value02_icon:
          name: Home page - Entity State 02 - Icon
          description: *description_icon_automatic_default
          default: []
          selector: *selector_icon
        home_value02_icon_color:
          name: Home page - Entity State 02 - Icon color
          description: *description_icon_color
          default: *default_home_value_color
          selector: *color_selector
        home_value02_graph:
          name: Home page - Entity State 02 - Graph
          description: *description_home_value_graph
          default: false
          selector: *selector_home_value_graph
        home_value02_graph_min:
          name: Home page - Entity State 02 - Graph minimum
          description: *description_home_value_graph_min
          default: ""
          selector: *selector_home_value_graph_bound
        home_value02_graph_max:
          name: Home page - Entity State 02 - Graph maximum
          description: *description_home_value_graph_max
          default: ""
          selector: *selector_home_value_graph_bound
        home_value03:
          name: Home page - Entity State 03 - Entity
          description: *description_entity_displayed
          default: *selector_entity_single_default_empty
          selector: *selector_value_entity
        home_value03_label_color:
          name: Home page - Entity State 03 - Text color
          description: *description_text_color
          default: *default_home_value_color
          selector: *color_selector
        home_value03_icon:
          name: Home page - Entity State 03 - Icon
          description: *description_icon_automatic_default
          default: []
          selector: *selector_icon
        home_value03_icon_color:
          name: Home page - Entity State 03 - Icon color
          description: *description_icon_color
          default: *default_home_value_color
          selector: *color_selector
        home_value03_graph:
          name: Home page - Entity State 03 - Graph
          description: *description_home_value_graph
          default: false
          selector: *selector_home_value_graph
        home_value03_graph_min:
          name: Home page - Entity State 03 - Graph minimum
          description: *description_home_value_graph_min
          default: ""
          selector: *selector_home_value_graph_bound
        home_value03_graph_max:
          name: Home page - Entity State 03 - Graph maximum
          description: *description_home_value_graph_max
          default: ""
          selector: *selector_home_value_graph_bound
        home_value04:
          name: Home page - Entity State 04 - Entity
          description: *description_entity_displayed
          default: *selector_entity_single_default_empty
          selector: *selector_value_entity
        home_value04_label_color:
          name: Home page - Entity State 04 - Text color
          description: *description_text_color
          default: *default_home_value_color
          selector: *color_selector
        home_value04_icon:
          name: Home page - Entity State 04 - Icon
          description: *description_icon_automatic_default
          default: []
          selector: *selector_icon
        home_value04_icon_color:
          name: Home page - Entity State 04 - Icon color
          description: *description_icon_color
          default: *default_home_value_color
          selector: *color_selector
        home_value04_graph:
          name: Home page - Entity State 04 - Graph
          description: *description_home_value_graph
          default: false
          selector: *selector_home_value_graph
        home_value04_graph_min:
          name: Home page - Entity State 04 - Graph minimum
          description: *description_home_value_graph_min
          default: ""
          selector: *selector_home_value_graph_bound
        home_value04_graph_max:
          name: Home page - Entity State 04 - Graph maximum
          description: *description_home_value_graph_max
          default: ""
          selector: *selector_home_value_graph_bound
    home_page_custom_buttons:
      name: Home page - Custom buttons
      icon: mdi:home
      description: Select the custom buttons for the Home page.
      collapsed: true
      input:
        custom_buttons_font_size:
          name: ' '
          description: >
            # ✅ HOME PAGE - CUSTOM BUTTONS ✅

            Please select the size of the icons shown on the custom buttons.
          default: '8'
          selector:
            select:
              multiple: false
              options:
                - label: 24px
                  value: '7'
                - label: 32px
                  value: '8'
        home_custom_button01:
          name: Home page - Custom button 1 - Entity
          description: &description_home_custom_button_entity >
            Entity which should be controlled.

            *Entities with supported advanced settings will open it's settings page, all other entities will execute the action or toggle when clicked.*

            *Only one entity may be selected.*
          default: *selector_entity_single_default_empty
          selector: &selector_home_custom_button_entity
            entity:
              multiple: *selector_entity_single_multiple
              filter:
                domain:
                  - alarm_control_panel
                  - automation
                  - button
                  - climate
                  - cover
                  - fan
                  - humidifier
                  - input_boolean
                  - input_button
                  - input_select
                  - lawn_mower
                  - light
                  - lock
                  - media_player
                  - remote
                  - scene
                  - script
                  - select
                  - switch
                  - timer
                  - vacuum
                  - water_heater
        home_custom_button01_icon:
          name: Home page - Custom button 1 - Icon
          description: *description_icon_automatic_default
          default: []
          selector: *selector_icon
        home_custom_button01_name:
          name: Home Page - Custom Button 1 - Title
          description: &description_home_custom_button_title >
            Define a title for display on the button's detailed page, if applicable.
            This title will not appear on the Home page but on the detailed page accessed through this button, where supported.

            In the absence of a specified title, the system will default to using the entity's Friendly Name or, failing that, its `entity_id`.
          default: ""
          selector:
            text:
        home_custom_button01_confirm:
          name: Home page - Custom button 1 - Require confirmation
          default: false
          description: &description_ask_for_confirmation >
            When enabled, a confirmation dialog will be shown before the action is executed.
          selector:
            boolean:
        home_custom_button02:
          name: Home page - Custom button 2 - Entity
          description: *description_home_custom_button_entity
          default: *selector_entity_single_default_empty
          selector: *selector_home_custom_button_entity
        home_custom_button02_icon:
          name: Home page - Custom button 2 - Icon
          description: *description_icon_automatic_default
          default: []
          selector: *selector_icon
        home_custom_button02_name:
          name: Home Page - Custom Button 2 - Title
          description: *description_home_custom_button_title
          default: ""
          selector:
            text:
        home_custom_button02_confirm:
          name: Home page - Custom button 2 - Require confirmation
          default: false
          description: *description_ask_for_confirmation
