    notifications:
      name: Notifications
      icon: mdi:email
      collapsed: true
      input:
        home_button04_icon:
          name: Home page - Notification - Icon
          description: "Icon which should be displayed (Default mdi:email)."
          default: mdi:email  # E1ED
          selector: *selector_icon
        home_button04_icon_color01:
          name: Home page - Notification read - Icon color
          description: *description_icon_color
          default: [200, 204, 200]
          selector: *color_selector
        home_button04_icon_color02:
          name: Home page - Notification unread - Icon color
          description: *description_icon_color
          default: [248, 0, 0]  # 63488 Red
          selector: *color_selector
    screensaver_settings:
      name: Screensaver
      icon: mdi:sleep
      description: Select how your panel will behave while sleeping.
      collapsed: true
      input:
        screensaver_display_time:
          name: Screen saver - Display time
          description: >
            Enable the display of time while sleeping (screensaver).


            **Important!**

            1. *Keeping the display always "on" may increase the temperature on your panel,
            requiring adjustments on the **Temperature correction** control to keep consistence with the environment temperature.*

            2. *Please set **Display Brightness Sleep** accordingly under the device's page
            (Settings > Devices & Services > ESPHome) to have the text visible.*
          default: false
          selector:
            boolean:
        screensaver_display_time_font_size:
          name: Screen saver - Display time font size
          description: >
            Font size to be used when displaying the time while sleeping (screensaver).

            ***ATTENTION!!** Some fonts may be limited by unavailable language chars or space in the screen.
            Please fall back to the default size if you have issues.*
          default: '6'
          selector:
            select:
              multiple: false
              options:
                - label: 72px (default)
                  value: '6'
                - label: 112px
                  value: '11'
                - label: 188px
                  value: '12'
        screensaver_display_time_font_color:
          name: Screen saver - Display time font color
          description: "Font color to be used when displaying the time while sleeping (screensaver)."
          default: [64, 64, 64]
          selector: *color_selector
        screensaver_background_color:
          name: Screen saver - Background color
          description: "Background color to be used while sleeping (screensaver)."
          default: [0, 0, 0]
          selector: *color_selector
        wake_up_sensors:
          name: Wake-up sensors
          description: >-
            Select sensors to wake up the panel when the sensor turns `On`.
            The panel is kept on while any of these sensors is `On`.
          default: &selector_entity_multiple_default_empty []
          selector:
            entity:
              multiple: true
              filter:
                domain:
                  - binary_sensor
                device_class:
                  - door
                  - garage_door
                  - lock
                  - motion
                  - occupancy
                  - opening
                  - smoke
                  - sound
                  - vibration
                  - window
    media_player_settings:
      name: Media player
      icon: mdi:movie-cog
      collapsed: true
      input:
        media_player_update_interval:
          name: Media player - Update interval
          description: >
            Interval (msec) to call for an update from the media player entity while the Media Player page is open.
            Each poll forces Home Assistant to refresh the entity, which for polled integrations (Spotify, Sonos, etc.)
            means a real API call to the upstream service. Lower values improve responsiveness but increase load on
            both Home Assistant and the media service; higher values reduce load but the Media Player page can be laggy.
          default: 5000
          selector:
            number:
              min: 500
              max: 60000
              unit_of_measurement: milliseconds
        media_player_update_delay:
          name: Media player - Delay (msec) after entity updade call?
          default: 500
          selector:
            number:
              min: 0
              max: 5000
              unit_of_measurement: milliseconds
    entity_details_pages_settings:
      name: Entity details pages
      icon: mdi:card-account-details-outline
      collapsed: true
      input:
        entity_details_pages_debounce:
          name: Entity details pages - Debounce
          description: >
            Minimum interval (msec) between two redraws of an open entity details page.
            After each redraw the automation waits this long before watching for the next
            change, so a rapidly-changing entity (a dimming light, a running media player)
            cannot redraw the page faster than this. Lower values feel more responsive but
            send more commands to the panel over a serial link that is easily saturated;
            higher values reduce panel load at the cost of a visible lag.
          default: 1000
          selector:
            number:
              min: 250
              max: 10000
              unit_of_measurement: milliseconds
        entity_details_pages_update_interval:
          name: Entity details pages - Fallback update interval
          description: >
            How long (seconds) to wait for a change before redrawing an open entity details
            page anyway. Redraws are normally driven by the entity itself, so this only acts
            as a safety net for updates that arrive without a state change. Lower values
            mean more redundant redraws; higher values mean a missed update can stay on
            screen for longer.
          default: 60
          selector:
            number:
              min: 5
              max: 900
              unit_of_measurement: seconds
        entity_details_pages_max_refreshes:
          name: Entity details pages - Maximum refreshes
          description: >
            Safety limit on how many times an open entity details page can be redrawn before
            the refresh loop gives up. The loop normally ends when the page is closed; this
            only stops it running forever if the panel stops reporting which page it is
            showing. There is no need to change this under normal use.
          default: 3600
          selector:
            number:
              min: 1
              max: 10000
        entity_details_pages_sync_timeout:
          name: Entity details pages - Synchronisation timeout
          description: >
            How long (msec) to wait for the panel to report which page and entity it is
            showing, before giving up on refreshing that page. The panel reports this a
            moment after the page opens, and the refresh cannot start until it arrives.
            Raise this if details pages sometimes do not update on a busy network or a
            heavily loaded Home Assistant instance. There is no need to change it under
            normal use.
          default: 2000
          selector:
            number:
              min: 100
              max: 10000
              unit_of_measurement: milliseconds
    versioning:
      name: Versioning
      icon: mdi:update
      description: >-
        How the Blueprint handles version mismatches between the Blueprint, the ESPHome firmware and the TFT
        file, with optional custom actions for advanced users.
      collapsed: true
      input:
        esphome_version_check_bypass:
          name: Version check - Ignore older ESPHome firmware
          description: >-
            By default the Blueprint stops when the panel's ESPHome firmware is older than the minimum
            version this Blueprint requires, because that firmware may not have registered all the API
            actions the Blueprint calls. Newer releases that keep compatibility with your firmware do not
            stop the Blueprint.


            Enable this to keep the Blueprint running anyway, so the panel stays usable while you update
            your firmware.


            **Attention!** Features that need a newer firmware will not work, and a sequence that reaches
            one of them stops at that point. Everything the firmware does support keeps working.


            *The version mismatch notification is still created, so you do not forget to finish the update.*
          default: false
          selector:
            boolean: {}
        versioning_esphome_outdated_action:
          name: ESPHome firmware outdated - Custom action
          description: >-
            Optional action(s) to run when the panel's ESPHome firmware is older than the minimum version
            this Blueprint requires.


            This runs only when the automations are reloaded (e.g. after re-importing the Blueprint) or when
            Home Assistant starts, and only while the mismatch persists. It does not run when the firmware
            version cannot be determined.


            Variables available in your templates:

            - `min_esphome_version_string`: the minimum firmware version this Blueprint requires.

            - `api_version`: the API version this Blueprint uses, as `[major, minor]`.

            - `esphome_api_version`: the API version reported by the firmware as `[major, minor]`, when
            the run was started by a panel event (empty otherwise).

            - `blueprint_version`: this Blueprint's version, the recommended version to update the firmware
            to (the matching release tag is `v{{ blueprint_version }}`).

            - `esphome_version_string`: the firmware version currently reported by the panel.

            - `nspanel_name`: the panel's ESPHome name, sanitized as used in its action names
            (e.g. `nspanel_kitchen`).

            - `nspanel_full_name`: the panel's display name in Home Assistant.

            - `nspanel_deviceid`: the panel's device ID in Home Assistant.


            **Attention!** These actions run inside the Blueprint: an error stops the current run, and waits
            or delays hold it. For long tasks (e.g. compiling and installing a firmware), call a script with
            `script.turn_on`, which returns immediately.
          default: []
          selector:
            action: {}
        versioning_tft_outdated_action:
          name: TFT file outdated - Custom action
          description: >-
            Optional action(s) to run when the panel reports a TFT file older than its ESPHome firmware
            requires.


            This runs when the panel boots and reports its versions, after the Blueprint and the ESPHome
            firmware versions are checked.


            Variables available in your templates:

            - `versions.tft`: the TFT version currently on the panel.

            - `versions.tft_min`: the minimum TFT version required by the firmware.

            - `versions.esphome`: the firmware version reported by the panel.

            - `nspanel_name`, `nspanel_full_name` and `nspanel_deviceid`: the panel's identification, as
            described in the ESPHome firmware action above.


            *If the Upload TFT add-on is set to update the TFT automatically, the panel will already start an
            update on its own. Use this action for notifications or your own integrations, not to start a
            second upload.*


            **Attention!** These actions run inside the Blueprint: an error stops the current run, and waits
            or delays hold it. For long tasks, call a script with `script.turn_on`, which returns immediately.
          default: []
          selector:
            action: {}
        versioning_blueprint_outdated_action:
          name: Blueprint outdated - Custom action
          description: >-
            Optional action(s) to run when the panel's ESPHome firmware requires a newer version of this
            Blueprint, or reports an API version this Blueprint no longer supports.


            This runs when the panel boots and reports its versions.


            Variables available in your templates:

            - `blueprint_version`: this Blueprint's version.

            - `versions.blueprint_min`: the minimum Blueprint version required by the firmware.

            - `versions.esphome`: the firmware version reported by the panel.

            - `api_version` and `esphome_api_version`: the API version used by this Blueprint and
            the one reported by the firmware, as `[major, minor]`.

            - `nspanel_name`, `nspanel_full_name` and `nspanel_deviceid`: the panel's identification, as
            described in the ESPHome firmware action above.


            *Home Assistant has no action to re-import a Blueprint, so this is mostly useful for notifications.*


            **Attention!** These actions run inside the Blueprint: an error stops the current run, and waits
            or delays hold it. For long tasks, call a script with `script.turn_on`, which returns immediately.
          default: []
          selector:
            action: {}
    advanced_settings:
      name: Advanced settings
      icon: mdi:cogs
      collapsed: true
      input:
        unavailable_behavior:
          name: Unavailable entities - Button appearance
          description: >-
            Please select how a button should be shown when the entity it is bound to reports
            `unavailable`.


            This applies to every button bound to an entity: the button pages, the custom buttons on
            the climate page and the custom buttons on the home page.


            *Grey out* keeps the button in place with its own icon greyed, so the layout does not move
            and the button is visibly not actionable. *Hide* removes it from the page, leaving an empty
            slot. *Show as off* is the previous behaviour, where an unavailable entity is
            indistinguishable from one that is simply off.


            With *Grey out* or *Hide*, tapping an unavailable button does nothing.


            *An entity reporting `unknown` is not affected: a button or script entity that has never
            run reports `unknown` while remaining perfectly usable.*
          default: '1'
          selector:
            select:
              multiple: false
              options:
                - label: Show as off
                  value: '0'
                - label: Grey out
                  value: '1'
                - label: Hide
                  value: '2'
        button_tap_behavior:
          name: Buttons - Tap behavior
          description: >-
            Please select what a short tap does on a button bound to an entity, on the button pages and
            on the custom buttons of the home page.


            *Toggle* performs the entity's action (on/off, open/close) and opens the detail page only
            with a long press. Entities that cannot be toggled, like climate or media players, always
            open their detail page.


            *Open details when adjustable* opens the detail page on a tap for covers with position or
            tilt, fans with speed, oscillation or preset modes, and lights with brightness or color, so their
            controls are one tap away. Entities that are only on/off still toggle.


            *Hardware buttons and the custom buttons on the climate page are not affected.*
          default: toggle
          selector:
            select:
              multiple: false
              options:
                - label: Toggle
                  value: toggle
                - label: Open details when adjustable
                  value: details_when_adjustable
        value_hide_when_zero:
          name: Values - Hide when zero
          description: >-
            When enabled, entity states that round to `0` (and their icons)
            are hidden from the display. Only applies to numeric states.
          default: false
          selector:
            boolean: {}
        icon_color_fallback_on:
          name: Icon fallback color when state is "**ON**"
          description: >
            *General*

            *Which default color should be used for icons when the state is **ON** while a custom color is not selected and the domain does not provides a state-based color?*
          default: [200, 204, 200]
          selector: *color_selector
        icon_color_fallback_off:
          name: Icon fallback color when state is "**OFF**"
          description: >
            *General*

            *Which default color should be used fo icons when the state is **OFF**?*
          default: [92, 92, 92]
          selector: *color_selector
        button_back_font_size:
          name: Back/Close Button Icon Size
          description: >-
            Select the size of the icon displayed on the Back/Close button in the top-right corner of each page.
          default: '8'
          selector:
            select:
              multiple: false
              options:
                - label: 24px
                  value: '7'
                - label: 32px
                  value: '8'
                - label: 48px
                  value: '10'
        delay:
          name: Command Delay
          description: >
            Small delay between sequential Home Assistant action calls to the panel.
            Helps ensure ordering when many calls are dispatched in quick succession.
            The Nextion-side command pacer handles display buffer protection, so this value can usually stay low.
            Increase only if you observe missing or out-of-order commands on busy networks.
          default: 10
          selector:
            number:
              min: 0
              max: 25
              step: 1
              unit_of_measurement: milliseconds
              mode: box
        delay_boot:
          name: Command Delay During Boot
          description: >
            Delay between sequential Home Assistant service calls to the panel during the boot sequence.
            Boot involves a large burst of commands (settings, icons, component initialization),
            so a slightly higher value than the runtime delay is a safe default.
            The default of 50 ms works well for most setups.
            Values above 100 ms are rarely needed.
          default: 50
          selector:
            number:
              min: 0
              max: 250
              step: 1
              unit_of_measurement: milliseconds
              mode: box
        domain_automation_button_action:
          name: System settings - Button action for automation entities
          description: >
            Select the button action when associated to `automation.xxx` entities.

            ***Toggle:** Enable/disable the automation (default).*

            ***Trigger:** Run the automation (ignoring conditions).*
          default: "toggle"
          selector:
            select:
              multiple: false
              options:
                - label: "Toggle (default)"
                  value: "toggle"
                - label: "Trigger"
                  value: "trigger"
        device_name_override:
          name: Action Prefix Override
          description: >
            **USE WITH CAUTION**

            Manually specify the prefix used when calling ESPHome actions
            (e.g., `esphome.PREFIX_wake_up`).

            This overrides the automatic detection, which reads the prefix
            from the panel's `Device Name` diagnostic sensor (derived from
            the ESPHome `name:` field, not `friendly_name:`).

            Typical use case: the device was renamed in Home Assistant's UI
            after pairing, so the device/entity names in HA no longer match
            the ESPHome `name:` field that actions are registered under.

            **Requirements:**
            - Must match the ESPHome `name:` field (case-sensitive before sanitization)
            - Will be sanitized: non-alphanumeric characters replaced with `_`, collapsed, lowercased
            - Leave empty to use automatic detection (recommended)

            **Example:** ESPHome `name: NSPanel-Kitchen` → enter `NSPanel-Kitchen`,
            sanitized to `nspanel_kitchen`, producing actions like
            `esphome.nspanel_kitchen_wake_up`.
          default: ""
          selector:
            text:
              multiline: false
              multiple: false
              type: text

mode: parallel
max: 50

trigger_variables:
  nspanel_deviceid: !input nspanel_name
  device_name_override: !input device_name_override
  nspanel_entities: '{{ device_entities(nspanel_deviceid) }}'

  device_name_sensor: >-
    {%- set m = nspanel_entities | select("search", "^sensor\\..+_device_name$") | list %}
    {{ m[0] if m | count > 0 else "" }}

  entity_prefix: >-
    {%- if device_name_sensor | length > 0 -%}
      {{ device_name_sensor.split('.')[1] | replace('_device_name', '') }}
    {%- else -%}
      {{
        nspanel_deviceid
        | default("nspanel")
        | string
        | regex_replace("[^a-zA-Z0-9]", "_")
        | regex_replace("_+", "_")
        | lower
      }}
    {%- endif %}

  relay01_entity: >-
    {%- set m = nspanel_entities | select("search", "^switch\\..+_relay_1$") | list %}
    {{ m[0] if m | count > 0 else "switch." ~ entity_prefix ~ "_relay_1" }}
  relay02_entity: >-
    {%- set m = nspanel_entities | select("search", "^switch\\..+_relay_2$") | list %}
    {{ m[0] if m | count > 0 else "switch." ~ entity_prefix ~ "_relay_2" }}

  currentpage: >-
    {%- set m = nspanel_entities | select("search", "^sensor\\..+_current_page$") | list %}
    {{ m[0] if m | count > 0 else "sensor." ~ entity_prefix ~ "_current_page" }}

  background_type: >-
    {%- set m = nspanel_entities | select("search", "^select\\..+_background_type$") | list %}
    {{ m[0] if m | count > 0 else "select." ~ entity_prefix ~ "_background_type" }}

  nspaneltemp: >-
    {%- set m = nspanel_entities | select("search", "^sensor\\..+_temperature$") | list %}
    {{ m[0] if m | count > 0 else "sensor." ~ entity_prefix ~ "_temperature" }}

  # The embedded thermostat is recognized only by its default `_thermostat` suffix. A renamed or
  # localized entity_id is handled as an external climate entity (#640).
  thermostat_embedded: >-
    {%- set m = nspanel_entities | select("search", "^climate\\..+_thermostat$") | list %}
    {{ m[0] if m | count > 0 else "climate." ~ entity_prefix ~ "_thermostat" }}

  detailed_entity: >-
    {%- set m = nspanel_entities | select("search", "^sensor\\..+_detailed_entity$") | list %}
    {{ m[0] if m | count > 0 else "sensor." ~ entity_prefix ~ "_detailed_entity" }}

  utilities_line_reference:
    page01:
      main: !input utilities_page01_main_line_reference
      group01: !input utilities_page01_group01_line_reference
      group02: !input utilities_page01_group02_line_reference
      group03: !input utilities_page01_group03_line_reference
      group04: !input utilities_page01_group04_line_reference
      group05: !input utilities_page01_group05_line_reference
      group06: !input utilities_page01_group06_line_reference

variables:
  # Blueprint version will be following release version defined automatically when merging to main
  # There's no need to change it here
  blueprint_version: 2026.11.15

  # Minimum ESPHome firmware version required by this Blueprint (the Blueprint -> ESPHome contract).
  # Set it to 'next' when a change makes the Blueprint depend on a newer firmware, e.g. a new API
  # action or a new field in an existing one. The versioning workflow replaces 'next' by the version
  # being released. Releases that keep the contract leave it unchanged, so older firmware keeps working.
  # While it is 'next' (development builds), the minimum firmware check is skipped.
  min_esphome_version: 2026.11.9

  # API version [MAJOR, MINOR] this Blueprint uses, matching api_version in
  # esphome/nspanel_esphome_version.yaml. Raise MINOR when the Blueprint starts calling a new API action,
  # and MAJOR when it follows a firmware change that removed an action or changed its parameters.
  # Kept as a list: Home Assistant would convert "1.10" to the number 1.1.
  api_version: [2, 0]

  # Firmware version as reported by the ESPHome integration in the device registry.
  # Format: "<project_version> (ESPHome <compiler_version>)", e.g. "2026.8.5 (ESPHome 2026.6.0)".
  # The device registry is used instead of a sensor so the value stays readable
  # while the panel is offline.
  esphome_sw_version: >-
    {{ device_attr(nspanel_deviceid, 'sw_version') | default('', true) | string | trim }}
  esphome_version_string: >-
    {{ esphome_sw_version.split(' ')[0] if esphome_sw_version | length > 0 else '' }}
  # Parsed into an integer tuple; empty list means "could not determine".
  esphome_version_parts: >-
    {{
      esphome_version_string.split('.') | map('int') | list
      if esphome_version_string.split('.') | count == 3
      and esphome_version_string.split('.') | select('match', '^[0-9]+$') | list | count == 3
      else []
    }}
  # AwesomeVersion object for comparisons, derived from the device registry
  # sw_version attribute. Falls back to 0.0.0 when the version is unparseable,
  # matching the fail-closed behaviour of esphome_compatible.
  esphome_version: >-
    {{
      version(esphome_version_string)
      if esphome_version_parts | count == 3
      else version("0.0.0")
    }}
  blueprint_version_parts: >-
    {{ (blueprint_version | string).split('.') | map('int') | list }}
  # Parsed into an integer tuple. The unresolved 'next' sentinel (development
  # builds) and any unparseable value fall back to this Blueprint's own version,
  # the strictest requirement. While the sentinel is unresolved, this is only
  # used in notifications, as the check is skipped (see min_esphome_version_pending).
  min_esphome_version_parts: >-
    {{
      (min_esphome_version | string).split('.') | map('int') | list
      if (min_esphome_version | string).split('.') | count == 3
      and (min_esphome_version | string).split('.') | select('match', '^[0-9]+$') | list | count == 3
      else blueprint_version_parts
    }}
  # Resolved minimum version, for notifications and custom actions.
  min_esphome_version_string: "{{ min_esphome_version_parts | join('.') }}"
  # True while min_esphome_version is the unresolved 'next' sentinel (development builds).
  # The required firmware version is not known yet, so the minimum version check is skipped,
  # while the API version check still applies. The versioning workflow resolves it on release.
  min_esphome_version_pending: "{{ (min_esphome_version | string | trim) == 'next' }}"
  # API version reported by the firmware, parsed into [MAJOR, MINOR]. Only panel
  # events carry it, so it is empty for runs started by any other trigger, and for
  # firmware that does not report it yet.
  # Kept as a list: a rendered "1.10" would be converted to the number 1.1.
  esphome_api_version: >-
    {%- set raw = (
      trigger.event.data.api_version | default('', true) | string
      if trigger is defined and trigger.id == 'nspanel_event'
      and trigger.event is defined and trigger.event.data is defined
      else ''
    ) -%}
    {{
      raw.split('.') | map('int') | list
      if raw.split('.') | count == 2
      and raw.split('.') | select('match', '^[0-9]+$') | list | count == 2
      else []
    }}
  # The firmware provides an older API than this Blueprint uses (an action the
  # Blueprint calls may not exist yet).
  esphome_api_outdated: >-
    {{
      esphome_api_version | count == 2
      and (
        esphome_api_version[0] < api_version[0]
        or (esphome_api_version[0] == api_version[0]
            and esphome_api_version[1] < api_version[1])
      )
    }}
  # The firmware removed or changed actions this Blueprint calls (a newer API
  # MAJOR), so the Blueprint must be updated.
  blueprint_api_outdated: >-
    {{
      esphome_api_version | count == 2
      and esphome_api_version[0] > api_version[0]
    }}
  # ESPHome must be equal to or newer than min_esphome_version and, when reported,
  # provide the API version this Blueprint uses. The documented update order is
  # ESPHome -> TFT -> Blueprint, so a Blueprint requiring a newer firmware means
  # the user skipped a step and new API actions may not exist yet.
  # Fails closed: an unparseable firmware version blocks all action calls.
  esphome_compatible: >-
    {{
      esphome_version_parts | count == 3
      and (
        min_esphome_version_pending
        or esphome_version_parts[0] > min_esphome_version_parts[0]
        or (esphome_version_parts[0] == min_esphome_version_parts[0]
            and esphome_version_parts[1] > min_esphome_version_parts[1])
        or (esphome_version_parts[0] == min_esphome_version_parts[0]
            and esphome_version_parts[1] == min_esphome_version_parts[1]
            and esphome_version_parts[2] >= min_esphome_version_parts[2])
      )
      and not esphome_api_outdated
    }}
  # User escape hatch for the version gate. When enabled, the Blueprint keeps
  # running against an outdated firmware instead of stopping, accepting that
  # individual action calls may fail until the firmware is updated.
  esphome_version_check_bypass: !input esphome_version_check_bypass
  # Effective gate: the run is only blocked when the versions are incompatible
  # and the user has not opted out.
  esphome_gate_ok: '{{ esphome_compatible or esphome_version_check_bypass }}'

