      special_icons: { blank: "\uFFFF", void: "\uFFFF", unknown: "\uE027", unavailable: "\uE027" }
      # Icon and color of an entity by domain and state, used by "Variable Entity" (&variable_entity).
      # Data instead of template branches: it is stored once per automation, while the templates using it
      # are copied wherever the anchor is used (issue #657).
      #   states:       state (or `attribute` value) -> { color: name in nextion.color, icon: glyph }
      #   actions:      climate only: first entry whose `match` is found in hvac_action (or the state)
      #   attribute:    attribute to look up instead of the state (state when the attribute is missing)
      #   default_icon: present when the domain overrides the entity's own icon; used for states without
      #                 an icon, null for the domain's default icon
      # A state without `color` uses the entity's default color (entity_icon_color_tmp).
      entity_state_styles:
        alarm_control_panel:
          default_icon: "\uEECC"                                 # mdi:shield-alert-outline
          states:
            disarmed: { color: "off", icon: "\uE99B" }           # mdi:shield-off-outline
            disarming: { color: amber, icon: "\uE99B" }          # mdi:shield-off-outline
            armed_home: { color: green, icon: "\uECCA" }         # mdi:shield-home-outline
            armed_away: { color: green, icon: "\uECCB" }         # mdi:shield-lock-outline
            armed_night: { color: green, icon: "\uF828" }        # mdi:shield-moon-outline
            armed_vacation: { color: green, icon: "\uECC6" }     # mdi:shield-airplane-outline
            armed_bypass: { color: green, icon: "\uE77F" }       # mdi:shield-half-full
            pending: { color: amber, icon: "\uE498" }            # mdi:shield-outline
            arming: { color: amber, icon: "\uE498" }             # mdi:shield-outline
            triggered: { color: red }
        climate:
          default_icon: null
          actions:
            - { match: "off", color: "off", icon: "\uE392" }     # mdi:thermostat
            - { match: heat_cool, color: amber, icon: "\uE069" }  # mdi:autorenew
            - { match: heat, color: deep_orange, icon: "\uE50F" }  # mdi:thermometer-lines (heat, heating)
            - { match: cool, color: blue, icon: "\uE716" }       # mdi:snowflake (cool, cooling)
            - { match: dry, color: orange, icon: "\uE58D" }      # mdi:water-percent (dry, drying)
            - { match: fan, color: cyan, icon: "\uE20F" }        # mdi:fan (fan, fan_only)
            - { match: auto, color: green, icon: "\uF8F1" }      # mdi:refresh-auto
            - { match: idle, color: "off", icon: "\uE50E" }      # mdi:thermometer
        lock:
          default_icon: "\uE8ED"                                 # mdi:lock-alert
          states:
            locked: { color: green, icon: "\uE33D" }             # mdi:lock
            unlocked: { color: red, icon: "\uEFC5" }             # mdi:lock-open-variant
        timer:
          states:
            active: { color: green }
            paused: { color: amber }
        water_heater:
          attribute: operation_mode
          default_icon: null
          states:
            "off": { color: "off", icon: "\uF1B3" }              # mdi:water-boiler-off
            "on": { color: orange, icon: "\uEF91" }              # mdi:water-boiler
            eco: { color: green, icon: "\uE329" }                # mdi:leaf
            electric: { color: amber, icon: "\uF40A" }           # mdi:lightning-bolt
            gas: { color: deep_orange, icon: "\uE237" }          # mdi:fire
            heat_pump: { color: blue, icon: "\uFA42" }           # mdi:heat-pump
            performance: { color: red, icon: "\uFA44" }          # mdi:heat-wave
            high_demand: { color: red, icon: "\uE4C4" }          # mdi:speedometer
      # yamllint enable rule:line-length rule:braces

      ##### Nextion dict ####
      nextion:
