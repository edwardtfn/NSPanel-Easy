                                          - '{{ nspanel_event.page == "buttonpage03" }}'
                                          - '{{ nspanel_event.component == "button02" }}'
                                        sequence: !input entity18_custom_action
                                      - alias: Custom action - Button 19
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage03" }}'
                                          - '{{ nspanel_event.component == "button03" }}'
                                        sequence: !input entity19_custom_action
                                      - alias: Custom action - Button 20
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage03" }}'
                                          - '{{ nspanel_event.component == "button04" }}'
                                        sequence: !input entity20_custom_action
                                      - alias: Custom action - Button 21
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage03" }}'
                                          - '{{ nspanel_event.component == "button05" }}'
                                        sequence: !input entity21_custom_action
                                      - alias: Custom action - Button 22
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage03" }}'
                                          - '{{ nspanel_event.component == "button06" }}'
                                        sequence: !input entity22_custom_action
                                      - alias: Custom action - Button 23
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage03" }}'
                                          - '{{ nspanel_event.component == "button07" }}'
                                        sequence: !input entity23_custom_action
                                      - alias: Custom action - Button 24
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage03" }}'
                                          - '{{ nspanel_event.component == "button08" }}'
                                        sequence: !input entity24_custom_action
                                      - alias: Custom action - Button 25
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage04" }}'
                                          - '{{ nspanel_event.component == "button01" }}'
                                        sequence: !input entity25_custom_action
                                      - alias: Custom action - Button 26
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage04" }}'
                                          - '{{ nspanel_event.component == "button02" }}'
                                        sequence: !input entity26_custom_action
                                      - alias: Custom action - Button 27
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage04" }}'
                                          - '{{ nspanel_event.component == "button03" }}'
                                        sequence: !input entity27_custom_action
                                      - alias: Custom action - Button 28
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage04" }}'
                                          - '{{ nspanel_event.component == "button04" }}'
                                        sequence: !input entity28_custom_action
                                      - alias: Custom action - Button 29
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage04" }}'
                                          - '{{ nspanel_event.component == "button05" }}'
                                        sequence: !input entity29_custom_action
                                      - alias: Custom action - Button 30
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage04" }}'
                                          - '{{ nspanel_event.component == "button06" }}'
                                        sequence: !input entity30_custom_action
                                      - alias: Custom action - Button 31
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage04" }}'
                                          - '{{ nspanel_event.component == "button07" }}'
                                        sequence: !input entity31_custom_action
                                      - alias: Custom action - Button 32
                                        conditions:
                                          - '{{ nspanel_event.page == "buttonpage04" }}'
                                          - '{{ nspanel_event.component == "button08" }}'
                                        sequence: !input entity32_custom_action
                                  - *short_press_action_call
                                  - alias: Re-render current page buttons after click
                                    sequence:
                                      - delay:
                                          milliseconds: 300
                                      - *variables_page_buttons
                                      # Only the buttons the click can change are redrawn: the clicked button and the
                                      # buttons sharing its entity or State Indicator Entity, e.g. scene buttons tracked
                                      # by one input_select. Other entities changed by a custom action are redrawn by
                                      # their state triggers. Available momentary entities without a State Indicator Entity
                                      # are left out, as their state trigger shows them on for 800 ms and then off.
                                      # Buttons a state trigger has drawn since the click are skipped: the newest update of their
                                      # entity or State Indicator Entity came after the click, with a state that trigger draws.
                                      # Nothing is skipped while other runs of this automation were running at the click or are running
                                      # now, as a state trigger run may have been dropped at the maximum number of runs, or while
                                      # state triggers are blocked (no device name).
                                      - repeat:
                                          for_each: >
                                            {%- set ns = namespace(items=[], click_entities=[last_click_button.entity]) -%}
                                            {%- if last_click_button.state_entity is defined
                                                  and last_click_button.state_entity is string
                                                  and last_click_button.state_entity | length > 3
                                                  and "." in last_click_button.state_entity -%}
                                              {%- set ns.click_entities = ns.click_entities + [last_click_button.state_entity] -%}
                                            {%- endif -%}
                                            {%- set skip_drawn = has_value(device_name_sensor)
                                                  and this.attributes.current | int(1) == 0
                                                  and state_attr(this.entity_id, "current") == 1 -%}
                                            {%- for item in buttons_pages.buttons
                                                  | selectattr("page", "defined")
                                                  | selectattr("page", "eq", nspanel_event.page)
                                                  | selectattr("entity", "defined")
                                                  | rejectattr("entity", "eq", []) -%}
                                              {%- set item_state_entity = item.state_entity
                                                    if item.state_entity is defined
                                                        and item.state_entity is string
                                                        and item.state_entity | length > 3
                                                        and "." in item.state_entity
                                                    else item.entity -%}
                                              {%- if (item.entity in ns.click_entities or item_state_entity in ns.click_entities)
                                                    and not (item_state_entity == item.entity
                                                      and item.entity.split(".")[0] in ["automation", "button", "input_button", "remote", "scene", "script"]
                                                      and states(item.entity) not in ["unavailable"]) -%}
                                                {%- set newest = [
                                                        states[item.entity] if "." in item.entity else none,
                                                        states[item_state_entity] if "." in item_state_entity else none
                                                      ]
                                                      | reject("none") | sort(attribute="last_updated") | last | default(none) -%}
                                                {%- if not (skip_drawn
                                                      and newest is not none
                                                      and newest.last_updated > trigger.event.time_fired
                                                      and (newest.state not in enum.states.unknown or newest.state == "unavailable")) -%}
                                                  {%- set ns.items = ns.items + [item] -%}
                                                {%- endif -%}
                                              {%- endif -%}
                                            {%- endfor -%}
                                            {{ ns.items }}
                                          sequence: *display_button_page_button

                      - alias: Climate page
                        conditions:
                          - '{{ nspanel_event is defined }}'
                          - '{{ nspanel_event.page is defined }}'
                          - '{{ nspanel_event.page == pages.climate }}'
                        sequence:
                          - *climate_custom_buttons_variables
                          - variables:
                              last_click_button: '{{ climate_custom_buttons | selectattr("component", "defined") | selectattr("component", "eq", nspanel_event.component) | list }}'
                          - condition: '{{ last_click_button | count > 0 }}'
                          - variables:
                              last_click_button: '{{ last_click_button | first }}'
                              entity_domain: >
                                {{
                                  last_click_button.entity.split(".")[0] | default("unknown")
                                  if
                                    last_click_button is defined and
                                    last_click_button.entity is defined and
                                    last_click_button.entity is string and
                                    last_click_button.entity | length > 0 and
                                    (
                                      last_click_button.entity == "embedded_climate" or
                                      last_click_button.entity.split(".") | count == 2
                                    )
                                  else "unknown"
                                }}
                          - choose:
                              - alias: Long click
                                conditions:
                                  - '{{ nspanel_event.command == "long_click" }}'
                                sequence:
                                  - choose:
                                      - conditions: '{{ nspanel_event.component == "button08" }}'
                                        sequence: !input climate_button08_hold_custom_action
                                      - conditions: '{{ nspanel_event.component == "button09" }}'
                                        sequence: !input climate_button09_hold_custom_action
                              - alias: Short click
                                conditions:
                                  - '{{ nspanel_event.command == "short_click" }}'
                                  - '{{ entity_domain not in domains_functionality.detailed_only }}'
                                sequence:
                                  - *short_press_action_call

                      - alias: Fan page mode buttons
                        # The display only reports which slot was pressed. Its meaning is derived
                        # from the entity with the same rules as the page render: speed buttons
                        # (highest speed on top, off at the bottom) for up to 3 speeds, otherwise
                        # preset modes when there is no speed control at all.
                        conditions:
                          - '{{ nspanel_event.page is defined and nspanel_event.page == pages.fan }}'
                          - '{{ nspanel_event.component is defined and nspanel_event.component is match "mode_bt[1-5]$" }}'
                          - '{{ nspanel_event.entity is defined and nspanel_event.entity is string and nspanel_event.entity is match "fan\\." }}'
                          - '{{ states[nspanel_event.entity] is not none }}'
                        sequence:
                          - variables:
                              # Action names are templated, as a literal fan.* action fails validation
                              # on systems without any fan integration loaded.
                              fan_actions:
                                turn_off: "fan.turn_off"
                                set_percentage: "fan.set_percentage"
                                set_preset_mode: "fan.set_preset_mode"
                              fan_slot: '{{ nspanel_event.component[7:] | int(0) }}'
                              fan_supported_features: '{{ state_attr(nspanel_event.entity, "supported_features") | int(0) }}'
                              fan_percentage_step: '{{ state_attr(nspanel_event.entity, "percentage_step") | float(0) }}'
                              fan_preset_modes_attr: '{{ state_attr(nspanel_event.entity, "preset_modes") }}'
                          - variables:
                              fan_speed_steps: >-
                                {{
                                  (100 / fan_percentage_step) | round(0) | int(0)
                                  if fan_percentage_step > 0
                                  else 0
                                }}
                              fan_preset_modes: >-
                                {{
                                  fan_preset_modes_attr
                                  if
                                    fan_preset_modes_attr is iterable and
                                    fan_preset_modes_attr is not string
                                  else []
                                }}
                          - variables:
                              fan_speed_available: '{{ fan_speed_steps > 0 and fan_supported_features | bitwise_and(1) > 0 }}'
                          - variables:
                              fan_speed_buttons: '{{ fan_speed_available and fan_speed_steps <= 3 }}'
                          - choose:
                              - alias: Speed button
                                conditions:
                                  - '{{ fan_speed_buttons }}'
                                  - '{{ fan_slot >= 1 and fan_slot <= fan_speed_steps + 1 }}'
                                sequence:
                                  - variables:
                                      fan_speed_index: '{{ fan_speed_steps + 1 - fan_slot }}'  # 0 = off
                                  - if: '{{ fan_speed_index == 0 }}'
                                    then:
                                      - action: '{{ fan_actions.turn_off }}'
                                        target:
                                          entity_id: '{{ nspanel_event.entity }}'
                                        continue_on_error: true
                                    else:
                                      # Integer division, as HA's ordered-list helpers: 3 speeds -> 33, 66, 100
                                      - action: '{{ fan_actions.set_percentage }}'
                                        data:
                                          percentage: '{{ (fan_speed_index * 100) // fan_speed_steps }}'
                                        target:
                                          entity_id: '{{ nspanel_event.entity }}'
                                        continue_on_error: true
                              - alias: Preset mode button
                                conditions:
                                  - '{{ not fan_speed_available }}'
                                  - '{{ fan_supported_features | bitwise_and(8) > 0 }}'
                                  - '{{ fan_slot >= 1 and fan_slot <= fan_preset_modes | count }}'
                                sequence:
                                  - action: '{{ fan_actions.set_preset_mode }}'
                                    data:
                                      preset_mode: '{{ fan_preset_modes[fan_slot - 1] }}'
                                    target:
                                      entity_id: '{{ nspanel_event.entity }}'
                                    continue_on_error: true

                      - alias: Home page custom buttons
                        conditions:
                          - '{{ nspanel_event.page == pages.home }}'
                        sequence:
                          - variables:
                              last_click_button: '{{ home_page.custom_buttons | selectattr("component", "defined") | selectattr("component", "eq", nspanel_event.component) | list }}'
                          - condition: '{{ last_click_button is defined }}'
                          - condition: '{{ last_click_button | count > 0 }}'
                          - variables:
                              last_click_button: '{{ last_click_button | first }}'
                          - condition: '{{ last_click_button is defined }}'
                          - condition: '{{ last_click_button.entity is defined }}'
                          - alias: variable_entity_input
                            variables:
                              entity_id: '{{ last_click_button.entity }}'
                              overlap:
                                icon: >
                                  {{
                                    last_click_button.icon
                                    if
                                      last_click_button.icon is defined and
                                      last_click_button.icon is string and
                                      last_click_button.icon | length > 0 and
                                      last_click_button.icon is match "mdi:" and
                                      ((last_click_button.icon.split("mdi:") | last) in special_icons or ("," ~ (last_click_button.icon.split("mdi:") | last) ~ ",") in all_icon_names)
                                    else
                                      None
                                  }}
                                name: '{{ last_click_button.name if last_click_button.name is defined else None }}'
                          - *variables_light_modes
                          - condition: '{{ entity_id_valid }}'
                          - choose:
                              - alias: Long click
                                conditions:
                                  - '{{ nspanel_event.command == "long_click" or click_opens_details or entity_domain == "timer" }}'
                                  - '{{ entity_domain in domains_functionality.detailed }}'
                                  - '{{ entity_domain != "light" or light_has_details }}'
                                  - '{{ entity_domain != "fan" or supported_features | bitwise_and(11) > 0 }}'
                                sequence:
                                  - variables:
                                      back_page: '{{ pages.home }}'
                                  - *variable_entity
                                  - *entity_details_show
                              - alias: Short click
                                conditions:
                                  - '{{ nspanel_event.command == "short_click" }}'
                                  - '{{ entity_domain not in domains_functionality.detailed_only }}'
                                sequence:
                                  - *short_press_action_call

              - alias: Versions mismatch
                conditions:
                  - '{{ nspanel_event.type == "version"}}'
                sequence:
                  - variables:
                      versions:
                        blueprint: '{{ nspanel_event.blueprint | default("") }}'
                        esphome: '{{ nspanel_event.esphome | default("") }}'
                        tft: >
                          {{
                            nspanel_event.tft | float(0)
                            if nspanel_event.tft is defined
                            else 0
                          }}
                        tft_min: >
                          {{
                            nspanel_event.min_tft_version | float(0)
                            if nspanel_event.min_tft_version is defined
                            else 0
                          }}
                        blueprint_min: >
                          {{
                            nspanel_event.min_blueprint_version | default("")
                            if nspanel_event.min_blueprint_version is defined
                            else ""
                          }}
                      # Parse CalVer strings into comparable integer tuples.
                      # This is required because lexicographic comparison fails for
                      # CalVer when month digits differ in length (e.g. "4" vs "10").
                      # versions.blueprint is the blueprint version echoed back by ESPHome,
                      # used to verify the blueprint version ESPHome is talking to.
                      blueprint_reported_parts: >-
                        {{
                          versions.blueprint.split('.')
                          | map('int')
                          | list
                          if versions.blueprint | length >= 8
                          and not is_number(versions.blueprint)
                          else [0, 0, 0]
                        }}
                      blueprint_min_parts: >-
                        {{
                          versions.blueprint_min.split('.')
                          | map('int')
                          | list
                          if versions.blueprint_min | length >= 8
                          and not is_number(versions.blueprint_min)
                          else [0, 0, 0]
                        }}
                      # True when blueprint_reported >= blueprint_min (compatible)
                      blueprint_compatible: >-
                        {{
                          blueprint_reported_parts[0] > blueprint_min_parts[0]
                          or (blueprint_reported_parts[0] == blueprint_min_parts[0]
                              and blueprint_reported_parts[1] > blueprint_min_parts[1])
                          or (blueprint_reported_parts[0] == blueprint_min_parts[0]
                              and blueprint_reported_parts[1] == blueprint_min_parts[1]
                              and blueprint_reported_parts[2] >= blueprint_min_parts[2])
                        }}
                      # True when blueprint_min > blueprint_reported, meaning the ESPHome
                      # firmware requires a Blueprint version newer than what it received.
                      # In this case the Blueprint (not ESPHome) needs to be updated.
                      blueprint_behind_esphome_req: >-
                        {{
                          blueprint_min_parts[0] > blueprint_reported_parts[0]
                          or (blueprint_min_parts[0] == blueprint_reported_parts[0]
                              and blueprint_min_parts[1] > blueprint_reported_parts[1])
                          or (blueprint_min_parts[0] == blueprint_reported_parts[0]
                              and blueprint_min_parts[1] == blueprint_reported_parts[1]
                              and blueprint_min_parts[2] > blueprint_reported_parts[2])
                        }}
                  - choose:
                      # yamllint disable rule:line-length
                      - alias: All versions OK
                        conditions:
                          # Blueprint version is a valid CalVer string
                          - >-
                            {{
                              versions.blueprint | length >= 8
                              and not is_number(versions.blueprint)
                            }}
                          - '{{ versions.blueprint == blueprint_version }}'
                          # Blueprint version reported by ESPHome is compatible
                          # with the minimum version required by the firmware
                          - '{{ blueprint_compatible }}'
                          # TFT version is valid and compatible
                          - '{{ versions.tft > 0 and versions.tft_min > 0 }}'
                          - '{{ versions.tft >= versions.tft_min }}'
                        sequence:
                          - action: persistent_notification.dismiss
                            data:
                              notification_id: 'NSPanel_Easy_version_mismatch_{{ nspanel_name }}'
                            continue_on_error: true

                      - alias: Blueprint version not detected
                        conditions:
                          # Blueprint version is missing or not a valid CalVer string,
                          # meaning ESPHome could not receive or parse the blueprint version.
                          - >-
                            {{
                              versions.blueprint | length < 8
                              or is_number(versions.blueprint)
                              or versions.blueprint != blueprint_version
                            }}
                        sequence:
                          - action: persistent_notification.create
                            data:
                              notification_id: 'NSPanel_Easy_version_mismatch_{{ nspanel_name }}'
                              title: NSPanel Easy - Communication Issue
                              message: >
                                The ESPHome firmware is unable to verify the Blueprint version for the NSPanel.
                                  - Panel Details: **{{ nspanel_full_name }}**

                                  - Reported Blueprint version: {{ versions.blueprint if versions.blueprint | length > 0 else "Unknown" }}

                                  - Current Blueprint version: {{ blueprint_version }}

                                  - Expected Blueprint version: {{ versions.blueprint_min if versions.blueprint_min | length > 0 else "Unknown" }}


                                Troubleshooting steps and more information are available in the online documentation: [Panel startup issues - Blueprint is not detected](https://github.com/edwardtfn/NSPanel-Easy/blob/main/docs/error_initializing.md#blueprint-is-not-detected).
                            continue_on_error: true

                      - alias: Blueprint version mismatch
                        conditions:
                          # ESPHome firmware requires a Blueprint version newer than what it
                          # received (blueprint_min > blueprint_reported). This happens when
                          # ESPHome is updated and its min_blueprint_version moves forward
                          # but the Blueprint in HA has not been updated yet.
                          # The stale-report case (blueprint_reported != blueprint_version)
                          # is intentionally left to the 'Blueprint version not detected'
                          # branch above, as it is a communication/sync issue, not a
                          # Blueprint version mismatch requiring a re-import.
                          - >-
                            {{
                              versions.blueprint | length >= 8
                              and not is_number(versions.blueprint)
                            }}
                          - '{{ blueprint_behind_esphome_req }}'
                        sequence:
                          - action: persistent_notification.create
                            data:
                              notification_id: 'NSPanel_Easy_version_mismatch_{{ nspanel_name }}'
                              title: "NSPanel Easy - Version mismatch: Blueprint"
                              message: >
                                Your NSPanel Easy Blueprint version is outdated.

                                - Current Blueprint version: {{ blueprint_version }}

                                - Expected version: {{ versions.blueprint_min }}, based on the panel **{{ nspanel_full_name }}**.

                                ---

                                **How to Resolve This Issue**

                                1. Navigate to your [Blueprint Dashboard](/config/blueprint/dashboard).

                                2. Locate the blueprint named "**NSPanel Easy Configuration**".

                                3. Click on the corresponding 3-dot menu.

                                4. Choose "**Re-import blueprint**".

                                5. Select the "**Re-import**" button.


                                *For more detailed instructions, please refer to the online documentation: [How to Update Blueprint](https://github.com/edwardtfn/NSPanel-Easy/blob/main/docs/howto.md#update-blueprint).*
                            continue_on_error: true
                          - alias: Custom action - Blueprint outdated
                            sequence: !input versioning_blueprint_outdated_action

                      - alias: TFT is older than expected
                        conditions:
                          - '{{ versions.tft > 0 }}'
                          - '{{ versions.tft_min > 0 }}'
                          - '{{ versions.tft_min > versions.tft }}'
                        sequence:
                          - choose:
                              - alias: TFT Upload add-on missing
                                conditions:
                                  - '{{ nspanel_event.upload_tft_installed is defined }}'
                                  - '{{ not (nspanel_event.upload_tft_installed | bool) }}'
                                sequence:
                                  - action: persistent_notification.create
                                    data:
                                      notification_id: 'NSPanel_Easy_version_mismatch_{{ nspanel_name }}'
                                      title: "NSPanel Easy - Version mismatch: Missing TFT upload add-on"
                                      message: >
                                        The TFT version on your NSPanel is outdated for the panel **{{ nspanel_full_name }}**,
                                        and you don't have installed the add-on TFT Upload required to fix this.

                                        - Current TFT version: {{ nspanel_event.tft }}

                                        - Expected version: {{ versions.tft_min }}

                                        ---

                                        To resolve this issue, please flash your device including the add-on Upload TFT.
                                        For instructions, please [click here](https://github.com/edwardtfn/NSPanel-Easy/blob/main/docs/addon_upload_tft.md).
                                    continue_on_error: true
                              - alias: TFT Upload auto-upload enabled
                                conditions:
                                  - '{{ nspanel_event.upload_tft_installed is defined }}'
                                  - '{{ nspanel_event.upload_tft_installed | bool }}'
                                  - '{{ nspanel_event.upload_tft_auto is defined }}'
                                  - '{{ nspanel_event.upload_tft_auto | bool }}'
                                sequence:
                                  - action: persistent_notification.create
                                    data:
                                      notification_id: 'NSPanel_Easy_version_mismatch_{{ nspanel_name }}'
                                      title: "NSPanel Easy - Version mismatch: TFT display"
                                      message: >
                                        The TFT version on your NSPanel is outdated for the panel **{{ nspanel_full_name }}**.

                                        - Current TFT version: {{ nspanel_event.tft }}

                                        - Expected version: {{ versions.tft_min }}

                                        ---

                                        Your panel is set to auto-update the TFT.
                                        {%- if nspanel_event.upload_tft_wait_ms is defined -%}
                                        The update will start approximately {{ (nspanel_event.upload_tft_wait_ms | int / 1000) | round(0) | int }} seconds after boot.
                                        {%- endif -%}

                                        You can also press "**Update TFT Display**" on the [device page](/config/devices/device/{{ nspanel_deviceid }})
                                        to start the update immediately.

                                        If this message persists after the update completes,
                                        please report an [issue on GitHub](https://github.com/edwardtfn/NSPanel-Easy/issues).
                                    continue_on_error: true
                            default:
                              - action: persistent_notification.create
                                data:
                                  notification_id: 'NSPanel_Easy_version_mismatch_{{ nspanel_name }}'
                                  title: "NSPanel Easy - Version mismatch: TFT display"
                                  message: >
                                    The TFT version on your NSPanel is outdated for the panel **{{ nspanel_full_name }}**.

                                    - Current TFT version: {{ nspanel_event.tft }}

                                    - Expected version: {{ versions.tft_min }}

                                    ---

                                    **How to Resolve This Issue**

                                    1. Navigate to the [device page](/config/devices/device/{{ nspanel_deviceid }}).

                                    2. In the "**Configuration**" section, find the option labeled "**Update TFT Display - Model**".

                                    3. Click "**Update TFT Display**" to initiate the update process.

                                    4. Please wait patiently until your panel restarts, indicating the update is complete.


                                    *For more detailed instructions, please refer to the online documentation:
                                    [How to Update TFT](https://github.com/edwardtfn/NSPanel-Easy/blob/main/docs/howto.md#update-tft).*
                                continue_on_error: true
                          - alias: Custom action - TFT outdated
                            sequence: !input versioning_tft_outdated_action
                      # yamllint disable rule:comments-indentation
                      # yamllint enable rule:line-length
                      # yamllint enable rule:comments-indentation

              - alias: Other events
                conditions:
                  - '{{ nspanel_event.type == "generic" }}'
                sequence:
                  - choose:
                      - alias: light settings  # rgb_color, brightness, color_temp_kelvin - This was kept until we find a solution to call with rgb_color directly from ESPHome
                        conditions:
                          - '{{ nspanel_event.page == pages.light }}'
                          - '{{ nspanel_event.component in ["rgb_color", "brightness_pct", "color_temp_kelvin"] }}'
                          - '{{ nspanel_event.entity is defined and nspanel_event.entity is string and nspanel_event.entity | length > 0 }}'
                        sequence:
                          - action: light.turn_on
                            data:
                              entity_id: '{{ nspanel_event.entity }}'
                              '{{ nspanel_event.component }}': '{{ nspanel_event.value }}'
                            continue_on_error: true

                      - alias: Jump to climate page
                        conditions:
                          - '{{ nspanel_event.page == pages.home }} '
                          - '{{ nspanel_event.component == "climate" }}'
                          - '{{ nspanel_event.value == "release" }}'
                          - '{{ climate | length > 0 }} '
                        sequence:
                          - variables:
                              entity_id: '{{ climate }}'
                              back_page: '{{ pages.home }}'
                          - *variable_entity
                          - *entity_details_show

                      - alias: Graph page - Newest values
                        conditions:
                          - '{{ nspanel_event.page == pages.graph }}'
                          - '{{ nspanel_event.component == "graph" }}'
                          - '{{ nspanel_event.event == "refresh" }}'
                        sequence:
                          - variables:
                              entity_id: '{{ nspanel_event.entity | default("", true) }}'
                              entity_id_valid: *variable_entity_id_valid
                              # Start of the newest period the panel already shows
                              graph_since: '{{ nspanel_event.value | int(0) }}'
                          - condition: '{{ entity_id_valid }}'
                          # The entity the panel shows, with the graph enabled
                          - condition: '{{ states(detailed_entity) == entity_id }}'
                          - *condition_graph_enabled
                          - variables: *variables_graph_period
                          - condition: '{{ graph_end_ts > graph_start_ts }}'
                          - *graph_get_statistics
                          - variables: *variables_graph_values
                          - condition: '{{ graph_values | count > 1 }}'
                          - action: 'esphome.{{ action_prefix }}_component_text_list'
                            data:
                              page: mem
                              id: graph_append
                              txt_list: '{{ graph_values }}'
                            continue_on_error: true

      - alias: Automation reloaded
        conditions:
          - condition: trigger
            id:
              - automation_reloaded
              - ha_started
        sequence:
          - if: '{{ states.sensor | selectattr("entity_id", "eq", device_name_sensor) | list | count > 0 }}'
            then:
              - action: persistent_notification.dismiss
                data:
                  notification_id: 'NSPanel_Easy_device_name_sensor_missing_{{ nspanel_name }}'
                continue_on_error: true
            else:
              - action: persistent_notification.create
                data:
                  notification_id: 'NSPanel_Easy_device_name_sensor_missing_{{ nspanel_name }}'
                  title: NSPanel sensor unavailable
                  message: >
                    The sensor "Device name" (`{{ device_name_sensor }}`) is unavailable.

                    - Panel: {{ nspanel_full_name }}

                    - Blueprint version: {{ blueprint_version }}

                    - Sensor's expected entity_id: {{ device_name_sensor }}


                    How to fix this:

                      1. Go to the [device page](/config/devices/device/{{ nspanel_deviceid }})

                      2. Find the sensor "Device name" under the "Diagnostic" area (it might be in the "sensors not shown" group)

                      3. Enable the sensor

                      4. Wait a bit until the sensor starts providing a value (it shouldn't take more than a minute)

                      5. Restart the panel, so it receives its settings again

                      6. Go to [Developer Tools](/developer-tools/yaml) and click the button "Automations" to reload your automations and clear this notification
                continue_on_error: true

          # Home Assistant fires automation_reloaded for every reload, with no data about which automations
          # were reloaded, and replaces only the automations whose configuration changed. A replaced automation
          # starts with a new state, so an older state means this panel's settings did not change and are
          # already on the panel. Skipping it keeps an unrelated automation save from sending the full settings
          # to every panel at once (#636). The check above still runs, so a reload clears its notification.
          # Automations receive `this` as the state dict, where last_changed is an ISO string; attribute access
          # and as_timestamp() also accept a state object with a datetime, so either form is read.
          - condition: >-
              {%- set replaced = as_timestamp(this.last_changed, 0) if this is defined and this else 0 -%}
              {{ trigger.id != "automation_reloaded" or replaced == 0 or (as_timestamp(now()) - replaced) < 60 }}

          # The panel's actions are named after its device name. Without the "Device name" sensor (panel not
          # connected yet, restarting, or the sensor disabled) and without an override, the name can only be
          # guessed from the entity ids, which no longer match after a rename and lead to calls of actions that
          # don't exist. The panel requests its settings itself once it connects, so nothing is lost by stopping.
          - condition: >-
              {{ (device_name_override is string and device_name_override | length > 0) or has_value(device_name_sensor) }}

          - delay: >  # Prevents all panels updating simultaneously in large systems
              {% set ns = namespace(panels=[]) %}
              {% for s in states.sensor | selectattr("entity_id", "search", "_device_name$") %}
                {% set did = device_id(s.entity_id) %}
                {% if did and device_attr(did, "model") == "NSPanel-Easy" %}
                  {% set ns.panels = ns.panels + [s.entity_id] %}
                {% endif %}
              {% endfor %}
              {{ (4 * ns.panels.index(device_name_sensor)) if (device_name_sensor in ns.panels) else 0 }}

          ##### Update global settings (as user may have changed something) #####
          # Sent through "Boot init" in a run of its own, instead of a second copy of the global settings here,
          # which Home Assistant would expand into the automation again (about 90 kB, #657)
          - alias: Request global settings
            event: nspanel_easy_settings_request
            event_data:
              device_id: '{{ nspanel_deviceid }}'
              device_name: '{{ action_prefix }}'  # Read by `action_prefix` in the run handling the request
              type: boot
              step: reload

          # A home page value slot left without an entity is cleared, otherwise the last value sent
          # stays on screen after the entity is removed (#351). The text is cleared instead of hidden,
          # as `vis` is not kept across page changes, while the text of the global home page components is.
          # This runs only here, when the Blueprint settings may have changed, and not on every home page
          # refresh, so values sent through the API to unconfigured slots are kept (#591).
          - alias: Home page values - Clear unconfigured
            repeat:
              for_each: >
                {%- set ns = namespace(items=[]) -%}
                {%- for item in home_page.entity_value -%}
                  {%- if not (item.entity is defined and item.entity is string and item.entity.split(".") | count == 2) -%}
                    {%- set ns.items = ns.items + [item] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.items }}
              sequence:
                - action: 'esphome.{{ action_prefix }}_component_text_list'
                  data:
                    page: home
                    id: '{{ repeat.item.component }}'
                    txt_list:
                      - ""
                  continue_on_error: true
                - *delay_default
                - action: 'esphome.{{ action_prefix }}_component_text_list'
                  data:
                    page: home
                    id: '{{ repeat.item.component }}_icon'
                    txt_list:
                      - ""
                  continue_on_error: true
                - *delay_default

          - choose:
              ## PAGE HOME ##
              - conditions: '{{ pages.current == pages.home }}'
                sequence: *refresh_page_home

              ## PAGE BUTTON PAGES 01 - 04 ##
              - conditions: '{{ pages.current in pages.buttonpages }}'
                sequence: *refresh_page_buttonpage

              ## ENTITY PAGES ##
              - conditions: '{{ pages.current in pages.entitypages }}'
                sequence: *refresh_entity_pages

      - alias: Update button's entities
        conditions:
          - condition: trigger
            id: trigger_buttonpage_state
          - '{{ trigger.to_state.state not in enum.states.unknown or "unavailable" in [trigger.from_state.state, trigger.to_state.state] }}'
          - condition: or
            conditions:
              - '{{ pages.current in pages.buttonpages }}'
              - '{{ pages.current in pages.detailed_entity }}'
              - '{{ detailed_entity | length > 0 and trigger.entity_id == states(detailed_entity) }}'
        sequence:
          - variables:
              detailed_entity_state: '{{ states(detailed_entity) if detailed_entity | length > 0 else "" }}'
              # Activation: a script or automation run started less than momentary_duration_ms before the update (its start, or the end
              # of a short run), an automation is turned on or off, a button or input button is pressed, a scene is activated.
              # Remotes are not filtered.
              momentary_activated: >
                {% set domain = trigger.entity_id.split(".")[0] %}
                {% if domain not in ["automation", "button", "input_button", "scene", "script"] %}
                  {{ true }}
                {% elif trigger.from_state is none or trigger.to_state is none %}
                  {{ false }}
                {% elif domain in ["automation", "script"] %}
                  {% set last_triggered = trigger.to_state.attributes.get("last_triggered") %}
                  {{
                    (as_timestamp(trigger.to_state.last_updated) - as_timestamp(last_triggered, 0) < momentary_duration_ms / 1000)
                    or (domain == "automation" and [trigger.from_state.state, trigger.to_state.state] in [["off", "on"], ["on", "off"]])
                  }}
                {% else %}
                  {{ trigger.to_state.state != trigger.from_state.state and trigger.from_state.state != "unavailable" }}
                {% endif %}
          - choose:
              - alias: Buttons pages
                conditions:
                  - '{{ pages.current in pages.buttonpages }}'
                sequence:
                  - *variables_page_buttons
                  - repeat:
                      for_each: >
                        {% set trigger_eid = trigger.entity_id %}
                        {% set page_buttons = buttons_pages.buttons
                          | selectattr("page", "defined")
                          | selectattr("page", "eq", pages.current)
                          | selectattr("entity", "defined")
                          | rejectattr("entity", "eq", [])
                          | rejectattr("entity", "eq", "")
                          | list %}
                        {# Buttons triggered by their main entity #}
                        {% set by_entity = page_buttons
                          | selectattr("entity", "eq", trigger_eid)
                          | list %}
                        {# Buttons triggered by their state entity, excluding the ones
                            already matched above to avoid duplicated updates.
                            `unique` cannot be used here as dicts are not hashable. #}
                        {% set by_state = page_buttons
                          | rejectattr("entity", "eq", trigger_eid)
                          | selectattr("state_entity", "defined")
                          | selectattr("state_entity", "eq", trigger_eid)
                          | list %}
                        {{ by_entity + by_state }}
                      sequence: *display_button_page_button

      - alias: Update climate page
        conditions:
          - condition: trigger
            id: climate_state
        sequence:
          - *update_home_page_climate_chip
          - if:
              - '{{ trigger.event.data.new_state.state not in enum.states.unknown }}'
              - '{{ pages.current == pages.climate }}'
              - '{{ detailed_entity | length > 0 }}'
              - '{{ trigger.event.data.entity_id == states(detailed_entity) }}'
            then:
              - variables:
                  climate_entity: '{{ trigger.event.data.entity_id }}'
                  hvac_modes: '{{ state_attr(climate_entity, "hvac_modes") }}'
              - *climate-update_slider
              - *climate-update_buttons
              - *climate-update_preset

      - alias: Update climate page custom buttons
        conditions:
          - condition: trigger
            id:
              - climate_button08_state
              - climate_button09_state
          - '{{ pages.current == pages.climate }}'
        sequence:
          - *climate_custom_buttons

      - alias: Update climate page values
        conditions:
          - condition: trigger
            id: trigger_climatepage_value_state
          - '{{ pages.current == pages.climate }}'
        sequence:
          - *variables-climate_page
          - repeat:
              for_each: >
                {{
                  climate_page_entities
                  | selectattr("entity", "defined")
                  | selectattr("entity", "eq", trigger.entity_id)
                  | list
                }}
              sequence:
                - *display_value

      - alias: Update entities pages
        conditions:
          - condition: trigger
            id: trigger_entitypage_state
          - '{{ pages.current in pages.entitypages }}'
        sequence:
          - *variables-entity_pages
          - repeat:
              for_each: >
                {{
                  entities_pages.entities
                  | selectattr("page", "defined")
                  | selectattr("page", "eq", pages.current)
                  | selectattr("entity", "defined")
                  | selectattr("entity", "eq", trigger.entity_id)
                  | list
                }}
              sequence: *update_entity_page_entity

      - alias: Update hardware buttons states
        conditions:
          - condition: trigger
            id:
              - left_button_state
              - left_button_alt_state
              - right_button_state
              - right_button_alt_state
        sequence:
          - *variables_hardware
          - variables:
              button_name: '{{ "left" if trigger.id in ["left_button_state", "left_button_alt_state"] else "right" }}'
              button_state: &button_state_var >
                {{
                  (
                    states(hardware.buttons[button_name].state_entity) | default("unavailable")
                    if hardware.buttons[button_name].state_entity_is_valid
                    else
                      (
                        states(hardware.buttons[button_name].entity) | default("unavailable")
                        if hardware.buttons[button_name].entity_is_valid
                        else "unavailable"
                      )
                  ) in enum.states.on
                }}
          - action: 'esphome.{{ action_prefix }}_component_val'
            data:
              page: mem
              id: >
                {{
                  "hw_bt_left"
                  if trigger.id in ["left_button_state", "left_button_alt_state"]
                  else "hw_bt_right"
                }}
              val: '{{ 1 if button_state else 0 }}'
            continue_on_error: true
          # Re-evaluate the entity state after a short settle window;
          # if it changed meanwhile, update the Nextion indicator again.
          - delay:
              milliseconds: 250
          - variables:
              button_state_new: *button_state_var
          - if: '{{ button_state_new != button_state }}'
            then:
              - action: 'esphome.{{ action_prefix }}_component_val'
                data:
                  page: mem
                  id: >
                    {{
                      "hw_bt_left"
                      if trigger.id in ["left_button_state", "left_button_alt_state"]
                      else "hw_bt_right"
                    }}
                  val: '{{ 1 if button_state_new else 0 }}'
                continue_on_error: true

      - alias: Update home page - Entities
        conditions:
          - condition: trigger
            id: home_values_state
        sequence:
          - repeat:
              for_each: >
                {{
                  home_page.entity_value
                  | selectattr("entity", "defined")
                  | selectattr("entity", "eq", trigger.entity_id)
                  | list
                }}
              sequence:
                - *display_value
          - alias: Graph page - Current value
            if:
              - '{{ pages.current == pages.graph }}'
              - '{{ states(detailed_entity) == trigger.entity_id }}'
            then:
              - variables:
                  entity_id: '{{ trigger.entity_id }}'
              - *variable_entity
              - variables:
                  unit_of_measurement_raw: '{{ state_attr(entity_id, "unit_of_measurement") | default("") }}'
                  unit_of_measurement: >
                    {{
                      unit_of_measurement_raw
                      if unit_of_measurement_raw and unit_of_measurement_raw is string and unit_of_measurement_raw | length > 0
                      else ""
                    }}
              - *graph_value_now

      - alias: Update QR code
        conditions:
          - condition: trigger
            id: qrcode_changed
        sequence:
          - *qrcode_update

      - alias: Update utilities pages
        conditions:
          - condition: trigger
            id: utilities_page
          - '{{ pages.current == pages.utilities }}'
        sequence:
          - variables:
              list1: '{{ pages_utilities.groups | selectattr("value1", "defined") | selectattr("value1", "eq", trigger.entity_id) | list }}'
              list2: '{{ pages_utilities.groups | selectattr("value2", "defined") | selectattr("value2", "eq", trigger.entity_id) | list }}'
              list3: '{{ pages_utilities.groups | selectattr("line_ref", "defined") | selectattr("line_ref", "eq", trigger.entity_id) | list }}'
              full_list: '{{ list1 + list2 + list3 }}'
              groups: '{{ full_list | map(attribute="name") | unique | list }}'
          - repeat:
              for_each: '{{ pages_utilities.groups | selectattr("name", "in", groups) | list }}'
              sequence: *refresh_page_utilities_group

      - alias: Update water heater page values
        conditions:
          - condition: trigger
            id: trigger_water_heater_page_value_state
          - '{{ pages.current == pages.water_heater }}'
          - '{{ states(detailed_entity).split(".")[0] == "water_heater" }}'  # The page may be showing a humidifier
        sequence:
          - *variables_water_heater_page
          - repeat:
              for_each: >
                {{
                  water_heater_page_entities
                  | selectattr("entity", "defined")
                  | selectattr("entity", "eq", trigger.entity_id)
                  | list
                }}
              sequence:
                - *display_value

      - alias: Update humidifier page values
        conditions:
          - condition: trigger
            id: trigger_humidifier_page_value_state
          - '{{ pages.current == pages.water_heater }}'  # Humidifiers are shown on the water heater page
          - '{{ states(detailed_entity).split(".")[0] == "humidifier" }}'
        sequence:
          - *variables_humidifier_page
          - repeat:
              for_each: >
                {{
                  humidifier_page_entities
                  | selectattr("entity", "defined")
                  | selectattr("entity", "eq", trigger.entity_id)
                  | list
                }}
              sequence:
                - *display_value
