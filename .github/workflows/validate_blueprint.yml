---
name: Validate Blueprint YAML

# yamllint disable-line rule:truthy
on:
  pull_request:
    # labeled/unlabeled re-run the checks when the equivalence tests' skip label changes
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code_scan:
    name: Validate Blueprint YAML
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          # This job runs scripts from the PR, so it must not keep the Git credentials
          persist-credentials: false

      - name: Get changed files
        id: changed
        if: github.event_name == 'pull_request'
        uses: step-security/changed-files@v47.0.5
        with:
          files: |
            nspanel_easy_blueprint.yaml
            .github/scripts/blueprint_metrics.py
            .github/scripts/test_*.py
            .github/workflows/validate_blueprint.yml
            .github/requirements.txt
            components/nspanel_easy/icon_rules.h
            components/nspanel_easy/all_icons.h

      - name: Set up Python
        if: github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true'
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true'
        run: pip install -r .github/requirements.txt

      - name: Validate nspanel_easy_blueprint.yaml
        if: github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true'
        run: yamllint -c "./.rules/yamllint.yml" nspanel_easy_blueprint.yaml

      # The metrics go to the job summary, compared with the target branch on pull requests. They are informative,
      # except the number of distinct templates: above --max-distinct the step fails, keeping a margin below Spook's
      # template cache of 1,024 entries, which the Blueprint shares with the rest of the installation (issue #636).
      # Set close to the current count, so the reductions do not slip back; raise it only as a deliberate decision.
      - name: Blueprint metrics
        id: metrics
        if: github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base_args=()
          if [[ -n "$BASE_REF" ]] && git show "origin/$BASE_REF:nspanel_easy_blueprint.yaml" > "$RUNNER_TEMP/base_blueprint.yaml"; then
            base_args=(--base "$RUNNER_TEMP/base_blueprint.yaml")
          fi  # if a base Blueprint is available
          status=0
          python3 .github/scripts/blueprint_metrics.py nspanel_easy_blueprint.yaml "${base_args[@]}" \
            --markdown --output "$RUNNER_TEMP/blueprint_metrics.md" --max-distinct 700 || status=$?
          # The report is also written when the limit fails the step, so it always reaches the summary
          if [[ -f "$RUNNER_TEMP/blueprint_metrics.md" ]]; then
            cat "$RUNNER_TEMP/blueprint_metrics.md" >> "$GITHUB_STEP_SUMMARY"
          fi  # if the report was written
          exit "$status"

      # The PR comment is posted by pr_metrics_comment.yml (workflow_run), which has the write permission that
      # this workflow lacks on PRs from forks. Only the PR number, a flag and the report are passed on, as an artifact.
      # It also runs when the Blueprint is unchanged, so that an existing comment is updated when a PR reverts it.
      - name: Prepare metrics for the PR comment
        id: comment_data
        if: >-
          !cancelled()
          && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          comment_dir="$RUNNER_TEMP/blueprint_metrics_comment"
          mkdir -p "$comment_dir"
          echo "$PR_NUMBER" > "$comment_dir/pr_number"
          # The checkout is the merge commit, so this diff holds only the changes of this PR
          if git diff --quiet "origin/$BASE_REF" HEAD -- nspanel_easy_blueprint.yaml; then
            echo "false" > "$comment_dir/blueprint_changed"
          else
            echo "true" > "$comment_dir/blueprint_changed"
          fi  # if the Blueprint is unchanged
          if [[ -f "$RUNNER_TEMP/blueprint_metrics.md" ]]; then
            cp "$RUNNER_TEMP/blueprint_metrics.md" "$comment_dir/report.md"
          fi  # if the report was written
          echo "dir=$comment_dir" >> "$GITHUB_OUTPUT"

      - name: Upload metrics for the PR comment
        if: >-
          !cancelled()
          && steps.comment_data.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: blueprint-metrics
          path: ${{ steps.comment_data.outputs.dir }}
          retention-days: 1
          if-no-files-found: error

      # Equivalence tests: each .github/scripts/test_*.py renders part of the Blueprint in this PR and in the target branch
      # and fails when what the panel receives differs. For an intended change, add the label 'Blueprint: behavior change'.
      - name: Blueprint equivalence tests
        if: >-
          github.event_name == 'pull_request'
          && steps.changed.outputs.any_changed == 'true'
          && !contains(github.event.pull_request.labels.*.name, 'Blueprint: behavior change')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/$BASE_REF:nspanel_easy_blueprint.yaml" > "$RUNNER_TEMP/reference_blueprint.yaml"
          status=0
          for test_script in .github/scripts/test_*.py; do
            echo "::group::${test_script}"
            if ! python3 "$test_script" "$RUNNER_TEMP/reference_blueprint.yaml" nspanel_easy_blueprint.yaml; then
              echo "::error file=${test_script}::Rendering differs from ${BASE_REF}. If intended, add the label 'Blueprint: behavior change'."
              status=1
            fi  # if the test failed
            echo "::endgroup::"
          done
          exit "$status"

  all-checks-passed:
    name: Validate Blueprint YAML / All checks passed
    runs-on: ubuntu-latest
    needs: code_scan
    if: always()
    steps:
      - name: Check result
        run: |
          echo "code_scan: ${{ needs.code_scan.result }}"
          case "${{ needs.code_scan.result }}" in
            success|skipped) exit 0 ;;
            *)               exit 1 ;;
          esac
...
