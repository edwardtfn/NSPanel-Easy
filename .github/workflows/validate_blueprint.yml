---
name: Validate Blueprint YAML

# yamllint disable-line rule:truthy
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code_scan:
    name: Validate Blueprint YAML
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - name: Get changed files
        id: changed
        if: github.event_name == 'pull_request'
        uses: step-security/changed-files@v47.0.5
        with:
          files: |
            nspanel_easy_blueprint.yaml
            .github/scripts/blueprint_metrics.py
            .github/workflows/validate_blueprint.yml

      - name: Set up Python
        if: github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true'
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true'
        run: pip install -r .github/requirements.txt

      - name: Validate nspanel_easy_blueprint.yaml
        if: github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true'
        run: yamllint -c "./.rules/yamllint.yml" nspanel_easy_blueprint.yaml

      # Informative only: the metrics go to the job summary, compared with the target branch on pull requests
      - name: Blueprint metrics
        if: github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base_args=()
          if [[ -n "$BASE_REF" ]] && git show "origin/$BASE_REF:nspanel_easy_blueprint.yaml" > "$RUNNER_TEMP/base_blueprint.yaml"; then
            base_args=(--base "$RUNNER_TEMP/base_blueprint.yaml")
          fi  # if a base Blueprint is available
          python3 .github/scripts/blueprint_metrics.py nspanel_easy_blueprint.yaml "${base_args[@]}" \
            --markdown --output "$GITHUB_STEP_SUMMARY"

  all-checks-passed:
    name: Validate Blueprint YAML / All checks passed
    runs-on: ubuntu-latest
    needs: code_scan
    if: always()
    steps:
      - name: Check result
        run: |
          echo "code_scan: ${{ needs.code_scan.result }}"
          case "${{ needs.code_scan.result }}" in
            success|skipped) exit 0 ;;
            *)               exit 1 ;;
          esac
...
