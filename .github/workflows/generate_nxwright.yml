---
name: Generate nxwright

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
      - 'hmi/**.hmi'
      - 'hmi/dev/nxwright/**'
      - 'hmi/dev/scripts/**'
      - '.github/workflows/generate_nxwright.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Generation — executes pull request code, so it stays read-only
  # ===========================================================================
  generate:
    name: Regenerate nxwright source from HMI
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.drift.outputs.changed }}
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: '1'
          persist-credentials: false
          repository: >-
            ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      # Invoked through bash: the exec bit does not survive every Windows clone.
      - name: Regenerate nxwright source
        run: bash hmi/dev/scripts/generate_nxwright.sh

      # status, not diff: a new panel or page is untracked and invisible to diff.
      - name: Detect drift
        id: drift
        run: |
          if [ -z "$(git status --porcelain -- hmi/dev/nxwright)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nxwright output is up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager status --short -- hmi/dev/nxwright
          fi

      - name: Upload regenerated output
        if: steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nxwright
          path: hmi/dev/nxwright
          retention-days: 1

  # ===========================================================================
  # Write-back — never executes pull request code, so it may hold write access
  # ===========================================================================
  commit:
    name: Commit regenerated output
    needs: generate
    if: >-
      needs.generate.outputs.changed == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          ref: ${{ github.head_ref }}

      # Wipe first so pages removed from the HMI disappear from the tree.
      - name: Drop the previous output
        run: rm -rf hmi/dev/nxwright

      - name: Download regenerated output
        uses: actions/download-artifact@v8
        with:
          name: nxwright
          path: hmi/dev/nxwright

      - name: Commit regenerated output
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: Regenerate nxwright output"
          file_pattern: 'hmi/dev/nxwright'

  # ===========================================================================
  # Fork pull requests get a read-only token, so drift must be fixed by hand
  # ===========================================================================
  report:
    name: Report uncommittable drift
    needs: generate
    if: >-
      needs.generate.outputs.changed == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Report drift
        run: |
          echo "::error::nxwright output is out of date. Run" \
               "hmi/dev/scripts/generate_nxwright.sh and commit the result."
          exit 1
...
