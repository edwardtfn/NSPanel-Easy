---
name: Build ESPHome

# yamllint disable-line rule:truthy
on:
  pull_request:
  schedule:
    # Run daily at 10:00 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch:

env:
  # Repository URL and ref for external_components resolution.
  # For fork PRs, points to the fork so the PR code is actually tested.
  REF_URL: >-
    https://github.com/${{
      github.event.pull_request.head.repo.full_name
      || github.repository
    }}
  REF_NAME: ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Detect whether any files relevant to this workflow have changed, and
  # select the build tests affected by them (see select_esphome_tests.py).
  # On schedule and workflow_dispatch, always proceed with every test.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed.outputs.any_changed || steps.fallback.outputs.any_changed }}
      matrix: ${{ steps.select.outputs.matrix }}
      prebuilt_matrix: ${{ steps.select.outputs.prebuilt_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed files
        id: changed
        if: github.event_name == 'pull_request'
        uses: step-security/changed-files@v47.0.5
        with:
          files: |
            nspanel_esphome*.yaml
            esphome/nspanel_esphome*.yaml
            prebuilt/nspanel_esphome*.yaml
            prebuilt/wall_display*.yaml
            .github/workflows/esphome_build.yml
            .github/requirements.txt
            .rules/yamllint.yml
            .test/*.yaml
            **/*.h
            **/*.c
            **/*.cpp
            **/*.py

      # On schedule/workflow_dispatch the step above is skipped, so
      # any_changed is empty — treat that as "yes, proceed".
      - name: Set any_changed for non-PR triggers
        id: fallback
        if: github.event_name != 'pull_request'
        run: echo "any_changed=true" >> "$GITHUB_OUTPUT"

      # Deleted files are included, so a test that still includes a removed
      # file is selected (and fails as expected).
      - name: Select tests
        id: select
        if: steps.changed.outputs.any_changed == 'true' || github.event_name != 'pull_request'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_and_modified_files }}
          SELECT_ALL: ${{ github.event_name != 'pull_request' }}
        run: python3 .github/scripts/select_esphome_tests.py

      # The build sizes are posted to the PR by pr_metrics_comment.yml (workflow_run), which has the write permission
      # that this workflow lacks on PRs from forks. It reads the sizes from the job logs; only the PR number goes here.
      - name: Save PR number for the PR comment
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/esphome_build_pr"
          echo "$PR_NUMBER" > "$RUNNER_TEMP/esphome_build_pr/pr_number"

      - name: Upload PR number for the PR comment
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: esphome-build-pr
          path: ${{ runner.temp }}/esphome_build_pr
          retention-days: 1
          if-no-files-found: error

  # ===========================================================================
  # Code scan
  # ===========================================================================
  code_scan:
    name: Code scan (YAML)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any_changed == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r .github/requirements.txt

      - name: Validate YAML files
        run: find . \( -name "*.yaml" -o -name "*.yml" \) -exec yamllint -c ./.rules/yamllint.yml {} +

  # ===========================================================================
  # ESPHome Latest
  # ===========================================================================
  build_latest:
    name: ${{ matrix.firmware.name }} (latest)
    runs-on: ubuntu-latest
    needs: changes
    # Skipped when no test is selected (an empty matrix is an error).
    if: needs.changes.outputs.matrix != '' && needs.changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        firmware: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build firmware
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: ${{ matrix.firmware.yaml-file }}
          substitutions: |
            ref_name=${{ env.REF_NAME }}
            ref_url=${{ env.REF_URL }}

  # ===========================================================================
  # ESPHome Dev
  # ===========================================================================
  build_dev:
    name: ${{ matrix.firmware.name }} (dev)
    runs-on: ubuntu-latest
    needs: changes
    # Skipped when no test is selected (an empty matrix is an error).
    if: needs.changes.outputs.matrix != '' && needs.changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        firmware: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build firmware
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: ${{ matrix.firmware.yaml-file }}
          version: dev
          substitutions: |
            ref_name=${{ env.REF_NAME }}
            ref_url=${{ env.REF_URL }}

  # ===========================================================================
  # Pre-built firmware - ESPHome Latest
  # ===========================================================================
  build_prebuilt_latest:
    name: ${{ matrix.firmware.name }} - Pre-built (latest)
    runs-on: ubuntu-latest
    needs: changes
    # Skipped when no test is selected (an empty matrix is an error).
    if: needs.changes.outputs.prebuilt_matrix != '' && needs.changes.outputs.prebuilt_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        firmware: ${{ fromJSON(needs.changes.outputs.prebuilt_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build firmware
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: ${{ matrix.firmware.yaml-file }}
          substitutions: |
            ref_name=${{ env.REF_NAME }}
            ref_url=${{ env.REF_URL }}
      - name: Verify compiled output
        run: |
          # Locate the binary produced by the build action.
          # Using find avoids hardcoding the device name from the YAML.
          BIN=$(find prebuilt/.esphome/build -name "firmware.ota.bin" | head -1)
          BIN_FACTORY=$(find prebuilt/.esphome/build -name "firmware.factory.bin" | head -1)
          ok=true
          if [ ! -s "$BIN" ]; then
            echo "ERROR: firmware.ota.bin missing or empty"
            ok=false
          else
            echo "OK: firmware.ota.bin ($(wc -c < "$BIN") bytes)"
          fi
          if [ -n "$BIN_FACTORY" ] && [ ! -s "$BIN_FACTORY" ]; then
            echo "ERROR: firmware.factory.bin found but empty"
            ok=false
          elif [ -n "$BIN_FACTORY" ]; then
            echo "OK: firmware.factory.bin ($(wc -c < "$BIN_FACTORY") bytes)"
          fi
          [ "$ok" = true ] || exit 1

  # ===========================================================================
  # Pre-built firmware - ESPHome Dev
  # ===========================================================================
  build_prebuilt_dev:
    name: ${{ matrix.firmware.name }} - Pre-built (dev)
    runs-on: ubuntu-latest
    needs: changes
    # Skipped when no test is selected (an empty matrix is an error).
    if: needs.changes.outputs.prebuilt_matrix != '' && needs.changes.outputs.prebuilt_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        firmware: ${{ fromJSON(needs.changes.outputs.prebuilt_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build firmware
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: ${{ matrix.firmware.yaml-file }}
          version: dev
          substitutions: |
            ref_name=${{ env.REF_NAME }}
            ref_url=${{ env.REF_URL }}
      - name: Verify compiled output
        run: |
          # Locate the binary produced by the build action.
          # Using find avoids hardcoding the device name from the YAML.
          BIN=$(find prebuilt/.esphome/build -name "firmware.ota.bin" | head -1)
          BIN_FACTORY=$(find prebuilt/.esphome/build -name "firmware.factory.bin" | head -1)
          ok=true
          if [ ! -s "$BIN" ]; then
            echo "ERROR: firmware.ota.bin missing or empty"
            ok=false
          else
            echo "OK: firmware.ota.bin ($(wc -c < "$BIN") bytes)"
          fi
          if [ -n "$BIN_FACTORY" ] && [ ! -s "$BIN_FACTORY" ]; then
            echo "ERROR: firmware.factory.bin found but empty"
            ok=false
          elif [ -n "$BIN_FACTORY" ]; then
            echo "OK: firmware.factory.bin ($(wc -c < "$BIN_FACTORY") bytes)"
          fi
          [ "$ok" = true ] || exit 1

  # ===========================================================================
  # Size guard — RAM and flash of every build, from the job logs
  # ===========================================================================
  size_guard:
    name: Build size guard
    runs-on: ubuntu-latest
    needs:
      - build_latest
      - build_dev
      - build_prebuilt_latest
      - build_prebuilt_dev
    # Runs whenever any build ran; failed builds already fail the workflow and are not checked
    if: >-
      always() && (
        needs.build_latest.result != 'skipped' ||
        needs.build_dev.result != 'skipped' ||
        needs.build_prebuilt_latest.result != 'skipped' ||
        needs.build_prebuilt_dev.result != 'skipped'
      )
    permissions:
      actions: read  # Job list and logs of this run
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # The logs only give numbers to the guard: the logs of PRs from forks are untrusted data
      - name: Download the build logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          logs_dir="$RUNNER_TEMP/logs"
          mkdir -p "$logs_dir"
          : > "$RUNNER_TEMP/index.tsv"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[]
              | select(.name | test("\\((latest|dev)\\)$"))
              | select(.conclusion == "success")
              | [.id, .conclusion, .name] | @tsv' > "$RUNNER_TEMP/jobs.tsv"
          while IFS=$'\t' read -r job_id conclusion name; do
            log_file="$logs_dir/$job_id.log"
            if ! gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "$log_file"; then
              echo "::warning title=Build size::Could not read the log of '$name'"
              continue
            fi
            printf '%s\t%s\t%s\n' "$log_file" "$conclusion" "$name" >> "$RUNNER_TEMP/index.tsv"
          done < "$RUNNER_TEMP/jobs.tsv"

      - name: Check RAM and flash usage
        run: python3 .github/scripts/esphome_size_guard.py "$RUNNER_TEMP/index.tsv" --summary "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Gate — required status check for branch protection
  # ===========================================================================
  all-checks-passed:
    name: Build ESPHome / All checks passed
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - changes
      - code_scan
      - build_latest
      - build_dev
      - build_prebuilt_latest
      - build_prebuilt_dev
      - size_guard
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results=(
            "changes=${{ needs.changes.result }}"
            "code_scan=${{ needs.code_scan.result }}"
            "build_latest=${{ needs.build_latest.result }}"
            "build_dev=${{ needs.build_dev.result }}"
            "build_prebuilt_latest=${{ needs.build_prebuilt_latest.result }}"
            "build_prebuilt_dev=${{ needs.build_prebuilt_dev.result }}"
            "size_guard=${{ needs.size_guard.result }}"
          )
          failed=false
          for entry in "${results[@]}"; do
            job="${entry%%=*}"
            result="${entry##*=}"
            echo "${job}: ${result}"
            case "${result}" in
              success|skipped) ;;
              *) failed=true ;;
            esac
          done
          if [ "${failed}" = "true" ]; then
            echo "One or more jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs passed or were skipped."
...
