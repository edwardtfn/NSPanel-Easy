---
name: Blueprint metrics comment

# Posts the Blueprint metrics of a PR (from validate_blueprint.yml) as a single comment, updated on every run instead
# of adding new ones. It runs on workflow_run, so its token can write to PRs from forks too. It never checks out or
# runs code from the PR: the artifact is untrusted data, and its PR number is only used when that PR's head is the
# commit of the triggering run.
# Note: workflow_run only uses the version of this file on the default branch.

# yamllint disable-line rule:truthy
on:
  workflow_run:
    workflows: ["Validate Blueprint YAML"]
    types: [completed]

permissions: {}

concurrency:
  # Serialize per PR branch, so two runs cannot both create a comment
  group: blueprint-metrics-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    name: Post Blueprint metrics
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download metrics
        id: download
        uses: actions/download-artifact@v8
        # No artifact when the run was cancelled before it was uploaded
        continue-on-error: true
        with:
          name: blueprint-metrics
          path: ${{ runner.temp }}/metrics
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          METRICS_DIR: ${{ runner.temp }}/metrics
        run: |
          marker='<!-- blueprint-metrics-comment -->'
          body_file="$RUNNER_TEMP/comment_body.md"

          pr_number="$(head -c 16 "$METRICS_DIR/pr_number" | tr -cd '0-9')"
          if [[ -z "$pr_number" ]]; then
            echo "::error::Invalid PR number in the artifact"
            exit 1
          fi  # if the PR number is invalid

          # The artifact may come from a fork: trust the PR number only when that PR's head is the commit of the run.
          # A different head also means a newer push, whose own run updates the comment.
          pr_head="$(gh api "repos/$GH_REPO/pulls/$pr_number" --jq '.head.sha')"
          if [[ "$pr_head" != "$HEAD_SHA" ]]; then
            echo "PR #$pr_number head is $pr_head, not $HEAD_SHA: skipping"
            exit 0
          fi  # if the PR head does not match the run

          comment_id="$(gh api --paginate "repos/$GH_REPO/issues/$pr_number/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)"

          blueprint_changed="$(head -c 8 "$METRICS_DIR/blueprint_changed" 2>/dev/null | tr -cd 'a-z')"
          if [[ "$blueprint_changed" == "true" && -f "$METRICS_DIR/report.md" ]]; then
            {
              echo "$marker"
              # First section (the metrics table) visible, the other sections collapsed; size capped below GitHub's limit
              head -c 60000 "$METRICS_DIR/report.md" | awk '
                /^### / { sections++ }
                sections == 2 && !opened { print "<details><summary>More Blueprint metrics</summary>\n"; opened = 1 }
                { print }
                END { if (opened) print "\n</details>" }'
              echo
              echo "Commit ${HEAD_SHA:0:7}. This comment is updated on every push."
            } > "$body_file"
          elif [[ -n "$comment_id" ]]; then
            {
              echo "$marker"
              echo "### Blueprint metrics"
              echo
              echo "Commit ${HEAD_SHA:0:7} no longer changes the Blueprint."
            } > "$body_file"
          else
            echo "The Blueprint is unchanged and there is no comment to update: skipping"
            exit 0
          fi  # if the Blueprint changed

          if [[ -n "$comment_id" ]]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$comment_id" -F "body=@$body_file" --silent
            echo "Updated comment $comment_id on PR #$pr_number"
          else
            gh api -X POST "repos/$GH_REPO/issues/$pr_number/comments" -F "body=@$body_file" --silent
            echo "Created a comment on PR #$pr_number"
          fi  # if a comment already exists
...
