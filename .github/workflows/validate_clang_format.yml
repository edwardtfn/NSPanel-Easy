---
name: Validate C++ (Clang Format)

# yamllint disable-line rule:truthy
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # Required for auto-commit
  pull-requests: read  # Required by changed-files to list the pull request files with the REST API

# One run per pull request (or per ref for manual runs): a newer push supersedes a run still working
# on an older commit; keyed by number, as pull requests from different forks can share a branch name
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang-format-checking:
    name: Clang Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # PR head repo (handles forks), otherwise current repo
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          # PR head branch, otherwise selected dispatch ref
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Detect changed C/C++ files
        id: changed
        if: github.event_name == 'pull_request'
        uses: step-security/changed-files@v47.0.5
        with:
          # The git mode fetches with `-u` into the checked-out branch, moving HEAD to a newer
          # commit without updating the working tree; the auto-commit below then reverts that commit
          use_rest_api: true
          files: |
            **/*.h
            **/*.c
            **/*.cpp
            .clang-format
            .github/requirements-clang-format.txt
            .github/workflows/validate_clang_format.yml

      - name: Set up Python environment
        if: github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      # Pinned via pip instead of apt, so the formatter version does not depend
      # on the runner image (e.g. the `ubuntu-latest` move from 24.04 to 26.04).
      - name: Install clang-format (pinned in .github/requirements-clang-format.txt)
        if: github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true'
        run: |
          pip install -r .github/requirements-clang-format.txt
          clang-format --version

      - name: Apply clang-format
        if: github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true'
        run: |
          find ./components/nspanel_easy \
            \( -name "*.h" -o -name "*.c" -o -name "*.cpp" \) \
            -print0 | xargs -0 -r clang-format --style=file -i

      - name: Verify formatting (fork PRs)
        # Forks cannot be auto-committed to, so fail loudly with a clear message
        # instructing the contributor to run clang-format locally and push the fix.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          steps.changed.outputs.any_changed == 'true'
        run: |
          if ! git diff --exit-code; then
            echo "::error::clang-format changes required. Run clang-format locally and push the fix."
            exit 1
          fi

      - name: Commit clang-format fixes
        if: >-
          (github.event_name != 'pull_request' || steps.changed.outputs.any_changed == 'true') &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: apply clang-format"
          commit_options: "--no-verify"
          # Only formatter output can be committed, never a stale copy of any other file.
          # Every pattern must match a tracked file, as `git add` fails on a pattern matching none
          # (there are no `.c` files in the component).
          file_pattern: >-
            :(glob)components/nspanel_easy/**/*.h
            :(glob)components/nspanel_easy/**/*.cpp

  # ===========================================================================
  # Gate — required status check for branch protection
  # ===========================================================================
  all-checks-passed:
    name: Validate C++ (Clang Format) / All checks passed
    runs-on: ubuntu-latest
    needs: clang-format-checking
    if: always()
    steps:
      - name: Check result
        run: |
          echo "clang-format-checking: ${{ needs.clang-format-checking.result }}"
          case "${{ needs.clang-format-checking.result }}" in
            success|skipped) exit 0 ;;
            *) exit 1              ;;
          esac
...
