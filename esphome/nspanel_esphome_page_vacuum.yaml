#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME - Page vacuum (shared with lawn_mower domain)                                     #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  # Vacuum entity feature bitmask constants (VacuumEntityFeature).
  VACUUM_FEATURE_PAUSE: 4
  VACUUM_FEATURE_STOP: 8
  VACUUM_FEATURE_RETURN_HOME: 16
  VACUUM_FEATURE_BATTERY: 64
  VACUUM_FEATURE_START: 8192

  # Lawn mower entity feature bitmask constants (LawnMowerEntityFeature).
  MOWER_FEATURE_START_MOWING: 1
  MOWER_FEATURE_PAUSE: 2
  MOWER_FEATURE_DOCK: 4

  TAG_PAGE_VACUUM: nspanel.page.vacuum

display:
  - id: !extend disp1
    on_touch:
      then:
        - lambda: |-
            if (page_id != get_page_id("vacuum")) return;  // Page vacuum (shared with lawn_mower)
            if (touch_event) return;                       // Only act on release

            const std::string entity = detailed_entity->state.c_str();

            // Determine the domain from the entity ID prefix.
            const bool is_mower = (entity.substr(0, entity.find('.')) == "lawn_mower");

            switch (component_id) {
              case 8:  // bt_start_pause — Blueprint resolves state and calls correct action
                fire_ha_event("action_call", {
                  {"action", is_mower ? "_lawn_mower_start_pause_toggle_" : "_vacuum_start_pause_toggle_"},
                  {"entity", entity.c_str()}
                });
                break;

              case 9:  // bt_stop — vacuum only; hidden for mower via Blueprint
                fire_ha_event("action_call", {
                  {"action", "vacuum.stop"},
                  {"entity", entity.c_str()}
                });
                break;

              case 10:  // bt_return
                fire_ha_event("action_call", {
                  {"action", is_mower ? "lawn_mower.dock" : "vacuum.return_to_base"},
                  {"entity", entity.c_str()}
                });
                break;

              default:
                break;
            }

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_VACUUM

script:
  # Renders the vacuum / lawn mower page from the Blueprint's entity snapshot (#636): the title and icon,
  # the state, the picture, the start/pause, stop and return buttons, and the battery, as the Blueprint
  # wrote them. The battery comes from the device's battery sensor (role "battery") when the entity has no
  # battery_level attribute.
  - id: !extend entity_snapshot_received
    then:
      - lambda: |-
          if (entity_snapshot.page != "vacuum") return;
          const SnapshotEntity *entity = entity_snapshot.find("main");
          if (entity == nullptr) {
            ESP_LOGW("${TAG_PAGE_VACUUM}", "Snapshot without a main entity, ignored");
            return;
          }  // if (no main entity)
          if (entity->entity_id.compare(0, 7, "vacuum.") != 0 && entity->entity_id.compare(0, 11, "lawn_mower.") != 0) {
            ESP_LOGW("${TAG_PAGE_VACUUM}", "Unsupported entity for vacuum page: %s", entity->entity_id.c_str());
            return;
          }  // if (not a vacuum or lawn mower)
          blueprint_setting_received();
          details_render_title(*entity);
          const VacuumView view = vacuum_view(*entity, entity_snapshot.find("battery"));
          #ifdef NSPANEL_EASY_HW_DISPLAY
          const bool light_theme = (current_theme == ThemeMode::LIGHT);
          #else  // NSPANEL_EASY_HW_DISPLAY
          const bool light_theme = false;
          #endif  // NSPANEL_EASY_HW_DISPLAY
          constexpr int32_t GREY_WHITE = 59164;  // nextion.color.grey_white

          disp1->set_component_text("state_label", view.state_label.c_str());
          disp1->send_command_printf("vacuum_pic.pic=%d", vacuum_picture(view, light_theme));
          action_icon->execute("vacuum", "bt_start_pause", view.running ? Icons::MDI_PAUSE : Icons::MDI_PLAY,
                               GREY_WHITE, view.start_pause, false, true);
          action_icon->execute("vacuum", "bt_stop", Icons::MDI_STOP, GREY_WHITE, view.stop, false, true);
          action_icon->execute("vacuum", "bt_return", Icons::MDI_HOME_IMPORT_OUTLINE, GREY_WHITE,
                               view.return_home && !view.docked, false, true);
          const bool has_battery = view.battery >= 0;
          action_icon->execute("vacuum", "battery_icon", vacuum_battery_icon(has_battery ? view.battery : 0),
                               GREY_WHITE, has_battery, false, true);
          if (has_battery) {
            disp1->set_component_text_printf("battery_value", "%d%%", view.battery);
          }  // if (has_battery)
          disp1->send_command_printf("vis battery_value,%d", has_battery ? 1 : 0);

  - id: !extend page_change
    then:
      - lambda: if (new_page_id == get_page_id("vacuum")) page_vacuum->execute();

  - id: page_vacuum
    mode: single
    then:  # Placeholder — Blueprint drives refresh via page_changed handler

  - id: !extend reset_globals
    then:
      - lambda: |-
          if (new_page_id == get_page_id("vacuum")) {
            display_entity_keep = true;
          }

  - id: !extend stop_page_constructors
    then:
      - lambda: page_vacuum->stop();
...
