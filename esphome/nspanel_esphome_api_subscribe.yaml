#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME CORE - HOME ASSISTANT STATE SUBSCRIPTIONS (EXPERIMENTAL)                          #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####                                                                                           #####
##### The blueprint pushes a set of bindings once per session, closing with subscribe_end.      #####
##### ESPHome persists them and re-subscribes on every boot, so state changes render locally    #####
##### without an automation run.                                                                #####
#####                                                                                           #####
##### Bindings take effect on the following boot: APIConnection latches state_subs_at_ to -1    #####
##### once the initial burst drains, and the blueprint can only push after the API is           #####
##### connected. A binding change therefore schedules a restart. Should ESPHome gain runtime    #####
##### subscriptions, both the persistence layer and the restart can be removed.                 #####
#####################################################################################################
---
substitutions:
  TAG_SUB: nspanel.api.sub

  api_subscribe_max: '128'               # Maximum number of bindings. Storage is allocated to the configured count, not this.
  api_subscribe_entity_len: '96'         # Buffer size for an entity_id, including the null terminator. Raise it if a longer entity_id is truncated.
  api_subscribe_debounce: '10s'          # Seconds of quiet after the last binding before a restart is applied.
  api_subscribe_timeout: '120s'          # Seconds without an end marker before committing the push unverified.

esphome:
  build_flags:
    - -D NSPANEL_EASY_SUBSCRIBE
    - -D NSPANEL_EASY_SUB_MAX=${api_subscribe_max}
    - -D NSPANEL_EASY_SUB_ENTITY_LEN=${api_subscribe_entity_len}

api:
  homeassistant_states: true  # Required: enables USE_API_HOMEASSISTANT_STATES
  actions:
    ##### One binding. The blueprint sends one call per subscribable component. #####
    - action: api_subscribe
      variables:
        push_id: string       # Identifier of the push, ordered by start time; the same for every call of one push
        page: string          # Target page, e.g. "chips"
        component: string     # Target component, e.g. "chip01"
        entity: string        # Home Assistant entity_id
        device_class: string  # HA device_class, for the icon by domain, device class and state
        attribute: string     # HA entity's attribute to subscribe to
        icon_on: string       # Icon for the active state; empty to resolve on-device
        icon_off: string      # Icon for the inactive state; empty to resolve on-device
        color_on: int[]       # RGB array for the active state
        color_off: int[]      # RGB array for the inactive state
        inverted: bool        # Render as visible while the entity is inactive
        icon_name: string     # Icon by name (e.g. "mdi:lamp") when icon_on is empty; empty for none
      then:
        - lambda: |-
            blueprint_setting_received();
            sub_push_binding(
              push_id.c_str(),
              page.c_str(),
              component.c_str(),
              entity.c_str(),
              device_class.c_str(),
              attribute.c_str(),
              icon_on.c_str(),
              icon_off.c_str(),
              color_on.size() == 3 ? rgbTo565(color_on) : 0,
              color_off.size() == 3 ? rgbTo565(color_off) : 0, inverted,
              icon_name.c_str()
            );
            api_subscribe_debounce->execute();
            api_subscribe_watchdog->execute();

    ##### Icon names: the Blueprint's all_icon_names, sent in chunks once per session. #####
    # The names are in codepoint order (U+E000 + position), so only the names travel and the panel works out
    # every codepoint. Kept in PSRAM, never persisted, so no restart follows.
    - action: api_subscribe_icon_names
      variables:
        start: int         # Position of the first name of the chunk; 0 starts a new list
        names: string      # Comma-separated names, without "mdi:"
      then:
        - lambda: |-
            sub_icon_names_add(static_cast<uint16_t>(start), names);

    ##### Icon table: the Blueprint's device class icons and domain defaults, sent in chunks once per session. #####
    # Lets the panel resolve the icon of an entity from its domain, device class and state. Kept in PSRAM, never
    # persisted, so no restart follows.
    - action: api_subscribe_icon_table
      variables:
        start: bool        # First chunk of the session: clear the previous table
        keys: string[]     # "<domain>.<device_class>-<state>", "<domain>.<device_class>" or "<domain>"
        glyphs: string[]   # Icons, one per key: a codepoint, or an icon name (resolved with the icon names)
      then:
        - lambda: |-
            sub_icon_table_add(start, keys, glyphs);

    ##### End marker. Sent after every binding, carrying how many were sent. #####
    - action: api_subscribe_end
      variables:
        push_id: string       # Identifier of the push, as sent with its bindings
        count: int            # Number of bindings sent in this push
      then:
        - lambda: |-
            if (sub_push_end(push_id.c_str(), static_cast<uint16_t>(count))) {
              api_subscribe_restart->execute();
            }
            // An ignored end marker (e.g. from an older push) leaves the staged push open:
            // keep its watchdog running in that case
            if (!sub_push_active()) {
              api_subscribe_watchdog->stop();
            }  // if (!sub_push_active())

script:
  ##### Collapses a burst of binding calls into a single restart decision. #####
  - id: api_subscribe_debounce
    mode: restart
    then:
      - delay: ${api_subscribe_debounce}

  ##### Safety net for a push whose end marker never arrives. #####
  - id: api_subscribe_watchdog
    mode: restart
    then:
      - delay: ${api_subscribe_timeout}
      - lambda: |-
          if (sub_push_timeout()) {
            api_subscribe_restart->execute();
          }

  ##### Waits for the push to go quiet, then restarts to activate the bindings. #####
  - id: api_subscribe_restart
    mode: restart
    then:
      - wait_until:
          condition:
            not:
              script.is_running: api_subscribe_debounce
      - lambda: |-
          ESP_LOGI("${TAG_SUB}", "Restarting to activate new binding(s)");
      - delay: 250ms
      - lambda: |-
          App.safe_reboot();

  - id: !extend api_stale_changed
    then:
      - lambda: |-
          // Renderers read api_stale. On reconnection, Home Assistant only re-sends the states that
          // differ from its cache, so an unchanged state would otherwise never be rendered again.
          sub_render_all();

  - id: !extend boot_early_routines
    then:
      - lambda: |-
          // Must run before the API connects: a subscription registered after
          // the initial burst is stored by ESPHome and never sent.
          if (sub_load() > 0) {
            sub_subscribe_all();
          }

  - id: !extend page_change
    then:
      - lambda: |-
          // Re-render bound components from their last known state, so a page
          // change does not need a round trip to Home Assistant.
          sub_render_all();

  - id: !extend dump_config
    then:
      - lambda: |-
          sub_dump_config();
...
