#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME CORE - HOME ASSISTANT STATE SUBSCRIPTIONS (EXPERIMENTAL)                          #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####                                                                                           #####
##### The blueprint pushes a set of bindings once per session, closing with subscribe_end.      #####
##### ESPHome persists them and re-subscribes on every boot, so state changes render locally    #####
##### without an automation run.                                                                #####
#####                                                                                           #####
##### Bindings take effect on the following boot: APIConnection latches state_subs_at_ to -1    #####
##### once the initial burst drains, and the blueprint can only push after the API is           #####
##### connected. A binding change therefore schedules a restart. Should ESPHome gain runtime    #####
##### subscriptions, both the persistence layer and the restart can be removed.                 #####
#####################################################################################################
---
substitutions:
  TAG_SUB: nspanel.api.sub

  api_subscribe_max: '128'               # Maximum number of bindings. Storage is allocated to the configured count, not this.
  api_subscribe_entity_len: '96'         # Buffer size for an entity_id, including the null terminator. Raise it if a longer entity_id is truncated.
  api_subscribe_debounce: '10s'          # Seconds of quiet after the last binding before a restart is applied.
  api_subscribe_timeout: '120s'          # Seconds without an end marker before committing the push unverified.
  # Erase every stored preference (as a factory reset) and restart, when the bindings cannot be stored.
  # At most once since the panel was powered on. See docs/api_subscribe.md before enabling it.
  api_subscribe_wipe_nvs_on_failure: 'false'
  # Icon names, asked from the Blueprint one block at a time (event `icon_names_request`)
  api_icon_names_block: '400'            # Names per block.
  api_icon_names_timeout: '5s'           # Time to wait for a block before asking for it again.
  api_icon_names_retries: '3'            # Retries of one block before drawing the icons given by name by domain.
  # Spread of the requests, so panels that start or reconnect together don't ask Home Assistant all at once (#636)
  api_icon_names_spread_ms: '30000'      # End of the window (ms) the panels' first blocks are spread over. 0: at once.
  api_icon_names_spread_min_ms: '0'      # Start of that window (ms), e.g. to let other panels ask first.
  api_icon_names_pause_ms: '1000'        # Wait (ms) between blocks, doubled on each retry of a block. 0 for none.

esphome:
  build_flags:
    - -D NSPANEL_EASY_SUBSCRIBE
    - -D NSPANEL_EASY_SUB_MAX=${api_subscribe_max}
    - -D NSPANEL_EASY_SUB_ENTITY_LEN=${api_subscribe_entity_len}
    - -D NSPANEL_EASY_SUB_WIPE_NVS_ON_FAILURE=${api_subscribe_wipe_nvs_on_failure}

api:
  homeassistant_states: true  # Required: enables USE_API_HOMEASSISTANT_STATES
  actions:
    ##### One binding. The blueprint sends one call per subscribable component. #####
    - action: api_subscribe
      variables:
        push_id: string       # Identifier of the push, ordered by start time; the same for every call of one push
        page: string          # Target page, e.g. "chips"
        component: string     # Target component, e.g. "chip01"
        entity: string        # Home Assistant entity_id
        device_class: string  # HA device_class, for the icon by domain, device class and state
        attribute: string     # HA entity's attribute to subscribe to
        icon_on: string       # Icon for the active state; empty to resolve on-device
        icon_off: string      # Icon for the inactive state; empty to resolve on-device
        color_on: int[]       # RGB array for the active state
        color_off: int[]      # RGB array for the inactive state
        inverted: bool        # Render as visible while the entity is inactive
        icon_name: string     # Icon by name (e.g. "mdi:lamp") when icon_on is empty; empty for none
      then:
        - lambda: |-
            blueprint_setting_received();
            sub_push_binding(
              push_id.c_str(),
              page.c_str(),
              component.c_str(),
              entity.c_str(),
              device_class.c_str(),
              attribute.c_str(),
              icon_on.c_str(),
              icon_off.c_str(),
              color_on.size() == 3 ? rgbTo565(color_on) : 0,
              color_off.size() == 3 ? rgbTo565(color_off) : 0, inverted,
              icon_name.c_str()
            );
            api_subscribe_debounce->execute();
            api_subscribe_watchdog->execute();

    ##### Icon names: a block of the Blueprint's all_icon_names, in reply to the event `icon_names_request`. #####
    # The names are in codepoint order (U+E000 + position), so only the names travel and the panel works out
    # every codepoint. Kept in PSRAM, never persisted, so no restart follows.
    - action: api_subscribe_icon_names
      variables:
        start: int         # Position of the first name of the block
        total: int         # Number of names in the whole list
        names: string      # Comma-separated names, without "mdi:"
      then:
        - lambda: |-
            if (start < 0 or start > UINT16_MAX or total < 0 or total > UINT16_MAX) {
              ESP_LOGW("${TAG_SUB}", "Icon names: start %" PRId32 " or total %" PRId32 " out of range; ignored", start,
                       total);
              return;
            }  // if (out of range)
            sub_icon_names_add(static_cast<uint16_t>(start), static_cast<uint16_t>(total), names);

    ##### End marker. Sent after every binding, carrying how many were sent. #####
    - action: api_subscribe_end
      variables:
        push_id: string       # Identifier of the push, as sent with its bindings
        count: int            # Number of bindings sent in this push
      then:
        - lambda: |-
            if (sub_push_end(push_id.c_str(), static_cast<uint16_t>(count))) {
              api_subscribe_restart->execute();
            }
            // An ignored end marker (e.g. from an older push) leaves the staged push open:
            // keep its watchdog running in that case
            if (!sub_push_active()) {
              api_subscribe_watchdog->stop();
            }  // if (!sub_push_active())

globals:
  - id: api_icon_names_spread_pending  # The next block of icon names waits a random time, once connected
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: api_icon_names_pause_from_ms  # millis() at which the pause after a block of icon names started
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: api_icon_names_pause_retry  # The pause is the longer one, before a block is asked for again
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  ##### Asks the Blueprint for the icon names, one block at a time, until the list is complete. #####
  # A block that does not arrive within the timeout is asked for again. While Home Assistant is away, it waits.
  # With `spread`, and after every loss of the connection, the next block waits once Home Assistant is connected,
  # in this panel's slot among the panels (a random time while their number is unknown), so panels that start or
  # reconnect together are spread out. Blocks are paced, and a block asked
  # for again waits longer each time, so a slow Home Assistant gets fewer requests.
  - id: api_icon_names_fetch
    mode: restart
    parameters:
      spread: bool
    then:
      - lambda: |-
          // A block of 0 would never ask for anything, and more than the Blueprint answers would never complete
          static_assert(${api_icon_names_block} >= 1 and ${api_icon_names_block} <= 1000,
                        "api_icon_names_block must be from 1 to 1000");
          static_assert(${api_icon_names_retries} >= 0 and ${api_icon_names_retries} <= 255,
                        "api_icon_names_retries must be from 0 to 255");
          static_assert(${api_icon_names_spread_ms} >= 0 and ${api_icon_names_spread_ms} <= 600000,
                        "api_icon_names_spread_ms must be from 0 to 600000");
          static_assert(${api_icon_names_spread_min_ms} >= 0 and
                            ${api_icon_names_spread_min_ms} <= ${api_icon_names_spread_ms},
                        "api_icon_names_spread_min_ms must be from 0 to api_icon_names_spread_ms");
          static_assert(${api_icon_names_pause_ms} >= 0 and ${api_icon_names_pause_ms} <= 60000,
                        "api_icon_names_pause_ms must be from 0 to 60000");
          sub_icon_names_fetch_reset();
          id(api_icon_names_spread_pending) = spread;
      - while:
          condition:
            lambda: return sub_icon_names_wanted();
          then:
            - wait_until:
                condition:
                  lambda: return api_server->is_connected_with_state_subscription();
            # The wait starts once Home Assistant is connected, so panels waiting for it don't all ask at the
            # moment it comes back. Without the number of panels yet, the settings come first: they carry it,
            # so each panel can ask in its own slot (a single panel at once).
            - wait_until:
                condition:
                  lambda: |-
                    return !id(api_icon_names_spread_pending) or blueprint_panel_count > 0 or
                           blueprint_settings_state == BlueprintSettingsState::COMPLETE or
                           blueprint_settings_state == BlueprintSettingsState::FAILED;
                timeout: !lambda return ${api_icon_names_spread_ms};
            - delay: !lambda |-
                if (!id(api_icon_names_spread_pending)) return 0;
                id(api_icon_names_spread_pending) = false;
                const uint32_t wait_ms = panel_slot_wait_ms(${api_icon_names_spread_min_ms}, ${api_icon_names_spread_ms});
                ESP_LOGD("${TAG_SUB}", "Icon names: asking in %" PRIu32 " ms", wait_ms);
                return wait_ms;
            - lambda: |-
                if (!api_server->is_connected_with_state_subscription()) {
                  id(api_icon_names_spread_pending) = true;  // Lost during the random wait: wait again
                  return;
                }  // if (not connected)
                uint16_t start = 0;
                uint16_t count = 0;
                if (sub_icon_names_request(${api_icon_names_block}, ${api_icon_names_retries}, start, count)) {
                  char start_text[6];
                  char count_text[6];
                  snprintf(start_text, sizeof(start_text), "%" PRIu16, start);
                  snprintf(count_text, sizeof(count_text), "%" PRIu16, count);
                  fire_ha_event("icon_names_request", {{"start", start_text}, {"count", count_text}});
                }  // if (a block to ask for)
            - wait_until:
                condition:
                  lambda: |-
                    if (!api_server->is_connected_with_state_subscription()) {
                      id(api_icon_names_spread_pending) = true;
                      return true;
                    }  // if (connection lost)
                    return !sub_icon_names_awaiting();
                timeout: ${api_icon_names_timeout}
            # A block received: the pause before the next one. A block still awaited: a longer pause before asking
            # for it again, doubled on each retry (up to 16 times the pause), and none after its last retry.
            # A reply that arrives late, during that longer pause, starts a normal pause from its arrival.
            - lambda: |-
                id(api_icon_names_pause_from_ms) = millis();
                id(api_icon_names_pause_retry) = sub_icon_names_awaiting();
            - wait_until:
                condition:
                  lambda: |-
                    if (!sub_icon_names_wanted()) return true;
                    if (!api_server->is_connected_with_state_subscription()) {
                      id(api_icon_names_spread_pending) = true;
                      return true;  // The loop waits for the connection, then for a random time
                    }  // if (connection lost)
                    if (id(api_icon_names_pause_retry) and !sub_icon_names_awaiting()) {
                      id(api_icon_names_pause_retry) = false;  // Late reply
                      id(api_icon_names_pause_from_ms) = millis();
                    }  // if (late reply)
                    uint32_t wait_ms = ${api_icon_names_pause_ms};
                    if (id(api_icon_names_pause_retry)) {
                      const uint8_t attempts = sub_icon_names_attempts_made();
                      wait_ms = attempts > ${api_icon_names_retries} ? 0 : wait_ms << std::min<uint8_t>(attempts, 4);
                    }  // if (retry)
                    return millis() - id(api_icon_names_pause_from_ms) >= wait_ms;

  ##### Collapses a burst of binding calls into a single restart decision. #####
  - id: api_subscribe_debounce
    mode: restart
    then:
      - delay: ${api_subscribe_debounce}

  ##### Safety net for a push whose end marker never arrives. #####
  - id: api_subscribe_watchdog
    mode: restart
    then:
      - delay: ${api_subscribe_timeout}
      - lambda: |-
          if (sub_push_timeout()) {
            api_subscribe_restart->execute();
          }

  ##### Waits for the push to go quiet, then restarts to activate the bindings. #####
  - id: api_subscribe_restart
    mode: restart
    then:
      - wait_until:
          condition:
            not:
              script.is_running: api_subscribe_debounce
      - lambda: |-
          ESP_LOGI("${TAG_SUB}", "Restarting to activate new binding(s)");
      - delay: 250ms
      - lambda: |-
          App.safe_reboot();

  - id: !extend api_stale_changed
    then:
      - lambda: |-
          // Renderers read api_stale. On reconnection, Home Assistant only re-sends the states that
          // differ from its cache, so an unchanged state would otherwise never be rendered again.
          sub_render_all();
          // Back with Home Assistant: the icon names it could not send are asked for again
          if (!api_stale and sub_icon_names_wanted()) {
            api_icon_names_fetch->execute(true);
          }  // if (fresh and names missing)

  - id: !extend boot_early_routines
    then:
      - lambda: |-
          // Must run before the API connects: a subscription registered after
          // the initial burst is stored by ESPHome and never sent.
          if (sub_load() > 0) {
            sub_subscribe_all();
          }
          // Asked for once Home Assistant connects, as the bindings use them
          api_icon_names_fetch->execute(true);

  - id: !extend new_minute
    then:
      - lambda: |-
          // A calendar chip's lead time starts with no state change, so the clock decides
          sub_calendar_recheck();

  - id: !extend page_change
    then:
      - lambda: |-
          // Re-render bound components from their last known state, so a page
          // change does not need a round trip to Home Assistant.
          sub_render_all();

  - id: !extend dump_config
    then:
      - lambda: |-
          sub_dump_config();

interval:
  # Traffic of the subscriptions: updates received from Home Assistant, logged once a minute (nothing when
  # none arrived), to see whether any bound entity is chatty enough to matter
  - id: api_subscribe_stats
    interval: 60s
    then:
      - lambda: |-
          sub_log_stats(60);
...
