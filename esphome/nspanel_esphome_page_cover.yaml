#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME Page cover                                                                        #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  TAG_PAGE_COVER: nspanel.page.cover

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_COVER

script:
  - id: !extend event_from_display  # Defined by hw_display
    then:
      - lambda: |-
          if (params[0] == "cover") {
            // CSV Format: cover,<key>[,<value>]
            // params[0]=page, params[1]=key, params[2]=value (optional)

            if (params_count < 2) {
              ESP_LOGW("${TAG_PAGE_COVER}", "Bad params");
              return;
            }
            const std::string& key = params[1];
            ESP_LOGV("${TAG_PAGE_COVER}", "Cover control: key=%s", key.c_str());

            if (key == "position" || key == "tilt_position") {
              if (params_count != 3) {
                ESP_LOGW("${TAG_PAGE_COVER}", "Bad params");
                return;
              }

              const std::string& value = params[2];
              char* end = nullptr;
              long pos = strtol(value.c_str(), &end, 10);
              if (end == value.c_str() || *end != '\0' || pos < 0 || pos > 100) {
                ESP_LOGW("${TAG_PAGE_COVER}", "Bad %s: %s", key.c_str(), value.c_str());
                return;
              }
              const std::string pos_str = std::to_string(pos);
              ESP_LOGV("${TAG_PAGE_COVER}", "Setting %s: %s", key.c_str(), pos_str.c_str());

              // The blueprint builds the action data as {key: value}, so the key must
              // match the action parameter name.
              const std::string action = (key == "position") ? "cover.set_cover_position"
                                                             : "cover.set_cover_tilt_position";
              fire_ha_event("action_call", {
                {"action", action.c_str()},
                {"key", key.c_str()},
                {"value", pos_str.c_str()},
                {"entity", detailed_entity->state.c_str()}
              });
            } else {
              ESP_LOGV("${TAG_PAGE_COVER}", "Executing action: %s", key.c_str());
              const std::string action = "cover." + key;
              fire_ha_event("action_call", {
                {"action", action.c_str()},
                {"entity", detailed_entity->state.c_str()}
              });
            } // endif key is a position
          } // endif page == "cover"

  # Renders the cover page from the Blueprint's entity snapshot (#636): the position and tilt on every
  # snapshot; when the page opens, also the title and icon, the open and close icons, which sliders show,
  # and the battery (from the battery sensor the Blueprint found, role "battery", when the cover has no
  # battery attribute), as the Blueprint wrote them.
  - id: !extend entity_snapshot_received
    then:
      - lambda: |-
          if (entity_snapshot.page != "cover") return;
          const SnapshotEntity *entity = entity_snapshot.find("main");
          if (entity == nullptr) {
            ESP_LOGW("${TAG_PAGE_COVER}", "Snapshot without a main entity, ignored");
            return;
          }  // if (no main entity)
          blueprint_setting_received();
          const CoverView view = cover_view(*entity, entity_snapshot.find("battery"));
          const char *unit_space = entity_snapshot.compact_unit_display ? "" : " ";
          if (view.position >= 0) {
            // Two position sliders: one next to the tilt slider, one centered; only one is visible
            disp1->send_command_printf("coverslider.val=%d", view.position);
            disp1->send_command_printf("cover_value.txt=\"%d%s%%\"", view.position, unit_space);
            disp1->send_command_printf("coverslider2.val=%d", view.position);
            disp1->send_command_printf("cover_value_2.txt=\"%d%s%%\"", view.position, unit_space);
          }  // if (position)
          if (view.tilt >= 0) {
            disp1->send_command_printf("tiltslider.val=%d", view.tilt);
            disp1->send_command_printf("tilt_value.txt=\"%d%s%%\"", view.tilt, unit_space);
          }  // if (tilt)
          if (!entity_snapshot.constructor) return;

          details_render_title(*entity);
          disp1->send_command_printf("cover_open.txt=\"%s\"", view.icon_open);
          disp1->send_command_printf("cover_close.txt=\"%s\"", view.icon_close);
          // `vis` is not sticky across page loads, so set it both ways every time
          for (const char *component : {"coverslider", "cover_value", "tiltslider", "tilt_value"}) {
            disp1->send_command_printf("vis %s,%d", component, view.tilt_available ? 1 : 0);
          }  // for each position-and-tilt component
          for (const char *component : {"coverslider2", "cover_value_2"}) {
            disp1->send_command_printf("vis %s,%d", component, view.tilt_available ? 0 : 1);
          }  // for each centered-slider component
          if (view.battery >= 0) {
            disp1->send_command_printf("battery_value.txt=\"%d%s%%\"", view.battery, unit_space);
            disp1->send_command_printf("battery_icon.txt=\"%s\"", view.battery_icon);
            disp1->send_command("battery_icon.pco=52857");  // nextion.color.grey_super_light
          }  // if (battery)

  - id: !extend reset_globals
    then:
      - lambda: |-
          if (new_page_id == get_page_id("cover")) {
            display_entity_keep = true;
          }
...
