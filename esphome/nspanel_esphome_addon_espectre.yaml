#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME ADD-ON - ESPECTRE MOTION DETECTION                                                #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################
##### Include ESPHome's built-in ESPectre component as a wake-up-the-screen add-on.             #####
#####################################################################################################
---
substitutions:
  TAG_ADDON_ESPECTRE: nspanel.addon.espectre
  ##############################
  ## Change only in your      ##
  ## local yaml substitutions ##
  ##############################
  espectre_traffic_generator_mode: "wifi_raw"    # ping, dns, dns_tcp, wifi_raw or external
  espectre_detection_algorithm: "high_accuracy"  # high_accuracy or lightweight

esphome:
  min_version: 2026.11.0
  build_flags:
    - -D NSPANEL_EASY_ADDON_ESPECTRE

espectre:
  id: espectre_csi
  detection_algorithm: ${espectre_detection_algorithm}
  traffic_generator_mode: ${espectre_traffic_generator_mode}

binary_sensor:
  - platform: espectre
    motion:
      id: espectre_motion
      name: "ESPectre Motion"
      on_press:
        # wake the screen
        - script.execute:
            id: wakeup
            reset_timer: true
        # display the motion sensor icon
        - script.execute:
            id: refresh_relays
            relay_mask: 2
      on_release:
        # hide the motion sensor icon
        - script.execute:
            id: refresh_relays
            relay_mask: 2
    calibrating:
      name: "Calibration Active"

number:
  - platform: espectre
    threshold:
      name: "Motion Threshold"
    motion_on_hits:
      name: "Motion On Hits"
    motion_off_hits:
      name: "Motion Off Hits"

select:
  - platform: espectre
    traffic_generator_mode:
      name: "CSI Traffic Source"
    detection_algorithm:
      name: "Detection Profile"
    csi_sample_spacing:
      name: "CSI Packet Spacing"

switch:
  - platform: espectre
    sensing:
      id: espectre_sensing
      name: "Sensing Enabled"
      # Kept over restarts (the component's default, RESTORE_DEFAULT_ON). The stops for uploads don't go through
      # this switch (see espectre_stop), so they don't change the saved state.

sensor:
  - platform: espectre
    movement:
      name: "Movement Score"
    diagnostics:
      id: espectre_diagnostics
      generator_rate:
        name: "Generator Rate"
      traffic_tx_rate:
        name: "Traffic TX Rate"
      traffic_rx_rate:
        name: "Traffic RX Rate"
      csi_accepted_rate:
        name: "CSI Accepted Rate"
      csi_occupancy:
        name: "CSI Temporal Occupancy"

  - platform: wifi_signal
    name: "WiFi RSSI"
    entity_category: diagnostic

button:
  - platform: espectre
    name: "Recalibrate"

  # The Traffic Generator app presses this while its diagnostics panel is open.
  - platform: template
    name: "Refresh Diagnostics"
    entity_category: diagnostic
    on_press:
      - component.update: espectre_diagnostics

ota:
  # Sensing is stopped when an OTA starts (ota_std.on_begin -> stop_all -> espectre_stop, see below).
  # The component only starts again with a restart, which a failed or aborted OTA does not do, so the panel restarts
  # here when sensing is on.
  - id: !extend ota_std
    on_abort:
      then:
        - script.execute: espectre_restart_after_ota
    on_error:
      then:
        - script.execute: espectre_restart_after_ota

script:
  - id: !extend dump_config
    then:
      - lambda: |-
          ESP_LOGCONFIG("${TAG_ADDON_ESPECTRE}", "ESPectre motion detection (built into ESPHome)");
          ESP_LOGCONFIG("${TAG_ADDON_ESPECTRE}", "  Configured traffic source: %s", "${espectre_traffic_generator_mode}");
          ESP_LOGCONFIG("${TAG_ADDON_ESPECTRE}", "  Configured detector: %s", "${espectre_detection_algorithm}");

  # Stops the component at once, without the switch, so the switch keeps the user's choice. Used for the uploads,
  # as their transfer blocks the main loop, where a change of the switch would be applied.
  # The component only starts again with a restart.
  - id: espectre_stop
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("${TAG_ADDON_ESPECTRE}", "Stopping sensing");
          espectre_csi->on_shutdown();

  # Resumes sensing after a failed or aborted OTA, which does not restart the panel, when the user left it on
  - id: espectre_restart_after_ota
    mode: single
    then:
      - if:
          condition:
            - switch.is_on: espectre_sensing
          then:
            - lambda: ESP_LOGW("${TAG_ADDON_ESPECTRE}", "Restarting to resume sensing after the OTA");
            # Lets the warning reach the log and the OTA client before the restart
            - delay: 1s
            - lambda: App.safe_reboot();

  # reduce pressure on system during OTA and TFT uploads
  - id: !extend stop_all
    then:
      - if:
          condition:
            lambda: return system_flags.tft_upload_active or system_flags.ota_in_progress;
          then:
            - script.execute: espectre_stop

  # display/hide the motion sensor icon in chip relay_2
  # chip_relay2 is repurposed to mirror the ESPectre motion sensor instead of relay 2's own state.
  # The built-in relay 2 branch is excluded at build time (NSPANEL_EASY_ADDON_ESPECTRE), so this is the only writer of that chip.
  - id: !extend refresh_relays
    then:
      - lambda: |-
          if (system_flags.tft_upload_active) return;  // Skip refresh if TFT update is in progress
          if (!(relay_mask & 2)) return;
          const bool motion = espectre_motion->state;
          if (chip_states[CHIP_IDX_RELAY2].visible == motion) return;
          chip_states[CHIP_IDX_RELAY2].visible = motion;
          chip_render(CHIP_IDX_RELAY2);

...
