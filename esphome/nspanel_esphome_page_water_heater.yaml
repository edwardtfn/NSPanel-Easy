#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME - Page water heater                                                               #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################
---
substitutions:
  TAG_PAGE_WATER_HEATER: nspanel.page.water_heater

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_WATER_HEATER

script:
  - id: !extend event_from_display  # Defined by hw_display
    then:
      - lambda: |-
          if (params[0] != "water_heater") return;

          // CSV Format: water_heater,key,value
          // params[0]=page, params[1]=key, params[2]=value
          if (params_count != 3) {
            ESP_LOGW("${TAG_PAGE_WATER_HEATER}", "Bad params");
            return;
          }

          const std::string& key = params[1];
          const std::string& value = params[2];

          // The page also shows humidifiers, but its buttons and slider always report the water heater actions
          const bool humidifier = detailed_entity->state.compare(0, 11, "humidifier.") == 0;

          if (key == "operation_mode" && humidifier) {
            std::string action;
            std::string mode;
            if (!water_heater_humidifier_press(value, action, mode)) {
              ESP_LOGW("${TAG_PAGE_WATER_HEATER}", "No humidifier mode for '%s'", value.c_str());
              return;
            }  // if (no humidifier mode)
            if (mode.empty()) {
              fire_ha_event("action_call", {
                {"action", action.c_str()},
                {"entity", detailed_entity->state.c_str()}
              });
            } else {
              fire_ha_event("action_call", {
                {"action", action.c_str()},
                {"key", "mode"},
                {"value", mode.c_str()},
                {"entity", detailed_entity->state.c_str()}
              });
            }  // if (power button)
            return;
          }  // endif operation_mode (humidifier)

          if (key == "temperature" && humidifier) {
            // humidifier.set_humidity only accepts whole percentages
            const long humidity = std::lround(atof(value.c_str()) / 10);
            fire_ha_event("action_call", {
              {"action", "humidifier.set_humidity"},
              {"key", "humidity"},
              {"value", std::to_string(humidity).c_str()},
              {"entity", detailed_entity->state.c_str()}
            });
            return;
          }  // endif temperature (humidifier)

          if (key == "operation_mode") {
            fire_ha_event("action_call", {
              {"action", "water_heater.set_operation_mode"},
              {"key", "operation_mode"},
              {"value", value.c_str()},
              {"entity", detailed_entity->state.c_str()}
            });
            return;
          }  // endif operation_mode

          if (key == "temperature") {
            fire_ha_event("action_call", {
              {"action", "water_heater.set_temperature"},
              {"key", key.c_str()},
              {"value", to_string(atof(value.c_str()) / 10).c_str()},
              {"entity", detailed_entity->state.c_str()}
            });
            return;
          }  // endif temperature

  # Renders the water heater page (also used for humidifiers) from the Blueprint's entity snapshot (#636): the title,
  # the slider and its values, the icon next to the target, and the mode buttons.
  - id: !extend entity_snapshot_received
    then:
      - lambda: |-
          if (entity_snapshot.page != "water_heater") return;
          const SnapshotEntity *entity = entity_snapshot.find("main");
          if (entity == nullptr) {
            ESP_LOGW("${TAG_PAGE_WATER_HEATER}", "Snapshot without a main entity, ignored");
            return;
          }  // if (no main entity)
          if (entity->entity_id.compare(0, 13, "water_heater.") != 0 &&
              entity->entity_id.compare(0, 11, "humidifier.") != 0) {
            ESP_LOGW("${TAG_PAGE_WATER_HEATER}", "Unsupported entity for water heater page: %s",
                     entity->entity_id.c_str());
            return;
          }  // if (not a water heater nor a humidifier)
          blueprint_setting_received();

          // Title: the one of the button that opened the page, else the entity's name
          const std::string &title = (details_overlap.entity == entity->entity_id && !details_overlap.title.empty())
                                         ? details_overlap.title
                                         : entity->name;
          if (!title.empty()) disp1->set_component_text("page_label", title.c_str());

          const WaterHeaterView view = water_heater_view(*entity);
          ESP_LOGV("${TAG_PAGE_WATER_HEATER}", "Snapshot: entity=%s state=%s step=%" PRIi32 " steps=%" PRIi32,
                   entity->entity_id.c_str(), entity->state.c_str(), view.temp_step, view.total_steps);
          const std::string &sep = id(mui_decimal_separator);
          const char dec_sep = sep.empty() ? '.' : sep[0];
          const std::string suffix = std::string(entity_snapshot.compact_unit_display ? "" : " ") +
                                     (view.humidifier ? "%" : "${temp_units}");

          // Slider configuration and current value
          disp1->set_component_text("temp_unit", suffix.c_str());
          disp1->send_command_printf("slider.maxval=%" PRIi32, view.total_steps);
          disp1->set_component_value("temp_offset", view.temp_offset);
          disp1->set_component_value("temp_step", view.temp_step);
          disp1->set_component_text("current_temp", water_heater_value_text(view.current, view.temp_step, suffix,
                                                                            dec_sep, "${LOCALIZATION[LANG].unavailable}")
                                                        .c_str());

          // Target and slider
          const bool has_target = view.target > -999.0f;
          if (has_target) {
            disp1->set_component_text("target", water_heater_value_text(view.target, view.temp_step, suffix, dec_sep, "")
                                                    .c_str());
            disp1->set_component_value("slider", std::lround(((10 * view.target) - view.temp_offset) / view.temp_step));
            disp1->set_component_text("target_icon", view.icon);
          }  // if (target)
          disp1->set_component_visibility("slider", has_target);
          disp1->set_component_visibility("target_icon", has_target);
          disp1->set_component_visibility("decrease_temp", has_target);
          disp1->set_component_visibility("increase_temp", has_target);

          water_heater_buttons_render(*entity);

  - id: !extend reset_globals
    then:
      - lambda: |-
          if (new_page_id == get_page_id("water_heater")) {
            display_entity_keep = true;
          }
...
