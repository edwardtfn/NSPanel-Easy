#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME - Page climate                                                                    #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################
---
substitutions:
  CLIMATE_EMBEDDED_SENTINEL: embedded_climate
  TAG_PAGE_CLIMATE: nspanel.page.climate

globals:
  - id: climate_page_unit  # Unit suffix shown next to values on the climate page (e.g. "°C", "%")
    type: std::string
    restore_value: false
    initial_value: '"${temp_units}"'

api:
  actions:
    # Dynamically updates the climate page with the latest climate control settings and status.
    - action: page_climate
      variables:
        current_temp: float      # Current temperature reading.
        supported_features: int  # Bitmask indicating the supported features of the climate device, such as temperature control (1) and fan mode (4).
        target_temp: float       # Desired target temperature setting.
        target_temp_high: float  # Upper limit of the target temperature range for devices supporting ranges.
        target_temp_low: float   # Lower limit of the target temperature range.
        temp_step: int           # Temperature adjustment step size, indicating the granularity of changes (multiplied by 10 for precision).
        total_steps: int         # Total adjustment steps available, derived from the device's temperature range and step size.
        temp_offset: int         # Calibration offset applied to the temperature reading (multiplied by 10 for precision).
        climate_icon: string     # Icon codepoint representing the current climate status, chosen from HASwitchPlate Material Design Icons.
        entity: string           # Entity ID of the climate device, allowing for direct control and status updates.
        unit: string             # Unit suffix to display next to values (e.g. "°C", "%"). Falls back to the compile-time temperature unit when empty.
      then:
        - lambda: |-
            ESP_LOGV("${TAG_PAGE_CLIMATE}", "Action: page_climate");
            ESP_LOGV("${TAG_PAGE_CLIMATE}", "  current_temp: %f", current_temp);
            ESP_LOGV("${TAG_PAGE_CLIMATE}", "  supported_features: %" PRId32, supported_features);
            ESP_LOGV("${TAG_PAGE_CLIMATE}", "  target_temp: %f", target_temp);
            ESP_LOGV("${TAG_PAGE_CLIMATE}", "  target_temp_high: %f", target_temp_high);
            ESP_LOGV("${TAG_PAGE_CLIMATE}", "  target_temp_low: %f", target_temp_low);
            ESP_LOGV("${TAG_PAGE_CLIMATE}", "  temp_step: %" PRId32, temp_step);
            ESP_LOGV("${TAG_PAGE_CLIMATE}", "  total_steps: %" PRId32, total_steps);
            ESP_LOGV("${TAG_PAGE_CLIMATE}", "  temp_offset: %" PRId32, temp_offset);
            ESP_LOGV("${TAG_PAGE_CLIMATE}", "  climate_icon: %s", climate_icon.c_str());
            ESP_LOGV("${TAG_PAGE_CLIMATE}", "  entity: %s", entity.c_str());
            ESP_LOGV("${TAG_PAGE_CLIMATE}", "  unit: %s", unit.c_str());

            // Set detailed entity sensor
            if (current_page_id == get_page_id("climate"))
              detailed_entity->publish_state(entity.c_str());

            set_climate->execute(
              current_temp,
              static_cast<uint32_t>(supported_features),
              target_temp,
              target_temp_high,
              target_temp_low,
              temp_step,
              total_steps,
              temp_offset,
              climate_icon,
              unit
            );

display:
  - id: !extend disp1
    on_touch:
      then:
        - lambda: |-
            if (touch_event) return;  // Ignore the touch, so only the release will be used
            if (page_id == get_page_id("home") and                // Page `home`
                id(is_climate) and                                // Is climate available?
                (component_id == hmi::home::INDR_TEMP.id or       // Indoor temperature
                component_id == hmi::home::INDR_TEMP_ICON.id)) {  // Indoor temp icon
              detailed_entity->publish_state(id(is_embedded_thermostat) ? "${CLIMATE_EMBEDDED_SENTINEL}" : "");
              update_flag_climate_embedded->execute();
              goto_page->execute(get_page_id("climate"));
              return;
            }

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_CLIMATE

script:
  - id: !extend action_component_val
    then:
      - lambda: |-
          if (page != "mem") return;
          if (component == "embedded_climate") {
            id(is_embedded_thermostat) = (val != 0);
            update_flag_climate_embedded->execute();
          }

  - id: !extend boot_nextion  # Defined by boot
    then:
      - script.execute: update_flag_climate_embedded

  - id: change_climate_state
    mode: restart
    parameters:
      key: string
      value: string
    then:
      - lambda: |-
          if (climate_embedded_visible) return;
          if (key == "hvac_mode") {
            fire_ha_event("action_call", {
              {"action", "climate.set_hvac_mode"},
              {"key", "hvac_mode"},
              {"value", value.c_str()},
              {"entity", detailed_entity->state.c_str()}
            });
            return;
          }
          if (key == "temperature" or key == "target_temp_high" or key == "target_temp_low") {
            fire_ha_event("action_call", {
              {"action", "climate.set_temperature"},
              {"key", key.c_str()},
              {"value", to_string(atof(value.c_str()) / 10)},
              {"entity", detailed_entity->state.c_str()}
            });
            return;
          }

  - id: !extend event_from_display  # Defined by hw_display
    then:
      - lambda: |-
          if (params[0] == "climate") {
              // CSV Format: climate,key,<value>
              // params[0]=page, params[1]=key, params[2]=value

            if (params_count != 3) {
              ESP_LOGW("${TAG_PAGE_CLIMATE}", "Bad params");
              return;
            }

            const std::string& key = params[1];
            const std::string& value = params[2];
            change_climate_state->execute(key.c_str(), value.c_str());
          }

  - id: !extend localization_units_separator_update
    then:
      - lambda: |-
          if (current_page_id != get_page_id("climate")) return;
          const std::string& sep = id(mui_decimal_separator);
          const char dec_sep = sep.empty() ? '.' : sep[0];
          const char dec_separator_str[2] = {dec_sep, '\0'};
          disp1->set_component_text("temp_unit", (id(units_separator) + id(climate_page_unit)).c_str());
          disp1->set_component_text("dec_separator", dec_separator_str);

  - id: !extend page_change
    then:
      - lambda: |-
          if (new_page_id != get_page_id("climate")) return;
          page_climate->execute();

  - id: page_climate
    mode: single
    then:  # There's nothing here so far

  - id: !extend reset_globals
    then:
      - lambda: |-
          if (new_page_id != get_page_id("climate")) return;
          display_entity_keep = true;

  - id: set_climate
    mode: restart
    parameters:
      current_temp: float
      supported_features: uint32_t
      target_temp: float
      target_temp_high: float
      target_temp_low: float
      temp_step: uint8_t
      total_steps: uint16_t
      temp_offset: uint16_t
      climate_icon: string
      unit: string
    then:
      - lambda: |-
          id(climate_page_unit) = unit.empty() ? "${temp_units}" : unit;
          ESP_LOGV("${TAG_PAGE_CLIMATE}", "Script: set_climate");
          ESP_LOGV("${TAG_PAGE_CLIMATE}", "  current_temp: %f%s${temp_units}", current_temp,
                                                                              id(units_separator).c_str());
          ESP_LOGV("${TAG_PAGE_CLIMATE}", "  supported_features: %" PRIu32, supported_features);
          ESP_LOGV("${TAG_PAGE_CLIMATE}", "  target_temp: %f%s${temp_units}", target_temp, id(units_separator).c_str());
          ESP_LOGV("${TAG_PAGE_CLIMATE}", "  target_temp_high: %f%s${temp_units}", target_temp_high,
                                                                                    id(units_separator).c_str());
          ESP_LOGV("${TAG_PAGE_CLIMATE}", "  target_temp_low: %f%s${temp_units}", target_temp_low,
                                                                                  id(units_separator).c_str());
          ESP_LOGV("${TAG_PAGE_CLIMATE}", "  temp_step: %u%s${temp_units}", temp_step, id(units_separator).c_str());
          ESP_LOGV("${TAG_PAGE_CLIMATE}", "  total_steps: %u", total_steps);
          ESP_LOGV("${TAG_PAGE_CLIMATE}", "  temp_offset: %i%s${temp_units}", temp_offset, id(units_separator).c_str());
          ESP_LOGV("${TAG_PAGE_CLIMATE}", "  climate_icon: %s", climate_icon.c_str());

          if (current_page_id != get_page_id("climate")) {
            ESP_LOGW("${TAG_PAGE_CLIMATE}", "'set_climate' was called when page 'climate' is not visible");
            return;
          }
          if (temp_step <= 0) {
            ESP_LOGW("${TAG_PAGE_CLIMATE}", "Invalid temp_step (<= 0); skipping climate render");
            return;
          }
          disp1->send_command_printf("climateslider.maxval=%i", total_steps);
          disp1->send_command_printf("slider_high.maxval=%i",   total_steps);
          disp1->send_command_printf("slider_low.maxval=%i",    total_steps);
          disp1->set_component_value("temp_offset",             temp_offset);
          disp1->set_component_value("temp_step",               temp_step);
          disp1->set_component_text("temp_unit",                (id(units_separator) + id(climate_page_unit)).c_str());
          const std::string& sep = id(mui_decimal_separator);
          const char dec_sep = sep.empty() ? '.' : sep[0];
          const char dec_separator_str[2] = {dec_sep, '\0'};
          disp1->set_component_text("dec_separator",            dec_separator_str);
          disp1->show_component("current_temp");
          char buffer[15];
          const bool useDecimal = (temp_step % 10 != 0);

          if (current_page_id != get_page_id("climate")) return;

          if (current_temp > -999) {  // Current temp enabled
            ESP_LOGV("${TAG_PAGE_CLIMATE}", "Show current temperature");
            snprintf(buffer, sizeof(buffer), (useDecimal) ? "%.1f%s%s" : "%.0f%s%s",
                                                                                    current_temp,
                                                                                    id(units_separator).c_str(),
                                                                                    id(climate_page_unit).c_str());
            disp1->set_component_text("current_temp", adjustDecimalSeparator(buffer, dec_sep).c_str());
          } else {
            ESP_LOGV("${TAG_PAGE_CLIMATE}", "Show current temperature 'unavailable'");
            disp1->set_component_text("current_temp", "${LOCALIZATION[LANG].unavailable}");
          }

          if (current_page_id != get_page_id("climate")) return;

          uint8_t active_slider = UINT8_MAX;

          if (target_temp > -999) {  // Target temp enabled
            active_slider = 0;

            snprintf(buffer, sizeof(buffer), (useDecimal) ? "%.1f%s%s" : "%.0f%s%s",
                                                                                    target_temp,
                                                                                    id(units_separator).c_str(),
                                                                                    id(climate_page_unit).c_str());
            disp1->set_component_text("target_high", adjustDecimalSeparator(buffer, dec_sep).c_str());

            disp1->set_component_value("climateslider", round(((10*target_temp) - temp_offset) / temp_step));

            disp1->hide_component("slider_high");
            disp1->hide_component("slider_low");
            disp1->hide_component("target_low");

            disp1->show_component("target_high");
            disp1->show_component("climateslider");

          } else {

            disp1->hide_component("slider_high");

            if (target_temp_low > -999) {  // Target temp low enabled
              active_slider = 2;

              snprintf(buffer, sizeof(buffer), (useDecimal) ? "%.1f%s%s" : "%.0f%s%s",
                                                                                      target_temp_low,
                                                                                      id(units_separator).c_str(),
                                                                                      id(climate_page_unit).c_str());
              disp1->set_component_text("target_low", adjustDecimalSeparator(buffer, dec_sep).c_str());

              disp1->set_component_value("slider_low", round(((10*target_temp_low) - temp_offset) / temp_step));

              disp1->show_component("target_low");
              disp1->show_component("slider_low");

            } else {
              disp1->hide_component("target_low");
              disp1->hide_component("slider_low");
            }

            if (current_page_id != get_page_id("climate")) return;

            if (target_temp_high > -999) {  // Target temp high enabled
              active_slider = 1;

              snprintf(buffer, sizeof(buffer), (useDecimal) ? "%.1f%s%s" : "%.0f%s%s",
                                                                                      target_temp_high,
                                                                                      id(units_separator).c_str(),
                                                                                      id(climate_page_unit).c_str());
              disp1->set_component_text("target_high", adjustDecimalSeparator(buffer, dec_sep).c_str());

              disp1->set_component_value("slider_high", round(((10*target_temp_high) - temp_offset) / temp_step));

              disp1->show_component("target_high");
              disp1->show_component("slider_high");
            } else {
              disp1->hide_component("target_high");
              disp1->hide_component("slider_high");
            }
          }

          if (current_page_id != get_page_id("climate")) return;

          if (
                target_temp > -999 or       // Target temp enabled
                target_temp_high > -999 or  // Target temp high enabled
                target_temp_low > -999      // Target temp low enabled
              ) {
            disp1->set_component_text("target_icon", climate_icon.c_str());
            disp1->show_component("target_icon");
            disp1->show_component("decrease_temp");
            disp1->show_component("increase_temp");
          } else {
            disp1->hide_component("target_icon");
            disp1->hide_component("decrease_temp");
            disp1->hide_component("increase_temp");
          }

          if (current_page_id != get_page_id("climate")) return;

          if (active_slider != UINT8_MAX)
            disp1->set_component_value("active_slider", active_slider);

  - id: !extend stop_all
    then:
      - lambda: change_climate_state->stop();

  - id: !extend stop_page_constructors
    then:
      - lambda: |-
          page_climate->stop();
          set_climate->stop();

  - id: update_flag_climate_embedded
    mode: single
    then:
      - lambda: |-
          // Keeps the display's `climate_embedded` global in sync with the ESPHome side, so the
          // `climate` page preinit accepts the page while the API is disconnected.
          disp1->send_command_printf("climate_embedded=%i", id(is_embedded_thermostat) ? 1 : 0);
...
