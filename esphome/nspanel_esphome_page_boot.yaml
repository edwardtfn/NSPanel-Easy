#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME - Page boot                                                                       #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  PAGE_BOOT_COMPONENT_ID_BT_REBOOT: 14
  PAGE_BOOT_COMPONENT_ID_HS_BLUEPRINT: 35   # Touch area of the Blueprint line
  PAGE_BOOT_COMPONENT_ID_HS_ICON_NAMES: 36  # Touch area of the icon names line
  PAGE_BOOT_DELAY_TO_EXIT: 30s
  PAGE_BOOT_ID: 0
  TAG_PAGE_BOOT: nspanel.page.boot

globals:
  # The status page stays open, also across restarts, from when the user opens it until the user closes it (#841)
  - id: status_page_pinned
    type: bool
    restore_value: true
    initial_value: "false"

  # When Home Assistant connected, in ms since the start (millis_64); 0 while it is not connected
  - id: ha_connected_since
    type: uint64_t
    restore_value: false
    initial_value: "0"

display:
  - id: !extend disp1
    # No `start_up_page`: the display is not sent to the boot page when ESPHome connects. It starts on the
    # screensaver and waits there (#615), and it keeps its page when only ESPHome restarts.
    on_setup:
      then:
        # The page the display is showing is not known here, so ask for it (answered through `on_page`)
        - lambda: disp1->send_command("sendme");
        # Ask the display for its settings (model, TFT version), instead of waiting for it to send them
        - script.execute: display_report_request
    # The display settings, sent one by one by the TFT's `report_display` macro when ESPHome asks for them
    # (see `display_report_request`). "display_report" closes the report.
    on_custom_sensor:
      then:
        - lambda: |-
            // Display modes and flags are small positive numbers; anything else is taken as not received
            const uint8_t number = (value > 0 and value <= UINT8_MAX) ? static_cast<uint8_t>(value) : 0;
            if (key == "display_mode") {
              display_report.display_mode = number;
            } else if (key == "hard_coded_mode") {
              display_report.hard_coded_mode = number;
            } else if (key == "magic_flag") {
              display_report.magic_flag = number;
            }  // if (key)
    on_custom_text_sensor:
      then:
        - lambda: |-
            if (key == "tft_version") display_report.tft_version = value.str();
    on_custom_binary_sensor:
      then:
        - lambda: |-
            if (key == "display_report") {
              // Tells the display that ESPHome is connected, which ends its wait on the screensaver or boot page
              disp1->send_command("esphome=1");
              display_params_apply->execute(display_report.display_mode, display_report.hard_coded_mode,
                                            display_report.tft_version, display_report.magic_flag);
              display_report.reset();
              return;
            }  // if (display_report)
            if (key != "display_ack") return;
            ESP_LOGI("${TAG_PAGE_BOOT}", "Nextion display acknowledged. Requesting update from the blueprint...");
            disp1->send_command("display_ack=1");
            if (disp1->is_setup()) {
              // The display (re)started dark, with the brightness values from its Program.s, also after a
              // restart in the middle of a run, which `on_setup` does not see. Send the configured values again
              // and apply the brightness the panel should have, as the firmware's cached value no longer matches.
              // While booting, or held dimmed, the display stays dimmed (#485, #656).
              disp1->send_command_printf("brightness=%i", static_cast<int>(display_brightness->state));
              disp1->send_command_printf("brightness_dim=%i", static_cast<int>(display_dim_brightness->state));
              disp1->send_command_printf("brightness_sleep=%i", static_cast<int>(display_sleep_brightness->state));
              brightness_current = UINT8_MAX;
              // While booting, the display keeps its start screen until the boot opens a page
              // (see `display_start_hold_release`)
              if (!system_flags.display_start_hold) {
                set_brightness->execute((brightness_dim_hold or brightness_auto_hold) ?
                                        display_dim_brightness->state : display_brightness->state);
              }  // if (!system_flags.display_start_hold)
              // The display restarted with the palette of its TFT. While booting, `boot_wrap_up` applies the
              // theme again; after the boot, nothing else would.
              display_start++;
              if (system_flags.boot_completed) theme_update->execute();
            }  // if (disp1->is_setup())
            system_flags.display_resync_pending = true;
            boot_request_blueprint_settings->execute("display_ack");
            display_report_request->execute();  // The display (re)started, so its settings may have changed

    on_touch:
      then:
        - lambda: |-
            if (touch_event or page_id != get_page_id("boot")) return;  // Only act with release, on the boot page
            switch (component_id) {
              case ${PAGE_BOOT_COMPONENT_ID_BT_REBOOT}:
                screen_power->turn_off();
                App.safe_reboot();
                break;
              case ${PAGE_BOOT_COMPONENT_ID_HS_BLUEPRINT}:
                // Retry a request of the Blueprint settings that was given up (red), as after a reload
                if (blueprint_settings_state != BlueprintSettingsState::FAILED) break;
                ESP_LOGI("${TAG_PAGE_BOOT}", "Blueprint settings requested again from the status page");
                blueprint_settings_timeout->stop();
                blueprint_settings_state = BlueprintSettingsState::NEEDED;
                blueprint_settings_requests = 0;
                blueprint_settings_resend = false;
                boot_request_blueprint_settings->execute("reload");
                page_boot_status->execute(false);
                break;
              #ifdef NSPANEL_EASY_SUBSCRIBE
              case ${PAGE_BOOT_COMPONENT_ID_HS_ICON_NAMES}:
                // Retry the icon names that were given up (red), keeping the names received
                if (!sub_icon_names_failed()) break;
                ESP_LOGI("${TAG_PAGE_BOOT}", "Icon names requested again from the status page");
                api_icon_names_fetch->execute();
                page_boot_status->execute(false);
                break;
              #endif  // NSPANEL_EASY_SUBSCRIBE
            }  // switch (component_id)

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_BOOT

script:
  - id: !extend boot_preparation
    then:
      - script.execute: page_boot_exit_on_timeout

  - id: !extend event_from_display  # Defined by hw_display
    then:
      - lambda: |-
          if ((params[0] == "blank" || params[0] == "boot") && params[1] == "params") {
            // Pushed by the timers of TFTs up to v2026.11.16, and by the blank TFT. A newer TFT sends nothing by
            // itself: ESPHome asks for its settings (see `display_report_request`).
            // Protocol versions:
            // CSV Format v0:      boot,params,<display_mode>,<charset>,<version>
            // CSV Format v1:      boot,params,<display_mode>,<version>
            // CSV Format v2:      boot,params,<display_mode>,<hard_coded_mode>,<version>,<magic_flag_found_at_boot>
            // params[0] = "boot"
            // params[1] = "params"
            // params[2] = display_mode               // EEPROM-backed or hard_coded
            // params[3] = hard_coded_mode            // new: compile-time default for this TFT file
            //           = charset (ignored)          // old: no longer used
            // params[4] = version                    // both contracts
            // params[5] = magic_flag_found_at_boot   // new only: 0 = uninitialized, 1 = valid

            system_flags.display_settings_received = false;

            uint8_t protocol_version = UINT8_MAX;

            switch (params_count) {
              case 4:  // Contract v1
                protocol_version = 1;
                break;
              case 5:  // Contract v0 (Blackymas)
                protocol_version = 0;
                break;
              case 6:  // Contract v2 (new)
                protocol_version = 2;
                break;
            }

            if (protocol_version > 2) {
              ESP_LOGW("${TAG_PAGE_BOOT}", "Unexpected params count: %zu", params_count);
              return;
            }

            const bool old_contract = (params_count == 5);


            // Stop the timer which sends these params, as those are not going to change anymore
            disp1->send_command("tm_esphome.en=0");

            // Parse display parameters — pre-validate to reject whitespace, signs,
            // and non-numeric input before parsing, then range-check the result.
            auto parse_uint8_strict = [](const std::string &s) -> uint8_t {
              if (s.empty() || s.find_first_not_of("0123456789") != std::string::npos)
                return 0;
              char *end = nullptr;
              const unsigned long parsed = strtoul(s.c_str(), &end, 10);
              return (parsed <= UINT8_MAX) ? static_cast<uint8_t>(parsed) : 0;
            };

            const uint8_t display_mode_from_tft = parse_uint8_strict(params[2]);
            const bool valid_display_mode_from_tft = display_mode_index_of(display_mode_from_tft) != UINT8_MAX;
            ESP_LOGI("${TAG_PAGE_BOOT}", "Display params:");
            ESP_LOGI("${TAG_PAGE_BOOT}", "  Contract ver:  %" PRIu8, protocol_version);
            ESP_LOGI("${TAG_PAGE_BOOT}", "  Mode:          %" PRIu8, display_mode_from_tft);

            switch (protocol_version) {
              case 0:  // Blackymas / pre-CJK removal: boot,params,<display_mode>,<charset>,<version>
                ESP_LOGW("${TAG_PAGE_BOOT}", "  Old TFT contract v0 — initializing EEPROM");
                if (valid_display_mode_from_tft) {
                  display_mode_eeprom = display_mode_from_tft;
                  auto call = display_model->make_call();
                  call.set_index(display_mode_index_of(display_mode_from_tft));
                  call.perform();
                } else {
                  ESP_LOGW("${TAG_PAGE_BOOT}", "  Invalid display_mode: %" PRIu8, display_mode_from_tft);
                }
                break;
              case 1:  // v2026.4.9 only: boot,params,<display_mode>,<version>
                ESP_LOGW("${TAG_PAGE_BOOT}", "  Old TFT contract v1 — initializing EEPROM");
                if (valid_display_mode_from_tft) {
                  display_mode_eeprom = display_mode_from_tft;
                  auto call = display_model->make_call();
                  call.set_index(display_mode_index_of(display_mode_from_tft));
                  call.perform();
                } else {
                  ESP_LOGW("${TAG_PAGE_BOOT}", "  Invalid display_mode: %" PRIu8, display_mode_from_tft);
                }
                break;
              case 2:  // v2026.4.10+: boot,params,<display_mode>,<hard_coded_mode>,<version>,<magic_flag_found_at_boot>
                display_params_apply->execute(display_mode_from_tft, parse_uint8_strict(params[3]), params[4],
                                              parse_uint8_strict(params[5]));
                return;
            }

            // Version position depends on contract
            const std::string &ver_str = (protocol_version == 1) ? params[3] : params[4];
            // CalVer (YYYY.M.seq, the release version) or legacy (major.minor) from older TFT files
            const bool ver_valid = tft_ver_valid(ver_str);
            version_tft->publish_state(ver_valid ? ver_str : "");

            ESP_LOGI("${TAG_PAGE_BOOT}", "  TFT version:   %s%s", ver_str.c_str(), ver_valid ? "" : " (INVALID)");

            system_flags.display_settings_received = ver_valid && display_valid;
          }

  # Asks the TFT for its display settings (model, TFT version). The TFT answers with its `report_display`
  # macro, which sends each value on its own (see `on_custom_sensor`), so it works on any page and also
  # when ESPHome restarts while the display keeps running. A TFT up to v2026.11.16 has no such macro and
  # ignores this: it pushes the settings by itself (see `event_from_display`).
  # The request is repeated a few times while there is no answer, as nothing else would ask again.
  - id: display_report_request
    mode: restart
    then:
      - repeat:
          count: 5
          then:
            - lambda: |-
                if (iteration > 0 and system_flags.display_settings_received) {
                  display_report_request->stop();
                  return;
                }  // if (already answered)
                display_report.reset();
                disp1->send_command("call report_display");
            - delay: 3s
      - lambda: |-
          if (system_flags.display_settings_received) return;
          // No answer: a TFT up to v2026.11.16 has no such macro, and only sends its settings from its boot page
          ESP_LOGW("${TAG_PAGE_BOOT}", "No display report, opening the boot page for the settings of an older TFT");
          goto_page->execute(get_page_id("boot"));

  # Applies the display settings reported by the TFT: the display model, from the mode stored on the display
  # or from the default of its TFT file, and the TFT version.
  - id: display_params_apply
    mode: queued
    max_runs: 2
    parameters:
      display_mode: uint8_t      # Stored on the display (EEPROM), or the default of the TFT file
      hard_coded_mode: uint8_t   # Default display mode of the TFT file
      tft_version: string        # Version of the TFT file
      magic_flag: uint8_t        # 1 when the display's EEPROM was already initialized when it started
    then:
      - lambda: |-
          system_flags.display_settings_received = false;
          // Stop the timer of the boot page that waits for ESPHome
          disp1->send_command("tm_esphome.en=0");

          ESP_LOGI("${TAG_PAGE_BOOT}", "Display params:");
          ESP_LOGI("${TAG_PAGE_BOOT}", "  Mode:          %" PRIu8, display_mode);
          ESP_LOGI("${TAG_PAGE_BOOT}", "  Hard-coded:    %" PRIu8, hard_coded_mode);
          ESP_LOGI("${TAG_PAGE_BOOT}", "  Magic flag:    %" PRIu8, magic_flag);

          // The display model: from the default of the TFT file when the display's EEPROM was not
          // initialized, else from the mode stored on the display
          const uint8_t mode = (magic_flag == 0) ? hard_coded_mode : display_mode;
          if (magic_flag == 0) {
            ESP_LOGW("${TAG_PAGE_BOOT}", "  EEPROM was uninitialized at boot — using hard-coded default");
          }  // if (magic_flag == 0)
          const uint8_t index = display_mode_index_of(mode);  // Position of the mode's option in the selector
          if (index != UINT8_MAX) {
            auto call = display_model->make_call();
            call.set_index(index);
            call.perform();
          } else {
            ESP_LOGW("${TAG_PAGE_BOOT}", "  Invalid display mode: %" PRIu8, mode);
          }  // if (valid mode)

          // CalVer (YYYY.M.seq, the release version) or legacy (major.minor) from older TFT files
          const bool ver_valid = tft_ver_valid(tft_version);
          version_tft->publish_state(ver_valid ? tft_version : "");
          ESP_LOGI("${TAG_PAGE_BOOT}", "  TFT version:   %s%s", tft_version.c_str(), ver_valid ? "" : " (INVALID)");

          system_flags.display_settings_received = ver_valid && display_valid;

          // A display that is ready, with a TFT this firmware can use, shows the wake-up page right away,
          // instead of waiting on the boot page for Wi-Fi, Home Assistant and the Blueprint (#615).
          // With an older TFT, the panel stays on the boot page until the TFT is updated.
          if (system_flags.display_settings_received and !system_flags.boot_completed and
              tft_ver_gte(tft_version, "${min_tft_version}")) {
            boot_show_wakeup_page->execute();
          }  // if (display ready while booting)

  # Opens the wake-up page while the boot sequence is still running, with the settings stored on the panel.
  # What comes from Home Assistant and from the Blueprint is shown as each one becomes available.
  - id: boot_show_wakeup_page
    mode: single
    then:
      # The settings the pages need, which are stored on the panel: brightness, wake-up page, fonts, theme
      - script.execute: boot_nextion
      - script.wait: boot_nextion
      - script.execute: theme_update
      - script.wait: theme_update
      - lambda: |-
          if (system_flags.boot_completed) return;
          if (current_page_id != get_page_id("screensaver") and current_page_id != get_page_id("boot")) return;
          if (id(status_page_pinned)) {
            // Left open by the user before the restart: shown again until the user closes it (#841)
            ESP_LOGI("${TAG_PAGE_BOOT}", "Display ready, opening the status page left open");
            if (current_page_id != get_page_id("boot")) goto_page->execute(get_page_id("boot"));
            return;
          }  // if (status page pinned)
          ESP_LOGI("${TAG_PAGE_BOOT}", "Display ready, opening the wake-up page");
          // Not a user action: the wake-up page stays dimmed while booting, e.g. after a power outage at night (#485, #656)
          brightness_auto_hold_arm(static_cast<uint8_t>(display_brightness->state));
          wakeup->execute(false);

  # Ends the start screen of the display (see `display_start_hold`), when the display leaves the screensaver it
  # starts on, or when the boot completes: from then on, the panel sets the brightness. The boot page sets its
  # own brightness, as it is shown at full brightness when ESPHome does not connect.
  - id: display_start_hold_release
    mode: single
    then:
      - lambda: |-
          if (!system_flags.display_start_hold) return;
          system_flags.display_start_hold = false;
          ESP_LOGD("${TAG_PAGE_BOOT}", "Start screen released on page '%s'", page_names[current_page_id]);
          brightness_current = UINT8_MAX;  // Set by the display itself until now
          if (current_page_id == get_page_id("boot")) return;
          if (current_page_id == get_page_id("screensaver")) {
            if (id(status_page_pinned)) {
              // Left open by the user before the restart: shown again until the user closes it (#841)
              goto_page->execute(get_page_id("boot"));
              return;
            }  // if (status page pinned)
            // Still on the screensaver when the boot completes: replace the start screen by the screensaver
            page_screensaver->execute();
            return;
          }  // if (screensaver)
          set_brightness->execute((brightness_dim_hold or brightness_auto_hold) ? display_dim_brightness->state :
                                                                                  display_brightness->state);

  - id: page_boot
    mode: single
    then:
      - lambda: |-
          ESP_LOGD("${TAG_PAGE_BOOT}", "Page boot constructor started");
          page_boot_exit_on_timeout->execute();
          // The close button is hidden by the display while ESPHome is not connected
          disp1->send_command("vis button_back,1");
          page_boot_status->execute(true);
          wait_for_page_boot_exit->execute();
          ESP_LOGD("${TAG_PAGE_BOOT}", "Page boot constructor completed");

  - id: page_boot_exit_on_timeout
    mode: single
    then:
      - delay: ${PAGE_BOOT_DELAY_TO_EXIT}
      - script.wait: wait_for_version_tft
      - lambda: |-
          // Opened by the user as a status page: kept until the user leaves it
          if (system_flags.boot_page_requested) return;
          // Not a user action: the wake-up page stays dimmed, unless the boot page was touched (#485, #656)
          if (current_page_id == get_page_id("boot")) {
            brightness_auto_hold_arm(static_cast<uint8_t>(display_brightness->state));
            wakeup->execute(false);
          }  // if (current_page_id == get_page_id("boot"))

  ##### Status page: the lines known by the firmware, from ESPHome to the icon names #####
  # The display fills the first line (TFT version and baud rate) and the details itself, and greys these lines out
  # while ESPHome is not connected. Called when the page opens (force: send every line) and every second while it is
  # shown (only the lines that changed).
  - id: page_boot_status
    mode: single
    parameters:
      force: bool
    then:
      - lambda: |-
          if (current_page_id != get_page_id("boot") or id(page_change_pending)) return;
          enum StatusMark : uint8_t { STATUS_OK, STATUS_WARN, STATUS_BAD, STATUS_NONE };
          static constexpr const char *STATUS_GLYPHS[] = {"\uE5DF", "\uE027", "\uE158", "\uE765"};
          static constexpr uint16_t STATUS_COLORS[] = {15947, 62885, 57895, 33913};  // Green, orange, red, grey
          static constexpr uint16_t STATUS_WHITE = 65535;
          // Rows 2 to 7, as last sent: the mark and the value
          static std::string shown[6];
          static std::string shown_name;
          if (force) {
            for (auto &row : shown) row.clear();
            shown_name.clear();
          }

          // The panel's name in the title, to tell the panels apart on photos (#841). Without ESPHome, the
          // display keeps "NSPanel Easy".
          std::string name = App.get_friendly_name().str();
          if (name.empty()) name = App.get_name().str();
          std::replace(name.begin(), name.end(), '"', '\'');
          if (name.size() > 60) {
            size_t cut = 60;
            while (cut > 0 and (static_cast<uint8_t>(name[cut]) & 0xC0) == 0x80) cut--;  // Not inside a character
            name.resize(cut);
          }  // if (too long for the title)
          if (!name.empty() and name != shown_name) {
            shown_name = name;
            disp1->send_command_printf("nspanel_easy.txt=\"%s\"", name.c_str());
          }  // if (name changed)
          auto show = [&](uint8_t row, StatusMark mark, const std::string &value) {
            const std::string key = std::to_string(mark) + value;
            if (shown[row - 2] == key) return;
            shown[row - 2] = key;
            const uint16_t color = (mark == STATUS_OK) ? STATUS_WHITE : STATUS_COLORS[mark];
            disp1->send_command_printf("mark%u.txt=\"%s\"", row, STATUS_GLYPHS[mark]);
            disp1->send_command_printf("mark%u.pco=%u", row, STATUS_COLORS[mark]);
            disp1->send_command_printf("val%u.txt=\"%s\"", row, value.c_str());
            disp1->send_command_printf("val%u.pco=%u", row, color);
            disp1->send_command_printf("lbl%u.pco=%u", row, mark == STATUS_NONE ? STATUS_COLORS[STATUS_NONE] : STATUS_WHITE);
          };

          // ESPHome: the firmware version, orange when the TFT carries another one
          const std::string &tft = version_tft->state;
          if (!tft.empty() and tft != "${version}") {
            show(2, STATUS_WARN, "${version}, TFT differs");
          } else {
            show(2, STATUS_OK, "${version}");
          }  // if (TFT version)

          // Wi-Fi: the IP address and the signal, orange below -75 dBm
          if (!wifi_component->is_connected()) {
            show(3, STATUS_BAD, "not connected");
          } else {
            char wifi[32] = "connected";
            auto ips = network::get_ip_addresses();
            const int rssi = wifi_component->wifi_rssi();
            if (!ips.empty()) {
              char ip[16];  // Sufficient for IPv4: "255.255.255.255" + '\0'
              ips[0].str_to(ip);
              snprintf(wifi, sizeof(wifi), "%s %d dBm", ip, rssi);
            }  // if (address known)
            show(3, rssi < -75 ? STATUS_WARN : STATUS_OK, wifi);
          }  // if (Wi-Fi)

          // Home Assistant, and for how long (#841)
          const bool ha = api_server->is_connected_with_state_subscription();
          if (ha and id(ha_connected_since) > 0) {
            const uint32_t minutes = static_cast<uint32_t>((millis_64() - id(ha_connected_since)) / 60000ULL);
            char since[32];
            if (minutes >= 1440) {
              snprintf(since, sizeof(since), "connected %" PRIu32 "d %" PRIu32 "h", minutes / 1440, (minutes / 60) % 24);
            } else if (minutes >= 60) {
              snprintf(since, sizeof(since), "connected %" PRIu32 "h %" PRIu32 "m", minutes / 60, minutes % 60);
            } else {
              snprintf(since, sizeof(since), "connected %" PRIu32 "m", minutes);
            }  // if (duration)
            show(4, STATUS_OK, since);
          } else {
            show(4, ha ? STATUS_OK : STATUS_BAD, ha ? "connected" : "not connected");
          }  // if (Home Assistant)

          // Blueprint: its version and how far its settings are
          const std::string &blueprint = version_blueprint->state;
          const std::string prefix = blueprint.empty() ? "" : blueprint + " ";
          switch (blueprint_settings_state) {
            case BlueprintSettingsState::COMPLETE:
              show(5, system_flags.blueprint_ready ? STATUS_OK : STATUS_WARN, prefix + "complete");
              break;
            case BlueprintSettingsState::PENDING:
              show(5, STATUS_WARN, prefix + "receiving");
              break;
            case BlueprintSettingsState::FAILED:
              show(5, STATUS_BAD, prefix + "gave up");
              break;
            default:
              show(5, ha ? STATUS_WARN : STATUS_BAD, ha ? prefix + "waiting" : "not available");
              break;
          }  // switch (blueprint_settings_state)

          #ifdef NSPANEL_EASY_SUBSCRIBE
          // Bindings: how many are live, and whether they are stored and verified
          char bindings[32];
          if (sub_store_failed()) {
            snprintf(bindings, sizeof(bindings), "%" PRIu16 ", not stored", sub_count);
            show(6, STATUS_BAD, bindings);
          } else if (sub_unverified_count() > 0) {
            snprintf(bindings, sizeof(bindings), "%" PRIu16 ", not verified", sub_count);
            show(6, STATUS_WARN, bindings);
          } else {
            snprintf(bindings, sizeof(bindings), "%" PRIu16, sub_count);
            show(6, sub_count > 0 ? STATUS_OK : STATUS_WARN, bindings);
          }  // if (bindings)

          // Icon names: all received, still arriving, or given up
          char icons[32];
          const uint16_t received = sub_icon_names_received();
          const uint16_t expected = sub_icon_names_expected();
          if (sub_icon_names_complete()) {
            snprintf(icons, sizeof(icons), "all %" PRIu16, expected);
            show(7, STATUS_OK, icons);
          } else if (sub_icon_names_failed()) {
            snprintf(icons, sizeof(icons), "gave up at %" PRIu16, received);
            show(7, STATUS_BAD, icons);
          } else if (expected > 0) {
            snprintf(icons, sizeof(icons), "%" PRIu16 " of %" PRIu16, received, expected);
            show(7, STATUS_WARN, icons);
          } else {
            show(7, STATUS_WARN, "waiting");
          }  // if (icon names)
          #else
          show(6, STATUS_NONE, "-");
          show(7, STATUS_NONE, "-");
          #endif  // NSPANEL_EASY_SUBSCRIBE

  - id: !extend page_change
    then:
      - lambda: |-
          // Leaving the screensaver the display starts on ends its start screen
          if (new_page_id != get_page_id("screensaver")) display_start_hold_release->execute();
          // The boot page opened from the settings page (long press) is the status page, shown on request: it is
          // left by the user, like any other page, instead of by the boot (#615). It stays open across restarts
          // until the user leaves it (#841). A display restart goes back to the screensaver: that is not the user.
          const uint8_t boot_page_id = get_page_id("boot");
          if (new_page_id == boot_page_id and last_page_id == get_page_id("settings")) {
            id(status_page_pinned) = true;
          } else if (last_page_id == boot_page_id and new_page_id != boot_page_id and
                     new_page_id != get_page_id("screensaver") and id(status_page_pinned)) {
            ESP_LOGD("${TAG_PAGE_BOOT}", "Status page closed");
            id(status_page_pinned) = false;
          }  // if (status page opened or closed)
          system_flags.boot_page_requested = (new_page_id == boot_page_id and id(status_page_pinned));
          if (new_page_id != get_page_id("boot")) return;
          page_boot->execute();

  - id: !extend update_flag_api_ready
    then:
      - lambda: |-
          // When Home Assistant connected, for the status page
          if (!api_server->is_connected_with_state_subscription()) {
            id(ha_connected_since) = 0;
          } else if (id(ha_connected_since) == 0) {
            id(ha_connected_since) = millis_64();
          }  // if (Home Assistant connected)

  - id: !extend stop_all
    then:
      - lambda: |-
          wait_for_page_boot_exit->stop();

  - id: !extend stop_page_constructors
    then:
      - lambda: |-
          page_boot->stop();
          page_boot_status->stop();

  - id: wait_for_page_boot_exit
    mode: restart
    then:
      - while:
          condition:
            - lambda: |-
                return current_page_id == get_page_id("boot");
          then:
            - lambda: |-
                ESP_LOGV("${TAG_PAGE_BOOT}", "Waiting for boot page exit");
                page_boot_status->execute(false);
            - delay: 1s

  - id: !extend watchdog_round
    then:
      - lambda: |-
          if (current_page_id != get_page_id("boot")) return;
          if (system_flags.boot_page_requested) return;  // Status page opened by the user
          if (version_tft->state.empty()) return;
          brightness_auto_hold_arm(static_cast<uint8_t>(display_brightness->state));  // Not a user action (#656)
          wakeup->execute(true);

text_sensor:
  - id: !extend version_blueprint
    on_value:
      then:
        - lambda: |-
            wait_to_be_ready->execute();
...
