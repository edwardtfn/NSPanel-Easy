#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME CORE - BOOT                                                                       #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  ##############################
  ## Change only in your      ##
  ## local yaml substitutions ##
  ##############################
  BOOT_EVENT_REPEAT_INTERVAL_MS: 10000
  BOOT_SETTINGS_QUIET_MS: 15000  # A retry waits until the Blueprint has sent nothing for this long
  # Time the boot waits for the Blueprint while Home Assistant is connected, before it goes on without it
  BOOT_BLUEPRINT_WAIT_TIMEOUT_MS: 120000
  # Without the end of the settings (`settings_end`), the panel requests them again after this delay, doubled on
  # each new request (up to 8 times), and gives up after BOOT_SETTINGS_MAX_REQUESTS requests (#664)
  BOOT_SETTINGS_RETRY_DELAY_MS: 30000
  BOOT_SETTINGS_MAX_REQUESTS: 5
  # When the Blueprint tells that the settings changed, the panel waits up to this long (at random) before requesting
  # them, so the panels of a large installation do not all request at the same time
  BOOT_SETTINGS_STALE_MAX_DELAY_MS: 20000
  BOOT_NEXTION_WAIT_TIMEOUT: 120s
  TAG_BOOT: nspanel.boot

display:
  - id: !extend disp1
    on_setup:
      then:
        - script.execute: watchdog_round

esphome:
  build_flags:
    - -D NSPANEL_EASY_BOOT
  on_boot:
    then:
      - script.execute: boot

script:
  - id: boot
    mode: single
    then:  # Other packages will subscribe themselves to this to run after critical components and early routines
      - lambda: |-
          ESP_LOGI("${TAG_BOOT}", "Starting boot sequence");
          blueprint_status_flags.reset();
          wait_to_be_ready->execute();
          boot_preparation->execute();
          boot_critical_components->execute();
      - script.wait: boot_critical_components
      - script.execute: boot_early_routines
      - script.wait: boot_early_routines
      - delay: 1s
      # This should be moved somewhere else
      - lambda: |-
          ESP_LOGD("${TAG_BOOT}", "Boot: Starting sequence");
          ESP_LOGD("${TAG_BOOT}", "Boot: Waiting for Wi-Fi");
          wait_for_wifi->execute();
      - script.wait: wait_for_wifi

      - lambda: |-
          if (wifi_component->is_connected()) {  // Wi-Fi connected
            ESP_LOGD("${TAG_BOOT}", "Boot: Wi-Fi connected");
          } else {
            ESP_LOGD("${TAG_BOOT}", "Boot: Wi-Fi NOT available");
          }

          wait_for_api->execute();
      - script.wait: wait_for_api
      - lambda: |-
          if (api_server->is_connected_with_state_subscription()) {
            ESP_LOGD("${TAG_BOOT}", "Boot: API connected");
          } else {
            ESP_LOGD("${TAG_BOOT}", "Boot: API not available");
          }

          // Wait for a response from the blueprint
          boot_request_blueprint_settings->execute("start");
          blueprint_wait_start();  // Once per boot: the wait in the wrap-up shares this timeout
          wait_for_blueprint->execute();
      - script.wait: wait_for_blueprint
      - lambda: |-
          if (not system_flags.blueprint_ready) {
            ESP_LOGD("${TAG_BOOT}", "Boot: Blueprint not available");
          }

          // Display settings
          boot_nextion->execute();
      - script.wait: boot_nextion

      - lambda: |-
          // Wrap-up
          ESP_LOGD("${TAG_BOOT}", "Boot: Wait to finish");
          wait_for_wifi->execute();
          // Without Home Assistant, the API and the Blueprint were already waited for above. Waiting again
          // would only delay a boot that completes with the settings stored on the panel (#516).
          // With Home Assistant, this wait shares the timeout of the one above, so it ends at once if that expired.
          if (api_server->is_connected_with_state_subscription()) {
            wait_for_blueprint->execute();
          }  // if (api_server->is_connected_with_state_subscription())
      - script.wait: wait_for_wifi
      - script.wait: wait_for_api
      - script.wait: wait_for_blueprint
      - script.wait: wait_for_version_tft
      - script.execute: boot_wrap_up
      - script.wait: boot_wrap_up

      - lambda: |-
          system_flags.boot_completed = true;
          refresh_wifi_icon->execute(false);  // Red from now on when a connection is missing
          display_start_hold_release->execute();
          ESP_LOGD("${TAG_BOOT}", "Boot: Jump to wake-up page");
          // Not a user action: the display stays dimmed as during the boot (#485), unless it was touched
          // meanwhile, and only returns to the regular brightness on a user action (#656)
          brightness_auto_hold_arm(static_cast<uint8_t>(display_brightness->state));
          wakeup->execute(true);

  - id: boot_critical_components
    mode: single
    then:  # Critical components should subscribe themselves to this
      - lambda: |-
          ESP_LOGI("${TAG_BOOT}", "Starting boot critical components sequence");

  - id: boot_early_routines
    mode: single
    then:  # Critical components should subscribe themselves to this
      - lambda: |-
          ESP_LOGI("${TAG_BOOT}", "Starting boot early routines sequence");

  - id: boot_nextion
    mode: single
    then:
      - wait_until:
          condition:
            - lambda: return disp1->is_setup();
          timeout: ${BOOT_NEXTION_WAIT_TIMEOUT}
      - lambda: |-
          if (!disp1->is_setup()) boot_nextion->stop();
          // Display settings
          ESP_LOGD("${TAG_BOOT}", "Boot: Sending display settings");
          disp1->send_command_printf("brightness=%i",       int(display_brightness->state));
          disp1->send_command_printf("brightness_dim=%i",   int(display_dim_brightness->state));
          disp1->send_command_printf("brightness_sleep=%i", int(display_sleep_brightness->state));
          disp1->send_command_printf("wakeup_page_id=%" PRIu8, get_page_id(wakeup_page_name->current_option()));

  - id: boot_preparation
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("${TAG_BOOT}", "Starting boot preparation sequence");

  - id: boot_request_blueprint_settings
    mode: restart
    parameters:
      step: string
    then:
      - lambda: |-
          // Only the panel requests its settings (#664). "start" asks for the Blueprint version only, so it is
          // always sent. A full request is only sent while the settings are needed: once requested, the panel
          // waits for their end (`settings_end`), and `blueprint_settings_timeout` requests them again without it.
          // A display that restarts loses what was sent to it. Only a "display_ack" once the display is set up is
          // a restart (as in its handler): before that, the display repeats it until it is set up. "setup" comes
          // once per ESPHome run, so never from a restart.
          if (step == "display_ack" and disp1->is_setup()) {
            if (blueprint_settings_state == BlueprintSettingsState::COMPLETE or
                blueprint_settings_state == BlueprintSettingsState::FAILED) {
              blueprint_settings_state = BlueprintSettingsState::NEEDED;
              blueprint_settings_requests = 0;
            } else if (blueprint_settings_state == BlueprintSettingsState::PENDING) {
              // Not a second send in parallel: requested again once the send in progress ends
              blueprint_settings_resend = true;
            }  // if (blueprint_settings_state)
          }  // if (display restarted)
          if (step != "start" and blueprint_settings_state != BlueprintSettingsState::NEEDED) return;
          static uint32_t last_boot_event_fired = 0;
          // Last full request (every step but "start", which the Blueprint answers with the version only)
          static uint32_t last_full_request_fired = 0;
          // Set when a full request (every step but "start") was sent while no client was connected.
          // ESPHome drops such events, and the Blueprint answers "start" with the version only.
          static bool full_request_lost = false;
          const uint32_t now = App.get_loop_component_start_time();
          // "start" opens the boot sequence, so it is never dropped. "display_ack" after the Blueprint settings
          // were received restarts the state replay after an unexpected display reset, so it is not dropped
          // either. Every other step is a retry and stays rate-limited to keep a stalled boot from flooding
          // Home Assistant.
          const bool display_reset = (step == "display_ack" && system_flags.blueprint_ready);
          // The display being ready asks for the full settings: "display_ack" from the boot page of a TFT up to
          // v2026.11.16, or "setup" when ESPHome sets up the display, as a newer TFT starts on the screensaver and
          // sends no "display_ack". Rate-limited after "start", "setup" waited for the next retry, up to a minute.
          const bool display_ready_step = (step == "display_ack" || step == "setup");
          // "reload" follows `settings_stale`, sent by a new automation after a reload or a Home Assistant start:
          // the push of the automation it replaced, if any, was stopped with it, so nothing is sent in parallel.
          const bool settings_changed_step = (step == "reload");
          if (step != "start" && !display_ready_step && !settings_changed_step &&
              (uint32_t)(now - last_boot_event_fired) < ${BOOT_EVENT_REPEAT_INTERVAL_MS}) return;
          // During boot, the display repeats "display_ack" until it is set up (it ignores display_ack=1 before
          // that). Each one used to start a full push in parallel with the others (#636): once a full request
          // reached Home Assistant, the repeats wait for the repeat interval. A display reset later in the boot
          // still requests the settings again after that interval.
          if (display_ready_step && !display_reset && last_full_request_fired != 0 &&
              (uint32_t)(now - last_full_request_fired) < ${BOOT_EVENT_REPEAT_INTERVAL_MS}) {
            ESP_LOGD("${TAG_BOOT}", "Display acknowledged again while booting, request skipped");
            return;
          }  // if repeated display_ack while booting
          // A retry while the Blueprint is still sending settings would start a second full push in
          // parallel with the one in progress, slowing Home Assistant down and both pushes with it (#636).
          if (step != "start" && !display_ready_step && !settings_changed_step &&
              !blueprint_settings_quiet(${BOOT_SETTINGS_QUIET_MS})) {
            ESP_LOGD("${TAG_BOOT}", "Blueprint settings still arriving, request skipped");
            return;
          }  // if settings still arriving
          const bool api_connected = api_server->is_connected_with_state_subscription();
          ESP_LOGD("${TAG_BOOT}", "Request blueprint settings");
          fire_ha_event("boot", {{"step", step.c_str()}});
          last_boot_event_fired = now;
          if (step != "start") {
            if (api_connected) {
              last_full_request_fired = now;  // Only a request that reached Home Assistant holds the repeats back
              full_request_lost = false;
              blueprint_settings_requested->execute();
            } else if (step != "display_ack" or disp1->is_setup()) {
              // Until the display is set up, ESPHome drops display_ack=1 and the display sends display_ack again
              full_request_lost = true;
            }
          } else if (full_request_lost and api_connected and disp1->is_setup()) {
            // Send the lost full request now instead of waiting for the next retry.
            // A display that is not set up yet sends display_ack again by itself.
            ESP_LOGD("${TAG_BOOT}", "Request blueprint settings again, the full request was lost before the API connected");
            fire_ha_event("boot", {{"step", "display_ack"}});
            last_full_request_fired = now;
            full_request_lost = false;
            blueprint_settings_requested->execute();
          }

  # A full request reached Home Assistant: the settings are pending until their end (`settings_end`)
  - id: blueprint_settings_requested
    mode: single
    then:
      - lambda: |-
          blueprint_settings_state = BlueprintSettingsState::PENDING;
          if (blueprint_settings_requests < UINT8_MAX) blueprint_settings_requests++;
          ESP_LOGD("${TAG_BOOT}", "Blueprint settings requested (request %" PRIu8 ")", blueprint_settings_requests);
          blueprint_settings_timeout->execute();

  # Waits for the end of the requested settings (`settings_end`). Without it, the settings are requested again,
  # after a delay that doubles on each new request, until BOOT_SETTINGS_MAX_REQUESTS requests were sent, so a
  # Blueprint that cannot complete them (e.g. a version mismatch) is not asked forever (#664).
  - id: blueprint_settings_timeout
    mode: restart
    then:
      - delay: !lambda |-
          // The first request waits the base delay, each new one twice as long as the one before, up to 8 times
          const uint8_t shift = (blueprint_settings_requests > 1) ? std::min<uint8_t>(blueprint_settings_requests - 1, 3) : 0;
          return static_cast<uint32_t>(${BOOT_SETTINGS_RETRY_DELAY_MS}) << shift;
      # A push still in progress on a slow Home Assistant is not a missing end (#636): no new request, nor giving up,
      # while settings keep arriving
      - wait_until:
          condition:
            - lambda: |-
                return blueprint_settings_state != BlueprintSettingsState::PENDING or
                       blueprint_settings_quiet(${BOOT_SETTINGS_QUIET_MS});
      - lambda: |-
          if (blueprint_settings_state != BlueprintSettingsState::PENDING) return;
          if (blueprint_settings_requests >= ${BOOT_SETTINGS_MAX_REQUESTS}) {
            blueprint_settings_state = BlueprintSettingsState::FAILED;
            ESP_LOGW("${TAG_BOOT}", "Blueprint settings incomplete after %" PRIu8 " requests, using what was received. "
                                    "Check that the Blueprint and the firmware versions match.", blueprint_settings_requests);
            return;
          }  // if (no request left)
          ESP_LOGW("${TAG_BOOT}", "Blueprint settings incomplete, requesting them again");
          blueprint_settings_resend = false;  // This request sends them again anyway
          blueprint_settings_state = BlueprintSettingsState::NEEDED;
          boot_request_blueprint_settings->execute("timeout");

  # Told by the Blueprint that the settings it sent are stale (`settings_stale`), after an automation reload or a
  # Home Assistant start: requested after a random delay, so the panels do not all request at the same time.
  - id: blueprint_settings_stale
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("${TAG_BOOT}", "Blueprint settings changed, requesting them");
          blueprint_settings_timeout->stop();
          blueprint_settings_state = BlueprintSettingsState::NEEDED;
          blueprint_settings_requests = 0;
          blueprint_settings_resend = false;  // This request sends them again anyway
      - delay: !lambda return random_uint32() % (${BOOT_SETTINGS_STALE_MAX_DELAY_MS} + 1);
      - lambda: |-
          boot_request_blueprint_settings->execute("reload");

  - id: !extend action_component_val
    then:
      - lambda: |-
          if (page != "mem") return;
          if (component == "settings_stale") {
            blueprint_settings_stale->execute();
            return;
          }  // if (settings_stale)
          if (component == "settings_end") {
            // The end of a full send. Only for a request still waiting for it (or given up): when the settings are
            // needed again (e.g. stale settings), it is the end of an older send, which does not hold the new ones.
            if (blueprint_settings_state != BlueprintSettingsState::PENDING and
                blueprint_settings_state != BlueprintSettingsState::FAILED) {
              ESP_LOGD("${TAG_BOOT}", "End of an older Blueprint settings send, ignored");
              return;
            }  // if (no request waiting for it)
            blueprint_settings_timeout->stop();
            if (blueprint_settings_resend) {
              // The display restarted during this send, so it missed part of it
              ESP_LOGI("${TAG_BOOT}", "Blueprint settings received, requesting them again after a display restart");
              blueprint_settings_resend = false;
              blueprint_settings_state = BlueprintSettingsState::NEEDED;
              blueprint_settings_requests = 0;
              boot_request_blueprint_settings->execute("display_ack");
              return;
            }  // if (blueprint_settings_resend)
            blueprint_settings_state = BlueprintSettingsState::COMPLETE;
            ESP_LOGI("${TAG_BOOT}", "Blueprint settings complete (request %" PRIu8 ")", blueprint_settings_requests);
            blueprint_settings_requests = 0;
            // The boot may have stopped waiting for the Blueprint already: update its state here as well,
            // and the Wi-Fi icon, which turns red without it
            if (is_blueprint_fully_ready()) refresh_wifi_icon->execute(false);
            return;
          }  // if (settings_end)

  - id: boot_wrap_up
    mode: restart
    then:

  - id: !extend stop_all
    then:
      - lambda: |-
          boot->stop();
          boot_critical_components->stop();
          boot_early_routines->stop();
          boot_nextion->stop();
          boot_preparation->stop();
          boot_request_blueprint_settings->stop();
          boot_wrap_up->stop();
          blueprint_settings_stale->stop();
          blueprint_settings_timeout->stop();

  - id: !extend watchdog_round
    then:
      - lambda: |-
          if (system_flags.boot_completed) {
            // The boot completed without the Blueprint (#516), or a request did not reach Home Assistant: ask for
            // the settings as soon as Home Assistant is connected. Not while a request after stale settings waits
            // for its random delay. The request is rate-limited by `boot_request_blueprint_settings`.
            if (blueprint_settings_state == BlueprintSettingsState::NEEDED and !blueprint_settings_stale->is_running() and
                api_server->is_connected_with_state_subscription()) {
              boot_request_blueprint_settings->execute("timeout");
            }  // if the Blueprint settings are still needed
            return;
          }  // if (system_flags.boot_completed)
          if (boot->is_running()) return;
          boot_request_blueprint_settings->execute("timeout");
          boot->execute();
...
