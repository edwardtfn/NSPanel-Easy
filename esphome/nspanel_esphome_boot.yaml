#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME CORE - BOOT                                                                       #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  ##############################
  ## Change only in your      ##
  ## local yaml substitutions ##
  ##############################
  BOOT_EVENT_REPEAT_INTERVAL_MS: 10000
  BOOT_NEXTION_WAIT_TIMEOUT: 120s
  TAG_BOOT: nspanel.boot

display:
  - id: !extend disp1
    on_setup:
      then:
        - script.execute: watchdog_round

esphome:
  build_flags:
    - -D NSPANEL_EASY_BOOT
  on_boot:
    then:
      - script.execute: boot

script:
  - id: boot
    mode: single
    then:  # Other packages will subscribe themselves to this to run after critical components and early routines
      - lambda: |-
          ESP_LOGI("${TAG_BOOT}", "Starting boot sequence");
          blueprint_status_flags.reset();
          wait_to_be_ready->execute();
          boot_preparation->execute();
          boot_critical_components->execute();
      - script.wait: boot_critical_components
      - script.execute: boot_early_routines
      - script.wait: boot_early_routines
      - delay: 1s
      # This should be moved somewhere else
      - lambda: |-
          boot_log->execute("Boot", "Starting sequence");
          boot_log->execute("Boot", "Waiting for Wi-Fi");
          wait_for_wifi->execute();
      - script.wait: wait_for_wifi

      - lambda: |-
          if (wifi_component->is_connected()) {  // Wi-Fi connected
            boot_log->execute("Boot", "Wi-Fi connected");
            page_boot_show_ip->execute();
          } else {
            boot_log->execute("Boot", "Wi-Fi NOT available");
          }

          wait_for_api->execute();
      - script.wait: wait_for_api
      - lambda: |-
          if (api_server->is_connected_with_state_subscription()) {
            boot_log->execute("Boot", "API connected");
          } else {
            boot_log->execute("Boot", "API not available");
          }

          // Wait for a response from the blueprint
          boot_request_blueprint_settings->execute("start");
          wait_for_blueprint->execute();
      - script.wait: wait_for_blueprint
      - lambda: |-
          if (not system_flags.blueprint_ready) {
            boot_log->execute("Boot", "Blueprint not available");
          }

          // Display settings
          boot_nextion->execute();
      - script.wait: boot_nextion

      - lambda: |-
          // Wrap-up
          boot_log->execute("Boot", "Wait to finish");
          wait_for_wifi->execute();
          wait_for_api->execute();
          wait_for_blueprint->execute();
      - script.wait: wait_for_wifi
      - script.wait: wait_for_api
      - script.wait: wait_for_blueprint
      - script.wait: wait_for_version_tft
      - script.execute: boot_wrap_up
      - script.wait: boot_wrap_up

      - lambda: |-
          set_brightness->execute(display_brightness->state);
          boot_log->execute("Boot", "Jump to wake-up page");
          wakeup->execute(true);
          system_flags.boot_completed = true;

  - id: boot_critical_components
    mode: single
    then:  # Critical components should subscribe themselves to this
      - lambda: |-
          ESP_LOGI("${TAG_BOOT}", "Starting boot critical components sequence");

  - id: boot_early_routines
    mode: single
    then:  # Critical components should subscribe themselves to this
      - lambda: |-
          ESP_LOGI("${TAG_BOOT}", "Starting boot early routines sequence");

  - id: boot_log
    mode: queued
    max_runs: 3
    parameters:
      category: string
      log_message: string
    then:
      - lambda: |-
          ESP_LOGD("${TAG_BOOT}", "%s: %s", category.c_str(), log_message.c_str());
      # Extended by:
      # - page_boot

  - id: boot_nextion
    mode: single
    then:
      - wait_until:
          condition:
            - lambda: return disp1->is_setup();
          timeout: ${BOOT_NEXTION_WAIT_TIMEOUT}
      - lambda: |-
          if (!disp1->is_setup()) boot_nextion->stop();
          // Display settings
          boot_log->execute("Boot", "Sending display settings");
          disp1->send_command_printf("brightness=%i",       int(display_brightness->state));
          disp1->send_command_printf("brightness_dim=%i",   int(display_dim_brightness->state));
          disp1->send_command_printf("brightness_sleep=%i", int(display_sleep_brightness->state));
          disp1->send_command_printf("wakeup_page_id=%" PRIu8, get_page_id(wakeup_page_name->current_option()));

  - id: boot_preparation
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("${TAG_BOOT}", "Starting boot preparation sequence");

  - id: boot_request_blueprint_settings
    mode: restart
    parameters:
      step: string
    then:
      - lambda: |-
          if (system_flags.blueprint_ready and step != "display_ack") return;
          static uint32_t last_boot_event_fired = 0;
          // Set when a full request (every step but "start") was sent while no client was connected.
          // ESPHome drops such events, and the Blueprint answers "start" with the version only.
          static bool full_request_lost = false;
          const uint32_t now = App.get_loop_component_start_time();
          // "start" opens the boot sequence and "display_ack" restarts the state replay after an
          // unexpected display reset, so neither may be dropped. Every other step is a retry and
          // stays rate-limited to keep a stalled boot from flooding Home Assistant.
          if (step != "start" && step != "display_ack" &&
              (uint32_t)(now - last_boot_event_fired) < ${BOOT_EVENT_REPEAT_INTERVAL_MS}) return;
          const bool api_connected = api_server->is_connected_with_state_subscription();
          ESP_LOGD("${TAG_BOOT}", "Request blueprint settings");
          fire_ha_event("boot", {{"step", step.c_str()}});
          last_boot_event_fired = now;
          if (step != "start") {
            if (api_connected) {
              full_request_lost = false;
            } else if (step != "display_ack" or disp1->is_setup()) {
              // Until the display is set up, ESPHome drops display_ack=1 and the display sends display_ack again
              full_request_lost = true;
            }
          } else if (full_request_lost and api_connected and disp1->is_setup()) {
            // Send the lost full request now instead of waiting for the next retry.
            // A display that is not set up yet sends display_ack again by itself.
            ESP_LOGD("${TAG_BOOT}", "Request blueprint settings again, the full request was lost before the API connected");
            fire_ha_event("boot", {{"step", "display_ack"}});
            full_request_lost = false;
          }

  - id: boot_wrap_up
    mode: restart
    then:

  - id: !extend stop_all
    then:
      - lambda: |-
          boot->stop();
          boot_critical_components->stop();
          boot_early_routines->stop();
          boot_log->stop();
          boot_nextion->stop();
          boot_preparation->stop();
          boot_request_blueprint_settings->stop();
          boot_wrap_up->stop();

  - id: !extend watchdog_round
    then:
      - lambda: |-
          if (system_flags.boot_completed) return;
          if (boot->is_running()) return;
          boot_request_blueprint_settings->execute("timeout");
          boot->execute();
...
