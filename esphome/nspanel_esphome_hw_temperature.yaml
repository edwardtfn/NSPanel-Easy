#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME Hardware - Temperature                                                            #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################
---
substitutions:
  ##############################
  ## Change only in your      ##
  ## local yaml substitutions ##
  temp_units: "°C"
  ##############################
  TEMP_UNIT_IS_FAHRENHEIT: ${temp_units == "°F" or temp_units == "F" or temp_units == "°f" or temp_units == "f"}
  GPIO_TEMPERATURE_ADC_PIN: 38
  ntc_source_filter_delta: 0.002  # adjust to your sensor's voltage jitter level
  ntc_source_filter_heartbeat: 5min
  temp_calibration_warmup: '30'          # Minutes after boot before auto-calibration starts, while the panel's self-heating settles
  temp_calibration_time_constant: '30'   # Minutes for the correction to cover about 63% of a change in the offset
  temp_calibration_max_age: '120'        # Minutes without a change of the reference before auto-calibration pauses
  TEMP_CALIBRATION_HYSTERESIS: '0.75'     # Fraction of a correction step the smoothed value must move before the correction changes
  TAG_HW_TEMPERATURE: nspanel.hw.temperature

esphome:
  build_flags:
    - -D NSPANEL_EASY_HW_TEMPERATURE
    - -D NSPANEL_EASY_HW_TEMPERATURE_IS_FAHRENHEIT=${1 if TEMP_UNIT_IS_FAHRENHEIT else 0}

globals:
  - id: embedded_indoor_temp  # Is embedded sensor used for indoor temperature?
    type: bool
    restore_value: true
    initial_value: 'true'

number:
  - id: temperature_correction  # Temperature correction
    name: Temperature Correction
    platform: template
    entity_category: config
    unit_of_measurement: ${temp_units}
    min_value: ${ -18.0 if TEMP_UNIT_IS_FAHRENHEIT else -10.0 }
    max_value: ${ 18.0 if TEMP_UNIT_IS_FAHRENHEIT else 10.0 }
    initial_value: 0
    step: ${ 1.0 if TEMP_UNIT_IS_FAHRENHEIT else 0.1 }
    mode: box
    restore_value: true
    internal: false
    optimistic: true
    update_interval: never
    on_value:
      then:
        - logger.log: Temperature correction changed
        - delay: 1s
        - lambda: |-
            // To do: Remove version-based code after v2026.6.0
            #if ESPHOME_VERSION_CODE >= VERSION_CODE(2026, 3, 99)
            temp_nspanel->publish_state(temp_nspanel->get_raw_state());
            #else
            temp_nspanel->publish_state(temp_nspanel->raw_state);
            #endif

script:
  - id: !extend action_component_val
    then:
      - lambda: |-
          if (page != "mem") return;
          if (component == "embedded_indoor_temperature") {
            id(embedded_indoor_temp) = (val>0);
          }

  - id: !extend boot_nextion
    then:
      - lambda: |-
          // Only when using subscriptions
          #if defined(NSPANEL_EASY_PAGE_HOME) && defined(NSPANEL_EASY_SUBSCRIBE)
          indoor_temp_fallback = []() { display_embedded_temp->execute(); };
          #endif  // NSPANEL_EASY_PAGE_HOME && NSPANEL_EASY_SUBSCRIBE

  - id: display_embedded_temp  # Show panel's temperature if selected, or API or Wi-Fi are out
    mode: single
    then:
      - lambda: |-
          if (system_flags.tft_upload_active) return;
          #if defined(NSPANEL_EASY_PAGE_HOME) && defined(NSPANEL_EASY_SUBSCRIBE)
          if (indoor_temp_bound && indoor_temp_valid) return;  // The subscription owns this component
          #endif  // NSPANEL_EASY_PAGE_HOME && NSPANEL_EASY_SUBSCRIBE
          if (!id(embedded_indoor_temp) and
              api_server->is_connected_with_state_subscription() and
              wifi_component->is_connected() and
              current_page_id != ${PAGE_BOOT_ID})
            return;
          if (isnan(temp_nspanel->state)) {
            disp1->set_component_text(hmi::home::INDR_TEMP.name, "");
            return;
          }

          static char buffer[15];
          #if NSPANEL_EASY_HW_TEMPERATURE_IS_FAHRENHEIT
          // Fahrenheit with no decimal
          snprintf(buffer, sizeof(buffer), "%.0f%s${temp_units}", celsius_to_fahrenheit(temp_nspanel->state),
                                                                  id(units_separator).c_str());
          #else
          // Celsius with one decimal
          snprintf(buffer, sizeof(buffer), "%.1f%s${temp_units}", temp_nspanel->state,
                                                                  id(units_separator).c_str());
          #endif

          disp1->set_component_text(hmi::home::INDR_TEMP.name,
                                    adjustDecimalSeparator(buffer, id(mui_decimal_separator)[0]).c_str());

  - id: !extend dump_config
    then:
      - lambda: |-
          ESP_LOGCONFIG("${TAG_HW_TEMPERATURE}", "Temperature unit: ${temp_units}");

  - id: !extend localization_units_separator_update
    then:
      - script.execute: display_embedded_temp

  - id: !extend resync_display
    then:
      - script.execute: display_embedded_temp

  - id: !extend stop_all
    then:
      - lambda: display_embedded_temp->stop();

interval:
  - interval: 1min  # Auto-calibration against a Home Assistant reference; one sample per minute
    then:
      - lambda: |-
          #ifdef NSPANEL_EASY_SUBSCRIBE
          static bool warmed_up = false;
          if (!warmed_up) {
            if (millis() < ${temp_calibration_warmup} * 60000UL) return;
            warmed_up = true;
          }

          const float raw_c = temp_nspanel->get_raw_state();

          #if NSPANEL_EASY_HW_TEMPERATURE_IS_FAHRENHEIT
          const float correction_c = temperature_correction->state / 1.8f;  // Offset is a delta, no 32° shift
          #else
          const float correction_c = temperature_correction->state;
          #endif

          const optional<float> next_c = temp_calibration_sample(raw_c, correction_c,
                                                                 ${temp_calibration_max_age} * 60000UL,
                                                                 1.0f / ${temp_calibration_time_constant});
          if (!next_c.has_value()) return;

          #if NSPANEL_EASY_HW_TEMPERATURE_IS_FAHRENHEIT
          float next = *next_c * 1.8f;
          #else
          float next = *next_c;
          #endif

          // Publish only whole steps, and only once the smoothed value is ${TEMP_CALIBRATION_HYSTERESIS} of a step away
          // from the current correction. Plain rounding would flap between two steps whenever the offset sits near
          // a rounding boundary, rewriting the correction to flash every few minutes.
          const float step = temperature_correction->traits.get_step();
          if (fabsf(next - temperature_correction->state) < ${TEMP_CALIBRATION_HYSTERESIS} * step) return;
          next = clamp(roundf(next / step) * step,
                       temperature_correction->traits.get_min_value(), temperature_correction->traits.get_max_value());
          if (fabsf(next - temperature_correction->state) < step / 2) return;  // Clamped back onto the current value

          ESP_LOGD("${TAG_HW_TEMPERATURE}", "Auto-calibration: temperature correction %.1f -> %.1f${temp_units}",
                   temperature_correction->state, next);
          auto call = temperature_correction->make_call();
          call.set_value(next);
          call.perform();
          #endif  // NSPANEL_EASY_SUBSCRIBE

sensor:
  # 1) Raw ADC - fast sampling, early spike removal
  - id: ntc_source
    platform: adc
    pin: ${GPIO_TEMPERATURE_ADC_PIN}
    attenuation: 12db
    samples: 16
    update_interval: 1s
    internal: true

    filters:
      # (A) Remove single-spike noise
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

      # (B) Smooth the curve
      - exponential_moving_average:
          alpha: 0.2
          send_every: 1
          send_first_at: 1

      # (C) Only publish when the smoothed value actually changes
      - delta: ${ntc_source_filter_delta}

      # (D) If nothing changes, publish once every 5 minutes
      - heartbeat:
          period: ${ntc_source_filter_heartbeat}
          optimistic: true

  # 2) Convert to resistance
  - id: resistance_sensor
    platform: resistance
    sensor: ntc_source
    configuration: DOWNSTREAM
    resistor: 11.2kOhm
    internal: true

  # 3) Temperature (HA-facing)
  - id: temp_nspanel
    name: Temperature
    platform: ntc
    sensor: resistance_sensor
    unit_of_measurement: °C
    accuracy_decimals: 1
    internal: false
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm

    filters:
      # Publish only when temperature changes meaningfully
      - delta: 0.01

      # (D) If nothing changes, publish once every 5 minutes
      - heartbeat:
          period: ${ntc_source_filter_heartbeat}
          optimistic: true

      # Apply offset
      - lambda: |-
          // Apply offset based on correction units
          #if NSPANEL_EASY_HW_TEMPERATURE_IS_FAHRENHEIT
            // Offset is in °F, convert delta to °C before applying
            return x + (temperature_correction->state / 1.8f);
          #else
            // Offset already in °C
            return x + temperature_correction->state;
          #endif

    on_value:
      then:
        - script.execute: display_embedded_temp
...
