#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME - Page light                                                                      #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  TAG_PAGE_LIGHT: nspanel.page.light

display:
  - id: !extend disp1
    on_touch:
      then:
        - lambda: |-
            if (page_id != get_page_id("light")) return;  // Page light
            if (touch_event) return;                      // Ignore touch and process only release
            if (component_id == 21) {                     // power button
              ESP_LOGD("${TAG_PAGE_LIGHT}", "Power button tapped, informing HA");
              fire_ha_event("action_call", {
                {"action", "light.toggle"},
                {"entity", detailed_entity->state.c_str()}
              });
              return;
            }
            if (component_id == 32) {                     // effect_button
              ESP_LOGD("${TAG_PAGE_LIGHT}", "Effect button tapped, opening popup select");
              popup_select_open->execute(
                get_page_id("light"),
                std::string("${LOCALIZATION[LANG].light.select_effect}")
              );
              return;
            }

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_LIGHT

script:
  - id: !extend event_from_display
    then:
      - lambda: |-
          if (params[0] == "light") {
            // CSV Format varies by type:
            // light,brightness_pct,<value>
            // light,color_temp_kelvin,<value>
            // light,rgb_color,<red>,<green>,<blue>
            // light,<component>,<event>,<value>

            if (params_count < 3) {
              ESP_LOGW("${TAG_PAGE_LIGHT}", "Need 3+ params");
              return;
            }

            // Handle brightness and color temperature
            if (params[1] == "brightness_pct" or params[1] == "color_temp_kelvin") {
              if (params_count != 3) {
                ESP_LOGW("${TAG_PAGE_LIGHT}", "Need 3 params");
                return;
              }

              ESP_LOGV("${TAG_PAGE_LIGHT}", "key=%s, value=%s",
                        params[1].c_str(), params[2].c_str());

              fire_ha_event("action_call", {
                {"action", "light.turn_on"},
                {"key", params[1].c_str()},
                {"value", params[2].c_str()},
                {"entity", detailed_entity->state.c_str()}
              });

            } else if (params[1] == "rgb_color") {
              // RGB color: light,rgb_color,<red>,<green>,<blue>
              if (params_count != 5) {
                ESP_LOGW("${TAG_PAGE_LIGHT}", "Need 5 params");
                return;
              }

              ESP_LOGV("${TAG_PAGE_LIGHT}", "RGB: r=%s, g=%s, b=%s",
                        params[2].c_str(), params[3].c_str(), params[4].c_str());

              fire_ha_event("action_call", {
                {"action", "light.turn_on"},
                {"key", "rgb_color"},
                {"red", params[2].c_str()},
                {"green", params[3].c_str()},
                {"blue", params[4].c_str()},
                {"entity", detailed_entity->state.c_str()}
              });

            } else {
              // Generic event: light,<component>,<event>,<value>
              if (params_count != 4) {
                ESP_LOGW("${TAG_PAGE_LIGHT}", "Bad params");
                return;
              }

              ESP_LOGV("${TAG_PAGE_LIGHT}", "component=%s, event=%s, value=%s",
                        params[1].c_str(), params[2].c_str(), params[3].c_str());

              fire_ha_event("generic", {
                {"page", "light"},
                {"component", params[1].c_str()},
                {"event", params[2].c_str()},
                {"value", params[3].c_str()},
                {"entity", detailed_entity->state.c_str()}
              });
            }
          }

  # Renders the light page from the Blueprint's entity snapshot (#636): the title and icon, then the
  # brightness, colour temperature and effect, as the Blueprint wrote them (the effect list, the features
  # mask and the picker context only when the page opens).
  - id: !extend entity_snapshot_received
    then:
      - lambda: |-
          if (entity_snapshot.page != "light") return;
          const SnapshotEntity *entity = entity_snapshot.find("main");
          if (entity == nullptr) {
            ESP_LOGW("${TAG_PAGE_LIGHT}", "Snapshot without a main entity, ignored");
            return;
          }  // if (no main entity)
          blueprint_setting_received();
          details_render_title(*entity);
          const LightFeatures features = light_features(*entity);
          const char *unit_space = entity_snapshot.compact_unit_display ? "" : " ";

          if (features.brightness) {
            const int brightness_pct = light_brightness_pct(*entity);
            disp1->send_command_printf("lightslider.val=%d", brightness_pct);
            disp1->send_command_printf("light_value.txt=\"%d%s%%\"", brightness_pct, unit_space);
            disp1->send_command_printf("light_value_2.txt=\"%d%s%%\"", brightness_pct, unit_space);
            disp1->send_command("power_button.pco=50712");  // [192, 192, 192]
          }  // if (brightness)

          if (features.color_temp) {
            const LightColorTemp temp = light_color_temp(*entity);
            disp1->send_command_printf("temp_value.txt=\"%dK\"", temp.current);
            disp1->send_command_printf("temp_value_2.txt=\"%dK\"", temp.current);
            disp1->send_command_printf("tempslider.val=%d", temp.min + temp.max - temp.current);
            disp1->send_command_printf("tempslider.minval=%d", temp.min);
            disp1->send_command_printf("tempslider.maxval=%d", temp.max);
          }  // if (color_temp)

          if (features.effects) {
            const std::string current = light_current_effect(*entity);
            action_component_text_list->execute("mem", "popup_select_current", std::vector<std::string>{current});
            if (entity_snapshot.constructor) {
              const std::vector<std::string> *effect_list = entity->list("effect_list");
              const std::vector<std::string> effects = effect_list != nullptr ? *effect_list : std::vector<std::string>{};
              #ifdef NSPANEL_EASY_PAGE_SELECT
              // The picker pages through up to 32 options, always including the current one
              const std::vector<std::string> shown = select_picker_options(effects, current);
              #else  // NSPANEL_EASY_PAGE_SELECT
              const std::vector<std::string> shown(effects.begin(), effects.begin() + std::min<size_t>(effects.size(), 32));
              #endif  // NSPANEL_EASY_PAGE_SELECT
              action_component_text_list->execute("mem", "popup_select_context", std::vector<std::string>{"light_effect"});
              action_component_val->execute("mem", "popup_select_mode", 0);
              action_component_text_list->execute("mem", "popup_select_options", shown);
            }  // if (page opened)
          }  // if (effects)

          if (entity_snapshot.constructor) {
            // Bit 0 brightness, bit 1 temperature, bit 2 colour, bit 3 effects
            disp1->send_command_printf("light_features_mask=%d", features.mask());
            disp1->send_command("features.en=1");
          }  // if (page opened)

  - id: !extend picker_selected
    then:
      - lambda: |-
          if (context != "light_effect") return;

          ESP_LOGD("${TAG_PAGE_LIGHT}", "light_effect picker_selected: entity=%s value=%s",
                                        entity.c_str(), value.c_str());

          if (mask == 0) {
            // No effect selected — could interpret as "turn off effect" via light.turn_on with "None"
            // if the light supports it, or skip. v1: skip.
            return;
          }

          fire_ha_event("action_call", {
            {"action", "light.turn_on"},
            {"entity", entity.c_str()},
            {"key", "effect"},
            {"value", value.c_str()}
          });

  - id: !extend reset_globals
    then:
      - lambda: |-
          if (new_page_id == get_page_id("light")) {
            display_entity_keep = true;
          }
...
