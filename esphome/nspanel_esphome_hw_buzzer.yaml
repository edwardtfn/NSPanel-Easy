#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
######################################################################################################
#### ESPHOME - Hardware - Buzzer                                                               #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  GPIO_BUZZER_OUTPUT_PIN: 21
  boot_sound: false
  _BOOT_SOUND: ${ 1 if boot_sound else 0 }
  TAG_HW_BUZZER: nspanel.hw.buzzer
  # RTTTL format: name:d=duration,o=octave,b=tempo:notes
  # d=32 (32nd note), o=5 (octave 5), b=100 (tempo 100)
  tone_boot: "two short:d=4,o=5,b=100:16e6,16e6"
  # Played when a page is refused because Home Assistant is not connected (opt-in)
  page_unavailable_sound: false
  _PAGE_UNAVAILABLE_SOUND: ${ 1 if page_unavailable_sound else 0 }
  tone_page_unavailable: "unavailable:d=16,o=5,b=160:a5,e5"
  # tone_volume_change: "scale_up:d=32,o=5,b=100:c,c#,d#,e,f#,g#,a#,b"  # Use "none" to disable sound

api:
  actions:
    - action: rtttl_play  # Plays melodies encoded in RTTTL format, suitable for audio feedback, notifications, or simple tunes.
      variables:
        # The RTTTL string for the melody to be played.
        # It should follow the RTTTL format, including the melody's name,
        # default settings, and a sequence of notes.
        tone: string
      then:
        - lambda: |-
            buzzer->stop();
            ESP_LOGI("${TAG_HW_BUZZER}", "Play tone: '%s'", tone.c_str());
            buzzer->play(tone.c_str());

esphome:
  build_flags:
    - -D NSPANEL_EASY_HW_BUZZER

output:
  # Buzzer output
  - id: buzzer_out
    platform: ledc
    pin: ${GPIO_BUZZER_OUTPUT_PIN}

rtttl:  # ENABLE RINGTONE MUSIC SUPPORT
  id: buzzer
  output: buzzer_out

script:
  - id: !extend page_unavailable_feedback
    then:
      - lambda: |-
          // Only when the page unavailable sound is enabled
          #if ${_PAGE_UNAVAILABLE_SOUND}
          buzzer->play("${tone_page_unavailable}");
          #endif  // _PAGE_UNAVAILABLE_SOUND

  - id: !extend wait_for_page_boot_exit
    then:
      - lambda: |-
          // Only when boot sound is enabled
          #if ${_BOOT_SOUND}
          if (current_page_id == ${PAGE_BOOT_ID}) return;    // Page boot is visible, do not play sound
          boot_log->execute("Boot", "Play boot sound");
          buzzer->play("${tone_boot}");
          #endif  // _BOOT_SOUND
...
