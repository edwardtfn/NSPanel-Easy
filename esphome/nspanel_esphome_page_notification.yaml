#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME CORE - PAGE - NOTIFICATION                                                        #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  tone_notification: "two short:d=4,o=5,b=100:16e6,16e6"
  TAG_PAGE_NOTIFICATION: nspanel.page.notification

api:
  actions:
    # This action removes any displayed notifications from the screen,
    # helping to keep the user interface clean and focused on its primary functions.
    - action: notification_clear
      then:
        - script.execute: notification_clear

    # Displays a notification message on the screen, useful for alerts or informational updates.
    - action: notification_show
      variables:
        # Title or label for the notification, displayed in a prominent format.
        label: string
        # Detailed message or content of the notification. Include `\r` to insert a line break,
        # allowing for custom formatting.
        message: string
      then:
        - lambda: |-
            if (message.empty()) {
              ESP_LOGW("${TAG_PAGE_NOTIFICATION}", "`notification_show` action called without a notification message");
              return;
            }
            notification_label = label.c_str();
            notification_text = message.c_str();
            notification_refresh->execute(true);
            if (current_page_id == get_page_id("notification")) {
              page_notification->execute();
            } else {
              goto_page->execute(get_page_id("notification"));
            }
            // Only when buzzer is available
            #ifdef NSPANEL_EASY_HW_BUZZER
            notification_play_sound->execute();
            #endif

binary_sensor:
  - id: notification_unread
    name: Notification Unread
    platform: template
    internal: false
    icon: mdi:bell-alert-outline
    disabled_by_default: true

display:
  - id: !extend disp1
    on_touch:
      then:
        - lambda: |-
            if (page_id != get_page_id("notification")) return;
            if (touch_event) return;  // Only act with release
            switch (component_id) {
              case 7:  // bt_accept
                ha_button->execute("notification", "bt_accept", "released");
                notification_clear->execute();
                break;
              case 8:  // bt_clear
                ha_button->execute("notification", "bt_clear", "released");
                notification_refresh->execute(false);
                goto_page->execute(home_page_id);
                break;
            }

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_NOTIFICATION

script:
  - id: !extend action_component_color
    then:
      - lambda: |-
          if (page != "mem") return;
          bool color_changed = false;
          if (component == "notification_icon_color_normal") {
            color_changed = notification_icon_color_normal != color;
            notification_icon_color_normal = color;
          } else if (component == "notification_icon_color_unread") {
            color_changed = notification_icon_color_unread != color;
            notification_icon_color_unread = color;
          }
          if (color_changed) notification_refresh->execute(notification_unread->state);

  - id: !extend boot
    then:
      - lambda: |-
          notification_clear->execute();

  - id: notification_clear
    mode: single
    then:
      - lambda: |-
          if (current_page_id == get_page_id("notification"))
            goto_page->execute(home_page_id);
          notification_label = "";
          notification_text = "";
          notification_refresh->execute(false);

  - id: notification_play_sound
    mode: single
    then:
      - lambda: |-
          // Only when buzzer is available
          #ifdef NSPANEL_EASY_HW_BUZZER
          if (notification_sound->state)
            buzzer->play("${tone_notification}");
          #endif

  - id: notification_refresh
    mode: single
    parameters:
      unread: bool
    then:
      - lambda: |-
          notification_unread->publish_state(unread);
          const bool notification_available = !notification_text.empty();
          disp1->set_component_font_color(hmi::home::BT_NOTIFIC.name,
                                          unread ? notification_icon_color_unread
                                                 : notification_icon_color_normal);
          home_vis_set("bt_notific", notification_available);
          if (current_page_id == get_page_id("home")) {
            disp1->set_component_visibility("bt_notific", notification_available);
          }

  - id: !extend page_change
    then:
      - lambda: |-
          if (new_page_id != get_page_id("notification")) return;
          page_notification->execute();

  - id: page_notification
    mode: single
    then:
      - lambda: |-
          if (current_page_id != get_page_id("notification")) return;
          disp1->set_component_text("notifi_label", notification_label.c_str());
          disp1->set_component_text("notifi_text01", wrapText(notification_text.c_str(),
                                                              display_portrait ? 23 : 32,
                                                              ${LANG_BYTES_PER_CHAR}).c_str());

  - id: !extend stop_all
    then:
      - lambda: |-
          notification_clear->stop();
          notification_play_sound->stop();
          notification_refresh->stop();

  - id: !extend stop_page_constructors
    then:
      - lambda: page_notification->stop();

switch:
  - name: Sound - Notification  # Notification sound
    platform: template
    id: notification_sound
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - lambda: |-
            // Only when buzzer is available
            #ifdef NSPANEL_EASY_HW_BUZZER
            if (notification_unread->state)
              notification_play_sound->execute();
            #endif
    on_turn_off:
      then:
        - lambda: |-
            notification_play_sound->stop();
            // Only when buzzer is available
            #ifdef NSPANEL_EASY_HW_BUZZER
            if (buzzer->is_playing())
              buzzer->stop();
            #endif
...
