#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME CORE - HARDWARE - Display                                                         #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################
---
substitutions:
  ##############################
  ## Change only in your      ##
  ## local yaml substitutions ##
  ##############################
  THEME_DARK_LABEL: Dark
  THEME_DARK_COLOR_PCO_MAIN: ${COLOR_WHITE}                # Foreground font color for main information
  THEME_DARK_COLOR_PCO_SECONDARY: ${COLOR_GRAY_LIGHT}      # Foreground font color for secondary information
  THEME_DARK_COLOR_PCO_NAVIGATION: ${COLOR_GRAY_MOSS}      # Foreground font color for navigation components, like back button or page index
  THEME_DARK_COLOR_PCO_UNSUPPORTED: ${COLOR_GRAY_DARKEST}  #  Foreground font color for unsupported or unavailable components
  THEME_LIGHT_LABEL: Light (Under construction)
  THEME_LIGHT_COLOR_PCO_MAIN: ${COLOR_BLACK}               # BLACK - main text on white bg
  THEME_LIGHT_COLOR_PCO_SECONDARY: ${COLOR_GRAY_MEDIUM}    # Mid gray for secondary
  THEME_LIGHT_COLOR_PCO_NAVIGATION: ${COLOR_GRAY_DARK}     # Colors::RGB565_GRAY_DARK for navigation
  THEME_LIGHT_COLOR_PCO_UNSUPPORTED: ${COLOR_GRAY_LIGHT}   # Light gray - visually "faded"
  button_back_font: "8"
  COLOR_BLACK: '0'              # Colors::RGB565_BLACK
  COLOR_BLUE_INDIGO: '10597'    # Colors::RGB565_BLUE_INDIGO
  COLOR_CYAN_BRIGHT: '7519'     # Colors::RGB565_CYAN_BRIGHT
  COLOR_GRAY_DARK: '16904'      # Colors::RGB565_GRAY_DARK
  COLOR_GRAY_DARKEST: '6339'    # Colors::RGB565_GRAY_DARKEST
  COLOR_GRAY_LIGHT: '52857'     # Colors::RGB565_GRAY_LIGHT
  COLOR_GRAY_MEDIUM: '29614'    # Colors::RGB565_GRAY_MEDIUM — mid gray, secondary text on light backgrounds
  COLOR_GRAY_MOSS: '33808'      # Colors::RGB565_GRAY_MOSS
  COLOR_RED_PRIMARY: '63488'    # Colors::RGB565_RED
  COLOR_WHITE: '65535'          # Colors::RGB565_WHITE
  COLOR_YELLOW_GOLDEN: '64992'  # Colors::RGB565_YELLOW_GOLDEN
  GPIO_DISPLAY_POWER_PIN:
    number: 4
    inverted: true
  DISPLAY_MODES:
    EU:
      FILE: "landscape"
      ID: 1
      IDX: 0
      TEXT: "NSPanel EU"
    US:
      FILE: "portrait"
      ID: 2
      IDX: 1
      TEXT: "NSPanel US"
    US_LAND:
      FILE: "landscape"
      ID: 3
      IDX: 2
      TEXT: "NSPanel US Landscape"
    BLANK:
      FILE: "blank"
      ID: 4
      IDX: 3
      TEXT: "NSPanel Blank"

  TAG_HW_DISPLAY: nspanel.hw.display
  include_action_wake_up: false
  _pkg_action_wake_up:
    api:
      actions:
        # Wake Up Service
        - action: wake_up
          variables:
            reset_timer: bool  # Determines whether to reset the sleep and dimming timers upon waking the display.
          then:
            - lambda: wakeup->execute(reset_timer);

packages:
  action_wake_up: ${ _pkg_action_wake_up if include_action_wake_up else {} }

display:
  - id: disp1
    platform: nextion
    uart_id: tf_uart
    command_spacing: 1ms
    update_interval: never
    on_setup:
      then:
        - lambda: |-
            current_page_id = get_page_id("boot");
            wait_for_display->stop();
            ESP_LOGI("${TAG_HW_DISPLAY}", "Nextion setup triggered");
            system_flags.nextion_ready = true;
            // The display restarted and lost everything drawn on it. Arm a
            // repaint rather than doing it here: this fires while the boot
            // page is showing, and unscoped names resolve against the
            // visible page only.
            system_flags.display_resync_pending = true;
            boot_request_blueprint_settings->execute("setup");

    on_page:
      then:
        - lambda: |-
            ESP_LOGI("${TAG_HW_DISPLAY}", "Page changed: '%s'->'%s'", page_names[current_page_id], page_names[x]);
            ESP_LOGW_IF("${TAG_HW_DISPLAY}", (x == current_page_id), "Same page");
            page_change->execute(x);

    on_touch:
      then:
        - lambda: |-
            if (touch_event) timer_reset_all->execute();  // Reset timers on touch, but not on release (to avoid two calls per touch)

esphome:
  build_flags:
    - -D NSPANEL_EASY_HW_DISPLAY

globals:
  - id: button_back_font
    type: uint8_t
    restore_value: true
    initial_value: ${button_back_font}

  - id: theme_pending_apply
    type: bool
    restore_value: false
    initial_value: 'false'

  # Raised while the `theme_apply` page is on its way. That page repaints every
  # themed component from the theme palette, discarding whatever colour the
  # Blueprint pushed before it, so the next page change spends this flag on
  # `theme_applied` to let each module restore what it owns.
  - id: theme_apply_running
    type: bool
    restore_value: false
    initial_value: 'false'

nspanel_easy:
  detailed_entity_id: detailed_entity
  nextion_id: disp1

number:
  - id: display_brightness  # Screen brightness when in use
    name: Display Brightness
    platform: template
    entity_category: config
    unit_of_measurement: '%'
    min_value: 1
    max_value: 100
    initial_value: 100
    step: 1
    restore_value: true
    optimistic: true
    update_interval: never
    on_value:
      then:
        - lambda: |-
            disp1->send_command_printf("brightness=%i", int(x));
        - if:
            condition:
              - lambda: return current_page_id != get_page_id("screensaver");
            then:
              - script.execute:
                  id: set_brightness
                  brightness: !lambda return x;

  - id: display_dim_brightness  # Screen brightness when dimmed down
    name: Display Brightness Dimdown
    platform: template
    entity_category: config
    unit_of_measurement: '%'
    min_value: 1
    max_value: 100
    initial_value: 25
    step: 1
    restore_value: true
    optimistic: true
    on_value:
      then:
        - lambda: |-
            disp1->send_command_printf("brightness_dim=%i", int(x));
        - if:
            condition:
              - lambda: return current_page_id != get_page_id("screensaver");
            then:
              - script.execute:
                  id: set_brightness
                  brightness: !lambda return x;

script:
  - id: !extend action_component_val
    then:
      - lambda: |-
          if (page != "mem") return;
          if (component == "button_back_font") {
            id(button_back_font) = static_cast<uint8_t>(val);
            disp1->send_command_printf("button_back_font=%i", id(button_back_font));
            return;
          } else if (component == "wake_up") {
            wakeup->execute(val!=0);
          }

  - id: !extend action_component_text
    then:
      - lambda: |-
          if (page != "mem") return;
          if (txt.empty()) return;
          if (component == "command") {
            disp1->send_command(txt.c_str());
            return;
          }

  - id: !extend boot_nextion
    then:
      - lambda: |-
          disp1->send_command_printf("button_back_font=%i", id(button_back_font));
          wakeup_page_id = get_page_id(wakeup_page_name->current_option().c_str());
          if (wakeup_page_id != get_page_id("boot") and wakeup_page_id != get_page_id("screensaver"))
            disp1->send_command_printf("wakeup_page_id=%" PRIu8, wakeup_page_id);


  - id: !extend boot_wrap_up
    then:
      - script.execute: theme_update
      - script.wait: theme_update

  - id: !extend dump_config
    then:
      # Report Nextion status
      - lambda: |-
          ESP_LOGCONFIG("${TAG_HW_DISPLAY}", "Nextion:");
          ESP_LOGCONFIG("${TAG_HW_DISPLAY}", "  Theme: %s", background_type->current_option().c_str());
          ESP_LOGCONFIG("${TAG_HW_DISPLAY}", "  Queue size:  %zu", disp1->queue_size());
          if (disp1->is_setup())
            ESP_LOGCONFIG("${TAG_HW_DISPLAY}", "  Is setup: True");
          else {
            ESP_LOGW("${TAG_HW_DISPLAY}", "  Is setup:    False");
            ESP_LOGW("${TAG_HW_DISPLAY}", "  Is detected: %s", YESNO(disp1->is_detected()));
            //exit_reparse->execute();
          }
          if (system_flags.nextion_ready) {
            ESP_LOGCONFIG("${TAG_HW_DISPLAY}", "  Init: True");
          } else
            ESP_LOGW("${TAG_HW_DISPLAY}", "  Init: False");
          if (!version_tft->state.empty())
            ESP_LOGCONFIG("${TAG_HW_DISPLAY}", "  TFT: %s", version_tft->state.c_str());
          else
            ESP_LOGW("${TAG_HW_DISPLAY}", "  TFT: UNKNOWN");

      # Report wake-up page
      - lambda: |-
          ESP_LOGCONFIG("${TAG_HW_DISPLAY}", "Wake-up page: %s", page_names[wakeup_page_id]);

  - id: event_from_display
    mode: restart
    parameters:
      params: std::vector<std::string>
      params_count: uint8_t
    then:
      # Extended by:
      # - page_alarm
      # - page_boot
      # - page_climate
      # - page_cover
      # - page_fan
      # - page_home
      - lambda: |-
          ESP_LOGV("${TAG_HW_DISPLAY}", "New event from display:");
          ESP_LOGV("${TAG_HW_DISPLAY}", "  params: %d", params_count);

          if (params_count < 1) {
            ESP_LOGW("${TAG_HW_DISPLAY}", "Bad params");
            return;
          }
          const std::string page = params[0].c_str();
          ESP_LOGV("${TAG_HW_DISPLAY}", "  page: %s", page.c_str());

          if (params_count >= 2) {

            const std::string& event = params[1];
            if (event == "short_click" || event == "long_click") {

              if (params_count != 3) {
                ESP_LOGW("${TAG_HW_DISPLAY}", "Bad params");
                return;
              }

              // A page package may claim the click, e.g. to ask for confirmation
              if (click_interceptor and click_interceptor(page, event, params[2])) {
                ESP_LOGD("${TAG_HW_DISPLAY}", "%s handled locally", event.c_str());
                return;
              }

              // Button click event
              ESP_LOGD("${TAG_HW_DISPLAY}", "%s->HA", event.c_str());
              fire_ha_event("button_click", {
                {"page", page.c_str()},
                {"command", event.c_str()},
                {"component", params[2].c_str()}
              });
              ESP_LOGV("${TAG_HW_DISPLAY}", "Event sent");
            } else if (page != "button" and
                        page != "home" and
                        page != "light" and
                        page != "switch") {
              // Generic event
              ESP_LOGD("${TAG_HW_DISPLAY}", "Send generic event to Home Assistant");
              fire_ha_event("button_click", {
                {"page", page.c_str()},
                {"event", params[1].c_str()},
                {"component", params_count > 2 ? params[2].c_str() : ""},
                {"value", params_count > 3 ? params[3].c_str() : ""},
                {"entity", detailed_entity->state.c_str()}
              });
              ESP_LOGD("${TAG_HW_DISPLAY}", "Home Assistant generic event sent");
            }
          }  // params_count >= 2

  - id: goto_page
    mode: restart
    parameters:
      page_id: uint8_t
    then:
      - lambda: |-
          ESP_LOGV("${TAG_HW_DISPLAY}", "Go to page '%s' (id: %" PRIu8 ")", page_names[page_id], page_id);
          if (page_id == current_page_id) {
            ESP_LOGW("${TAG_HW_DISPLAY}", "Already the current page");
            return;
          }
          ESP_LOGVV("${TAG_HW_DISPLAY}", "Send page id '%" PRIu8 "' to Nextion", page_id);
          disp1->goto_page(page_id);

  - id: page_change
    mode: restart
    parameters:
      new_page_id: uint8_t
    then:
      - lambda: |-
          // Report new page to logs
          ESP_LOGV("${TAG_HW_DISPLAY}", "New page: %s", page_names[new_page_id]);
          current_page->publish_state(page_names[new_page_id]);
          if (current_page_id != new_page_id) {
            last_page_id = current_page_id;
            current_page_id = new_page_id;
          }

          // Page entry resets visibility to the TFT defaults, so no restore is pending
          unavailable_unhide_pending = false;

          // Stop previous constructors
          ESP_LOGV("${TAG_HW_DISPLAY}", "Stop previous constructors");
          stop_page_constructors->execute();

          // Reset globals
          display_entity_keep = false;
          reset_globals->execute(new_page_id);

      # Wait for other processes to finish before telling the blueprint about a new page
      - script.wait: reset_globals
      - script.wait: stop_page_constructors

      - lambda: |-
          if (!display_entity_keep) {
            detailed_entity->publish_state("");
            details_overlap = DetailsOverlap{};
            disp1->send_command_printf("back_page_id=%" PRIu8, get_page_id("home"));
          } else {  // Report detailed entity
            ESP_LOGD("${TAG_HW_DISPLAY}", "Entity shown: %s", detailed_entity->state.c_str());
            // Moving between entity details pages keeps the override, so drop it once another
            // entity is shown, or a later caller opening its entity would get a stale title and icon
            if (details_overlap.entity != detailed_entity->state) {
              details_overlap = DetailsOverlap{};
            }  // if (details_overlap belongs to another entity)
          }  // if (!display_entity_keep)

          // Reset timers
          if (current_page_id != ${PAGE_SCREENSAVER_ID}) {
            ESP_LOGV("${TAG_HW_DISPLAY}", "Reset timers");
            timer_reset_all->execute();
          }

          // Report new page to Blueprint
          if (last_page_id != UINT8_MAX and last_page_id != new_page_id) {
            ESP_LOGV("${TAG_HW_DISPLAY}", "Report new page to Blueprint");
            std::map<std::string, std::string> event_data = {
              {"page", page_names[new_page_id]},
              {"entity", detailed_entity->state}
            };
            // Title and icon of the button that opened this entity details page, if any
            if (!details_overlap.entity.empty() and details_overlap.entity == detailed_entity->state) {
              event_data["title"] = details_overlap.title;
              event_data["icon"] = details_overlap.icon;
            }  // if (details_overlap applies)
            fire_ha_event("page_changed", event_data);
          }

          // A resync armed while the boot page was showing cannot be spent
          // there: the buttons bars are not drawn on boot, so the forced
          // refresh would return early and the flag would be lost.
          const bool resync_now = system_flags.display_resync_pending and
                                  current_page_id != get_page_id("boot");

          // Update buttons bars on screen
          ESP_LOGV("${TAG_HW_DISPLAY}", "Update buttons bars on screen");
          refresh_hardware_buttons_bars->execute(3, resync_now);

          if (resync_now) {
            resync_display->execute();
          }

          // `theme_apply` carries no `sendme`, so this page change is the first
          // observable point after it has run and handed the display back.
          if (id(theme_apply_running)) {
            id(theme_apply_running) = false;
            theme_applied->execute();
          }

  - id: reset_globals
    mode: restart
    parameters:
      new_page_id: uint8_t
    then:
      - lambda: |-
          ESP_LOGV("${TAG_HW_DISPLAY}", "Reset globals");

  - id: resync_display
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("${TAG_HW_DISPLAY}", "Display resync on page '%s'", page_names[current_page_id]);
          system_flags.display_resync_pending = false;

  - id: set_brightness
    mode: single
    parameters:
      brightness: uint8_t
    then:
      - lambda: |-
          if (brightness <= 100 and brightness_current != brightness) {
            ESP_LOGD("${TAG_HW_DISPLAY}", "Brightness: %" PRIu8 "%%->%" PRIu8 "%%", brightness_current, brightness);
            brightness_current = brightness;
            disp1->set_backlight_brightness(brightness / 100.0f);
          }

  - id: !extend stop_all
    then:
      - lambda: |-
          stop_page_constructors->execute();
          event_from_display->stop();
          goto_page->stop();
          page_change->stop();
          reset_globals->stop();
          resync_display->stop();
          set_brightness->stop();
          theme_applied->stop();
          theme_update->stop();
          theme_update_all->stop();
          theme_update_dark->stop();
          theme_update_light->stop();
          timer_dim->stop();
          timer_page->stop();
          timer_reset_all->stop();
          wait_for_version_tft->stop();
          wakeup->stop();

  - id: stop_page_constructors
    mode: single
    then:  # Page home is an exception, as it can be constructed in the background

  - id: theme_applied
    mode: single
    then:  # Modules owning a themed component should subscribe themselves to this

  - id: theme_update
    then:
      - lambda: |-
          ESP_LOGI("${TAG_HW_DISPLAY}", "Apply theme: %s", background_type->current_option().c_str());
          current_theme = (background_type->current_option() == "${THEME_LIGHT_LABEL}") ?
                                                                ThemeMode::LIGHT : ThemeMode::DARK;
          theme_update_all->execute();
      - script.wait: theme_update_all

      - lambda: |-
          if (current_theme == ThemeMode::LIGHT) {
            theme_update_light->execute();
          } else {
            theme_update_dark->execute();
          }
      - script.wait: theme_update_dark
      - script.wait: theme_update_light

      - lambda: |-
          if (current_page_id == get_page_id("boot")) {
            id(theme_pending_apply) = true;
            return;
          }
          // Call page theme_apply
          id(theme_apply_running) = true;
          disp1->send_command("theme_apply.previous_page.val=dp");
          disp1->send_command("page theme_apply");

  - id: theme_update_all
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("${TAG_HW_DISPLAY}", "Applying theme: %s", (current_theme == ThemeMode::LIGHT) ? "LIGHT" : "DARK");
          disp1->send_command_printf("theme=%" PRIu8, (current_theme == ThemeMode::LIGHT) ? 1 : 0);

  - id: theme_update_dark
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("${TAG_HW_DISPLAY}", "Applying DARK theme");
          disp1->send_command("color_pco_main=${THEME_DARK_COLOR_PCO_MAIN}");
          disp1->send_command("color_pco_secondary=${THEME_DARK_COLOR_PCO_SECONDARY}");
          disp1->send_command("color_pco_navigation=${THEME_DARK_COLOR_PCO_NAVIGATION}");
          disp1->send_command("color_pco_unsupported=${THEME_DARK_COLOR_PCO_UNSUPPORTED}");

  - id: theme_update_light
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("${TAG_HW_DISPLAY}", "Applying LIGHT theme");
          disp1->send_command("color_pco_main=${THEME_LIGHT_COLOR_PCO_MAIN}");
          disp1->send_command("color_pco_secondary=${THEME_LIGHT_COLOR_PCO_SECONDARY}");
          disp1->send_command("color_pco_navigation=${THEME_LIGHT_COLOR_PCO_NAVIGATION}");
          disp1->send_command("color_pco_unsupported=${THEME_LIGHT_COLOR_PCO_UNSUPPORTED}");

  ###### Timers ######
  - id: timer_dim        # Handles the brightness dimming after a timeout
    mode: restart
    then:
      - lambda: set_brightness->execute(display_brightness->state);
      - delay: !lambda return (int(timeout_dim->state) *1000);
      - lambda: |-
          if (
                timeout_dim->state >= 1 and
                current_page_id != get_page_id("screensaver") and
                current_page_id != get_page_id("boot")
              ) {
            set_brightness->execute(display_dim_brightness->state);
          }

  - id: timer_page       # Handles the fallback to home page after a timeout
    mode: restart
    then:
      - delay: !lambda return (int(timeout_page->state) *1000);
      - lambda: |-
          if (timeout_page->state >= 1) {
            ESP_LOGV("${TAG_HW_DISPLAY}", "Timed out on page: %s", page_names[current_page_id]);
            if (current_page_id != get_page_id("boot") and
                current_page_id != get_page_id("confirm") and
                current_page_id != get_page_id("home") and
                current_page_id != get_page_id("notification") and
                current_page_id != get_page_id("screensaver")) {
              ESP_LOGD("${TAG_HW_DISPLAY}", "Fallback to page Home");
              goto_page->execute(get_page_id("home"));
            }
          }

  - id: timer_reset_all  # Global timer reset - Triggered with a touch on the screen
    # NOTE: Keep mode 'single' (do not change to 'restart').
    # Multiple call sites can converge on resetting timers within the same tick
    # (e.g., on_touch plus an explicit reset from a wake or page-change handler).
    # 'single' silently drops the duplicate; the occasional WARN is benign and
    # points at structural call patterns that may be worth investigating individually.
    # Switching to 'restart' produces a debug-message cascade (3 child 'restarting'
    # lines per call) plus a new warning on set_brightness, which is louder than
    # the original warning.
    mode: single
    then:
      # Extended by:
      #  - page_screensaver
      - lambda: |-
          ESP_LOGV("${TAG_HW_DISPLAY}", "Reset timers");
          timer_page->execute();
          timer_dim->execute();

  - id: wait_for_display
    mode: single
    then:
      - while:
          condition:
            - lambda: return !disp1->is_detected();
          then:
            - lambda: |-
                ESP_LOGE("${TAG_HW_DISPLAY}", "Display is not set. Restarting.");
                screen_power->turn_off();
            - delay: 2s
            - switch.turn_on: screen_power
            - delay: ${BAUD_RATE_TIMEOUT}
            - if:
                condition:
                  - lambda: return !disp1->is_detected();
                then:
                  # Display still not setup after another ${BAUD_RATE_TIMEOUT} — rescan.
                  # baud_scan power-cycles the display itself, so the
                  # next iteration's power-off is redundant but harmless.
                  - script.execute:
                      id: baud_scan
                      target_rate: 0
                  - script.wait: baud_scan
                  - if:
                      condition:
                        - lambda: return system_flags.baud_scan_success;
                      then:
                        - wait_until:
                            condition:
                              - lambda: return disp1->is_detected();
                            timeout: 19s

  - id: wait_for_version_tft
    mode: single
    then:
      - script.execute:
          id: boot_log
          category: Boot
          log_message: Check TFT version
      - repeat:
          count: 180  # seconds
          then:
            - lambda: |-
                if (!version_tft->state.empty()) wait_for_version_tft->stop();
                if (iteration % 5 == 0) boot_log->execute("Boot", "Waiting for TFT version");
            - delay: 1s

  - id: !extend wait_for_versions
    then:
      - script.execute: wait_for_version_tft
      - script.wait: wait_for_version_tft

  - id: wakeup
    mode: single
    parameters:
      reset_timer: bool
    then:
      - lambda: |-
          ESP_LOGV("${TAG_HW_DISPLAY}", "Wake-up (%s->%s)", page_names[current_page_id], page_names[wakeup_page_id]);
          ESP_LOGV("${TAG_HW_DISPLAY}", "  reset timer: %s", YESNO(reset_timer));
          if (version_tft->state.empty()) {
            ESP_LOGE("${TAG_HW_DISPLAY}", "TFT version invalid");
            return;
          }
          if (current_page_id == get_page_id("screensaver") or current_page_id == get_page_id("boot")) {
            ESP_LOGD("${TAG_HW_DISPLAY}", "Wake-up on page %s", page_names[wakeup_page_id]);
            #ifdef NSPANEL_EASY_PAGE_CLIMATE
            if (wakeup_page_id == get_page_id("climate")) {
              detailed_entity->publish_state((id(is_embedded_thermostat)) ? "embedded_climate" : "");
              disp1->send_command_printf("climate_embedded=%i", id(is_embedded_thermostat) ? 1 : 0);
            }
            #endif  // NSPANEL_EASY_PAGE_CLIMATE
            if (id(theme_pending_apply)) {
              // A theme change deferred from the boot page. Spend it here: the
              // flag is one-shot, and leaving it raised would route every later
              // wake-up through `theme_apply`.
              id(theme_pending_apply) = false;
              // Call page theme_apply
              id(theme_apply_running) = true;
              disp1->send_command_printf("theme_apply.previous_page.val=%" PRIu8, wakeup_page_id);
              disp1->send_command("page theme_apply");
            } else {
              goto_page->execute(wakeup_page_id);
            }
          }
          if (reset_timer) {
            timer_reset_all->execute();
          } else {
            timer_sleep->execute();
            timer_dim->execute();
          }

  - id: !extend watchdog_round
    then:
      - script.execute: wait_for_display

select:
  - id: background_type
    name: Background type
    platform: template
    options:
      - ${THEME_DARK_LABEL}
      - ${THEME_LIGHT_LABEL}
    initial_option: ${THEME_DARK_LABEL}
    optimistic: true
    restore_value: true
    internal: false
    disabled_by_default: false
    entity_category: config
    icon: mdi:theme-light-dark
    update_interval: never
    on_value:
      then:
        - script.execute: theme_update

  - id: display_model
    name: Display model
    platform: template
    options:
      - ${DISPLAY_MODES.EU.TEXT}
      - ${DISPLAY_MODES.US.TEXT}
      - ${DISPLAY_MODES.US_LAND.TEXT}
    initial_option: ${DISPLAY_MODES.EU.TEXT}
    optimistic: true
    restore_value: false
    entity_category: config
    update_interval: never
    on_value:
      then:
        - lambda: |-
            display_valid = (i < UINT8_MAX);
            if (!display_valid) return;

            display_portrait = (i == ${DISPLAY_MODES.US.IDX});

            // Persist to Nextion EEPROM
            const uint8_t mode = static_cast<uint8_t>(i) + 1;
            if (mode != display_mode_eeprom) {
              disp1->send_command_printf("wepo %" PRIu8 ",4", mode);
              disp1->send_command_printf("display_mode=%" PRIu8, mode);
              display_mode_eeprom = mode;  // Update baseline
            }

  - id: wakeup_page_name
    name: Wake-up page
    platform: template
    options:
      - buttonpage01
      - buttonpage02
      - buttonpage03
      - buttonpage04
      - climate
      - entitypage01
      - entitypage02
      - entitypage03
      - entitypage04
      - home
      - qrcode
      - utilities
    initial_option: home
    optimistic: true
    restore_value: true
    internal: false
    entity_category: config
    icon: mdi:page-next-outline
    update_interval: never
    on_value:
      then:
        - lambda: |-
            wakeup_page_id = get_page_id(x.c_str());
            if (wakeup_page_id != get_page_id("boot") and wakeup_page_id != get_page_id("screensaver"))
              disp1->send_command_printf("wakeup_page_id=%" PRIu8, wakeup_page_id);
            wait_to_be_ready->execute();
        - script.wait: wait_to_be_ready
