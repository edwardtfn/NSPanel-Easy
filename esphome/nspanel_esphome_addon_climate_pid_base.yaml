#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHome Add-on for Climate control - PID Shared - This will be called by pid_single/dual  #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################
##### Two internal PID controllers (heat and cool) with live tuning from Home Assistant.        #####
##### The including package defines their outputs `pid_heat_out` and `pid_cool_out`, keeps     #####
##### them in sync with thermostat_embedded, and drives its relays in `pid_pwm_apply`.          #####
##### The PWM cycle (nspanel_easy::pid_pwm_cycle) is timed here: the level is latched once per  #####
##### cycle and limited by the minimum on and off times.                                        #####
#####################################################################################################
##### ATTENTION: Do not include directly; use climate_pid_single or climate_pid_dual.           #####
#####################################################################################################
---
substitutions:
  ##############################
  ## Change only in your      ##
  ## local yaml substitutions ##
  ##############################
  ### PID seed values (first boot only, afterwards the number entities in HA are the source) ###
  pid_kp: "0.3"                 # Proportional gain: output share per Kelvin of error (0.3 = 30 %/K)
  pid_tn: "180"                 # Integral time Tn in minutes; ki = kp / (Tn * 60)
  pid_kd: "0.0"                 # Derivative term, not useful for slow systems
  pid_deadband: "0.25"          # Deadband around the setpoint in Kelvin (also when temp_units is °F)
  pwm_period: "1200"            # PWM cycle time in seconds
  pid_min_on_time: "180"        # Shortest relay on-time in seconds; shorter pulses are skipped
  pid_min_off_time: "180"       # Shortest relay off-time in seconds; shorter pauses keep the relay on
  pid_min_time_limit: "60"      # Lower limit in seconds for both minimum times (above 0), checked at build time
  pid_starting_integral: "0.0"  # Integral term on the first boot (0.0..1.0); afterwards it is restored from flash
  pid_sync_interval: "10"       # Seconds between syncs thermostat -> PID controllers
  pid_sample_interval: "30"     # Seconds between PID computations, so the output averaging covers a fixed time
  pid_number_mode: "box"        # Input mode of the number entities in HA: "box" (type a value) or "slider"
  ### Entity names (override to keep existing entity IDs or to localize) ###
  pid_name_heat_output: "PID Heat output"
  pid_name_cool_output: "PID Cool output"
  pid_name_heat_integral: "PID Heat integral"
  pid_name_cool_integral: "PID Cool integral"
  pid_name_kp: "PID kp"
  pid_name_tn: "PID Tn"
  pid_name_pwm_period: "PID PWM period"
  pid_name_deadband: "PID Deadband"
  pid_name_min_on_time: "PID Min on time"
  pid_name_min_off_time: "PID Min off time"
  pid_name_reset_integral: "PID Reset integral"
  TAG_ADDON_CLIMATE_PID: nspanel.addon.climate.pid

esphome:
  build_flags:
    - -D NSPANEL_EASY_ADDON_CLIMATE_PID

globals:
  # Integral term of each controller while it is off, and across reboots. The ESPHome PID keeps integrating
  # in off mode, so a room left off for days would otherwise switch on with its integral wound up to the limit.
  # Stored in flash, so a reboot does not restart the settling of a slow system from pid_starting_integral.
  - id: pid_heat_integral_stored
    type: float
    restore_value: true
    initial_value: '${pid_starting_integral}'

  - id: pid_cool_integral_stored
    type: float
    restore_value: true
    initial_value: '-${pid_starting_integral}'

climate:
  # The ESPHome PID climate has no direction per mode (heat mode with both outputs would also cool),
  # so heating and cooling use separate instances. Both regulate on pid_temperature, the thermostat's
  # temperature sampled at a fixed rate.
  - platform: pid
    id: pid_heat_embedded
    name: PID Heat
    internal: true
    sensor: pid_temperature
    default_target_temperature: 21  # Overwritten by the sync right after boot
    heat_output: pid_heat_out
    control_parameters:
      kp: ${pid_kp}
      ki: ${ (pid_kp | float) / ((pid_tn | float) * 60) }
      kd: ${pid_kd}
      min_integral: 0.0  # Heating: error and integral term are positive
      max_integral: 1.0
      output_averaging_samples: 5
    deadband_parameters:
      threshold_high: ${pid_deadband}°C
      threshold_low: -${pid_deadband}°C
      kp_multiplier: 0.0   # No proportional reaction inside the deadband
      ki_multiplier: 0.05  # Integral keeps creeping slowly inside the deadband
      kd_multiplier: 0.0
      deadband_output_averaging_samples: 15

  - platform: pid
    id: pid_cool_embedded
    name: PID Cool
    internal: true
    sensor: pid_temperature
    default_target_temperature: 24  # Overwritten by the sync right after boot
    cool_output: pid_cool_out
    control_parameters:
      kp: ${pid_kp}
      ki: ${ (pid_kp | float) / ((pid_tn | float) * 60) }
      kd: ${pid_kd}
      min_integral: -1.0  # Cooling: error and integral term are negative
      max_integral: 0.0
      output_averaging_samples: 5
    deadband_parameters:
      threshold_high: ${pid_deadband}°C
      threshold_low: -${pid_deadband}°C
      kp_multiplier: 0.0
      ki_multiplier: 0.05
      kd_multiplier: 0.0
      deadband_output_averaging_samples: 15

script:
  - id: !extend dump_config
    then:
      - lambda: |-
          #ifdef NSPANEL_EASY_ADDON_CLIMATE_BACKUP
            #error "The climate backup add-on cannot be combined with the PID add-ons: it follows the thermostat's actions, which do not drive the relays here."
          #endif  // NSPANEL_EASY_ADDON_CLIMATE_BACKUP
          #ifdef NSPANEL_EASY_ADDON_CLIMATE_ONOFF
            #error "The PID add-ons cannot be combined with the climate heat, cool or dual add-ons: both would drive the thermostat and the relays."
          #endif  // NSPANEL_EASY_ADDON_CLIMATE_ONOFF
          static_assert((${pid_min_time_limit}) > 0, "pid_min_time_limit must be above 0");
          static_assert((${pid_min_time_limit}) <= 900, "pid_min_time_limit must not exceed 900");
          static_assert((${pid_min_on_time}) >= (${pid_min_time_limit}) && (${pid_min_on_time}) <= 900,
                        "pid_min_on_time must be between pid_min_time_limit and 900");
          static_assert((${pid_min_off_time}) >= (${pid_min_time_limit}) && (${pid_min_off_time}) <= 900,
                        "pid_min_off_time must be between pid_min_time_limit and 900");
          ESP_LOGCONFIG("${TAG_ADDON_CLIMATE_PID}", "Add-on climate PID:");
          ESP_LOGCONFIG("${TAG_ADDON_CLIMATE_PID}", "  kp: %.3f", pid_tuning_kp->state);
          ESP_LOGCONFIG("${TAG_ADDON_CLIMATE_PID}", "  Tn: %.0f min", pid_tuning_tn->state);
          ESP_LOGCONFIG("${TAG_ADDON_CLIMATE_PID}", "  PWM period: %.0f s", pid_tuning_pwm_period->state);
          ESP_LOGCONFIG("${TAG_ADDON_CLIMATE_PID}", "  Min on time: %.0f s", pid_tuning_min_on_time->state);
          ESP_LOGCONFIG("${TAG_ADDON_CLIMATE_PID}", "  Min off time: %.0f s", pid_tuning_min_off_time->state);
          ESP_LOGCONFIG("${TAG_ADDON_CLIMATE_PID}", "  Deadband: %.2f K", pid_tuning_deadband->state);

  # Keeps each controller's integral term while it is off: stores it when the controller switches off,
  # and restores it when it switches on, which includes the first sync after a boot.
  # Executed by the including package after every sync.
  - id: pid_integral_track
    mode: queued
    then:
      - lambda: |-
          auto track = [](pid::PIDClimate *pid, bool &was_on, float &stored, const char *name) {
            const bool on = (pid->mode != climate::CLIMATE_MODE_OFF);
            if (on == was_on) return;
            was_on = on;
            if (on) {
              pid->set_starting_integral_term(stored);
              ESP_LOGD("${TAG_ADDON_CLIMATE_PID}", "%s on: integral restored to %.3f", name, stored);
            } else {
              stored = pid->get_integral_term();
              ESP_LOGD("${TAG_ADDON_CLIMATE_PID}", "%s off: integral %.3f stored", name, stored);
            }
          };
          static bool heat_on = false;
          static bool cool_on = false;
          track(pid_heat_embedded, heat_on, id(pid_heat_integral_stored), "PID heat");
          track(pid_cool_embedded, cool_on, id(pid_cool_integral_stored), "PID cool");

  # Applies kp and Tn from the number entities to both controllers (ki = kp / Tn in seconds)
  - id: apply_pid_tuning
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("${TAG_ADDON_CLIMATE_PID}", "Tuning applied: kp=%.3f Tn=%.0fmin",
                   pid_tuning_kp->state, pid_tuning_tn->state);
      - climate.pid.set_control_parameters:
          id: pid_heat_embedded
          kp: !lambda "return pid_tuning_kp->state;"
          ki: !lambda |-
            const float tn_s = pid_tuning_tn->state * 60.0f;
            return (tn_s > 0.0f) ? pid_tuning_kp->state / tn_s : 0.0f;
      - climate.pid.set_control_parameters:
          id: pid_cool_embedded
          kp: !lambda "return pid_tuning_kp->state;"
          ki: !lambda |-
            const float tn_s = pid_tuning_tn->state * 60.0f;
            return (tn_s > 0.0f) ? pid_tuning_kp->state / tn_s : 0.0f;

interval:
  # Times the PWM cycle shared by both controllers. Each cycle latches the level once, so a level change in the
  # middle of a cycle cannot cut a pulse short or switch the relay on twice, and limits the on-time by the minimum
  # on and off times. The including package drives its relays in pid_pwm_apply when the cycle's output changes.
  - interval: 1s
    then:
      - lambda: |-
          const float period_s = pid_tuning_pwm_period->state;
          const float min_on_s = pid_tuning_min_on_time->state;
          const float min_off_s = pid_tuning_min_off_time->state;
          if (std::isnan(period_s) || period_s < 60.0f) return;
          if (std::isnan(min_on_s) || min_on_s < 0.0f) return;
          if (std::isnan(min_off_s) || min_off_s < 0.0f) return;
          if (nspanel_easy::pid_pwm_cycle.update(millis(), static_cast<uint32_t>(period_s * 1000.0f),
                                                 static_cast<uint32_t>(min_on_s * 1000.0f),
                                                 static_cast<uint32_t>(min_off_s * 1000.0f))) {
            pid_pwm_apply->execute();
          }

  # Saves the integral term of each running controller, so a reboot continues from it.
  # Every 30 minutes, to keep flash writes low; a slow system's integral changes little in that time.
  - interval: 30min
    then:
      - lambda: |-
          if (pid_heat_embedded->mode != climate::CLIMATE_MODE_OFF) {
            id(pid_heat_integral_stored) = pid_heat_embedded->get_integral_term();
          }
          if (pid_cool_embedded->mode != climate::CLIMATE_MODE_OFF) {
            id(pid_cool_integral_stored) = pid_cool_embedded->get_integral_term();
          }

sensor:
  # The PID computes on every value of its sensor, and its output averaging counts values, not time.
  # thermostat_temperature publishes irregularly (on changes, at least every 5 min), so it is sampled here
  # at a fixed rate: the averaging then covers output_averaging_samples * pid_sample_interval seconds.
  # It follows the Home Assistant reference when the Blueprint is set to, like the thermostat.
  - platform: template
    id: pid_temperature
    internal: true
    unit_of_measurement: °C
    accuracy_decimals: 2
    device_class: temperature
    update_interval: ${pid_sample_interval}s
    lambda: return thermostat_temperature->state;

  # Controller outputs and integral terms, for tuning in HA
  - platform: pid
    climate_id: pid_heat_embedded
    name: ${pid_name_heat_output}
    type: HEAT
    entity_category: diagnostic
  - platform: pid
    climate_id: pid_cool_embedded
    name: ${pid_name_cool_output}
    type: COOL
    entity_category: diagnostic
  - platform: pid
    climate_id: pid_heat_embedded
    name: ${pid_name_heat_integral}
    type: INTEGRAL
    entity_category: diagnostic
  - platform: pid
    climate_id: pid_cool_embedded
    name: ${pid_name_cool_integral}
    type: INTEGRAL
    entity_category: diagnostic

number:
  # Live tuning from HA, applied to both controllers without reflashing.
  # After the first boot these entities are the source (restore_value); the substitutions are seeds only.
  - platform: template
    id: pid_tuning_kp
    name: ${pid_name_kp}
    entity_category: config
    icon: mdi:tune-vertical
    min_value: 0.05
    max_value: 1.0
    step: 0.05
    initial_value: ${pid_kp}
    restore_value: true
    optimistic: true
    mode: ${pid_number_mode}
    on_value:
      - script.execute: apply_pid_tuning

  - platform: template
    id: pid_tuning_tn
    name: ${pid_name_tn}
    entity_category: config
    icon: mdi:timer-cog-outline
    unit_of_measurement: min
    min_value: 10
    max_value: 600
    step: 5
    initial_value: ${pid_tn}
    restore_value: true
    optimistic: true
    mode: ${pid_number_mode}
    on_value:
      - script.execute: apply_pid_tuning

  # Read by the PWM cycle (interval above); a new value takes effect from the next cycle
  - platform: template
    id: pid_tuning_pwm_period
    name: ${pid_name_pwm_period}
    entity_category: config
    icon: mdi:sine-wave
    unit_of_measurement: s
    min_value: 300
    max_value: 3600
    step: 60
    initial_value: ${pwm_period}
    restore_value: true
    optimistic: true
    mode: ${pid_number_mode}
    on_value:
      - lambda: |-
          ESP_LOGI("${TAG_ADDON_CLIMATE_PID}", "PWM period applied: %.0fs", x);

  # Minimum relay on and off times, read by the PWM cycle like the period.
  # They protect valve actuators (a thermal actuator needs minutes to open), and relays from short pulses.
  # Internal on purpose, so they are not changed from Home Assistant without understanding them; set them with
  # pid_min_on_time / pid_min_off_time. Not restored, so a changed substitution applies after the next flash.
  # To expose them, extend them in the local yaml with `internal: false` (see docs/addon_climate.md).
  - platform: template
    id: pid_tuning_min_on_time
    name: ${pid_name_min_on_time}
    internal: true
    entity_category: config
    icon: mdi:timer-check-outline
    unit_of_measurement: s
    min_value: ${pid_min_time_limit}
    max_value: 900
    step: 30
    initial_value: ${pid_min_on_time}
    restore_value: false
    optimistic: true
    mode: ${pid_number_mode}
    on_value:
      - lambda: |-
          ESP_LOGI("${TAG_ADDON_CLIMATE_PID}", "Min on time applied: %.0fs", x);

  - platform: template
    id: pid_tuning_min_off_time
    name: ${pid_name_min_off_time}
    internal: true
    entity_category: config
    icon: mdi:timer-pause-outline
    unit_of_measurement: s
    min_value: ${pid_min_time_limit}
    max_value: 900
    step: 30
    initial_value: ${pid_min_off_time}
    restore_value: false
    optimistic: true
    mode: ${pid_number_mode}
    on_value:
      - lambda: |-
          ESP_LOGI("${TAG_ADDON_CLIMATE_PID}", "Min off time applied: %.0fs", x);

  - platform: template
    id: pid_tuning_deadband
    name: ${pid_name_deadband}
    entity_category: config
    icon: mdi:arrow-expand-vertical
    unit_of_measurement: K
    min_value: 0.0
    max_value: 1.0
    step: 0.05
    initial_value: ${pid_deadband}
    restore_value: true
    optimistic: true
    mode: ${pid_number_mode}
    on_value:
      - lambda: |-
          if (isnan(x) || x < 0.0f) return;
          ESP_LOGI("${TAG_ADDON_CLIMATE_PID}", "Deadband applied: +/-%.2fK", x);
          pid_heat_embedded->set_threshold_high(x);
          pid_heat_embedded->set_threshold_low(-x);
          pid_cool_embedded->set_threshold_high(x);
          pid_cool_embedded->set_threshold_low(-x);

button:
  - platform: template
    name: ${pid_name_reset_integral}
    entity_category: config
    icon: mdi:restore
    on_press:
      - climate.pid.reset_integral_term: pid_heat_embedded
      - climate.pid.reset_integral_term: pid_cool_embedded
      - lambda: |-
          id(pid_heat_integral_stored) = 0.0f;
          id(pid_cool_integral_stored) = 0.0f;

packages:
  climate_base_package: !include nspanel_esphome_addon_climate_base.yaml
...
