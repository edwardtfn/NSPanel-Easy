#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME CORE - Page Entities                                                              #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  ##### User customization #####
  # Longest adjusted value length shown with the default (largest) font on entities pages
  page_entities_value_font_large_max_len: 8
  # Longest adjusted value length shown with the medium font on entities pages (longer values use the smallest font)
  page_entities_value_font_medium_max_len: 12

  ##### Internal #####
  half_width_chars: "iljtIf '-,;:!.°\\\"|()[]{}*^~\\\\/_"
  TAG_PAGE_ENTITIES: nspanel.page.entities

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_ENTITIES

script:
  - id: !extend action_component_text
    then:
      - lambda: |-
          if (page.find("entitypage") != 0) return;
          if (txt.empty()) return;  // There's nothing to adjust if the value is empty
          if (component.find("_") != std::string::npos) return;  // Applies only to value itself. No label or icon.

          // Value - Adjust decimal separator
          if (not id(mui_decimal_separator).empty() and id(mui_decimal_separator) != ".") {
            disp1->set_component_text(component.c_str(),
                                      adjustDecimalSeparator(txt, id(mui_decimal_separator)[0]).c_str());
          }

          // Value - Adjust font
          static_assert(${page_entities_value_font_large_max_len} >= 0 and ${page_entities_value_font_large_max_len} <= 255,
                        "page_entities_value_font_large_max_len must be between 0 and 255");
          static_assert(${page_entities_value_font_medium_max_len} >= ${page_entities_value_font_large_max_len} and
                            ${page_entities_value_font_medium_max_len} <= 255,
                        "page_entities_value_font_medium_max_len must be between page_entities_value_font_large_max_len and 255");
          static constexpr uint8_t VALUE_FONT_ID_SMALL = 0;   // Smallest font, for long values
          static constexpr uint8_t VALUE_FONT_ID_MEDIUM = 1;  // Medium font
          static constexpr uint8_t VALUE_FONT_ID_LARGE = 3;   // Default font of the value components in the TFT
          const uint8_t adjusted_length = adjusted_text_length(txt, "${half_width_chars}");
          // Decide which font to use based on adjusted length
          // The large font is set explicitly, so a short value restores it after a long one on the same component
          if (adjusted_length > ${page_entities_value_font_medium_max_len}) {
            disp1->set_component_font(component.c_str(), VALUE_FONT_ID_SMALL);
          } else if (adjusted_length > ${page_entities_value_font_large_max_len}) {
            disp1->set_component_font(component.c_str(), VALUE_FONT_ID_MEDIUM);
          } else {  // adjusted_length <= ${page_entities_value_font_large_max_len}
            disp1->set_component_font(component.c_str(), VALUE_FONT_ID_LARGE);
          }  // adjusted_length

  - id: !extend action_component_val
    then:
      - lambda: |-
          if (page != "mem") return;
          if (component == "ent_value_xcen") {  // Entities pages alignment (0=Left, 1=Center, 2=Right)
            if (val > 2) {
              ESP_LOGW("${TAG_PAGE_ENTITIES}", "Invalid alignment value: %" PRIi32 " (expected 0-2)", val);
              return;
            }
            page_entities_value_horizontal_alignment = static_cast<uint8_t>(val);
            ESP_LOGD("${TAG_PAGE_ENTITIES}", "Set value alignment on entities pages: %" PRIu8, page_entities_value_horizontal_alignment);
            return;
          }

  - id: !extend page_change
    then:
      - lambda: |-
          if (new_page_id == get_page_id("entitypage01")) page_entitypage->execute(1);
          else if (new_page_id == get_page_id("entitypage02")) page_entitypage->execute(2);
          else if (new_page_id == get_page_id("entitypage03")) page_entitypage->execute(3);
          else if (new_page_id == get_page_id("entitypage04")) page_entitypage->execute(4);

  - id: page_entitypage
    mode: single
    parameters:
      page_number: uint
    then:
      - lambda: |-
          // Set value alignment
          if (current_page_id == get_page_id("entitypage01") or
              current_page_id == get_page_id("entitypage02") or
              current_page_id == get_page_id("entitypage03") or
              current_page_id == get_page_id("entitypage04")) {
            for (uint8_t i = 1; i <= 8; ++i) {
              disp1->send_command_printf("value%02d.xcen=%" PRIu8, i, page_entities_value_horizontal_alignment);
            }
          }

  - id: !extend stop_page_constructors
    then:
      - lambda: |-
          page_entitypage->stop();
...
