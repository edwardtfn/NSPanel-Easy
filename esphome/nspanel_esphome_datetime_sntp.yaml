#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME CORE - DATE & TIME - SNTP                                                         #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################
##### Included by nspanel_esphome_datetime.yaml only when `sntp_servers` is not blank.          #####
#####################################################################################################

---
time:
  # Second time source: SNTP only needs Wi-Fi, so the clock becomes valid before the API connects
  # (e.g. after a power loss, when the system time is not kept)
  - id: time_sntp
    platform: sntp
    # A list is used as is; a string is split at ";"
    servers: ${ sntp_servers if sntp_servers is not string else (sntp_servers.split(";") | map("trim") | select | list) }
    on_time_sync:
      then:
        - lambda: |-
            ESP_LOGD("${TAG_DATETIME}", "System clock synchronized (SNTP)");
            refresh_datetime->execute();
...
