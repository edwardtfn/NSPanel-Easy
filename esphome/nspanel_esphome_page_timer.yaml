#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME Page timer                                                                        #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  TAG_PAGE_TIMER: nspanel.page.timer

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_TIMER

script:
  - id: !extend event_from_display
    then:
      - lambda: |-
          if (params[0] != "timer") return;
          if (detailed_entity->state.empty()) {
            ESP_LOGW("${TAG_PAGE_TIMER}", "No detailed entity");
            return;
          }

          // CSV Format: timer,<action>
          // params[0]=page, params[1]=action

          if (params_count != 2) {
            ESP_LOGW("${TAG_PAGE_TIMER}", "Bad params");
            return;
          }

          const std::string& action = params[1];

          ESP_LOGV("${TAG_PAGE_TIMER}", "Timer action: %s", action.c_str());

          fire_ha_event("action_call", {
            {"action", ("timer." + action).c_str()},
            {"entity", detailed_entity->state.c_str()}
          });

  # Renders the timer page from the Blueprint's entity snapshot (#636): the title and icon, then the state,
  # seconds left and duration, as the Blueprint wrote them. The panel counts down from there.
  - id: !extend entity_snapshot_received
    then:
      - lambda: |-
          if (entity_snapshot.page != "timer") return;
          const SnapshotEntity *entity = entity_snapshot.find("main");
          if (entity == nullptr) {
            ESP_LOGW("${TAG_PAGE_TIMER}", "Snapshot without a main entity, ignored");
            return;
          }  // if (no main entity)
          if (entity->entity_id.compare(0, 6, "timer.") != 0) {
            ESP_LOGW("${TAG_PAGE_TIMER}", "Unsupported entity for timer page: %s", entity->entity_id.c_str());
            return;
          }  // if (not a timer)
          blueprint_setting_received();
          details_render_title(*entity);
          // The clock gives the seconds left of an active timer; without it, the timer's own `remaining`
          const ESPTime now = time_provider->now();
          const TimerView view = timer_view(*entity, now.is_valid() ? static_cast<int64_t>(now.timestamp) : 0);
          disp1->send_command_printf("timer_state.val=%d", view.state);
          disp1->send_command("refresh_bts.en=1");
          disp1->send_command_printf("remaining.val=%d", view.remaining);
          disp1->send_command_printf("duration_label.txt=\"%s\"", view.duration_label.c_str());
          disp1->send_command("tick.en=1");

  - id: !extend page_change
    then:
      - lambda: |-
          if (new_page_id != get_page_id("timer")) return;
          page_timer->execute();

  - id: page_timer
    mode: single
    then:  # There's nothing here so far

  - id: !extend reset_globals
    then:
      - lambda: |-
          if (new_page_id != get_page_id("timer")) return;
          display_entity_keep = true;

  - id: !extend stop_page_constructors
    then:
      - lambda: page_timer->stop();
...
