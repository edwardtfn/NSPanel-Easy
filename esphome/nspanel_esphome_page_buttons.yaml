#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME - Page buttons                                                                    #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

##### External references #####
###############################

---
substitutions:
  BUTTON_LONG_PRESS_DELAY: 800ms
  TAG_PAGE_BUTTONS: nspanel.page.buttons

api:
  actions:
    # Settings of one button page, sent by the Blueprint once per session. With subscriptions, the
    # button pages are drawn by the panel itself, from these settings and the bound entities.
    - action: buttons_setup
      variables:
        page: string               # Button page, e.g. "buttonpage01"
        page_label: string         # Page title
        labels: string[]           # Button labels, in button order
        state_values: string[]     # State Values, in button order; empty for the default on/off logic
        confirm: int               # Bit mask of the buttons asking for a confirmation (bit 0 = button01)
        icon_font: int             # Nextion font of the button icons
        temperature_unit: string   # Unit shown after a climate's current temperature
      then:
        - lambda: |-
            #ifdef NSPANEL_EASY_SUBSCRIBE
            buttons_setup(page, page_label, labels, state_values, confirm, icon_font, temperature_unit,
                          ${LANG_BYTES_PER_CHAR});
            #endif  // NSPANEL_EASY_SUBSCRIBE

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_BUTTONS

script:
  ##### Subscription-driven button pages: draws the pending updates #####
  - id: !extend page_change
    then:
      - lambda: |-
          #ifdef NSPANEL_EASY_SUBSCRIBE
          buttons_page_open(current_page_id);
          #endif  // NSPANEL_EASY_SUBSCRIBE

interval:
  - id: buttons_render
    interval: 50ms
    then:
      - lambda: |-
          #ifdef NSPANEL_EASY_SUBSCRIBE
          buttons_loop();
          #endif  // NSPANEL_EASY_SUBSCRIBE
...
