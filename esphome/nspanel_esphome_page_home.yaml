#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME Page Home                                                                         #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  ##############################
  ## Change only in your      ##
  ## local yaml substitutions ##
  TAG_PAGE_HOME: nspanel.page.home
  SUN_DEFAULT_LATITUDE: '0'
  SUN_DEFAULT_LONGITUDE: '0'
  ##############################
  # RGB565 white: the default of every Blueprint colour input on this page.
  HOME_COLOR_UNSET: '65535'

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_HOME
    - -D NSPANEL_EASY_USE_WEATHER

globals:
  - id: is_climate
    type: bool
    restore_value: true
    initial_value: 'true'

  ##### Sun position #####
  - id: sun_latitude
    type: float
    restore_value: true
    initial_value: 'NAN'

  - id: sun_longitude
    type: float
    restore_value: true
    initial_value: 'NAN'

  ##### Blueprint-owned colours #####
  # The `theme_apply` page repaints all of these from the theme palette, and a
  # display restart drops them back to their design-time value. The Blueprint
  # pushes each one only once, at boot, so they are shadowed here and restored
  # by `home_colors_apply`.
  #
  # ${HOME_COLOR_UNSET} is the Blueprint's default for every one of these
  # inputs, so a shadow still holding it means the user never picked a colour
  # and the theme is left to own the component. A user who picks that exact
  # value is indistinguishable from one who left the default, which is why the
  # theme wins there.
  - id: home_date_color
    type: uint16_t
    restore_value: true
    initial_value: ${HOME_COLOR_UNSET}
  - id: home_time_color
    type: uint16_t
    restore_value: true
    initial_value: ${HOME_COLOR_UNSET}
  - id: home_indr_temp_color
    type: uint16_t
    restore_value: true
    initial_value: ${HOME_COLOR_UNSET}
  - id: home_indr_temp_icon_color
    type: uint16_t
    restore_value: true
    initial_value: ${HOME_COLOR_UNSET}
  - id: home_outdoor_temp_color
    type: uint16_t
    restore_value: true
    initial_value: ${HOME_COLOR_UNSET}

  #### Custom buttons ####
  - id: home_custom_buttons_font_id
    type: uint8_t
    restore_value: true
    initial_value: '8'

  # One bit per custom button slot, bit 0 = button01. Persisted so a reboot
  # cannot expose an unconfirmed button until the blueprint pushes again.
  - id: home_confirm_mask
    type: uint8_t
    restore_value: true
    initial_value: '0'

script:
  - id: !extend action_component_color
    then:
      - lambda: |-
          if (page == "home") {
            // The base script has already painted the component; all that is
            // needed here is the shadow the restore paths read back.
            if (component == "indr_temp") {
              id(home_indr_temp_color) = color;
              return;
            }
            if (component == "indr_temp_icon") {
              id(home_indr_temp_icon_color) = color;
              return;
            }
            if (component == "outdoor_temp") {
              id(home_outdoor_temp_color) = color;
              return;
            }
            return;
          }  // page == "home"
          if (page != "mem") return;
          if (component == "date_color") {
            id(home_date_color) = color;
            disp1->set_component_font_color(hmi::home::DATE.name, color);
            return;
          }
          if (component == "time_color") {
            id(home_time_color) = color;
            disp1->set_component_font_color(hmi::home::TIME.name, color);
            return;
          }

  - id: !extend action_component_text_list
    then:
      - lambda: |-
          if (page != "mem") return;
          if (component == "sun_coordinates") {
            // Latitude and longitude arrive together so they are always applied
            // as a pair, never half-updated.
            if (txt_list.size() != 2) {
              ESP_LOGE("${TAG_PAGE_HOME}", "Expected 2 sun coordinates, got %zu", txt_list.size());
              return;
            }
            const auto latitude = parse_number<float>(txt_list[0]);
            const auto longitude = parse_number<float>(txt_list[1]);
            id(sun_latitude) = latitude.has_value() ? *latitude : NAN;
            id(sun_longitude) = longitude.has_value() ? *longitude : NAN;
            sun_coordinates_apply->execute();
            return;
          }

  - id: !extend action_component_val
    then:
      - lambda: |-
          if (page != "mem") return;
          if (component == "is_climate") {
            id(is_climate) = (val != 0);
            return;
          }
          if (component == "custom_buttons_confirm") {
            // Custom buttons requiring confirmation
            id(home_confirm_mask) = static_cast<uint8_t>(val);
            return;
          }
          if (component == "custom_buttons_font") {
            // Custom buttons icon size
            id(home_custom_buttons_font_id) = static_cast<uint8_t>(val);
            for (int i = 1; i <= 7; ++i) {
              disp1->send_command_printf("home.button%02d.font=%" PRIu8, i, id(home_custom_buttons_font_id));
            }

            disp1->set_component_font(hmi::home::BT_NOTIFIC.name, id(home_custom_buttons_font_id));
            disp1->set_component_font(hmi::home::BT_QRCODE.name, id(home_custom_buttons_font_id));
            disp1->set_component_font(hmi::home::BT_ENTITIES.name, id(home_custom_buttons_font_id));
            blueprint_status_flags.page_home = true;
            return;
          }
          if (component == "outdoor_temp_font") {  // Outdoor temperature font size
            disp1->set_component_font(hmi::home::OUTDOOR_TEMP.name, static_cast<uint8_t>(val));
            return;
          }

  - id: !extend boot_nextion
    then:
      - lambda: |-
          // Setup Home page
          boot_log->execute("Boot", "Set Home page elements");

          // Bluetooth icon
          #if defined(USE_ESP32_BLE_SERVER) || defined(USE_ESP32_BLE_CLIENT) || defined(USE_BLUETOOTH_PROXY)
          disp1->set_component_font(hmi::home::BT_ICON.name, id(chip_font_id));
          action_component_visibility->execute("home", "bt_icon", true);
          #endif

          // Custom buttons icon size
          for (uint8_t i = 1; i <= 7; ++i) {
            disp1->send_command_printf("home.button%02d.font=%i", i, id(home_custom_buttons_font_id));
          }

          // Other components icons size and color
          disp1->set_component_font(hmi::home::BT_ENTITIES.name, id(home_custom_buttons_font_id));
          disp1->set_component_font(hmi::home::WIFI_ICON.name,   id(chip_font_id));

          // Route custom button clicks through the confirmation dialog when the
          // blueprint asked for it. Only short clicks act on the entity; a long
          // click opens the detailed page and needs no confirmation.
          #ifdef NSPANEL_EASY_PAGE_CONFIRM
          click_interceptor = [](const std::string &page,
                                 const std::string &event,
                                 const std::string &component) -> bool {
            if (page != "home") return false;
            if (event != "short_click") return false;
            // The confirm page re-emits the accepted click while it is still
            // showing, so the guard below is what stops it looping back here.
            if (current_page_id != get_page_id("home")) return false;

            const uint8_t slot = parse_home_button_index(component.c_str());
            if (slot == UINT8_MAX) return false;
            if ((id(home_confirm_mask) & (1U << slot)) == 0) return false;

            ESP_LOGD("${TAG_PAGE_HOME}", "%s requires confirmation", component.c_str());
            disp1->set_component_text("confirm.page_name", "home");
            disp1->set_component_text("confirm.component", component.c_str());
            disp1->set_component_text("confirm.body", "");  // Global component, may hold a button page label
            disp1->set_component_value("confirm.page_id", get_page_id("home"));
            goto_page->execute(get_page_id("confirm"));
            return true;
          };
          #endif  // NSPANEL_EASY_PAGE_CONFIRM

  - id: !extend boot_wrap_up
    then:
      - script.execute: sun_coordinates_apply

  - id: home_colors_apply
    mode: single
    then:
      - lambda: |-
          // Scoped names throughout: this also runs while another page is
          // showing, right after `theme_apply` has handed the display back.
          ESP_LOGV("${TAG_PAGE_HOME}", "Restore home page colors");
          const auto restore = [](const char *component, uint16_t color) {
            if (color == ${HOME_COLOR_UNSET}) {
              return;  // Never customised; the theme owns this component
            }
            disp1->set_component_font_color(component, color);
          };
          restore(hmi::home::TIME.name, id(home_time_color));
          restore(hmi::home::DATE.name, id(home_date_color));
          restore(hmi::home::INDR_TEMP.name, id(home_indr_temp_color));
          restore(hmi::home::INDR_TEMP_ICON.name, id(home_indr_temp_icon_color));
          restore(hmi::home::OUTDOOR_TEMP.name, id(home_outdoor_temp_color));

  - id: !extend page_change
    then:
      - lambda: |-
          if (!is_home_page()) return;
          page_home->execute();

  - id: page_home
    mode: restart
    then:
      - script.wait: page_change

  - id: !extend resync_display
    then:
      - lambda: |-
          // The display lost every Nextion global to its Program.s default.
          // boot_nextion is what pushes them, and until now it only ran on the
          // full boot path.
          boot_nextion->execute();
          home_vis_resend();
          #ifdef NSPANEL_EASY_USE_WEATHER
          home_weather_resolve();
          #endif  // NSPANEL_EASY_USE_WEATHER
          #ifdef NSPANEL_EASY_SUBSCRIBE
          home_button_repaint();
          #endif  // NSPANEL_EASY_SUBSCRIBE
      - script.execute: home_colors_apply

  - id: !extend stop_all
    then:
      - lambda: |-
          home_colors_apply->stop();
          page_home->stop();  // Page home is an exception to the stop_page_constructor, as it can be constructed in the background
          sun_coordinates_apply->stop();
          sun_state_update->stop();

  - id: sun_coordinates_apply
    mode: single
    then:
      - lambda: |-
          // coords_valid is derived here, never restored on its own, so it can
          // never disagree with the stored coordinates.
          sun_info.coords_valid = !std::isnan(id(sun_latitude)) && !std::isnan(id(sun_longitude));
          if (sun_info.coords_valid) {
            sun_component->set_latitude(id(sun_latitude));
            sun_component->set_longitude(id(sun_longitude));
          }
      - script.execute: sun_state_update

  - id: sun_state_update
    mode: single
    then:
      - lambda: |-
          if (sun_info.coords_valid) {
            // Seeded explicitly: SunTrigger suppresses its first crossing, so
            // the triggers alone would leave this stale until the next one.
            sun_info.is_up = sun_component->is_above_horizon();
          } else {
            const auto now = time_provider->now();
            if (!now.is_valid()) return;  // Keep the safe daytime default
            sun_info.is_up = (now.hour >= 6 && now.hour < 18);
          }
          #ifdef NSPANEL_EASY_SUBSCRIBE
          home_weather_resolve();
          #endif  // NSPANEL_EASY_SUBSCRIBE

  - id: !extend theme_applied
    then:
      - script.execute: home_colors_apply

  - id: !extend update_flag_api_ready
    then:
      - lambda: |-
          #ifdef NSPANEL_EASY_SUBSCRIBE
          home_api_connection_update(api_server->is_connected_with_state_subscription());
          #endif  // NSPANEL_EASY_SUBSCRIBE

sun:
  id: sun_component
  time_id: time_provider
  latitude: ${SUN_DEFAULT_LATITUDE}
  longitude: ${SUN_DEFAULT_LONGITUDE}
  on_sunrise:
    - then:
        - script.execute: sun_state_update
  on_sunset:
    - then:
        - script.execute: sun_state_update

time:
  - id: !extend time_provider
    on_time:
      - hours: 6,18
        minutes: 0
        seconds: 0
        then:
          - script.execute: sun_state_update
...
