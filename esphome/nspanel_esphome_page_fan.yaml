#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME Page fan                                                                          #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  TAG_PAGE_FAN: nspanel.page.fan

display:
  - id: !extend disp1
    on_touch:
      then:
        - lambda: |-
            if (
                  page_id == get_page_id("fan") and  // Page fan
                  !touch_event                   // Only act with release
                ) {
              switch (component_id) {
                case 13:  // bt_oscillate
                  fire_ha_event("action_call", {
                    {"action", "fan.oscillate"},
                    {"key", "oscillating"},
                    {"value", "toggle"},
                    {"entity", detailed_entity->state.c_str()}
                  });
                  break;
                case 14:  // power_button
                  fire_ha_event("action_call", {
                    {"action", "fan.toggle"},
                    {"entity", detailed_entity->state.c_str()}
                  });
                  break;
                case 15:  // mode_button
                  popup_select_open->execute(
                    get_page_id("fan"),
                    std::string("${LOCALIZATION[LANG].fan.select_preset_mode}")
                  );
                  break;
                case 16:  // mode_bt1
                case 17:  // mode_bt2
                case 18:  // mode_bt3
                case 19:  // mode_bt4
                case 20:  // mode_bt5
                  // Only report which slot was pressed; the Blueprint decides whether it
                  // is a speed or a preset mode, based on the entity.
                  fire_ha_event("button_click", {
                    {"page", "fan"},
                    {"component", "mode_bt" + std::to_string(component_id - 15)},
                    {"entity", detailed_entity->state}
                  });
                  break;
              }
            }

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_FAN

script:
  - id: !extend event_from_display
    then:
      - lambda: |-
          if (params[0] == "fan" and params[1] == "percentage") {
            // CSV Format: fan,percentage,<value>
            // params[0]=page, params[1]=percentage, params[2]=value

            if (params_count != 3) {
              ESP_LOGW("${TAG_PAGE_FAN}", "Bad params");
              return;
            }

            const std::string& value = params[2];

            ESP_LOGV("${TAG_PAGE_FAN}", "Fan speed: %s%%", value.c_str());

            if (value == "0") {
              ESP_LOGV("${TAG_PAGE_FAN}", "Turn-off fan");

              fire_ha_event("action_call", {
                {"action", "fan.turn_off"},
                {"entity", detailed_entity->state.c_str()}
              });
            } else {
              ESP_LOGV("${TAG_PAGE_FAN}", "Set fan speed");

              fire_ha_event("action_call", {
                {"action", "fan.turn_on"},
                {"key", "percentage"},
                {"value", value.c_str()},
                {"entity", detailed_entity->state.c_str()}
              });
            }
          }  // if (params[0] == "fan" and params[1] == "percentage")

  # Renders the fan page from the Blueprint's entity snapshot (#636): the title and icon, then the
  # oscillation, speed (slider, or buttons for up to 3 speeds) and preset modes (popup, or buttons for a fan
  # without speed control), as the Blueprint wrote them. Pictures, icons and option lists only when the page
  # opens; pending presses are cleared on the confirmed button, or on every button when the page opens or
  # the entity went quiet.
  - id: !extend entity_snapshot_received
    then:
      - lambda: |-
          if (entity_snapshot.page != "fan") return;
          const SnapshotEntity *entity = entity_snapshot.find("main");
          if (entity == nullptr) {
            ESP_LOGW("${TAG_PAGE_FAN}", "Snapshot without a main entity, ignored");
            return;
          }  // if (no main entity)
          blueprint_setting_received();
          details_render_title(*entity);
          const FanFeatures fan = fan_features(*entity);
          const bool on = (entity->state == "on");
          const bool clear_all_pending = entity_snapshot.constructor || entity_snapshot.settled;
          #ifdef NSPANEL_EASY_HW_DISPLAY
          const int picture_shift = (current_theme == ThemeMode::LIGHT) ? 1 : 0;
          #else  // NSPANEL_EASY_HW_DISPLAY
          const int picture_shift = 0;
          #endif  // NSPANEL_EASY_HW_DISPLAY
          constexpr uint16_t GREY_WHITE = 59164;  // nextion.color.grey_white
          constexpr uint16_t GREY_DARK = 10596;   // nextion.color.grey_dark

          // State of the mode buttons; pending presses cleared on the active one, or on all
          auto paint_mode_button = [&](int slot, bool active) {
            disp1->send_command_printf("mode_bt%d.val=%d", slot, active ? 1 : 0);
            if (active || clear_all_pending) {
              disp1->send_command_printf("mode_bt%d.pco=65535", slot);   // nextion.color.white
              disp1->send_command_printf("mode_bt%d.pco2=65535", slot);  // nextion.color.white
            }  // if (active or clear_all_pending)
          };
          auto mode_buttons_visible = [&](int count) {
            for (int slot = 1; slot <= FAN_MODE_BUTTONS; ++slot) {
              disp1->send_command_printf("vis mode_bt%d,%d", slot, slot <= count ? 1 : 0);
            }  // for each mode button
          };
          auto mode_button_pictures = [&](int slot) {
            const int base = 114 + ((slot - 1) * 4);
            disp1->send_command_printf("mode_bt%d.pic=%d", slot, base + 2 + picture_shift);
            disp1->send_command_printf("mode_bt%d.pic2=%d", slot, base + picture_shift);
          };

          if (fan.oscillate) {
            disp1->send_command_printf("bt_oscillate.txt=\"%s\"",
                                       fan.oscillating ? Icons::MDI_AUTORENEW : Icons::MDI_AUTORENEW_OFF);
            disp1->send_command_printf("bt_oscillate.pco=%u", GREY_WHITE);
            disp1->send_command("vis bt_oscillate,1");
          }  // if (oscillate)

          disp1->send_command("power_button.pco=50712");  // [192, 192, 192], for every fan

          // Speed widgets are visible by default on the TFT, and `vis` is kept across page entries
          for (const char *component : {"fan_value", "fanslider", "button_up", "button_down"}) {
            disp1->send_command_printf("vis %s,%d", component, fan.speed_slider ? 1 : 0);
          }  // for each speed widget
          if (fan.speed_slider) {
            const char *unit_space = entity_snapshot.compact_unit_display ? "" : " ";
            disp1->send_command_printf("fan_value.txt=\"%d%s%%\"", fan.percentage, unit_space);
            disp1->send_command_printf("fanslider.val=%d", fan_slider_value(fan));
            disp1->send_command_printf("fanslider.maxval=%d", fan.steps);
            disp1->send_command_printf("button_up.pco=%u", fan.percentage < 100 ? GREY_WHITE : GREY_DARK);
            disp1->send_command_printf("button_down.pco=%u", fan.percentage > 0 ? GREY_WHITE : GREY_DARK);
          }  // if (speed_slider)

          if (fan.speed_buttons) {
            // Top to bottom from the highest speed down to off
            const int count = fan.steps + 1;
            if (entity_snapshot.constructor) {
              for (int slot = 1; slot <= count; ++slot) {
                disp1->send_command_printf("mode_bt%d.font=8", slot);
                disp1->send_command_printf("mode_bt%d.txt=\"%s\"", slot, fan_speed_icon(count - slot, fan.steps));
                mode_button_pictures(slot);
              }  // for each speed button
              mode_buttons_visible(count);
            }  // if (page opened)
            const int active_speed = fan_active_speed(fan, on);
            for (int slot = 1; slot <= count; ++slot) {
              paint_mode_button(slot, (count - slot) == active_speed);
            }  // for each speed button
          }  // if (speed_buttons)

          if (fan.preset_modes) {
            if (entity_snapshot.constructor) {
              #ifdef NSPANEL_EASY_PAGE_SELECT
              // The picker pages through up to 32 options, always including the current one
              const std::vector<std::string> shown = select_picker_options(fan.modes, fan.preset_mode);
              #else  // NSPANEL_EASY_PAGE_SELECT
              const std::vector<std::string> shown(fan.modes.begin(), fan.modes.begin() + std::min<size_t>(fan.modes.size(), 32));
              #endif  // NSPANEL_EASY_PAGE_SELECT
              action_component_text_list->execute("mem", "popup_select_context", std::vector<std::string>{"fan_preset_mode"});
              action_component_val->execute("mem", "popup_select_mode", 0);
              action_component_text_list->execute("mem", "popup_select_options", shown);
              disp1->send_command_printf("vis mode_button,%d", fan.preset_buttons ? 0 : 1);
              if (fan.preset_buttons) {
                // A fan without speed control leaves the slider area free for the modes
                for (size_t idx = 0; idx < fan.modes.size(); ++idx) {
                  const int slot = static_cast<int>(idx) + 1;
                  std::string label = fan.modes[idx];
                  label.erase(std::remove(label.begin(), label.end(), '"'), label.end());
                  disp1->send_command_printf("mode_bt%d.font=2", slot);
                  disp1->send_command_printf("mode_bt%d.txt=\"%s\"", slot, label.c_str());
                  mode_button_pictures(slot);
                }  // for each preset mode
                mode_buttons_visible(static_cast<int>(fan.modes.size()));
              }  // if (preset_buttons)
            }  // if (page opened)
            action_component_text_list->execute("mem", "popup_select_current", std::vector<std::string>{fan.preset_mode});
            if (fan.preset_buttons) {
              for (size_t idx = 0; idx < fan.modes.size(); ++idx) {
                paint_mode_button(static_cast<int>(idx) + 1, on && fan.modes[idx] == fan.preset_mode);
              }  // for each preset mode
            }  // if (preset_buttons)
          }  // if (preset_modes)

  - id: !extend page_change
    then:
      - lambda: if (new_page_id == get_page_id("fan")) page_fan->execute();

  - id: page_fan
    mode: single
    then:  # There's nothing here so far

  - id: !extend picker_selected
    then:
      - lambda: |-
          if (context != "fan_preset_mode") return;

          if (mask == 0) {
            // No selection — fan entities always have a current preset mode if they support it;
            // deselect tap is a no-op for v1.
            ESP_LOGV("${TAG_PAGE_FAN}", "fan_preset_mode deselect ignored");
            return;
          }

          ESP_LOGD("${TAG_PAGE_FAN}", "Dispatch: fan.set_preset_mode entity='%s' preset_mode='%s'", entity.c_str(),
                                                                                                    value.c_str());

          fire_ha_event("action_call", {
            {"action", "fan.set_preset_mode"},
            {"entity", entity.c_str()},
            {"key", "preset_mode"},
            {"value", value.c_str()}
          });

  - id: !extend reset_globals
    then:
      - lambda: |-
          if (new_page_id == get_page_id("fan")) {
            display_entity_keep = true;
          }

  - id: !extend stop_page_constructors
    then:
      - lambda: page_fan->stop();
...
