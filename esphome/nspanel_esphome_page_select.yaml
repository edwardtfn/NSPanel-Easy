#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME - Page Select                                                                     #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  TAG_PAGE_SELECT: nspanel.page.select

esphome:
  build_flags:
    - -D NSPANEL_EASY_PAGE_SELECT

script:
  # Renders the select page from the Blueprint's entity snapshot: the title and icon, then the same fields,
  # in the same order, as the Blueprint pushed them before the snapshot (options, context and mode only when
  # the page opens).
  - id: !extend entity_snapshot_received
    then:
      - lambda: |-
          if (entity_snapshot.page != "select") return;
          const SnapshotEntity *entity = entity_snapshot.find("main");
          if (entity == nullptr) {
            ESP_LOGW("${TAG_PAGE_SELECT}", "Snapshot without a main entity, ignored");
            return;
          }  // if (no main entity)
          details_render_title(*entity);  // Title and icon, as the Blueprint wrote them
          const std::string current = select_current_option(entity->state);
          if (entity_snapshot.constructor) {
            const std::vector<std::string> *options = entity->list("options");
            const std::vector<std::string> shown = select_picker_options(
                options != nullptr ? *options : std::vector<std::string>{}, current);
            blueprint_setting_received();
            action_component_text_list->execute("mem", "popup_select_context", std::vector<std::string>{"select_option"});
            action_component_val->execute("mem", "popup_select_mode", 0);
            action_component_text_list->execute("mem", "popup_select_options", shown);
            action_component_text_list->execute("popup_select", "lbl_title", std::vector<std::string>{
                select_picker_title(*entity, details_overlap.entity, details_overlap.title)});
          }  // if (page opened)
          blueprint_setting_received();
          action_component_text_list->execute("mem", "popup_select_current", std::vector<std::string>{current});

  - id: !extend picker_selected
    then:
      - lambda: |-
          if (context != "select_option") return;
          if (mask == 0) {
            ESP_LOGV("${TAG_PAGE_SELECT}", "select_option deselect ignored");
            return;
          }
          const size_t dot = entity.find('.');
          if (dot == std::string::npos) {
            ESP_LOGW("${TAG_PAGE_SELECT}", "Invalid entity '%s'", entity.c_str());
            return;
          }
          const std::string domain = entity.substr(0, dot);
          const std::string service = domain + ".select_option";
          ESP_LOGD("${TAG_PAGE_SELECT}", "Dispatch: %s entity=%s option=%s",
                                          service.c_str(), entity.c_str(), value.c_str());
          fire_ha_event("action_call", {
            {"action", service.c_str()},
            {"entity", entity.c_str()},
            {"key", "option"},
            {"value", value.c_str()}
          });

  - id: !extend reset_globals
    then:
      - lambda: |-
          if (new_page_id == get_page_id("select")) {
            display_entity_keep = true;
          }
...
