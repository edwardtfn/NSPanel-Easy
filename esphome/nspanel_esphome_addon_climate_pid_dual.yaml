#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHome Add-on for Climate control - PID Dual (two setpoints, heat and cool)              #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################
##### PI/PWM control for slow systems such as underfloor heating, replacing the two-point       #####
##### control of the dual add-on.                                                               #####
##### - thermostat_embedded keeps holding setpoints and mode for display, chip and Blueprint,   #####
#####   but only switches the dummy relay 0.                                                    #####
##### - Two internal PID controllers do the actual control: target_temperature_low -> heat,     #####
#####   target_temperature_high -> cool. The mode (off/heat/cool/heat_cool) is copied as well.  #####
##### - The relays are modulated by slow PWM outputs.                                           #####
#####################################################################################################
##### ATTENTION: Do NOT combine with climate_heat, climate_cool, climate_dual,                  #####
##### climate_pid_single or climate_backup. The climate base is included by this file.          #####
#####################################################################################################
---
esphome:
  build_flags:
    - -D NSPANEL_EASY_ADDON_CLIMATE_DUAL  # Dual setpoint UI on the display, as with the dual add-on

climate:
  # Thermostat facade: holds setpoints and mode, deadband/overrun only drive the activity display
  - id: !extend thermostat_embedded
    min_cooling_off_time: 1s
    min_heating_off_time: 1s
    min_cooling_run_time: 1s
    min_heating_run_time: 1s
    cool_deadband: ${cool_deadband} ${temp_units}
    cool_overrun: ${cool_overrun} ${temp_units}
    heat_deadband: ${heat_deadband} ${temp_units}
    heat_overrun: ${heat_overrun} ${temp_units}
    cool_action:
      - switch.turn_on: relay_0   # Dummy, the relays are driven by the PID controllers
    heat_action:
      - switch.turn_on: relay_0   # Dummy
    idle_action:
      - switch.turn_off: relay_0  # Dummy
    preset:
      - name: "Off"
        default_target_temperature_high: ${target_high} ${temp_units}
        default_target_temperature_low: ${target_low} ${temp_units}
        mode: "off"
      - name: Home
        default_target_temperature_high: ${target_high} ${temp_units}
        default_target_temperature_low: ${target_low} ${temp_units}
        mode: "heat_cool"

output:
  # Turn the controller outputs (0..100 %) into on/off cycles of the existing relay switches
  - platform: slow_pwm
    id: pid_heat_out
    period: ${pwm_period}s
    turn_on_action:
      - switch.turn_on: relay_${heater_relay}
    turn_off_action:
      - switch.turn_off: relay_${heater_relay}

  - platform: slow_pwm
    id: pid_cool_out
    period: ${pwm_period}s
    turn_on_action:
      - switch.turn_on: relay_${cooler_relay}
    turn_off_action:
      - switch.turn_off: relay_${cooler_relay}

number:
  - id: !extend pid_tuning_pwm_period
    on_value:
      - lambda: |-
          if (isnan(x) || x < 60.0f) return;
          const uint32_t ms = static_cast<uint32_t>(x * 1000.0f);
          ESP_LOGI("${TAG_ADDON_CLIMATE_PID}", "PWM period applied: %.0fs", x);
          pid_heat_out->set_period(ms);
          pid_cool_out->set_period(ms);

interval:
  # Copies mode and setpoints from the thermostat facade to the controllers.
  # Change detection avoids needless state publishes. All values are °C internally.
  - interval: ${pid_sync_interval}s
    then:
      - lambda: |-
          static float last_heat_target = NAN;
          static float last_cool_target = NAN;
          static int   last_mode = -1;

          const auto mode = thermostat_embedded->mode;
          const float t_low  = thermostat_embedded->target_temperature_low;
          const float t_high = thermostat_embedded->target_temperature_high;

          const bool heat_enabled = (mode == climate::CLIMATE_MODE_HEAT ||
                                     mode == climate::CLIMATE_MODE_HEAT_COOL);
          const bool cool_enabled = (mode == climate::CLIMATE_MODE_COOL ||
                                     mode == climate::CLIMATE_MODE_HEAT_COOL);

          const bool mode_changed = (int(mode) != last_mode);
          const bool heat_changed = mode_changed ||
              (heat_enabled && (isnan(last_heat_target) || fabsf(t_low - last_heat_target) > 0.01f));
          const bool cool_changed = mode_changed ||
              (cool_enabled && (isnan(last_cool_target) || fabsf(t_high - last_cool_target) > 0.01f));

          if (heat_changed) {
            if (heat_enabled && isnan(t_low)) {
              ESP_LOGW("${TAG_ADDON_CLIMATE_PID}", "Heat setpoint is NAN - sync skipped");
            } else {
              ESP_LOGD("${TAG_ADDON_CLIMATE_PID}", "Sync PID heat: enabled=%s target=%.2f°C",
                       YESNO(heat_enabled), t_low);
              auto call = pid_heat_embedded->make_call();
              if (heat_enabled) {
                call.set_mode(climate::CLIMATE_MODE_HEAT);
                call.set_target_temperature(t_low);
              } else {
                call.set_mode(climate::CLIMATE_MODE_OFF);
              }
              call.perform();
              last_heat_target = t_low;
            }
          }

          if (cool_changed) {
            if (cool_enabled && isnan(t_high)) {
              ESP_LOGW("${TAG_ADDON_CLIMATE_PID}", "Cool setpoint is NAN - sync skipped");
            } else {
              ESP_LOGD("${TAG_ADDON_CLIMATE_PID}", "Sync PID cool: enabled=%s target=%.2f°C",
                       YESNO(cool_enabled), t_high);
              auto call = pid_cool_embedded->make_call();
              if (cool_enabled) {
                call.set_mode(climate::CLIMATE_MODE_COOL);
                call.set_target_temperature(t_high);
              } else {
                call.set_mode(climate::CLIMATE_MODE_OFF);
              }
              call.perform();
              last_cool_target = t_high;
            }
          }

          last_mode = int(mode);

packages:
  climate_pid_base_package: !include nspanel_esphome_addon_climate_pid_base.yaml
...
