########################
##### EXPERIMENTAL #####
########################

#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME PRE-BUILT                                                                         #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################
---
substitutions:
  device_name: nspanel-easy
  wifi_ssid: nspanel-easy
  wifi_password: NSPanel_Easy

packages:
  core_package: !include ../esphome/nspanel_esphome_core.yaml
  standard_pkg: !include ../esphome/nspanel_esphome_standard.yaml
  upload_tft_package: !include ../esphome/nspanel_esphome_addon_upload_tft.yaml

api:
  actions:
    - action: firmware_update
      variables:
        url: string
      then:
        - ota.http_request.flash:
            md5_url: !lambda return fw_url->state + ".md5";
            url: !lambda return fw_url->state;
        - lambda: ESP_LOGE("prebuilt.api.action.firmware_update", "Firmware update failed!");

button:
  - id: bt_firmware_update
    name: Firmware update
    platform: template
    on_press:
      then:
        - ota.http_request.flash:
            md5_url: !lambda return fw_url->state + ".md5";
            url: !lambda return fw_url->state;
        - lambda: ESP_LOGE("prebuilt.button.bt_firmware_update", "Firmware update failed!");

captive_portal:
  id: ap_captive_portal

dashboard_import:
  package_import_url: github://edwardtfn/NSPanel-Easy/prebuilt/nspanel_esphome_prebuilt.yaml@main
  import_full_config: false

esp32:
  framework:
    advanced:
      # Failed assertions still abort and reboot the panel, but without the file/line/expression strings
      # Reduces flash usage; crash logs then show only the abort address
      assertion_level: SILENT

esp32_ble:
  id: ble

esp32_improv:
  id: ble_improv
  authorizer: none

esp32_ble_server:
  id: ble_server

esphome:
  name_add_mac_suffix: true
  build_flags:
    - -D NSPANEL_EASY_PREBUILT

http_request:

improv_serial:
  id: serial_improv

logger:
  baud_rate: 115200

ota:
  - id: !extend ota_std
    password: !remove
  - id: ota_http
    platform: http_request
    # The download blocks the main loop, so show the same dialog as for ota_std
    on_begin:
      then:
        - lambda: system_flags.ota_in_progress = true;
        - script.execute: ota_dialog_open
    on_progress:
      then:
        - script.execute:
            id: ota_dialog_progress
            progress: !lambda return x;
    # A failed or aborted OTA does not reboot the panel, so clear the flag to re-enable the watchdog
    on_abort:
      then:
        - lambda: system_flags.ota_in_progress = false;
        - script.execute: ota_dialog_close
    on_error:
      then:
        - lambda: system_flags.ota_in_progress = false;
        - script.execute: ota_dialog_close

text:
  - id: fw_url
    name: Firmware URL
    platform: template
    icon: mdi:cloud-download
    mode: text
    optimistic: true
    entity_category: config
    internal: false
    update_interval: never
    restore_value: true
    initial_value: "https://github.com/edwardtfn/NSPanel-Easy/raw/refs/tags/latest/prebuilt/nspanel_esphome_prebuilt.bin"
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("text.fw_url", "New Firmware URL set: %s", x.c_str());

update:
  - id: update_std
    platform: http_request
    name: Firmware Update
    source: "https://github.com/edwardtfn/NSPanel-Easy/raw/refs/tags/latest/prebuilt/nspanel_esphome_prebuilt.manifest.json"

wifi:
  networks: !remove
  ap: {}
  power_save_mode: LIGHT  # To make it compatible with BLE
...
